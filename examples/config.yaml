# pilot config example
# Copy to ~/.config/pilot/config.yaml

ollama_url: http://localhost:11434
model: qwen3.5:cloud
max_iterations: 20
auto_approve: never   # never | low | medium

data_dir: ~/.local/share/pilot

# PAM services offered by `pilot edit` when creating/editing FreeIPA HBAC rules.
# Keep this list aligned with the PAM service names installed on your hosts.
hbac_services:
  - sshd
  - sudo
  - sudo-i
  - su
  - su-l
  - login
  - gdm-password
  - nx
  - cockpit

# Block specific tools from being callable (defense in depth)
# blocked_tools:
#   - run_command

# Allow only these tools (overrides the default set)
# allowed_tools:
#   - read_file
#   - ask_user
#   - generate_playbook

# Custom system prompt (optional)
# system_prompt: |
#   You are pilot, an AI co-pilot for Ansible automation.
