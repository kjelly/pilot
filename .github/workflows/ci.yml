name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Python (for ansible_callback tests)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Go modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # -timeout: go test's default is 10m per package. Under -race here,
        # internal/spec now takes 12-15m (738-895 s across 2026-10-15 runs;
        # one PR run hit the old 15m limit at 900 s) and cmd/pilot/cmd 7-8m.
        # 30m keeps about a 2x margin for the slowest package and still fires
        # before the job's 40-minute limit, so a hung test ends in a Go stack
        # dump that names it, not a silent job cancellation.
        run: go test -race -count=1 -timeout 30m ./...

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: ansible_callback unit tests
        working-directory: ansible_callback
        run: python3 -m unittest test_pilot_diagnose.py -v

      - name: Duplicate YAML key check (repo-wide)
        run: python3 scripts/check-yaml-duplicate-keys.py

  playbook-lint:
    # L1 syntax (blocking) + duplicate-key check + L2 ansible-lint (advisory)
    # over every playbook — mirrors `make playbook-lint`, which local dev only
    # runs via the opt-in pre-commit hook (make install-hooks). Same
    # ansible-core + collections set Dockerfile.pilot-cli bakes into the
    # delivery image.
    name: Playbook lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible toolchain
        run: |
          python3 -m pip install "ansible-core==2.19.*" ansible-lint pyyaml
          ansible-galaxy collection install ansible.posix community.docker community.postgresql

      - name: make playbook-lint
        run: make playbook-lint

  thanos-retention:
    # Runs the Thanos Compactor (the image version the playbooks deploy)
    # with thanos-query-apply.yml's retention defaults against synthetic
    # blocks: a short-lived site and the last blocks of a stopped or
    # relabelled site are never downsampled, so they must survive raw
    # retention (docs/verification/thanos-query.md §1.5).
    name: Thanos retention behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: make thanos-retention-test
        run: make thanos-retention-test

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.1
          args: --timeout=5m
