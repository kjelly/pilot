name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Python (for ansible_callback tests)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Go modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # The flags, including go test's -timeout (30m), live in the Makefile.
        # -timeout counts from when a test binary starts, so this job's
        # timeout-minutes stays at least 10m above it, for the steps before
        # this one and for compiling the -race test binaries. On 2026-10-16
        # (warm cache) those took 32 s and about 155 s. A hung test then ends
        # in a Go stack dump that names it, not a silent job cancellation
        # (TestCIGoTestTimeoutFiresBeforeJobLimit).
        run: make test-race

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: ansible_callback unit tests
        working-directory: ansible_callback
        run: python3 -m unittest test_pilot_diagnose.py -v

      - name: Duplicate YAML key check (repo-wide)
        run: python3 scripts/check-yaml-duplicate-keys.py

  playbook-lint:
    # L1 syntax (blocking) + duplicate-key check + L2 ansible-lint (advisory)
    # over every playbook — mirrors `make playbook-lint`, which local dev only
    # runs via the opt-in pre-commit hook (make install-hooks). Same
    # ansible-core + collections set Dockerfile.pilot-cli bakes into the
    # delivery image.
    name: Playbook lint
    runs-on: ubuntu-latest
    # The identity Ansible regressions have their own 5m Go timeout; leave
    # room after syntax/tool setup and the alert-rules behavior suite.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible toolchain
        run: |
          python3 -m pip install "ansible-core==2.19.*" ansible-lint pyyaml requests
          ansible-galaxy collection install ansible.posix community.docker community.postgresql community.general

      - name: make playbook-lint
        run: make playbook-lint

      # promtool unit tests of the host-health/login-probe alert rules and
      # the Alertmanager inhibit behaviour (docs/verification/alertmanager.md
      # §1.7), with the Prometheus/Alertmanager images the playbooks pin.
      # They render the rules with the ansible-core installed above; the Go
      # test job skips them (no images, no ansible-playbook), so here
      # PILOT_REQUIRE_CONTAINER_TESTS=1 pulls the images and turns a skip
      # into a failure.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make alert-rules-test
        run: make alert-rules-test

      - name: make identity-noop-test
        run: make identity-noop-test

      - name: make identity-ssh-cache-test
        run: make identity-ssh-cache-test

      - name: make identity-secret-test
        run: make identity-secret-test

  thanos-retention:
    # Runs the Thanos Compactor (the image version the playbooks deploy)
    # with thanos-query-apply.yml's retention defaults against synthetic
    # blocks: a short-lived site and the last blocks of a stopped or
    # relabelled site are never downsampled, so they must survive raw
    # retention (docs/verification/thanos-query.md §1.5).
    name: Thanos retention behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: make thanos-retention-test
        run: make thanos-retention-test

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.1
          args: --timeout=5m

  image:
    # Builds the delivery image (images/Dockerfile.pilot-cli, see DELIVERY.md)
    # once every other job here has passed, and pushes it to
    # ghcr.io/kjelly/pilot-cli:
    #   main            -> :latest (only while this commit is still main's
    #                      head), :sha-<short>
    #   tag v1.2.3      -> :1.2.3, :1.2, :sha-<short>
    #   other branches  -> :sha-<short> (workflow_dispatch)
    #   pull_request    -> build only, nothing is pushed
    name: pilot-cli image
    needs: [test, playbook-lint, thanos-retention, lint]
    runs-on: ubuntu-latest
    # A cold-cache build took 3 min on 2026-10-27.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kjelly/pilot-cli
    steps:
      - uses: actions/checkout@v4

      # Two pushes to main minutes apart run CI side by side, and the older
      # one can finish last (2026-10-27: two runs ended 15 s apart). Only the
      # commit main still points at moves :latest, so it never goes back.
      - name: Is this commit still the head of main?
        id: head
        if: github.ref == 'refs/heads/main'
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/main)
          head=${head%%[[:space:]]*}
          if [ "$head" = "$GITHUB_SHA" ]; then current=true; else current=false; fi
          echo "main is at $head, this run built $GITHUB_SHA"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      # A v1.2.3 tag stamps 1.2.3 into main.version of every binary the image
      # bakes; any other ref keeps the Dockerfile default.
      - name: Component version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest=false: a tag push never moves :latest, so pushing an older tag
      # later cannot roll it back.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.head.outputs.current == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # The baked dist/*-linux-amd64 artifacts are amd64 only, so the image
      # is too.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile.pilot-cli
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PILOT_GIT_SHA=${{ github.sha }}
            PILOT_GIT_DIRTY=false
            DETECTION_ENGINE_VERSION=${{ steps.version.outputs.value }}
            LOGIN_PROBE_VERSION=${{ steps.version.outputs.value }}
            AGENT_CONTROLLER_VERSION=${{ steps.version.outputs.value }}
            PILOT_ACCESS_GATEWAY_VERSION=${{ steps.version.outputs.value }}
            PILOT_ACCESS_DIRECTORY_VERSION=${{ steps.version.outputs.value }}
            PILOT_SESSION_STORE_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
