name: CI

on:
  push:
    branches: [main]
    # Release tags only: the image job publishes a tag as :<semver>, and
    # buildx fails a push with no tags, so a tag like vm-snapshot would run
    # the full CI only to fail there
    # (TestCIImageReleaseTagTriggerMatchesReleasesOnly).
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Python (for ansible_callback tests)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Go modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # The flags, including go test's -timeout (45m), live in the Makefile.
        # -timeout counts from when a test binary starts, so this job's
        # timeout-minutes stays at least 10m above it, for the steps before
        # this one and for compiling the -race test binaries. On 2026-10-16
        # (warm cache) those took 32 s and about 155 s. A hung test then ends
        # in a Go stack dump that names it, not a silent job cancellation
        # (TestCIGoTestTimeoutFiresBeforeJobLimit).
        run: make test-race

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: ansible_callback unit tests
        working-directory: ansible_callback
        run: python3 -m unittest test_pilot_diagnose.py -v

      - name: Duplicate YAML key check (repo-wide)
        run: python3 scripts/check-yaml-duplicate-keys.py

  playbook-lint:
    # L1 syntax (blocking) + duplicate-key check + L2 ansible-lint (advisory)
    # over every playbook — mirrors `make playbook-lint`, which local dev only
    # runs via the opt-in pre-commit hook (make install-hooks). Same
    # ansible-core + collections set Dockerfile.pilot-cli bakes into the
    # delivery image.
    name: Playbook lint
    runs-on: ubuntu-latest
    # The Go -timeout values in the Makefile targets these steps run
    # (identity-noop 5m, identity-ssh-cache 10m, identity-secret 10m + 5m +
    # 5m + 4m, freeipa-server-pool 5m = 44m) are hang caps: a hung step fails
    # at its own cap, with go test's stack dump naming the test, and the job
    # normally takes about 20 minutes. The job budget must not be below the
    # sum of those caps, so a step is never cut off by an anonymous job
    # cancellation; 50 is that 44m plus room for the toolchain setup, the
    # syntax-check loop and the alert-rules suite (no explicit cap).
    # TestCIJobTimeoutCoversMakeTargetCaps keeps this in step with the
    # Makefile.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible toolchain
        run: |
          python3 -m pip install "ansible-core==2.19.*" ansible-lint pyyaml requests
          ansible-galaxy collection install ansible.posix community.docker community.postgresql community.general

      - name: make playbook-lint
        run: make playbook-lint

      # promtool unit tests of the host-health/login-probe alert rules and
      # the Alertmanager inhibit behaviour (docs/verification/alertmanager.md
      # §1.7), with the Prometheus/Alertmanager images the playbooks pin.
      # They render the rules with the ansible-core installed above; the Go
      # test job skips them (no images, no ansible-playbook), so here
      # PILOT_REQUIRE_CONTAINER_TESTS=1 pulls the images and turns a skip
      # into a failure.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make alert-rules-test
        run: make alert-rules-test

      - name: make identity-noop-test
        run: make identity-noop-test

      - name: make identity-ssh-cache-test
        run: make identity-ssh-cache-test

      - name: make identity-secret-test
        run: make identity-secret-test

      - name: make freeipa-server-pool-test
        run: make freeipa-server-pool-test

  root-tests:
    # The roster ownership tests need root: pilot-cli runs pilot as root
    # under `docker run`, and only root can give a file to another user.
    # They skip as the runner user in the Go test job; `make root-test`
    # runs them through sudo -n, failing any that would skip.
    name: Root-only ownership tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make root-test
        run: make root-test

  thanos-retention:
    # Runs the Thanos Compactor (the image version the playbooks deploy)
    # with thanos-query-apply.yml's retention defaults against synthetic
    # blocks: a short-lived site and the last blocks of a stopped or
    # relabelled site are never downsampled, so they must survive raw
    # retention (docs/verification/thanos-query.md §1.5).
    name: Thanos retention behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: make thanos-retention-test
        run: make thanos-retention-test

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.1
          args: --timeout=5m

  pilot-mcp-cross:
    # pilot-mcp is the client users install on Linux or macOS laptops;
    # cmd/pilot itself does not build for darwin, so this keeps pilot-mcp
    # (internal/mcpclient, internal/mcpwire) free of Linux-only imports.
    name: pilot-mcp cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make pilot-mcp-cross
        run: make pilot-mcp-cross

  mcp-remote:
    # pilot-mcp end to end against a real sshd; the deploy node's docker is
    # a stand-in that execs the real `pilot mcp remote`.
    name: pilot-mcp integration (sshd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install openssh-server
        run: command -v sshd || test -x /usr/sbin/sshd || (sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server)

      - name: make mcp-remote-test
        run: make mcp-remote-test

  image:
    # Builds the delivery image (images/Dockerfile.pilot-cli, see DELIVERY.md)
    # once every other job here has passed (needs lists them all, root-tests
    # included: TestCIImageWaitsForEveryValidationJob), and pushes it to
    # ghcr.io/kjelly/pilot-cli:
    #   push or workflow_dispatch on a branch -> :sha-<short>
    #   tag v1.2.3      -> :1.2.3, :1.2 only, so a tag on main's commit does
    #                      not overwrite that commit's :sha- image with a
    #                      different version stamp
    #   pull_request, or a fork -> build only, nothing is pushed
    # :latest is moved only by the promote job below.
    name: pilot-cli image
    needs: [test, playbook-lint, root-tests, thanos-retention, lint, pilot-mcp-cross, mcp-remote]
    runs-on: ubuntu-latest
    # A cold-cache build took 3 min on 2026-10-27.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kjelly/pilot-cli
      PUBLISH: ${{ github.repository == 'kjelly/pilot' && github.event_name != 'pull_request' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # A v1.2.3 tag stamps 1.2.3 into main.version of every binary the image
      # bakes; any other ref keeps the Dockerfile default.
      - name: Component version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest=false: without it a semver tag push would also write :latest.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.ref_type == 'branch' }}

      # The baked dist/*-linux-amd64 artifacts are amd64 only, so the image
      # is too.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile.pilot-cli
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PILOT_GIT_SHA=${{ github.sha }}
            PILOT_GIT_DIRTY=false
            DETECTION_ENGINE_VERSION=${{ steps.version.outputs.value }}
            LOGIN_PROBE_VERSION=${{ steps.version.outputs.value }}
            AGENT_CONTROLLER_VERSION=${{ steps.version.outputs.value }}
            PILOT_ACCESS_GATEWAY_VERSION=${{ steps.version.outputs.value }}
            PILOT_ACCESS_DIRECTORY_VERSION=${{ steps.version.outputs.value }}
            PILOT_SESSION_STORE_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    # Points :latest at this run's image while its commit is still main's
    # head. Two main runs reach this job in whichever order their CI finishes
    # (two main runs on 2026-10-27 ended 15 s apart), so reading main and
    # moving :latest happen under one lock shared by every run: a run that
    # holds it sees every earlier promotion, and one whose commit is no longer
    # main's head leaves :latest alone. :latest therefore never goes back to
    # an older commit (TestCIImageLatestNeverGoesBack). queue: max keeps every
    # waiting promote instead of the default single pending one, which a later
    # promote would cancel: if that later one is an older commit it skips, and
    # :latest would stay behind main's head. actionlint 1.7.12 does not know
    # `queue` yet; GitHub documents it for github.com (2026-05).
    name: promote pilot-cli:latest
    needs: image
    if: github.repository == 'kjelly/pilot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ghcr-pilot-cli-latest
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kjelly/pilot-cli
      DIGEST: ${{ needs.image.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move :latest if main is still at this commit
        shell: bash
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head, not $GITHUB_SHA: :latest is left to that commit's run"
            exit 0
          fi
          : "${DIGEST:?the image job published no digest}"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          echo ":latest -> $IMAGE@$DIGEST ($GITHUB_SHA)"
