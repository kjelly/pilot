name: Image

# Builds the delivery image (images/Dockerfile.pilot-cli, see DELIVERY.md)
# and pushes it to ghcr.io/kjelly/pilot-cli:
#   push to main      -> :latest, :main, :sha-<short>
#   push tag v1.2.3   -> :1.2.3, :1.2, :sha-<short>
#   workflow_dispatch -> same as a push of the selected ref
#   pull_request      -> build only, nothing is pushed, so a Dockerfile that
#                        no longer builds is caught before it reaches main.
# :latest always follows main; a tag push never moves it (flavor latest=false),
# so pushing an older tag later cannot roll :latest back.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/kjelly/pilot-cli

jobs:
  pilot-cli:
    name: pilot-cli image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A v1.2.3 tag stamps 1.2.3 into main.version of every binary the image
      # bakes; any other ref keeps the Dockerfile default.
      - name: Component version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # The baked dist/*-linux-amd64 artifacts are amd64 only, so the image
      # is too.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile.pilot-cli
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PILOT_GIT_SHA=${{ github.sha }}
            PILOT_GIT_DIRTY=false
            DETECTION_ENGINE_VERSION=${{ steps.version.outputs.value }}
            LOGIN_PROBE_VERSION=${{ steps.version.outputs.value }}
            AGENT_CONTROLLER_VERSION=${{ steps.version.outputs.value }}
            PILOT_ACCESS_GATEWAY_VERSION=${{ steps.version.outputs.value }}
            PILOT_ACCESS_DIRECTORY_VERSION=${{ steps.version.outputs.value }}
            PILOT_SESSION_STORE_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
