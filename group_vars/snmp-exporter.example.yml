# ============================================================================
#  group_vars/snmp-exporter.example.yml —— 每站 SNMP exporter 設定範本
# ============================================================================
#
#  啟用:複製成『真實 inventory 旁邊』的 group_vars/snmp-exporter.yml
#    cp group_vars/snmp-exporter.example.yml <inventory 目錄>/group_vars/snmp-exporter.yml
#  (.example.yml 不會被自動載入;檔名要等於 group 名才生效。)
#
#  對應 spec:docs/verification/snmp-exporter.md、
#  docs/superpowers/specs/2026-09-01-snmp-monitoring-integration-spec.md §6
#
#  這裡設定的值會生效:playbooks/apply/snmp-exporter-apply.yml 在 pre_tasks
#  才補預設值,不在 play 的 vars: 宣告(play vars 的優先順序高於 group_vars,
#  2026-10-13 之前這份範本的設定都被它蓋掉;AGENTS.md §4.5 第 3 點)。
# ============================================================================

# 以下全部有內建預設值,通常不用填:
# snmp_exporter_version: "v0.30.1"
# snmp_exporter_image: "quay.io/prometheus/snmp-exporter"
# snmp_exporter_container_name: "pilot-snmp-exporter"
#  改了容器名稱的話,同機 Prometheus 預設仍連 pilot-snmp-exporter:9116,
#  要用 -e snmp_exporter_endpoint=<名稱>:9116 指定(prometheus-apply.yml)。
# snmp_exporter_port: "9116"
# snmp_exporter_listen_address: "127.0.0.1"
# snmp_exporter_module_concurrency: "1"
# snmp_exporter_config_dir: "/etc/pilot/snmp-exporter"
# snmp_exporter_data_dir: "/var/lib/pilot/snmp-exporter"

# SNMP 認證密碼一律用 ansible-vault 加密檔帶入,依
# monitoring/snmp/catalog.yml authProfile 的 credentialRef 動態鍵值,不要明文寫在這裡
# (除了拋棄式沙盒測試)。範例骨架見 vault 產生器的 "snmp-exporter" 區塊。
# snmp_exporter_credentials:
#   core-switch-v3:
#     username: ""
#     authPassword: ""
#     privPassword: ""
