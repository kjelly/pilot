# ============================================================================
#  group_vars/pilot-access-gateway.example.yml —— Pilot Access Gateway 設定範本
# ============================================================================
#
#  啟用:複製成『真實 inventory 旁邊』的 group_vars/pilot-access-gateway.yml
#    cp group_vars/pilot-access-gateway.example.yml <inventory 目錄>/group_vars/pilot-access-gateway.yml
#  (.example.yml 不會被自動載入;檔名要等於 group 名才生效。)
#
#  對應 spec:docs/verification/pilot-access-gateway.md
#  詳細設計:docs/superpowers/specs/2026-09-14-pilot-access-gateway-stateless-freeipa-portal-spec.md(Pilot Access Gateway — Stateless
#  FreeIPA-backed Portal），§50-§58
#
#  day-2/opt-in 元件(contracts/pilot-access-gateway.yaml 的
#  site.include=false、optIn=true),不會自動進 site-wide deploy;要單獨用
#  `pilot deploy` 選 pilot-access-gateway 或直接跑
#  playbooks/apply/pilot-access-gateway-apply.yml。
#
#  目標主機必須已經是 freeipa-client(先跑 freeipa-client-apply.yml）且已有
#  正向 DNS record;`pilot-target-<scope>` hostgroup 需先由
#  `pilot gateway-scope reconcile` 建立(見 group_vars/freeipa.example.yml
#  旁的 pilot-gateway-scope 說明,或 docs/verification/pilot-gateway-scope.md)。
# ============================================================================

# gateway_id / gateway_scope 天生就是「每台 gateway 不同」(同一個 scope
# 也可以有多台 gateway,見 spec.md AG26;不同 scope 的 gateway 更是各自
# 獨立)——寫在這份 group 共用檔案裡,會讓所有 pilot-access-gateway 主機拿到
# 同一組值,那是錯的。務必放進各自的 host_vars/<主機短名>.yml(`pilot edit`
# 把主機加進這個 role 時也會主動提示要填這兩個 key,見
# internal/inventory.roleContract.HostVarsKeys):
#
#   # host_vars/gw-gpu-01.yml
#   gateway_id: gpu-01
#   gateway_scope: gpu
#
#   # host_vars/gw-dmz-01.yml
#   gateway_id: dmz-01
#   gateway_scope: dmz

# 這台 gateway 的 FQDN。不填則沿用 ansible_fqdn。
# gateway_fqdn: ""

# FreeIPA server(s)FQDN 清單。不填的話(2026-09-15 起)會自動從
# group_vars/freeipa.yml 的 freeipa_domain 推導成 ["ipa1.<domain>"]——
# 跟 freeipa-client-apply.yml 自己的推導慣例一致,同一份 inventory 上其他
# freeipa-client 主機已經用這個慣例 enroll 成功,通常不用填。只有伺服器
# 主機名不照這個慣例時才需要明確覆寫,而且必須是 YAML list(不要用
# `-e freeipa_servers=[...]` 這種寫法,Ansible 不會可靠解析成 list;CLI 呼叫
# 要用 `-e '{"freeipa_servers": [...]}'` 的 JSON 物件形式)。
# freeipa_servers:
#   - ipa1.ipa.pilot.internal

# Kerberos realm,例如 "IPA.PILOT.INTERNAL"。不填的話(2026-09-15 起)會自動
# 從 freeipa_domain 推導成大寫,同上,通常不用填。
# ipa_realm: "IPA.PILOT.INTERNAL"

# 只在**安裝當下**用來建立 reader service principal + keytab;執行期完全
# 不用。一律走 Vault,不要直接寫在這個檔案裡:
#   vault key: ipa_admin_password(跟 freeipa-identity/freeipa-dns 共用同一份 vault 檔)
# ipa_admin_password: ""

# 控制端已建置好的兩個 binary 路徑(相對於 repo root,或絕對路徑)。必填——
# 套用前會先在控制端驗證這兩個檔案存在、能正常執行 version 子指令。
pilot_binary_path: "dist/pilot-linux-amd64"
pilot_access_gateway_binary_path: "dist/pilot-access-gateway-linux-amd64"
#   用 scripts/build-pilot-access-gateway.sh 建置 pilot-access-gateway 二進位檔。

# Portal 使用者群組。必須是既有的 FreeIPA 群組——這支 playbook 不會建立
# local fallback group(nsswitch 的 files 來源比 sss 先查,local 群組會永久
# 遮蔽真正的 FreeIPA 群組,見 docs/verification/pilot-access-gateway.md §5)。
# gateway_portal_user_group: "role-pilot-portal-user"

# 是否安裝 sshd ForceCommand。2026-09-14 起預設為 true——沒做過 vm-target
# 鎖定回歸測試(spec.md §0 G4/§55.1)前不得對非 disposable 主機開啟;要暫時
# 關閉請明確取消註解設成 false。
# pilot_access_gateway_install_forcecommand: true

# ----------------------------------------------------------------------------
# SSH session recording(per-host recording spec,docs/superpowers/specs/
# 2026-09-23-pilot-access-gateway-per-host-session-recording-spec.md)
#
# 要錄影哪台主機,由 hosts.yml 每台主機的 `ssh_recording: off|terminal_output`
# 決定(經 freeipa-client 投影成 FreeIPA 的 pilot.policy.ssh-recording marker),
# gateway 每次 Connect 都即時讀取,host 的設定優先於下面的 gateway 預設值。
# host 端目前只接受 off/terminal_output——terminal_io(連使用者輸入一起錄)
# 保留給之後的版本,在 hosts.yml 寫 terminal_io 會被 lint 擋下。
# ----------------------------------------------------------------------------

# gateway 預設 recording mode:metadata|terminal_output|terminal_io。刻意沒有
# 預設值——不設定時 gateway 用 built-in metadata(只記 audit 事件、不錄終端
# 內容),只有 hosts.yml 標了 ssh_recording 的主機才會錄。設成
# terminal_output/terminal_io 會讓「沒有設定 ssh_recording 的每一台主機」
# 都錄影,且必須同時設定 pilot_session_store_url。
# terminal_io 的已知限制:typed input is recorded only as redacted byte counts
# on the Gateway SSH relay path; terminal_io does not capture command text
# today.(輸入端只記錄遮蔽後的位元組數,不保證 secret 不會出現在錄影的輸出內容中。)
# pilot_session_recording_mode: terminal_output

# store 無法確認寫入時的處理方式。預設 fail_closed:超過 failure_grace 仍無法
# 寫入就結束該 session——標記要錄影的主機絕不會靜默變成沒錄影。
# best_effort 會讓連線繼續,但把該筆錄影標為 incomplete。
# pilot_session_recording_failure_policy: fail_closed
# pilot_session_recording_queue_events: 1024
# pilot_session_recording_flush_interval: 500ms
# pilot_session_recording_failure_grace: 10s       # >= 1s 且 >= 2x flush_interval
# pilot_session_recording_max_session_duration: 24h  # ingest token lifetime,1h-168h

# pilot-session-store 的 ingest URL(必須是 https://)。不設定時,任何
# effective mode 為 terminal 的連線都會被拒絕(recording_backend_unavailable),
# 沒有本機錄影檔的 fallback。
# pilot_session_store_url: "https://<session_store_fqdn>:8443"
# pilot_session_store_ca_file: /etc/ipa/ca.crt

# PIT1 ingest token 的 HMAC signing key,必須跟 pilot-session-store 用同一個
# vault 值(見 group_vars/pilot-session-store.example.yml)。一律走 Vault,
# 64 個 hex 字元(openssl rand -hex 32):
#   vault key: pilot_session_store_ingest_signing_key
# pilot_session_store_ingest_signing_key: ""

# Metrics(per-host recording spec §31):不需要設定變數。這台主機上已有
# node_exporter 的 textfile 目錄(/var/lib/node_exporter/textfile,由
# host-monitoring 建立)時,gateway 會自動寫出 pilot_access_gateway.prom;
# 沒有時只印出說明、不影響套用。
