# ============================================================================
#  group_vars/pilot-session-store.example.yml —— Pilot Session Store 設定範本
# ============================================================================
#
#  啟用:複製成『真實 inventory 旁邊』的 group_vars/pilot-session-store.yml
#    cp group_vars/pilot-session-store.example.yml <inventory 目錄>/group_vars/pilot-session-store.yml
#  (.example.yml 不會被自動載入;檔名要等於 group 名才生效。)
#
#  對應 spec:docs/verification/pilot-session-store.md
#  詳細設計:docs/tmp/now/spec.md（Pilot Access Directory、Gateway Handoff 與
#  SSH Session Recording 實作規格），§28-§29/§35
#
#  site.include=true 的 role(contracts/pilot-session-store.yaml)——把它加進
#  某台主機 hosts.yml 的 roles 清單,本身就是操作者的核准動作,之後每次全站
#  部署都會照常套用。
#
#  目標主機必須已經是 freeipa-client(先跑 freeipa-client-apply.yml)且已有
#  正向 DNS record——這台主機自己的機器 keytab 是 ipa-getcert 核發 ingest
#  TLS 憑證的基礎,不需要另外走 admin 密碼。這台主機從不是 SSH portal
#  ingress(沒有 ForceCommand/HBAC),`hostCardinality: one-or-more`——可以有
#  一台以上的 store instance。
# ============================================================================

# 這台 Session Store 的 FQDN。不填則沿用 ansible_fqdn——必須是這台主機真正
# FreeIPA-enrolled 的 FQDN,不是額外 alias/CNAME(ipa-getcert 的 SAN 用它)。
# session_store_fqdn: ""

# 只在**安裝當下**用來建立 role-pilot-session-auditor group;執行期完全不
# 用。一律走 Vault,不要直接寫在這個檔案裡:
#   vault key: ipa_admin_password(跟 freeipa-identity/pilot-access-gateway/
#   pilot-access-directory 共用同一份 vault 檔)
# ipa_admin_password: ""

# 控制端已建置好的兩個 binary 路徑(相對於 repo root,或絕對路徑)。必填——
# 套用前會先在控制端驗證這兩個檔案存在、能正常執行 version 子指令。
pilot_binary_path: "dist/pilot-linux-amd64"
pilot_session_store_binary_path: "dist/pilot-session-store-linux-amd64"
#   用 scripts/build-pilot-session-store.sh 建置 pilot-session-store 二進位檔。

# 保留天數。沒有內建預設值——spec.md §28.5 明確禁止硬編碼公司 policy,必須
# 由部署者明確決定並填寫,否則套用會直接失敗(pre_tasks 的必填檢查)。
pilot_session_store_retention_days: 90

# 加密金鑰的識別碼(metadata,不是金鑰本身)。輪替金鑰時務必連這個值一起換
# 掉,否則 replay 時的 decrypt 失敗訊息會很難對應到「用了哪一把金鑰」。
pilot_session_store_key_id: "v1"

# AES-256 master key,64 個十六進位字元(32 bytes)。一律走 Vault,不要直接
# 寫在這個檔案裡——產生方式例如:
#   openssl rand -hex 32
# vault key: pilot_session_store_master_key
# pilot_session_store_master_key: ""

# Ingest per-session token 的 HMAC signing key(per-host recording spec
# §16)。pilot-access-gateway 用這把 key 為每個錄影 session 簽發只能寫入該
# session 的短效 token(PIT1),store 用同一把 key 驗證;這把 key 本身從不
# 在網路上傳送。取代舊的全站共用 bearer token(pilot_session_store_ingest_token,
# 已不再使用,apply 時會刪除舊的 token 檔)。一律走 Vault,64 個 hex 字元:
#   openssl rand -hex 32
# vault key: pilot_session_store_ingest_signing_key
# pilot_session_store_ingest_signing_key: ""
#
# 升級時請先保留 vault 裡舊的 pilot_session_store_ingest_token,確認升級成功
# 後再移除——回滾到舊版需要它(見 per-host recording spec §21.3)。

# Ingest HTTPS 監聽的 port。改這個值時,pilot-access-gateway 那邊
# group_vars/host_vars 的 pilot_access_gateway_recording_session_store_url
# 也要跟著改。
# pilot_session_store_ingest_port: 8443

# ----------------------------------------------------------------------------
# pilot-access-gateway 那端的對應設定(由 pilot-access-gateway 的 group vars
# 渲染,不要手動編輯 /etc/pilot/access-gateway.yaml——手動加的內容會被下一次
# apply 以 group vars 為準,見 group_vars/pilot-access-gateway.example.yml):
#
#   pilot_access_gateway_recording_session_store_url: "https://<session_store_fqdn>:<pilot_session_store_ingest_port>"
#   pilot_access_gateway_recording_session_store_ca_file: /etc/ipa/ca.crt   # Gateway 本身已是 freeipa-client,天然信任同一個 FreeIPA CA
#
# 兩邊必須使用同一個 vault key `pilot_session_store_ingest_signing_key`:
# store 用它驗證、gateway 用它簽發每個 session 的 PIT1 ingest token。
# 升級時先部署 store、再部署 gateway(site.yml 依這個順序執行)。
# ----------------------------------------------------------------------------

# Metrics(per-host recording spec §31):不需要設定變數。這台主機上已有
# node_exporter 的 textfile 目錄(/var/lib/node_exporter/textfile,由
# host-monitoring 建立)時,store 會自動寫出 pilot_session_store.prom;
# 沒有時只印出說明、不影響套用。
