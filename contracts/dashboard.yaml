schemaVersion: 1
id: dashboard
role: dashboard
effects: [network.endpoints]
specs:
  - path: docs/verification/dashboard.md
    rows: {all: true}
playbooks:
  apply: playbooks/apply/dashboard-apply.yml
regressionTests:
  - internal/spec/dashboard_regression_test.go
  - internal/spec/dashboard_dns_selection_test.go
  - cmd/pilot/cmd/deploy_managed_provider_test.go
  - cmd/pilot/cmd/tag_coverage_test.go
dependencies:
  - {component: docker, required: true, relation: sameHosts}
  - {component: thanos-query, required: true, relation: providerEndpoint, applyBeforeConsumer: true}
bindings:
  - input: thanos_query_target_host
    requiredWhenDependencySelected: true
    sourceSelection: exactlyOne
    from: {component: thanos-query, endpoint: query}
hostCardinality: exactly-one
resources: {minCPU: 2, minRAMMiB: 2048, minDiskGiB: 10}
groupVars:
  - {name: docker_network_name, type: string, required: false}
  - {name: dashboard_config_dir, type: string, required: false}
  - {name: grafana_admin_password, type: string, required: true, secret: true}
  - {name: grafana_host_data_dir, type: string, required: false}
  - {name: loki_host_data_dir, type: string, required: false}
  - {name: thanos_query_target_host, type: string, required: true, secret: false}
  - {name: thanos_query_url, type: string, required: false, secret: false}
  - {name: thanos_query_alias, type: string, required: false, secret: false}
  - {name: thanos_query_port, type: integer, required: false, secret: false}
endpoints:
  - {name: grafana, scheme: http, port: 3000, autoPublish: {eligible: true, subdomain: grafana}}
  - {name: loki, scheme: http, port: 3100, autoPublish: {eligible: false, reason: "Loki's HTTP API is Grafana's own datasource wiring, not a human-facing page"}}
stagePolicy: {variable: stage, default: sandbox}
evidenceRequirement: {targetTest: topology, idempotency: required}
traceability:
  mode: rowTags
  tag: {kind: bare}
verification: {autoDeploy: false}
site: {include: false, order: 0, vars: {}, tags: [], optIn: true}
