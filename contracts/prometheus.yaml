schemaVersion: 1
id: prometheus
role: prometheus
effects:
  - monitoring.scrape_targets
specs:
  - path: docs/verification/prometheus.md
    rows: {all: true}
playbooks:
  apply: playbooks/apply/prometheus-apply.yml
regressionTests:
  - internal/spec/prometheus_regression_test.go
  - cmd/pilot/cmd/tag_coverage_test.go
dependencies:
  - {component: docker, required: true, relation: sameHosts}
  - {component: seaweedfs-s3, required: true, relation: providerEndpoint}
  - {component: alertmanager, required: true, relation: providerEndpoint}
  - {component: host-monitoring, required: false, relation: providerEndpoint,
     reason: "genuinely optional forever, not just deferred — a site can validly have zero node_exporter hosts; scrape targets auto-expand from the host-monitoring group when present (see docs/verification/prometheus.md §1.5)"}
  - {component: dcgm-exporter, required: false, relation: providerEndpoint,
     reason: "genuinely optional forever, not just deferred — a site can validly have zero GPU hosts; scrape targets auto-expand from the dcgm-exporter group when present (see docs/verification/prometheus.md §1.5, C16-C19)"}
bindings:
  - input: thanos_s3_target_host
    requiredWhenDependencySelected: true
    sourceSelection: exactlyOne
    from: {component: seaweedfs-s3, endpoint: s3}
  - input: alertmanager_target_host
    requiredWhenDependencySelected: true
    sourceSelection: exactlyOne
    from: {component: alertmanager, endpoint: api}
  - input: node_exporter_targets
    requiredWhenDependencySelected: false
    sourceSelection: all
    from: {component: host-monitoring, endpoint: metrics}
  - input: dcgm_exporter_targets
    requiredWhenDependencySelected: false
    sourceSelection: all
    from: {component: dcgm-exporter, endpoint: metrics}
hostCardinality: one-or-more
resources: {minCPU: 2, minRAMMiB: 2048, minDiskGiB: 20}
groupVars:
  - {name: docker_network_name, type: string, required: false}
  - {name: alertmanager_alias, type: string, required: false}
  - {name: prometheus_alert_rules_file, type: string, required: false}
  - {name: prometheus_retention_time, type: string, required: false}
  - {name: prometheus_scrape_configs, type: string, required: false}
  - {name: prometheus_scrape_interval, type: string, required: false}
  - {name: thanos_aws_access_key_id, type: string, required: true, secret: true}
  - {name: thanos_aws_secret_access_key, type: string, required: true, secret: true}
  - {name: thanos_s3_alias, type: string, required: false}
  - {name: thanos_s3_bucket, type: string, required: false}
  - {name: thanos_s3_endpoint, type: string, required: false}
  - {name: alertmanager_port, type: integer, required: false}
  - {name: thanos_s3_port, type: integer, required: false}
  - {name: thanos_s3_target_host, type: string, required: true, secret: false}
  - {name: alertmanager_target_host, type: string, required: true, secret: false}
  - {name: prometheus_site_label, type: string, required: true, secret: false}
  - {name: node_exporter_targets, type: stringList, required: false, secret: false}
  - {name: node_exporter_basic_auth_user, type: string, required: false, default: "prometheus", secret: false}
  - {name: node_exporter_basic_auth_password, type: string, required: false, secret: true}
  - {name: dcgm_exporter_targets, type: stringList, required: false, secret: false}
  - {name: dcgm_exporter_basic_auth_user, type: string, required: false, default: "prometheus", secret: false}
  - {name: dcgm_exporter_basic_auth_password, type: string, required: false, secret: true}
  # Host-health + login-probe alert rules (GitHub issue #11; rendered from
  # playbooks/apply/templates/pilot-host-health-alert-rules.yml.j2).
  - {name: prometheus_host_health_alert_rules_enabled, type: boolean, required: false, default: true, secret: false}
  - {name: host_io_stall_ratio_threshold, type: string, required: false, default: "0.25", secret: false, validation: "^[0-9]+([.][0-9]+)?$"}
  - {name: host_io_stall_for, type: string, required: false, default: "10m", secret: false, validation: "^[0-9]+(ms|s|m|h|d)$"}
  - {name: host_disk_latency_seconds_threshold, type: string, required: false, default: "0.1", secret: false, validation: "^[0-9]+([.][0-9]+)?$"}
  - {name: host_disk_latency_min_ops_per_second, type: string, required: false, default: "1", secret: false, validation: "^[0-9]+([.][0-9]+)?$"}
  - {name: host_disk_queue_depth_threshold, type: string, required: false, default: "10", secret: false, validation: "^[0-9]+([.][0-9]+)?$"}
  - {name: host_disk_latency_for, type: string, required: false, default: "10m", secret: false, validation: "^[0-9]+(ms|s|m|h|d)$"}
  - {name: host_metrics_missing_for, type: string, required: false, default: "3m", secret: false, validation: "^[0-9]+(ms|s|m|h|d)$"}
  - {name: host_metrics_missing_success_window, type: string, required: false, default: "150s", secret: false, validation: "^[0-9]+(ms|s|m|h|d)$"}
  - {name: login_probe_alert_for, type: string, required: false, default: "3m", secret: false, validation: "^[0-9]+(ms|s|m|h|d)$"}
  - {name: login_probe_transport_alert_for, type: string, required: false, default: "5m", secret: false, validation: "^[0-9]+(ms|s|m|h|d)$"}
  - {name: login_probe_alert_keep_firing_for, type: string, required: false, default: "5m", secret: false, validation: "^[0-9]+(ms|s|m|h|d)$"}
  - {name: login_probe_stale_seconds, type: integer, required: false, default: 180, secret: false}
endpoints:
  - {name: prometheus, scheme: http, port: 9090, autoPublish: {eligible: false, reason: "no auth of its own; publishing this operational surface through the shared reverse-proxy would put unauthenticated metrics on the same trust boundary as user-facing apps"}}
  - {name: sidecar, scheme: grpc, port: 10901}
diagnostics:
  runtime: {kind: docker, name: pilot-prometheus}
  readiness: {endpoint: prometheus, path: /-/ready}
  logs: {source: docker, lookback: 30m}
  artifacts:
    - {path: /etc/pilot/prometheus/prometheus.yml, kind: file, sensitivity: non_secret}
    - {path: /etc/pilot/prometheus/targets, kind: directory, sensitivity: metadata_only}
  verifySpec: docs/verification/prometheus.md
remediation:
  actions:
    - id: restart
      risk: R1
      executor: {kind: docker_restart, target: pilot-prometheus}
      maxTargets: 1
      requiresApproval: true
      cooldown: 30m
      verification: {spec: docs/verification/prometheus.md}
stagePolicy: {variable: stage, default: sandbox}
evidenceRequirement: {targetTest: topology, idempotency: required}
traceability:
  mode: rowTags
  tag: {kind: bare}
  exemptions:
    "docs/verification/prometheus.md#C14": {kind: verifyOnly, reason: "up{job=\"node\"}==1 probe — verify-only outcome of the node-exporter scrape job rendered for C13 actually authenticating and succeeding"}
    "docs/verification/prometheus.md#C17": {kind: verifyOnly, reason: "up{job=\"dcgm\"}==1 probe — verify-only outcome of the dcgm-exporter scrape job rendered for C16 actually authenticating and succeeding"}
    "docs/verification/prometheus.md#C19": {kind: verifyOnly, reason: "DCGM_FI_DEV_GPU_UTIL sample probe — verify-only outcome of C17's scrape actually reaching a host with a real GPU device (dcgm-exporter.md C6), not a dedicated apply task"}
verification: {autoDeploy: false}
site: {include: false, order: 0, vars: {}, tags: [], optIn: true}
