schemaVersion: 1
id: detection-engine
role: detection-engine
specs:
  - path: docs/verification/detection-engine.md
    rows: {all: true} # C1-C12
  - path: docs/verification/detection-engine-model-provider.md
    rows: {all: true} # M1-M5, Stage B only — not applicable while provider disabled
playbooks:
  apply: playbooks/apply/detection-engine-apply.yml
regressionTests:
  - internal/spec/detection_engine_regression_test.go
  - internal/spec/detection_engine_model_provider_regression_test.go
  - internal/contract/detection_engine_stage_b_test.go
  - cmd/pilot/cmd/tag_coverage_test.go
conflicts: []
dependencies:
  - {component: host-monitoring, required: true, relation: sameHosts,
     reason: "Detection host uses node_exporter textfile collector only for engine health; managed-host telemetry still comes from Thanos."}
  - {component: thanos-query, required: true, relation: providerEndpoint}
  - {component: alertmanager, required: true, relation: providerEndpoint}
bindings:
  - input: detection_metrics_source_host
    requiredWhenDependencySelected: true
    sourceSelection: exactlyOne
    from: {component: thanos-query, endpoint: query}
  - input: detection_alertmanager_target_host
    requiredWhenDependencySelected: true
    sourceSelection: exactlyOne
    from: {component: alertmanager, endpoint: api}
os:
  - {distro: ubuntu, versions: ["24.04"]}
hostCardinality: exactly-one
resources: {minCPU: 2, minRAMMiB: 512, minDiskGiB: 5}
groupVars:
  - {name: detection_engine_artifact_path, type: string, required: true, secret: false}
  - {name: detection_engine_artifact_sha256, type: string, required: false, default: "", secret: false, validation: "^$|^[a-f0-9]{64}$"}
  - {name: detection_metrics_source_host, type: string, required: true, secret: false}
  - {name: detection_alertmanager_target_host, type: string, required: true, secret: false}
  - {name: detection_cycle_interval, type: duration, required: false, default: "15s", secret: false}
  - {name: detection_evaluation_delay, type: duration, required: false, default: "20s", secret: false}
  # Stage B contract delta (spec §41.1) — provider always disabled by
  # default; none of these are required for a Stage A apply.
  - {name: detection_model_provider_enabled, type: boolean, required: false, default: false, secret: false}
  - {name: detection_model_provider_protocol, type: string, required: false, default: "openai-responses", secret: false, validation: "^(openai-responses|ollama-chat|flm)$"}
  - {name: detection_model_provider_base_url, type: string, required: false, default: "", secret: false}
  - {name: detection_model_provider_model, type: string, required: false, default: "", secret: false}
  - {name: detection_model_provider_auth, type: string, required: false, default: "none", secret: false, validation: "^(none|bearer)$"}
  - {name: detection_model_provider_api_key, type: string, required: false, secret: true}
  - {name: detection_model_provider_external, type: boolean, required: false, default: false, secret: false}
  - {name: detection_allow_external_provider, type: boolean, required: false, default: false, secret: false}
  # Optional second provider (docs/superpowers/specs/2026-08-28-npu-detect-engine-spec.md
  # §35's alternate-backend fallback, generalized to any protocol pair):
  # tried only after the primary fails. Same shape as the primary block,
  # minus its own nested fallback.
  - {name: detection_model_provider_fallback_enabled, type: boolean, required: false, default: false, secret: false}
  - {name: detection_model_provider_fallback_protocol, type: string, required: false, default: "openai-responses", secret: false, validation: "^(openai-responses|ollama-chat|flm)$"}
  - {name: detection_model_provider_fallback_base_url, type: string, required: false, default: "", secret: false}
  - {name: detection_model_provider_fallback_model, type: string, required: false, default: "", secret: false}
  - {name: detection_model_provider_fallback_auth, type: string, required: false, default: "none", secret: false, validation: "^(none|bearer)$"}
  - {name: detection_model_provider_fallback_api_key, type: string, required: false, secret: true}
  # Optional log pipeline (docs/superpowers/specs/2026-08-28-npu-detect-engine-spec.md
  # §14-18) — a third, equally-weighted peer to baseline/cohort. Disabled
  # by default; the original detection-engine spec's own Non-Goals
  # excludes logs entirely, so a Stage A/B apply is unaffected.
  - {name: detection_log_source_enabled, type: boolean, required: false, default: false, secret: false}
  - {name: detection_log_source_base_url, type: string, required: false, default: "", secret: false}
  - {name: detection_log_source_query, type: string, required: false, default: "", secret: false}
  - {name: detection_log_source_current_window, type: duration, required: false, default: "10m", secret: false}
  - {name: detection_log_source_baseline_window, type: duration, required: false, default: "6h", secret: false}
inputRules:
  - any:
      - {input: detection_model_provider_enabled, operator: equals, value: false}
      - {input: detection_model_provider_base_url, operator: nonEmpty}
    reason: "an enabled model provider requires a non-empty base URL (spec §41.1)"
  - any:
      - {input: detection_model_provider_enabled, operator: equals, value: false}
      - {input: detection_model_provider_model, operator: nonEmpty}
    reason: "an enabled model provider requires a non-empty model (spec §41.1)"
  - any:
      - {input: detection_model_provider_enabled, operator: equals, value: false}
      - {input: detection_model_provider_auth, operator: notEquals, value: bearer}
      - {input: detection_model_provider_api_key, operator: nonEmpty}
    reason: "an enabled bearer-auth model provider requires a non-empty API key (spec §33/§41.1)"
  - any:
      - {input: detection_model_provider_fallback_enabled, operator: equals, value: false}
      - {input: detection_model_provider_enabled, operator: equals, value: true}
    reason: "a fallback provider requires the primary provider to be enabled — there is nothing for it to fall back from otherwise"
  - any:
      - {input: detection_model_provider_fallback_enabled, operator: equals, value: false}
      - {input: detection_model_provider_fallback_base_url, operator: nonEmpty}
    reason: "an enabled fallback provider requires a non-empty base URL"
  - any:
      - {input: detection_model_provider_fallback_enabled, operator: equals, value: false}
      - {input: detection_model_provider_fallback_model, operator: nonEmpty}
    reason: "an enabled fallback provider requires a non-empty model"
  - any:
      - {input: detection_model_provider_fallback_enabled, operator: equals, value: false}
      - {input: detection_model_provider_fallback_auth, operator: notEquals, value: bearer}
      - {input: detection_model_provider_fallback_api_key, operator: nonEmpty}
    reason: "an enabled bearer-auth fallback provider requires a non-empty API key"
  - any:
      - {input: detection_log_source_enabled, operator: equals, value: false}
      - {input: detection_log_source_base_url, operator: nonEmpty}
    reason: "an enabled log source requires a non-empty base URL"
  - any:
      - {input: detection_log_source_enabled, operator: equals, value: false}
      - {input: detection_log_source_query, operator: nonEmpty}
    reason: "an enabled log source requires a non-empty LogQL query"
endpoints: []
diagnostics:
  runtime: {kind: systemd, name: pilot-detection-engine.service}
  logs: {source: systemd, lookback: 30m}
  verifySpec: docs/verification/detection-engine.md
remediation:
  actions:
    - id: restart
      risk: R1
      executor: {kind: systemd_restart, target: pilot-detection-engine.service}
      maxTargets: 1
      requiresApproval: true
      verification: {spec: docs/verification/detection-engine.md}
stagePolicy: {variable: stage, default: sandbox}
experimental: false
evidenceRequirement: {targetTest: topology, idempotency: required}
lifecycle:
  backup:
    provider: restic
    preHook: >-
      install -d -m 0700 /var/backups/pilot-detection-engine &&
      /usr/local/bin/pilot-detection-engine db backup
      --db /var/lib/pilot/detection-engine/state.db
      --output /var/backups/pilot-detection-engine/state.db
    paths:
      - /etc/pilot/detection-engine
      - /var/backups/pilot-detection-engine
  upgrade: null
  decommission: null
traceability:
  mode: rowTags
  tag: {kind: rolePrefixed, prefix: detection-engine}
  exemptions:
    "docs/verification/detection-engine.md#C6": {kind: verifyOnly, reason: "status.json/textfile carrying no secret is a Go-code-level guarantee (internal/detection/status.go, metrics.go never define a secret field) — no apply task produces or could break this"}
    "docs/verification/detection-engine.md#C10": {kind: verifyOnly, reason: "cold-start no-false-anomaly is an internal/detection algorithm property (baseline_test.go's 120-bucket gate) — no apply task implements it"}
    "docs/verification/detection-engine.md#C11": {kind: verifyOnly, reason: "lifecycle/escalation/resolution/outbox-ordering scenario evidence comes from the fake-protocol topology lane (spec §49), not a single already-applied host"}
    "docs/verification/detection-engine-model-provider.md#M1": {kind: verifyOnly, reason: "config validate's pass/fail is a Go-code-level guarantee (cmd/pilot-detection-engine's config package) — no single apply task IS this behavior, it's a property of the already-deployed binary"}
    "docs/verification/detection-engine-model-provider.md#M2": {kind: verifyOnly, reason: "provider probe issuing a real batch round-trip is Go-code-level behavior (internal/detection provider adapters) — no apply task performs this call, it's invoked post-apply against the deployed binary"}
    "docs/verification/detection-engine-model-provider.md#M3": {kind: verifyOnly, reason: "status --field model_provider.protocol reads Go-rendered status.json — no apply task itself performs this classification, it's the running daemon's own output"}
    "docs/verification/detection-engine-model-provider.md#M4": {kind: verifyOnly, reason: "circuit breaker state is Go-code-level (internal/detection retry/circuit breaker) — no apply task can break or fix this independent of the deployed binary's code"}
    "docs/verification/detection-engine-model-provider.md#M5": {kind: verifyOnly, reason: "secret-leak absence is a Go-code-level guarantee (status.go/metrics.go never define a secret field) spanning every apply outcome (bearer vs none), not one specific apply task"}
verification: {autoDeploy: false}
site: {include: false, order: 0, vars: {}, tags: [], optIn: true}
