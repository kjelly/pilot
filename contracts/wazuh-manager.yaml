schemaVersion: 1
id: wazuh-manager
role: wazuh-manager
specs:
  - path: docs/verification/wazuh-manager.md
    rows: {all: true}
playbooks:
  apply: playbooks/apply/wazuh-manager-apply.yml
regressionTests:
  - internal/spec/wazuh_manager_regression_test.go
  - cmd/pilot/cmd/tag_coverage_test.go
dependencies:
  - {component: docker, required: true, relation: sameHosts}
  - {component: log-server, required: false, relation: providerEndpoint}
bindings:
  - input: siem_forward_host
    requiredWhenDependencySelected: true
    sourceSelection: exactlyOne
    from: {component: log-server, endpoint: syslog}
hostCardinality: exactly-one
resources: {minCPU: 4, minRAMMiB: 8192, minDiskGiB: 50}
groupVars:
  - {name: siem_forward_host, type: string, required: false, default: "", secret: false}
endpoints:
  - {name: agent, scheme: tcp, port: 1514}
  - {name: agentAuth, scheme: tcp, port: 1515}
  # host port matches wazuh_dashboard_host_port in wazuh-manager-apply.yml
  # (remapped off 443 in round 25 to avoid the reverse-proxy port conflict).
  # subdomain is "wazuh-dashboard", not "wazuh" -- the minimal-poc reference
  # topology's freeipa-dns.yaml already owns a "wazuh" A record for direct
  # access to the manager's own agent ports; confirmed live 2026-08-15 that
  # "wazuh" collides with it (DNS-ownership-collision gate correctly blocks
  # the auto-suggested candidate).
  - {name: dashboard, scheme: https, port: 8443, autoPublish: {eligible: true, subdomain: wazuh-dashboard}}
stagePolicy: {variable: stage, default: sandbox}
evidenceRequirement: {targetTest: topology, idempotency: required}
lifecycle:
  backup: {provider: restic, paths: [/var/ossec]}
traceability:
  mode: rowTags
  tag: {kind: bare}
  exemptions:
    "docs/verification/wazuh-manager.md#C7": {kind: derived, tags: [C4], reason: effective configuration from compose injection}
    "docs/verification/wazuh-manager.md#C8": {kind: verifyOnly, reason: disk capacity guard}
    "docs/verification/wazuh-manager.md#C9": {kind: verifyOnly, reason: rule-engine functional probe}
verification: {autoDeploy: false}
site: {include: true, order: 100, vars: {}, tags: [security, wazuh-manager], optIn: false}
