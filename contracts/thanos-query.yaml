schemaVersion: 1
id: thanos-query
role: thanos-query
specs:
  - path: docs/verification/thanos-query.md
    rows: {all: true}
playbooks:
  apply: playbooks/apply/thanos-query-apply.yml
regressionTests:
  - internal/spec/thanos_query_regression_test.go
  - cmd/pilot/cmd/tag_coverage_test.go
dependencies:
  - {component: docker, required: true, relation: sameHosts}
  - {component: seaweedfs-s3, required: true, relation: providerEndpoint}
bindings:
  - input: thanos_s3_target_host
    requiredWhenDependencySelected: true
    sourceSelection: exactlyOne
    from: {component: seaweedfs-s3, endpoint: s3}
hostCardinality: exactly-one
resources: {minCPU: 2, minRAMMiB: 2048, minDiskGiB: 10}
groupVars:
  - {name: thanos_s3_target_host, type: string, required: true, secret: false}
endpoints:
  # 10902 is the Thanos Sidecar's container-internal http-address (collides
  # with every site's own Sidecar on the shared host network); the real
  # detection-engine-spec §9/§10 host-facing port is 10912
  # (thanos_query_http_port default in thanos-query-apply.yml). Detection
  # Engine and any other consumer must connect to 10912, never 10902.
  - {name: query, scheme: http, port: 10912, autoPublish: {eligible: false, reason: "no auth of its own; same operational-surface exclusion as prometheus"}}
stagePolicy: {variable: stage, default: sandbox}
evidenceRequirement: {targetTest: topology, idempotency: required}
traceability:
  mode: rowTags
  tag: {kind: bare}
verification: {autoDeploy: false}
site: {include: false, order: 0, vars: {}, tags: [], optIn: true}
