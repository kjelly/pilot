schemaVersion: 1
id: alertmanager
role: alertmanager
specs:
  - path: docs/verification/alertmanager.md
    rows: {all: true}
playbooks:
  apply: playbooks/apply/alertmanager-apply.yml
regressionTests:
  - internal/spec/alertmanager_regression_test.go
  - cmd/pilot/cmd/tag_coverage_test.go
dependencies:
  - {component: docker, required: true, relation: sameHosts}
hostCardinality: exactly-one
resources: {minCPU: 1, minRAMMiB: 512, minDiskGiB: 2}
endpoints:
  - {name: api, scheme: http, port: 9093, autoPublish: {eligible: false, reason: "no auth of its own; same operational-surface exclusion as prometheus"}}
diagnostics:
  runtime: {kind: docker, name: pilot-alertmanager}
  readiness: {endpoint: api, path: /-/ready}
  logs: {source: docker, lookback: 30m}
  verifySpec: docs/verification/alertmanager.md
remediation:
  actions:
    - id: restart
      risk: R1
      executor: {kind: docker_restart, target: pilot-alertmanager}
      maxTargets: 1
      requiresApproval: true
      cooldown: 30m
      verification: {spec: docs/verification/alertmanager.md}
      autonomy: {sandbox: allowed, staging: allowed, prod: human}
    - id: reapply
      risk: R2
      executor: {kind: canonical_apply}
      maxTargets: 1
      requiresApproval: true
      verification: {spec: docs/verification/alertmanager.md}
      preflight: {requireIdempotencyEvidence: true, requireDependencyHealth: true}
groupVars:
  - {name: alertmanager_config, type: string, required: false}
  - {name: alertmanager_config_dir, type: string, required: false}
  - {name: alertmanager_host_data_dir, type: string, required: false}
  - {name: alertmanager_receiver_mode, type: string, required: false}
  - {name: alertmanager_teams_proxy_image, type: string, required: false}
  - {name: alertmanager_teams_webhook_url, type: string, required: false, secret: true}
  - {name: alertmanager_version, type: string, required: false}
  - {name: docker_network_name, type: string, required: false}
  - {name: alertmanager_teams_proxy_port, type: integer, required: false}
stagePolicy: {variable: stage, default: sandbox}
evidenceRequirement: {targetTest: vm, idempotency: required}
traceability:
  mode: rowTags
  tag: {kind: bare}
verification: {autoDeploy: false}
site: {include: false, order: 0, vars: {}, tags: [], optIn: true}
