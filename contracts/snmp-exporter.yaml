schemaVersion: 1
id: snmp-exporter
role: snmp-exporter
specs:
  - path: docs/verification/snmp-exporter.md
    rows: {all: true}
playbooks:
  apply: playbooks/apply/snmp-exporter-apply.yml
regressionTests: []
# Docker Engine is an execution prerequisite for this container-based
# exporter (spec §6.2), declared as a real sameHosts dependency here
# (unlike dcgm-exporter, which deliberately keeps docker external —
# snmp-exporter has no such external-Docker-Operator scenario).
dependencies:
  - {component: docker, required: true, relation: sameHosts}
conflicts: []
bindings: []
os:
  - {distro: ubuntu, versions: ["22.04", "24.04"]}
hostCardinality: zero-or-more
resources: {minCPU: 1, minRAMMiB: 512, minDiskGiB: 2}
groupVars:
  - {name: snmp_exporter_version, type: string, required: false, default: "v0.30.1", secret: false}
  - {name: snmp_exporter_image, type: string, required: false, default: "quay.io/prometheus/snmp-exporter", secret: false}
  - {name: snmp_exporter_container_name, type: string, required: false, default: "pilot-snmp-exporter", secret: false}
  - {name: snmp_exporter_port, type: string, required: false, default: "9116", secret: false}
  - {name: snmp_exporter_listen_address, type: string, required: false, default: "127.0.0.1", secret: false}
  - {name: snmp_exporter_module_concurrency, type: string, required: false, default: "1", secret: false}
  - {name: snmp_exporter_config_dir, type: string, required: false, default: "/etc/pilot/snmp-exporter", secret: false}
  - {name: snmp_exporter_data_dir, type: string, required: false, default: "/var/lib/pilot/snmp-exporter", secret: false}
endpoints:
  - {name: metrics, scheme: http, port: 9116, autoPublish: {eligible: false, reason: "loopback-only exporter surface by default (spec §5.1/§13.3); /snmp?target= has proxy/scan semantics stricter than an ordinary /metrics endpoint and must never be reverse-proxy-published"}}
stagePolicy: {variable: stage, default: sandbox}
evidenceRequirement: {targetTest: vm, idempotency: required}
traceability:
  mode: rowTags
  tag: {kind: bare}
  exemptions:
    "docs/verification/snmp-exporter.md#C1": {kind: skeleton, reason: "Phase 0 skeleton — playbooks/apply/snmp-exporter-apply.yml has zero tasks yet, see spec §15 Phase 1"}
    "docs/verification/snmp-exporter.md#C2": {kind: skeleton, reason: "Phase 0 skeleton — playbooks/apply/snmp-exporter-apply.yml has zero tasks yet, see spec §15 Phase 1"}
