schemaVersion: 1
id: pilot-access-gateway
role: pilot-access-gateway
specs:
  - path: docs/verification/pilot-access-gateway.md
    rows: {all: true}
playbooks:
  apply: playbooks/apply/pilot-access-gateway-apply.yml
regressionTests:
  - internal/freeipaaccess/normalize_test.go
  - internal/freeipaaccess/recording_policy_test.go
  - internal/accessportal/resolver_test.go
  - internal/accessportal/recording_policy_test.go
  - internal/gatewayapi/server_test.go
  - internal/gatewayapi/portal_group_test.go
  - internal/peercred/peercred_test.go
  - internal/identity/identity_group_test.go
  - internal/systemdactivation/systemdactivation_test.go
  - cmd/pilot/cmd/portal_client_test.go
  - cmd/pilot/cmd/portal_tui_test.go
  - cmd/pilot/cmd/portal_ssh_test.go
  - cmd/pilot/cmd/portal_ssh_config_sync_test.go
  - internal/gatewayconfig/config_test.go
  - internal/gatewayapi/recording_policy_test.go
  - internal/ingesttoken/ingesttoken_test.go
dependencies:
  - {component: freeipa-client, required: true, relation: sameHosts}
conflicts: []
hostCardinality: one-or-more
resources: {minCPU: 1, minRAMMiB: 512, minDiskGiB: 5}
groupVars:
  - {name: gateway_id, type: string, required: true, secret: false}
  - {name: gateway_scope, type: string, required: true, secret: false}
  - {name: gateway_fqdn, type: string, required: false, secret: false}
  - {name: freeipa_servers, type: stringList, required: false, secret: false}
  - {name: ipa_realm, type: string, required: false, secret: false}
  - {name: ipa_admin_password, type: string, required: true, secret: true}
  - {name: pilot_binary_path, type: string, required: true, secret: false}
  - {name: pilot_access_gateway_binary_path, type: string, required: true, secret: false}
  - {name: gateway_portal_user_group, type: string, required: false, default: role-pilot-portal-user, secret: false}
  - {name: pilot_access_gateway_install_forcecommand, type: boolean, required: false, default: true, secret: false}
  - {name: pilot_access_gateway_portal_automember, type: boolean, required: false, default: true, secret: false}
  - {name: pilot_access_gateway_portal_automember_exclude_users, type: stringList, required: false, default: [admin], secret: false}
  # SSH session recording (docs/superpowers/specs/2026-09-23-pilot-access-gateway-per-host-session-recording-spec.md §14/§27).
  # pilot_session_recording_mode has no default: unset means the built-in metadata (no terminal recording).
  - {name: pilot_session_recording_mode, type: string, required: false, secret: false}
  - {name: pilot_session_recording_failure_policy, type: string, required: false, default: fail_closed, secret: false}
  - {name: pilot_session_recording_queue_events, type: integer, required: false, default: 1024, secret: false}
  - {name: pilot_session_recording_flush_interval, type: string, required: false, default: 500ms, secret: false}
  - {name: pilot_session_recording_failure_grace, type: string, required: false, default: 10s, secret: false}
  - {name: pilot_session_recording_max_session_duration, type: string, required: false, default: 24h, secret: false}
  - {name: pilot_session_store_url, type: string, required: false, secret: false}
  - {name: pilot_session_store_ca_file, type: string, required: false, default: /etc/ipa/ca.crt, secret: false}
  - {name: pilot_session_store_ingest_signing_key, type: string, required: false, secret: true}
endpoints:
  - name: gateway-socket
    scheme: unix
    path: /run/pilot/access-gateway.sock
stagePolicy: {variable: stage, default: sandbox}
evidenceRequirement: {targetTest: topology, idempotency: required}
traceability:
  mode: mapped
  rows:
    "docs/verification/pilot-access-gateway.md#AG01": {tags: [AG01], reason: "access-gateway.yaml template task writes id/scope/target_hostgroup"}
    "docs/verification/pilot-access-gateway.md#AG02": {tags: [AG02], reason: "pilot-gateway system user creation task"}
    "docs/verification/pilot-access-gateway.md#AG03": {tags: [AG03], reason: "keytab ownership/mode task"}
    "docs/verification/pilot-access-gateway.md#AG04": {tags: [AG04], reason: "FreeIPA CA presence check inherited from freeipa-client enrollment"}
    "docs/verification/pilot-access-gateway.md#AG06": {tags: [AG06], reason: "capability probe task (step 17) exercises the same real ping the check re-verifies"}
    "docs/verification/pilot-access-gateway.md#AG09": {tags: [AG09], reason: "systemd socket unit install + start tasks"}
    "docs/verification/pilot-access-gateway.md#AG12": {tags: [AG12], reason: "step 18's own configured-hostgroup assertion"}
    "docs/verification/pilot-access-gateway.md#AG32": {tags: [AG32], reason: "root-owned Portal SSH config enforces GSSAPI-only target authentication with no credential delegation or fallback"}
    "docs/verification/pilot-access-gateway.md#AG33": {tags: [AG33], reason: "Kerberos client package tasks install kinit, klist, and kdestroy for session-scoped Portal credentials"}
    "docs/verification/pilot-access-gateway.md#AG34": {tags: [AG34], reason: "Step 14 install-pilot-session task now execs pilot portal-session instead of pilot portal"}
    "docs/verification/pilot-access-gateway.md#AG41": {tags: [AG41], reason: "Step 11 renders the recording block from the pilot_session_recording_*/pilot_session_store_* vars"}
    "docs/verification/pilot-access-gateway.md#AG42": {tags: [AG42], reason: "signing key install (store configured) / removal (no store) tasks"}
    "docs/verification/pilot-access-gateway.md#AG43": {tags: [AG43], reason: "task removing the former static session-store bearer token file"}
  exemptions:
    "docs/verification/pilot-access-gateway.md#AG19": {kind: structural-absence, tags: [], reason: "no task in this playbook ever writes under /var/lib/pilot — absence is structural, not produced by a specific task"}
    "docs/verification/pilot-access-gateway.md#AG30": {kind: idempotency-evidence, tags: [], reason: "second-apply changed=0 is a multi-run property recorded in the Phase 7 evidence doc, not a single tagged task"}
    "docs/verification/pilot-access-gateway.md#AG35": {kind: unit-test-evidence, tags: [], reason: "valid pilot-connect grammar parsing is loader-logic proven by TestParsePortalSSHOriginalCommand_ValidConnect, not a live host property"}
    "docs/verification/pilot-access-gateway.md#AG36": {kind: unit-test-evidence, tags: [], reason: "malformed/malicious command rejection is proven by TestParsePortalSSHOriginalCommand_Rejects"}
    "docs/verification/pilot-access-gateway.md#AG37": {kind: unit-test-evidence, tags: [], reason: "session_id never changing the HBAC/scope decision (it is only bound into a recorded session's ingest token) is proven by TestRunPortalOneShotConnect_Allowed/_Denied and TestConnectAuthorize_SessionIDOnlyBindsToken"}
    "docs/verification/pilot-access-gateway.md#AG38": {kind: unit-test-evidence, tags: [], reason: "one-shot connect always re-authorizing fresh is proven by TestRunPortalOneShotConnect_Denied"}
    "docs/verification/pilot-access-gateway.md#AG39": {kind: unit-test-evidence, tags: [], reason: "wrong-scope deny on the one-shot path reuses the same handleConnectAuthorize as the interactive path"}
    "docs/verification/pilot-access-gateway.md#AG40": {kind: unit-test-evidence, tags: [], reason: "ssh child exit code propagation is proven by TestRunPortalOneShotConnect_PropagatesSSHExitCode"}
    "docs/verification/pilot-access-gateway.md#AG44": {kind: unit-test-evidence, tags: [], reason: "recording precedence is the pure resolver's TestResolveRecordingMode"}
    "docs/verification/pilot-access-gateway.md#AG45": {kind: unit-test-evidence, tags: [], reason: "unknown/invalid/reserved policy denial is TestConnectAuthorize_RecordingPolicyDenies"}
    "docs/verification/pilot-access-gateway.md#AG46": {kind: unit-test-evidence, tags: [], reason: "terminal mode without a store is TestConnectAuthorize_TerminalWithoutStoreDenied"}
    "docs/verification/pilot-access-gateway.md#AG47": {kind: unit-test-evidence, tags: [], reason: "metadata responses carrying no store coordinates or token is TestConnectAuthorize_MetadataCarriesNoIngestCredential"}
    "docs/verification/pilot-access-gateway.md#AG48": {kind: unit-test-evidence, tags: [], reason: "token claims binding and per-mint jti is TestConnectAuthorize_MintsBoundIngestToken"}
    "docs/verification/pilot-access-gateway.md#AG49": {kind: unit-test-evidence, tags: [], reason: "fresh policy on every authorize is TestConnectAuthorize_FreshPolicyEachRequest"}
    "docs/verification/pilot-access-gateway.md#AG56": {kind: unit-test-evidence, tags: [], reason: "per-host userclass-unreadable denial (Phase 0 branch R) is TestConnectAuthorize_UserClassUnreadableDenies"}
verification: {autoDeploy: false}
# 2026-09-15 起 site.include:true(不再是 optIn/single-component-only)——
# 使用者明確決定「把 pilot-access-gateway 加進 hosts.yml 的 roles 清單」本身
# 就是核准動作,之後每次全站部署都會照常套用這個角色,跟其他角色的語意
# 一致。order 52 放在 freeipa-client(50)之後、freeipa-nfs-server(55)之前,
# 對應 dependencies 的 sameHosts 要求。§0 G4/§55.1 的鎖定回歸測試規則本身
# 沒有變——只是核准時機點從「每次部署都要重新確認」改成「第一次把 role
# 加進某台主機的當下」。
site: {include: true, order: 52, vars: {}, tags: [pilot-access-gateway], optIn: false}
