[domain/ipa.pilot.internal]

id_provider = ipa
ipa_server = _srv_, ipa1.ipa.pilot.internal
ipa_domain = ipa.pilot.internal
ipa_hostname = ipa-ha-client.ipa.pilot.internal
auth_provider = ipa
chpass_provider = ipa
access_provider = ipa
cache_credentials = True
ldap_tls_cacert = /etc/ipa/ca.crt
krb5_store_password_if_offline = True
[sssd]
services = nss, pam, ssh, sudo

domains = ipa.pilot.internal
[nss]
homedir_substring = /home

[pam]

[sudo]

[autofs]

[ssh]

[pac]

[ifp]

[session_recording]

