# Six-node topology for docs/verification/freeipa-client.md A10: the SSSD
# password-expiry policy on the hosts that carry an sshd ForceCommand or a
# gateway-facing sshd policy. Same shape as pilot-access-transport-topology.yaml
# plus one pilot-access-directory host.
#
#   pa-ipa     FreeIPA server (ipa1.ipa.pilot.internal)
#   pa-gw      FreeIPA client + pilot-access-gateway (ForceCommand pilot-session)
#   pa-dir     FreeIPA client + pilot-access-directory (ForceCommand pilot-directory-session)
#   pa-target  FreeIPA client + pilot-access-target-policy (the transport target)
#   pa-store   FreeIPA client + pilot-session-store (terminal recording store)
#   pa-ws      the workstation: not enrolled, wired only to the gateway's name,
#              target tcp/22 dropped, so a transport session provably went
#              through the gateway
#
#   pilot vm-target topology up --fresh --topology docs/topologies/freeipa-client-pwexpiry-a10-topology.yaml
#   pilot vm-target topology test --topology docs/topologies/freeipa-client-pwexpiry-a10-topology.yaml \
#       --playbook playbooks/test/freeipa-client-pwexpiry-a10-chain.yml \
#       --verify docs/verification/pilot-access-gateway.md=pilot-access-gateway \
#       --verify docs/verification/pilot-access-directory.md=pilot-access-directory \
#       --verify docs/verification/pilot-access-target-policy.md=pilot-access-target-policy \
#       -- -e stage=sandbox -e @<vault with ipa_admin_password and the two session-store keys> \
#       -e directory_id=pa-dir1 -e pilot_binary_path=dist/pilot-linux-amd64 \
#       -e pilot_access_directory_binary_path=dist/pilot-access-directory-linux-amd64
# with PILOT_INPUT_GATEWAY_ID=gpu-01 PILOT_INPUT_GATEWAY_SCOPE=gpu exported
# (the gateway spec's AG01 compares the deployed id and scope with them).
#
# The chain does not set the SSSD policy: the freeipa-client playbook refuses
# `renew` on the three host groups above until A10 passes, so the live test
# applies it with a second inventory in which the hosts are not in those groups.
# No `services: local`: the host cache stack is not required for this run.
nodes:
  - name: pa-ipa
    base_image: almalinux-9
    memory: 4608
    vcpus: 2
    disk: 30
    ssh_user: root
    ssh_timeout: 8m
    boot_timeout: 8m
    groups: [freeipa-server]
    wire:
      - pa-gw=pa-gw.ipa.pilot.internal
      - pa-target=pa-target.ipa.pilot.internal
      - pa-dir=pa-dir.ipa.pilot.internal
  - name: pa-gw
    base_image: ubuntu-24.04
    memory: 2048
    vcpus: 2
    disk: 20
    ssh_user: root
    ssh_timeout: 8m
    boot_timeout: 8m
    groups: [freeipa-client, pilot-access-gateway]
    wire:
      - pa-ipa=ipa1.ipa.pilot.internal
      - pa-target=pa-target.ipa.pilot.internal
      - pa-store=pa-store.ipa.pilot.internal
  - name: pa-dir
    base_image: ubuntu-24.04
    memory: 1536
    vcpus: 1
    disk: 20
    ssh_user: root
    ssh_timeout: 8m
    boot_timeout: 8m
    groups: [freeipa-client, pilot-access-directory]
    wire:
      - pa-ipa=ipa1.ipa.pilot.internal
      - pa-gw=pa-gw.ipa.pilot.internal
  - name: pa-target
    base_image: ubuntu-24.04
    memory: 2048
    vcpus: 2
    disk: 20
    ssh_user: root
    ssh_timeout: 8m
    boot_timeout: 8m
    groups: [freeipa-client, pilot-access-target-policy]
    wire:
      - pa-ipa=ipa1.ipa.pilot.internal
      - pa-gw=pa-gw.ipa.pilot.internal
  - name: pa-store
    base_image: ubuntu-24.04
    memory: 2048
    vcpus: 2
    disk: 25
    ssh_user: root
    ssh_timeout: 8m
    boot_timeout: 8m
    groups: [freeipa-client, pilot-session-store]
    wire:
      - pa-ipa=ipa1.ipa.pilot.internal
  - name: pa-ws
    base_image: ubuntu-24.04
    memory: 1536
    vcpus: 1
    disk: 15
    ssh_user: root
    ssh_timeout: 8m
    boot_timeout: 8m
    groups: [pilot-transport-workstation]
    wire:
      - pa-gw=pa-gw.ipa.pilot.internal
