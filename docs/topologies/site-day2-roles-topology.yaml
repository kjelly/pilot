# Declarative three-node topology for issue #362: playbooks/site.yml runs the
# host-assigned roles freeipa-server-replica and freeipa-dns-client on fresh
# nodes, in site.yml's own order (primary, then replica, then the client and
# its resolver), instead of silently skipping them.
#
#   i362-ipa1  FreeIPA primary (native DNS, the default)
#   i362-ipa2  freeipa-server-replica: promoted by the site-wide run. There is
#              no `wire:` on purpose: the primary has native DNS, so the replica
#              registers its own A record there (the playbook's self-register
#              step) instead of an /etc/hosts pin on the primary.
#   i362-c1    Ubuntu client in freeipa-client, host-monitoring and
#              freeipa-dns-client (the host the resolver baseline is applied to)
#
# Command (the one the actual run used; fresh nodes: L3 check-mode, apply,
# verify, second apply with changed=0):
#
#   pilot vm-target topology up --fresh \
#       --topology docs/topologies/site-day2-roles-topology.yaml
#   pilot vm-target topology test \
#       --topology docs/topologies/site-day2-roles-topology.yaml \
#       --playbook playbooks/site.yml \
#       --verify docs/verification/freeipa-server-replica.md=freeipa-server-replica \
#       --verify docs/verification/freeipa-dns-client.md=freeipa-dns-client \
#       --verify-timeout 60 \
#       -- -e stage=sandbox -e @<vars file>
#
# `topology test --ephemeral` instead of `up` + `test` is fine too.
#
# <vars file> is a vault-style YAML file that holds ipa_admin_password and, for
# the host-monitoring group (i362-c1 is in it, and site.yml runs
# host-monitoring-apply.yml on it), node_exporter_basic_auth_password. Neither
# value is in this repository.
#
# Only freeipa-server-replica and freeipa-dns-client are verified here: the two
# roles this topology exists for. The freeipa-server and freeipa-client specs
# are not verified on this topology (the freeipa-client spec has fixture-bound
# rows, C5/C8/C15-C17, that need the freeipa-client fixtures, which a plain
# site.yml run does not create).
#
# The node names carry the issue number so they cannot collide with another
# disposable topology on the same host. No `services: local`: the host cache
# stack is not required for this run.
services: none
nodes:
  - name: i362-ipa1
    base_image: almalinux-9
    # The guest sees about 95% of this, and pilot deploy needs 4096 MiB for
    # freeipa-server and freeipa-server-replica
    # (cmd/pilot/cmd/topology_resources_test.go).
    memory: 4608
    vcpus: 2
    disk: 30
    ssh_user: root
    ssh_timeout: 5m
    boot_timeout: 8m
    groups:
      - freeipa-server

  - name: i362-ipa2
    base_image: almalinux-9
    memory: 4608
    vcpus: 2
    disk: 30
    ssh_user: root
    ssh_timeout: 5m
    boot_timeout: 8m
    groups:
      - freeipa-server-replica

  - name: i362-c1
    base_image: ubuntu-24.04
    memory: 2048
    vcpus: 2
    disk: 15
    ssh_user: root
    ssh_timeout: 5m
    boot_timeout: 8m
    groups:
      - freeipa-client
      - freeipa-dns-client
      - host-monitoring
