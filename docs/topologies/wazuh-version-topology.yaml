# Disposable Issue #244 fresh-install topology. Root must claim the unique
# names before provisioning. No fixed IPs: agents use the sole manager group.
# The Ubuntu24 Debian agent cohosts the real log-server receiver. This fresh
# descriptor explicitly uses direct upstream services:none, not inherited cache
# consumers; native evidence must bind the actual inventory/proxy state.
services: none
nodes:
  - name: wx244-manager
    base_image: ubuntu-24.04
    # Guest-visible RAM must exceed the central contract's 8192 MiB.
    memory: 9216
    vcpus: 4
    disk: 100
    ssh_user: root
    ssh_timeout: 5m
    boot_timeout: 8m
    # Also exercises agent/central ownership on the same physical host, while
    # other agent forks observe its stable manager through shared readers.
    groups: [sandbox, docker, wazuh-manager, wazuh-fim]
  - name: wx244-deb
    base_image: ubuntu-24.04
    memory: 4096
    vcpus: 2
    disk: 30
    ssh_user: root
    ssh_timeout: 5m
    boot_timeout: 8m
    groups: [sandbox, log-server, audit-log-forwarding, wazuh-fim]
  - name: wx244-el
    base_image: almalinux-9
    memory: 2048
    vcpus: 2
    disk: 30
    ssh_user: root
    ssh_timeout: 5m
    boot_timeout: 8m
    groups: [sandbox, wazuh-fim]
  - name: wx244-deb22
    base_image: ubuntu-22.04
    memory: 2048
    vcpus: 2
    disk: 30
    ssh_user: root
    ssh_timeout: 5m
    boot_timeout: 8m
    groups: [sandbox, wazuh-fim]
