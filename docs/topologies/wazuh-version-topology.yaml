# Disposable Issue #244 version-contract topology (part A contract, part B controlled
# upgrade): three VMs. Root must claim the unique names before provisioning. No fixed IPs:
# agents use the sole manager group and the manager forwards to the sole log-server group.
#
# - wf244-manager carries docker, the manager and an agent, so one host meets the central
#   gate and the agent contract side by side; the other agents observe its native release
#   over SSH.
# - wf244-deb is an Ubuntu 24.04 agent that also hosts the real log-server receiver (the
#   manager's C10/C11 rows need one in the inventory; without it `topology test --verify`
#   cannot verify clean) and, via audit-log-forwarding, the receiver's own local sender
#   that log-server C7/C8 require.
# - wf244-el is an AlmaLinux 9 agent (signed exact RPM path, DNF versionlock).
# Ubuntu 22.04 is not part of this topology: its coverage needs its own candidate evidence.
#
# This descriptor uses direct upstream services:none, not inherited cache consumers;
# native evidence must bind the actual inventory/proxy state.
services: none
nodes:
  - name: wf244-manager
    base_image: ubuntu-24.04
    # Guest-visible RAM must exceed the central contract's 8192 MiB.
    memory: 9216
    vcpus: 4
    disk: 100
    ssh_user: root
    ssh_timeout: 5m
    boot_timeout: 8m
    groups: [sandbox, docker, wazuh-manager, wazuh-fim]
  - name: wf244-deb
    base_image: ubuntu-24.04
    # log-server contract minimum is 2048 MiB / 2 vCPU / 20 GiB; the agent shares the host.
    memory: 4096
    vcpus: 2
    disk: 30
    ssh_user: root
    ssh_timeout: 5m
    boot_timeout: 8m
    groups: [sandbox, log-server, audit-log-forwarding, wazuh-fim]
  - name: wf244-el
    base_image: almalinux-9
    memory: 2048
    vcpus: 2
    disk: 30
    ssh_user: root
    ssh_timeout: 5m
    boot_timeout: 8m
    groups: [sandbox, wazuh-fim]
