# Declarative three-node topology for docs/runbooks/minimal-poc-architecture.md.
# The groups below are the role memberships captured in that runbook's
# actual inventory snapshot; an empty role group is intentionally omitted.
#
# Bring up/render the same three hosts with:
#   pilot vm-target topology up --topology docs/topologies/minimal-poc-topology.yaml
#   pilot vm-target topology inventory --topology docs/topologies/minimal-poc-topology.yaml
#
# The site-wide verification set is passed repeatably to `topology test` (the
# YAML format deliberately stays limited to VM topology and group membership):
#   --verify docs/verification/freeipa-server.md=freeipa-server
#   --verify docs/verification/freeipa-client.md=freeipa-client
#   --verify docs/verification/freeipa-nfs-server.md=freeipa-nfs-server
#   --verify docs/verification/freeipa-nfs-client.md=freeipa-nfs-client
#   --verify docs/verification/docker.md=docker
#   --verify docs/verification/audit-log-forwarding.md=audit-log-forwarding
#   --verify docs/verification/log-server.md=log-server
#   --verify docs/verification/wazuh-manager.md=wazuh-manager
#   --verify docs/verification/wazuh-fim.md=wazuh-fim
#   --verify docs/verification/seaweedfs-s3.md=seaweedfs-s3
#   --verify docs/verification/restic-backup.md=restic-backup
#   --verify docs/verification/alertmanager.md=alertmanager
#   --verify docs/verification/prometheus.md=prometheus
#   --verify docs/verification/thanos-query.md=thanos-query
#   --verify docs/verification/dashboard.md=dashboard
#   --verify docs/verification/log-shipping.md=log-server
#   --verify docs/verification/host-monitoring.md=host-monitoring
#   --verify docs/verification/freeipa-dns-client.md=freeipa-dns-client
#   --verify docs/verification/reverse-proxy.md=reverse-proxy
#
# freeipa-ca-trust is day-2/opt-in and targets the literal `all` inventory
# group by default (not a named per-host role in this file) — see the
# runbook's §3.5. internal-endpoint and freeipa-dns are day-2 reconcilers
# (pilot reconcile, not role membership) and likewise not represented here.
#
# host-monitoring/freeipa-dns-client/reverse-proxy/freeipa-ca-trust/
# internal-endpoint merged in from the now-retired `delivery-test` skill
# (2026-08-14) — this merge has NOT yet been executed end-to-end against
# this exact topology; do not treat it as verified until a live round says
# so in the runbook's own round history.
#
# nexus carries both log-server and wazuh-manager (2026-08-06): confirmed
# live that log-server-apply.yml runs correctly co-located with
# wazuh-manager (TCP/514 only since v1.2 — no port conflict with anything
# wazuh-manager's docker-compose maps) — see
# docs/runbooks/audit-log-forwarding.md §5.5.1 and
# docs/verification/log-server.md's changelog. Without this, nexus's
# audit-log-forwarding traffic (and every other host forwarding to it)
# would silently go nowhere — the exact incident that motivated this fix.
#
# freeipa-identity.md is intentionally not listed: site.yml excludes the
# day-2 roster reconciler and it must be applied (with its fixture/roster)
# separately before verifying that spec.
#
# services: local reuses `pilot services up --profile dev-lite`'s host-local
# package/image cache across all three nodes (equivalent to `vm-target up
# --services local`, see docs/runbooks/minimal-poc-architecture.md §2). It is
# fail-closed if that stack isn't running — drop this key for an
# intentionally uncached run.
services: local
nodes:
  - name: freeipa-server
    base_image: almalinux-9
    memory: 4608
    vcpus: 2
    disk: 30
    ssh_user: root
    ssh_timeout: 3m
    boot_timeout: 6m
    groups:
      - freeipa-server
      - freeipa-dns-client
      - host-monitoring
      - audit-log-forwarding
      - wazuh-fim
      - restic-backup
    wire:
      - nexus
      - client-vm=client-vm.ipa.pilot.internal

  - name: nexus
    base_image: ubuntu-24.04
    memory: 12288
    vcpus: 6
    disk: 80
    ssh_user: root
    ssh_timeout: 3m
    boot_timeout: 6m
    groups:
      - freeipa-client
      - freeipa-dns-client
      - reverse-proxy
      - host-monitoring
      - docker
      - audit-log-forwarding
      - log-server
      - wazuh-manager
      - wazuh-fim
      - seaweedfs-s3
      - restic-backup
      - prometheus
      - thanos-query
      - alertmanager
      - dashboard
      - freeipa-nfs-server
    wire:
      - freeipa-server=ipa1.ipa.pilot.internal
      - client-vm=client-vm.ipa.pilot.internal

  - name: client-vm
    base_image: ubuntu-24.04
    memory: 2048
    vcpus: 2
    disk: 20
    ssh_user: root
    ssh_timeout: 3m
    boot_timeout: 6m
    groups:
      - freeipa-client
      - freeipa-dns-client
      - host-monitoring
      - docker
      - audit-log-forwarding
      - wazuh-fim
      - restic-backup
      - freeipa-nfs-client
    wire:
      - freeipa-server=ipa1.ipa.pilot.internal
      - nexus
