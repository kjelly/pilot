[defaults]
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent
collections_path = /opt/pilot-controller/empty
collections_scan_sys_path = False
roles_path = /opt/pilot-controller/empty
library = /opt/pilot-controller/empty
module_utils = /opt/pilot-controller/empty
action_plugins = /opt/pilot-controller/empty
become_plugins = /opt/pilot-controller/empty
cache_plugins = /opt/pilot-controller/empty
callback_plugins = /opt/pilot-controller/empty
cliconf_plugins = /opt/pilot-controller/empty
connection_plugins = /opt/pilot-controller/empty
filter_plugins = /opt/pilot-controller/empty
httpapi_plugins = /opt/pilot-controller/empty
inventory_plugins = /opt/pilot-controller/empty
lookup_plugins = /opt/pilot-controller/empty
netconf_plugins = /opt/pilot-controller/empty
shell_plugins = /opt/pilot-controller/empty
strategy_plugins = /opt/pilot-controller/empty
terminal_plugins = /opt/pilot-controller/empty
test_plugins = /opt/pilot-controller/empty
vars_plugins = /opt/pilot-controller/empty
vars_plugins_enabled = host_group_vars
[inventory]
enable_plugins = yaml
[ssh_connection]
ssh_args = -o ControlMaster=no -o UserKnownHostsFile=/dev/null
pipelining = True
