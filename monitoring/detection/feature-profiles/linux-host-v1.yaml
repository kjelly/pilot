# Detection Engine MVP feature profile (detection-engine spec §12).
# id/version are part of the SignalEvent fingerprint (spec §21) — changing
# either changes the fingerprint of every host using this profile.
id: linux-host-v1
# Version 4 separates episodes created before actionable warning floors,
# storage corroboration, and notification routing became part of the profile.
version: 4
lifecycle:
  # At the normal 15s cadence this requires six high samples within an
  # eight-cycle window, four consecutive critical samples, and eight quiet
  # samples before resolution.
  warningWindowCycles: 8
  warningRequiredCycles: 6
  criticalConsecutiveCycles: 4
  recoveryConsecutiveCycles: 8
notify:
  warning: dashboard
  critical: teams
  runbookURL: docs/runbooks/detection-engine.md
  recommendedAction: Inspect the ranked contributors, confirm user-visible impact, and follow the Detection Engine runbook before remediation.
features:
  - name: cpu_utilization
    required: true
    category: cpu
    scaleFloor: 0.02
    cohort: true
    warningMinValue: 0.60
    # 60-80% CPU can open a dashboard warning; it is not CPU saturation and
    # must not page as critical until the absolute critical floor is met.
    criticalMinValue: 0.80
    validMin: 0
    validMax: 1.05
    promql: |
      1 - avg by (pilot_host, site) (
        rate(node_cpu_seconds_total{
          job="node",
          mode="idle",
          pilot_host!=""
        }[1m])
      )

  - name: load1_per_cpu
    required: true
    category: cpu
    scaleFloor: 0.05
    cohort: true
    warning: false
    # Load is a supporting pressure indicator. Without saturation, latency,
    # or queue-depth evidence it cannot independently justify a critical page.
    critical: false
    validMin: 0
    validMax: 64
    promql: |
      max by (pilot_host, site) (
        node_load1{job="node",pilot_host!=""}
      )
      /
      on (pilot_host, site)
      count by (pilot_host, site) (
        node_cpu_seconds_total{
          job="node",
          mode="idle",
          pilot_host!=""
        }
      )

  - name: memory_used_ratio
    required: true
    category: memory
    scaleFloor: 0.02
    cohort: true
    warningMinValue: 0.80
    criticalMinValue: 0.90
    validMin: 0
    validMax: 1
    promql: |
      1 -
      max by (pilot_host, site) (
        node_memory_MemAvailable_bytes{job="node",pilot_host!=""}
      )
      /
      max by (pilot_host, site) (
        node_memory_MemTotal_bytes{job="node",pilot_host!=""}
      )

  - name: rootfs_used_ratio
    required: true
    category: storage
    scaleFloor: 0.01
    cohort: true
    warningMinValue: 0.80
    criticalMinValue: 0.90
    validMin: 0
    validMax: 1
    promql: |
      1 -
      max by (pilot_host, site) (
        node_filesystem_avail_bytes{
          job="node",
          pilot_host!="",
          mountpoint="/",
          fstype!~"tmpfs|overlay"
        }
      )
      /
      max by (pilot_host, site) (
        node_filesystem_size_bytes{
          job="node",
          pilot_host!="",
          mountpoint="/",
          fstype!~"tmpfs|overlay"
        }
      )

  - name: disk_io_busy
    required: true
    category: storage
    scaleFloor: 0.05
    cohort: true
    warningMinValue: 0.80
    warningRequireAny:
      - feature: disk_io_queue_depth
        minValue: 1.0
      - feature: disk_io_latency_seconds
        minValue: 0.02
    # Busy time alone lacks latency/queue-depth evidence, so it cannot open a
    # warning without one corroborating metric and can never page as critical.
    critical: false
    validMin: 0
    validMax: 1.05
    promql: |
      max by (pilot_host, site) (
        rate(node_disk_io_time_seconds_total{
          job="node",
          pilot_host!="",
          device!~"^(loop|ram|fd|sr)[0-9]*$"
        }[5m])
      )

  - name: disk_io_queue_depth
    required: false
    category: storage
    scaleFloor: 0.25
    cohort: true
    warning: false
    critical: false
    validMin: 0
    validMax: 10000
    promql: |
      max by (pilot_host, site) (
        rate(node_disk_io_time_weighted_seconds_total{
          job="node",
          pilot_host!="",
          device!~"^(loop|ram|fd|sr)[0-9]*$"
        }[5m])
      )

  - name: disk_io_latency_seconds
    required: false
    category: storage
    scaleFloor: 0.005
    cohort: true
    warning: false
    critical: false
    validMin: 0
    validMax: 60
    promql: |
      max by (pilot_host, site) (
        (
          rate(node_disk_read_time_seconds_total{
            job="node",
            pilot_host!="",
            device!~"^(loop|ram|fd|sr)[0-9]*$"
          }[5m])
          +
          rate(node_disk_write_time_seconds_total{
            job="node",
            pilot_host!="",
            device!~"^(loop|ram|fd|sr)[0-9]*$"
          }[5m])
        )
        /
        clamp_min(
          rate(node_disk_reads_completed_total{
            job="node",
            pilot_host!="",
            device!~"^(loop|ram|fd|sr)[0-9]*$"
          }[5m])
          +
          rate(node_disk_writes_completed_total{
            job="node",
            pilot_host!="",
            device!~"^(loop|ram|fd|sr)[0-9]*$"
          }[5m]),
          0.000001
        )
      )

  - name: thermal_max_celsius
    required: false
    category: thermal
    scaleFloor: 2.0
    cohort: true
    warningMinValue: 75
    criticalMinValue: 85
    validMin: -50
    validMax: 200
    promql: |
      max by (pilot_host, site) (
        node_hwmon_temp_celsius{
          job="node",
          pilot_host!=""
        }
      )
