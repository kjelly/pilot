# Apply playbook for docs/verification/agent-controller.md (Phase 1).
#
# Deploys the pilot-agent-controller binary (built by
# scripts/build-agent-controller.sh, NOT downloaded or `go install`ed —
# same controller-side SHA256 verify-before-copy + target-side
# re-verify-after-copy convention as detection-engine-apply.yml) as a
# systemd service on a dedicated host. It never talks outbound to any
# other Pilot-managed role in Phase 1 — it only RECEIVES Alertmanager's
# webhook and (via the configured dispatcher) calls out to an external
# Agent Runtime, so unlike detection-engine-apply.yml there is no
# upstream inventory-group auto-detect/gate here.
#
# The listener binds to this host's own default routed address (never
# 0.0.0.0) — spec §5.2's "private/network-scoped" requirement — so an
# operator who wants a different interface must override
# agent_controller_listen_addr explicitly rather than rely on a wildcard
# bind plus firewall-only enforcement.
#
# Usage (dry run):
#   go run ./cmd/pilot vm-target run --name agentctl --sandbox \
#       playbooks/apply/agent-controller-apply.yml --check --diff \
#       -e agent_controller_artifact_path=dist/pilot-agent-controller-linux-amd64 \
#       -e agent_controller_artifact_sha256=<sha256> \
#       -e agent_controller_webhook_secret=<secret>
#
# Variables: see docs/verification/agent-controller.md §1.5 and
# contracts/agent-controller.yaml's groupVars.
#
# Stage gating (same convention as detection-engine-apply.yml):
#   sandbox  default; runs immediately
#   staging  requires -e confirm_staging=true
#   prod     requires -e confirm_prod=true AND staging_attested_within_hours<=168
- name: Apply agent-controller (Phase 1 observe-only incident controller)
  hosts: "{{ target_group | default('agent-controller') }}"
  become: true
  gather_facts: true
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168

    agent_controller_user: pilot-agent
    agent_controller_bin_dest: /usr/local/bin/pilot-agent-controller
    agent_controller_config_dir: /etc/pilot/agent-controller
    agent_controller_config_path: /etc/pilot/agent-controller/config.yaml
    agent_controller_data_dir: /var/lib/pilot/agent-controller
    agent_controller_db_path: /var/lib/pilot/agent-controller/state.db
    agent_controller_status_path: /run/pilot/agent-controller/status.json
    agent_controller_textfile_path: /var/lib/node_exporter/textfile/pilot_agent_controller.prom
    agent_controller_backup_dir: /var/backups/pilot-agent-controller

    # Deliberately not defaulted to 0.0.0.0 or 127.0.0.1 — resolved below
    # from ansible_default_ipv4.address unless explicitly overridden.
    agent_controller_listen_addr: ""



    # agent_controller_artifact_path / agent_controller_artifact_sha256 /
    # agent_controller_webhook_secret are DELIBERATELY NOT declared here
    # (same "no shadowing default" reasoning as detection-engine-
    # apply.yml's own artifact vars) — all three are required and gated
    # below; a hardcoded default here would silently defeat that gate.

  pre_tasks:
    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or
            (stage == 'staging' and confirm_staging | bool) or
            (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm flag. Pass -e confirm_staging=true or confirm_prod=true."
      tags: [always]

    - name: "Gate: stage must match this host's inventory environment group"
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。
      tags: [always]

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
        fail_msg: "prod gate: staging attestation missing or older than 168h."
      when: stage == 'prod'
      tags: [always]

    # Values an operator may set in group_vars/host_vars (contract groupVars,
    # group_vars/<role>.example.yml). They are defaulted here instead of in
    # the play's vars:, which outrank group_vars/host_vars and silently
    # replaced the operator's value (AGENTS.md §4.5 point 3); -e still wins.
    - name: "Resolve inventory-overridable defaults without shadowing group_vars/host_vars"
      ansible.builtin.set_fact:
        agent_controller_dispatcher_endpoint: "{{ agent_controller_dispatcher_endpoint | default('') }}"
        agent_controller_dispatcher_kind: "{{ agent_controller_dispatcher_kind | default('fake') }}"
        agent_controller_dispatcher_timeout_seconds: "{{ agent_controller_dispatcher_timeout_seconds | default(30) }}"
        agent_controller_listen_port: "{{ agent_controller_listen_port | default(8090) }}"
        agent_controller_max_body_bytes: "{{ agent_controller_max_body_bytes | default(1048576) }}"
        agent_controller_max_concurrent_runs: "{{ agent_controller_max_concurrent_runs | default(4) }}"
        agent_controller_max_runs_per_host: "{{ agent_controller_max_runs_per_host | default(1) }}"
      tags: [always]

    - name: "Gate: supported OS is Ubuntu 24.04"
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version == '24.04'
        fail_msg: >-
          agent-controller only supports Ubuntu 24.04 (no actual-run
          evidence exists for any other OS). Detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
      tags: [always]

    - name: "Gate: supported CPU architecture is x86_64/amd64"
      ansible.builtin.assert:
        that:
          - ansible_architecture == 'x86_64'
        fail_msg: "agent-controller only supports amd64. Detected {{ ansible_architecture }}."
      tags: [always]

    - name: "Gate: host-monitoring textfile collector directory exists on this host"
      ansible.builtin.stat:
        path: /var/lib/node_exporter/textfile
      register: agent_controller_textfile_dir_stat
      tags: [always]

    # Under --check only: host-monitoring-apply.yml creates nothing, so on a
    # fresh host the directory is still missing when both run in one
    # ansible-playbook call. Its Step 9b records
    # host_monitoring_textfile_dir_previewed when it previewed creating this
    # directory in the same run (issue #76); only that lets the check-mode
    # preview continue. A real run always requires the directory.
    # `.get()`, not dot access: a missing path's stat has no `isdir`, and
    # dot access raises instead of failing this gate with its message.
    - name: "Gate: assert host-monitoring's textfile directory is present and a directory"
      ansible.builtin.assert:
        that:
          - >-
            (agent_controller_textfile_dir_stat.stat.get('exists', false)
             and agent_controller_textfile_dir_stat.stat.get('isdir', false))
            or (ansible_check_mode
                and not agent_controller_textfile_dir_stat.stat.get('exists', false)
                and (host_monitoring_textfile_dir_previewed | default('')) == '/var/lib/node_exporter/textfile')
        fail_msg: >-
          /var/lib/node_exporter/textfile does not exist. agent-controller
          reuses host-monitoring's textfile collector to publish its OWN
          health metrics only — apply
          playbooks/apply/host-monitoring-apply.yml on this host first.
          A --check preview passes this gate on a fresh host only when
          host-monitoring-apply.yml previews creating the directory earlier
          in the same run.
      tags: [always]

    - name: "Gate: artifact path/sha256/webhook secret are supplied"
      ansible.builtin.assert:
        that:
          - agent_controller_artifact_path is defined
          - agent_controller_artifact_path | length > 0
          - agent_controller_artifact_sha256 is defined
          - agent_controller_artifact_sha256 | length > 0
          - agent_controller_webhook_secret is defined
          - agent_controller_webhook_secret | length > 0
        fail_msg: >-
          agent_controller_artifact_path, agent_controller_artifact_sha256,
          and agent_controller_webhook_secret are all required — build with
          scripts/build-agent-controller.sh first; unauthenticated webhooks
          must fail closed (spec §5), so there is no default secret.
      no_log: true
      tags: [always]

    - name: "Gate: dispatcher.kind=http requires a non-empty endpoint"
      ansible.builtin.assert:
        that:
          - agent_controller_dispatcher_kind in ['fake', 'http']
          - agent_controller_dispatcher_kind != 'http' or (agent_controller_dispatcher_endpoint | default('') | length > 0)
        fail_msg: >-
          agent_controller_dispatcher_kind must be fake or http; http
          requires a non-empty agent_controller_dispatcher_endpoint
          (spec §12).
      tags: [always]

    - name: "Resolve agent_controller_listen_addr from this host's default route when not explicitly set"
      tags: [always]
      ansible.builtin.set_fact:
        agent_controller_listen_addr: "{{ ansible_default_ipv4.address }}"
      when: agent_controller_listen_addr | default('') | length == 0

    - name: "Resolve agent_controller_artifact_path to an absolute controller path (relative = repo-root relative)"
      ansible.builtin.set_fact:
        agent_controller_artifact_abs_path: >-
          {{ agent_controller_artifact_path
             if (agent_controller_artifact_path is match('^/'))
             else (playbook_dir ~ '/../../' ~ agent_controller_artifact_path) }}
      tags: [always]

    - name: "Gate: artifact exists on the controller"
      ansible.builtin.stat:
        path: "{{ agent_controller_artifact_abs_path }}"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      run_once: true
      register: agent_controller_artifact_stat
      tags: [always]

    - name: "Gate: controller-side artifact exists and its SHA256 matches"
      ansible.builtin.assert:
        that:
          - agent_controller_artifact_stat.stat.get('exists', false)
          - agent_controller_artifact_stat.stat.get('checksum', '') == agent_controller_artifact_sha256
        fail_msg: >-
          controller artifact {{ agent_controller_artifact_abs_path }} is
          missing or its SHA256 ({{ agent_controller_artifact_stat.stat.get('checksum', 'MISSING') }})
          does not match agent_controller_artifact_sha256
          ({{ agent_controller_artifact_sha256 }}).
      run_once: true
      tags: [always]

    - name: "Gate: controller artifact's own `version` subcommand succeeds"
      ansible.builtin.command:
        argv: ["{{ agent_controller_artifact_abs_path }}", "version"]
      delegate_to: localhost
      become: false
      run_once: true
      register: agent_controller_artifact_version
      changed_when: false
      check_mode: false
      tags: [always]

    - name: "Gate: version output matches the binary contract (`pilot-agent-controller <version> (<commit>)`)"
      ansible.builtin.assert:
        that:
          - agent_controller_artifact_version.stdout is match('^pilot-agent-controller \S+ \(\S+\)')
        fail_msg: "unexpected version output: {{ agent_controller_artifact_version.stdout }}"
      run_once: true
      tags: [always]

  tasks:
    # Facts survive later plays on the same host (site.yml): never inherit restore
    # authority from an earlier play. The rescue reads these, so they are always-tagged
    # like the rescue; Steps 4f/5d/5e below (Step 6's tag) grant authority only after this
    # invocation's own snapshots pass validation (#195, same design as detection-engine
    # #190/#203).
    - name: "Step 0e: reset this invocation's rollback authority"
      tags: [always]
      ansible.builtin.set_fact:
        agent_controller_rollback: {binary_ready: false, db_ready: false, install_started: false}
        agent_controller_rollback_failed: false
        agent_controller_rollback_restored: false

    - name: "Agent Controller install + systemd service"
      block:
        - name: "Step 1: create dedicated system user"
          tags: [agent-controller-C1]
          ansible.builtin.user:
            name: "{{ agent_controller_user }}"
            system: true
            shell: /usr/sbin/nologin
            create_home: false

        - name: "Step 2: ensure config/data/backup directories exist"
          tags: [agent-controller-C5]
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: "{{ item.owner }}"
            group: "{{ item.group }}"
            mode: "{{ item.mode }}"
          loop:
            - { path: "{{ agent_controller_config_dir }}", owner: root, group: root, mode: "0755" }
            - { path: "{{ agent_controller_data_dir }}", owner: "{{ agent_controller_user }}", group: "{{ agent_controller_user }}", mode: "0700" }
            - { path: "{{ agent_controller_backup_dir }}", owner: root, group: root, mode: "0700" }

        # Steps 3-5 take Step 6's own tag (agent-controller-C4), not `always`: backup and
        # upgrade detection must run exactly when Step 6 replaces the binary, under every
        # selection Ansible makes (--tags tagged, --skip-tags, another row's tag, ...), and
        # not otherwise. With `always`, a run that never reached Step 6 kept taking a
        # "pre-upgrade" backup while the binary stayed stale, and Step 4's
        # changed_when: true failed the second-apply idempotency check (#195, the same
        # defect detection-engine had before #190).
        #
        # Each upgrade snapshots into its own private directory and the rescue restores
        # only what this invocation validated: a shared fixed name could hand the rescue an
        # older snapshot when this run's backup failed (detection-engine #193/#194).
        - name: "Step 3: check whether a previous state.db exists (skip backup on first install)"
          tags: [agent-controller-C4]
          ansible.builtin.stat:
            path: "{{ agent_controller_db_path }}"
          register: agent_controller_existing_db

        - name: "Step 3b: check whether a previous binary exists and would actually change"
          tags: [agent-controller-C4]
          ansible.builtin.stat:
            path: "{{ agent_controller_bin_dest }}"
            checksum_algorithm: sha256
          register: agent_controller_existing_binary_stat

        # Only a real upgrade (the binary content will change) counts: a no-op re-apply
        # must stay changed=0.
        - name: "Step 3c: determine whether this apply is an upgrade"
          tags: [agent-controller-C4]
          ansible.builtin.set_fact:
            agent_controller_is_upgrade: >-
              {{ agent_controller_existing_binary_stat.stat.exists
                 and agent_controller_existing_binary_stat.stat.checksum != agent_controller_artifact_sha256 }}

        - name: "Step 3d: ensure the backup directory exists before taking rollback material"
          tags: [agent-controller-C4]
          ansible.builtin.file:
            path: "{{ agent_controller_backup_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
          when: agent_controller_is_upgrade

        - name: "Step 3e: allocate a private directory for this upgrade only"
          tags: [agent-controller-C4]
          ansible.builtin.tempfile:
            state: directory
            path: "{{ agent_controller_backup_dir }}"
            prefix: apply-
          register: agent_controller_backup_run
          when: agent_controller_is_upgrade and not ansible_check_mode

        - name: "Step 4: back up state.db before an upgrade (SQLite consistent snapshot via VACUUM INTO)"
          tags: [agent-controller-C4]
          ansible.builtin.command:
            argv:
              - "{{ agent_controller_bin_dest }}"
              - db
              - backup
              - --db
              - "{{ agent_controller_db_path }}"
              - --output
              - "{{ agent_controller_backup_run.path }}/pre-upgrade.db"
          when: agent_controller_is_upgrade and agent_controller_existing_db.stat.exists and not ansible_check_mode
          changed_when: true

        - name: "Step 4b: require the backup command to have produced a database file"
          tags: [agent-controller-C4]
          ansible.builtin.stat:
            path: "{{ agent_controller_backup_run.path }}/pre-upgrade.db"
            checksum_algorithm: sha256
          when: agent_controller_is_upgrade and agent_controller_existing_db.stat.exists and not ansible_check_mode
          register: agent_controller_db_backup_stat

        - name: "Step 4c: require a regular nonempty database snapshot"
          tags: [agent-controller-C4]
          ansible.builtin.assert:
            that:
              - agent_controller_db_backup_stat.stat.isreg | default(false)
              - not (agent_controller_db_backup_stat.stat.islnk | default(false))
              - agent_controller_db_backup_stat.stat.size | default(0) | int > 0
              - agent_controller_db_backup_stat.stat.checksum is defined
            fail_msg: >-
              `db backup` did not leave a regular nonempty snapshot at
              {{ agent_controller_backup_run.path }}/pre-upgrade.db; refusing to replace the
              binary without a database to restore.
          when: agent_controller_is_upgrade and agent_controller_existing_db.stat.exists and not ansible_check_mode

        - name: "Step 4d: verify SQLite snapshot integrity before replacing the binary"
          tags: [agent-controller-C4]
          ansible.builtin.command:
            argv: ["{{ agent_controller_bin_dest }}", db, check, --db, "{{ agent_controller_backup_run.path }}/pre-upgrade.db"]
          when: agent_controller_is_upgrade and agent_controller_existing_db.stat.exists and not ansible_check_mode
          register: agent_controller_db_backup_check
          changed_when: false
          failed_when: agent_controller_db_backup_check.rc != 0 or agent_controller_db_backup_check.stdout | trim != 'ok'

        - name: "Step 4e: record the validated database snapshot checksum"
          tags: [agent-controller-C4]
          ansible.builtin.stat:
            path: "{{ agent_controller_backup_run.path }}/pre-upgrade.db"
            checksum_algorithm: sha256
          when: agent_controller_is_upgrade and agent_controller_existing_db.stat.exists and not ansible_check_mode
          register: agent_controller_db_backup_stat

        - name: "Step 4f: grant this invocation database restore authority"
          tags: [agent-controller-C4]
          ansible.builtin.set_fact:
            agent_controller_rollback: >-
              {{ agent_controller_rollback | combine({'db_ready': true,
                 'db_sha256': agent_controller_db_backup_stat.stat.checksum}) }}
          when: agent_controller_is_upgrade and agent_controller_existing_db.stat.exists and not ansible_check_mode

        # No failed_when: false. A snapshot that cannot be taken stops the upgrade before
        # Step 6 replaces the binary.
        - name: "Step 5: snapshot the previously installed binary (rollback material)"
          tags: [agent-controller-C4]
          ansible.builtin.copy:
            src: "{{ agent_controller_bin_dest }}"
            dest: "{{ agent_controller_backup_run.path }}/pilot-agent-controller.prev"
            remote_src: true
            mode: "0755"
          when: agent_controller_is_upgrade and not ansible_check_mode

        - name: "Step 5b: checksum this invocation's binary snapshot"
          tags: [agent-controller-C4]
          ansible.builtin.stat:
            path: "{{ agent_controller_backup_run.path }}/pilot-agent-controller.prev"
            checksum_algorithm: sha256
          when: agent_controller_is_upgrade and not ansible_check_mode
          register: agent_controller_binary_backup_stat

        - name: "Step 5c: require an exact snapshot of the previously installed binary"
          tags: [agent-controller-C4]
          ansible.builtin.assert:
            that:
              - agent_controller_binary_backup_stat.stat.isreg | default(false)
              - not (agent_controller_binary_backup_stat.stat.islnk | default(false))
              - agent_controller_binary_backup_stat.stat.checksum | default('') == agent_controller_existing_binary_stat.stat.checksum
            fail_msg: >-
              the snapshot of the installed binary at
              {{ agent_controller_backup_run.path }}/pilot-agent-controller.prev is missing or
              differs from the installed binary; refusing to replace the binary without it.
          when: agent_controller_is_upgrade and not ansible_check_mode

        - name: "Step 5d: grant this invocation binary restore authority"
          tags: [agent-controller-C4]
          ansible.builtin.set_fact:
            agent_controller_rollback: >-
              {{ agent_controller_rollback | combine({'binary_ready': true,
                 'path': agent_controller_backup_run.path,
                 'binary_sha256': agent_controller_existing_binary_stat.stat.checksum}) }}
          when: agent_controller_is_upgrade and not ansible_check_mode

        - name: "Step 5e: record that binary replacement is about to be attempted"
          tags: [agent-controller-C4]
          ansible.builtin.set_fact:
            agent_controller_rollback: "{{ agent_controller_rollback | combine({'install_started': true}) }}"
          when: not ansible_check_mode

        - name: "Step 6: copy the pinned binary to the target"
          tags: [agent-controller-C4]
          ansible.builtin.copy:
            src: "{{ agent_controller_artifact_abs_path }}"
            dest: "{{ agent_controller_bin_dest }}"
            mode: "0755"
            owner: root
            group: root
          register: agent_controller_binary_result

        - name: "Step 7: verify the target-side binary SHA256 (verify again after copy)"
          tags: [agent-controller-C4]
          ansible.builtin.stat:
            path: "{{ agent_controller_bin_dest }}"
            checksum_algorithm: sha256
          register: agent_controller_target_binary_stat

        - name: "Step 7: assert target-side SHA256 matches"
          tags: [agent-controller-C4]
          ansible.builtin.assert:
            that:
              - agent_controller_target_binary_stat.stat.get('checksum', '') == agent_controller_artifact_sha256
            fail_msg: >-
              target binary SHA256
              ({{ agent_controller_target_binary_stat.stat.get('checksum', 'MISSING') }}) does
              not match agent_controller_artifact_sha256
              ({{ agent_controller_artifact_sha256 }}) after copy.
          when: not ansible_check_mode

        - name: "Step 8: render config.yaml (webhook secret is NOT here — only the env var NAME it arrives through)"
          tags: [agent-controller-C2, agent-controller-C4]
          ansible.builtin.copy:
            dest: "{{ agent_controller_config_path }}"
            mode: "0644"
            content: |
              listenAddr: "{{ agent_controller_listen_addr }}:{{ agent_controller_listen_port }}"
              dbPath: "{{ agent_controller_db_path }}"
              statusPath: "{{ agent_controller_status_path }}"
              textfileMetricsPath: "{{ agent_controller_textfile_path }}"
              webhookSecretEnv: "AGENT_CONTROLLER_WEBHOOK_SECRET"
              maxBodyBytes: {{ agent_controller_max_body_bytes }}
              maxConcurrentRuns: {{ agent_controller_max_concurrent_runs }}
              maxRunsPerHost: {{ agent_controller_max_runs_per_host }}
              dispatcher:
                kind: "{{ agent_controller_dispatcher_kind }}"
                endpoint: "{{ agent_controller_dispatcher_endpoint }}"
                timeoutSeconds: {{ agent_controller_dispatcher_timeout_seconds }}
          register: agent_controller_config_result

        - name: "Step 8b: record the private listen port for the C3 verification probe"
          ansible.builtin.copy:
            dest: "{{ agent_controller_config_dir }}/listen_port"
            mode: "0644"
            content: "{{ agent_controller_listen_port }}"

        - name: "Step 9: render webhook-secret.env (root:root 0600, no_log — the only place the real secret value lands)"
          tags: [agent-controller-C12]
          ansible.builtin.copy:
            dest: "{{ agent_controller_config_dir }}/webhook-secret.env"
            owner: root
            group: root
            mode: "0600"
            content: |
              AGENT_CONTROLLER_WEBHOOK_SECRET={{ agent_controller_webhook_secret }}
          no_log: true
          register: agent_controller_secret_env_result

        - name: "Step 10: validate the rendered config (config schema gate, before any restart)"
          tags: [agent-controller-C4]
          ansible.builtin.command:
            argv: ["{{ agent_controller_bin_dest }}", "config", "validate", "--config", "{{ agent_controller_config_path }}"]
          changed_when: false

        - name: "Step 11: render pilot-agent-controller.service"
          tags: [agent-controller-C1]
          ansible.builtin.copy:
            dest: /etc/systemd/system/pilot-agent-controller.service
            mode: "0644"
            content: |
              [Unit]
              Description=Pilot Agent Controller (Phase 1 observe-only)
              Wants=network-online.target
              After=network-online.target

              [Service]
              User={{ agent_controller_user }}
              Group={{ agent_controller_user }}
              Type=simple
              EnvironmentFile={{ agent_controller_config_dir }}/webhook-secret.env
              ExecStart={{ agent_controller_bin_dest }} serve --config {{ agent_controller_config_path }}
              Restart=on-failure
              RuntimeDirectory=pilot/agent-controller
              RuntimeDirectoryMode=0755
              NoNewPrivileges=yes
              PrivateTmp=yes
              ProtectHome=yes
              ProtectSystem=strict
              ProtectKernelTunables=yes
              ProtectKernelModules=yes
              ProtectControlGroups=yes
              RestrictSUIDSGID=yes
              CapabilityBoundingSet=
              AmbientCapabilities=
              ReadWritePaths={{ agent_controller_data_dir }}
              ReadWritePaths=/run/pilot/agent-controller
              ReadWritePaths=/var/lib/node_exporter/textfile

              [Install]
              WantedBy=multi-user.target
          register: agent_controller_unit_result

        - name: "Step 12: reload systemd if the unit file changed"
          ansible.builtin.systemd:
            daemon_reload: true
          when: (agent_controller_unit_result | default({})) is changed

        - name: "Step 13: ensure pilot-agent-controller.service enabled+started"
          tags: [agent-controller-C1]
          ansible.builtin.systemd:
            name: pilot-agent-controller.service
            state: started
            enabled: true
          when: not ansible_check_mode
          register: agent_controller_service_ensure_result

        # Registered so the rescue can say whether this run restarted the service. The
        # result reads above use `default({})`: a selection that skips Step 6, 8, 9 or 11
        # never registers it, and a bare `x is changed` on a missing result fails the run.
        - name: "Step 14: restart if the binary, secret, config, or unit changed"
          ansible.builtin.systemd:
            name: pilot-agent-controller.service
            state: restarted
          when: >-
            not ansible_check_mode
            and ((agent_controller_binary_result | default({})) is changed
            or (agent_controller_secret_env_result | default({})) is changed
            or (agent_controller_config_result | default({})) is changed
            or (agent_controller_unit_result | default({})) is changed)
          register: agent_controller_service_restart_result

        - name: "Step 15: wait for the service to report active"
          ansible.builtin.command:
            argv: [systemctl, is-active, pilot-agent-controller.service]
          register: agent_controller_active_check
          changed_when: false
          retries: 15
          delay: 2
          until: agent_controller_active_check.rc == 0
          when: not ansible_check_mode

        - name: "Step 16: wait for status.json to become readable (SQLite WAL commit can take a few seconds on a slow disk)"
          tags: [agent-controller-C6]
          ansible.builtin.command:
            argv: ["{{ agent_controller_bin_dest }}", "status", "--status-path", "{{ agent_controller_status_path }}", "--field", "state"]
          register: agent_controller_status_check
          changed_when: false
          failed_when: false
          retries: 20
          delay: 5
          until: agent_controller_status_check.rc == 0
          when: not ansible_check_mode

        - name: "Step 16: assert status.json was reachable"
          tags: [agent-controller-C6]
          ansible.builtin.assert:
            that:
              - agent_controller_status_check.rc == 0
            fail_msg: >-
              status.json never became readable at
              {{ agent_controller_status_path }} — check
              `journalctl -u pilot-agent-controller`.
          when: not ansible_check_mode

        - name: "Step 17: verify database integrity"
          tags: [agent-controller-C5]
          ansible.builtin.command:
            argv: ["{{ agent_controller_bin_dest }}", "db", "check", "--db", "{{ agent_controller_db_path }}"]
          register: agent_controller_db_check
          changed_when: false
          when: not ansible_check_mode

        - name: "Step 17b: enforce state.db ownership/mode (the sqlite driver creates it 0644 by default)"
          tags: [agent-controller-C5]
          ansible.builtin.file:
            path: "{{ agent_controller_db_path }}"
            owner: "{{ agent_controller_user }}"
            group: "{{ agent_controller_user }}"
            mode: "0600"
          when: not ansible_check_mode

      rescue:
        # Only a run that reached Step 6 (install_started) may have left a new binary
        # behind, so only that run stops the service. A run that fails before Step 6 (a
        # snapshot or validation step refused) has rewritten nothing the service uses, and
        # the rescue leaves the service alone: stopping and disabling a healthy service
        # there was an availability regression (#195 review; before #195 the stale-restore
        # path restarted it). A run that did not select Step 6 can still have rewritten
        # config.yaml, webhook-secret.env or the unit, or restarted the service, before it
        # failed; the rescue does not undo that, and its final message lists what changed.
        #
        # Known limitation, kjelly/pilot#395: a run that selects Step 6 without replacing
        # the binary and then fails still gets the stop below, and no run restores
        # config.yaml, the unit or webhook-secret.env.
        #
        # What the final message says is decided from facts every `--tags` selection can
        # read: always-tagged registers, and the registers of tagged steps read with
        # `is defined` (a selection that skips a step never registers it).
        - name: "ROLLBACK — list what this run changed on the host besides the binary"
          tags: [always]
          ansible.builtin.set_fact:
            agent_controller_rescue_changes: >-
              {{ [] if ansible_check_mode else (
                   (['rewrote config.yaml'] if (agent_controller_config_result is defined and agent_controller_config_result is changed) else [])
                 + (['rewrote webhook-secret.env'] if (agent_controller_secret_env_result is defined and agent_controller_secret_env_result is changed) else [])
                 + (['rewrote the systemd unit'] if (agent_controller_unit_result is defined and agent_controller_unit_result is changed) else [])
                 + (['started or enabled the service'] if (agent_controller_service_ensure_result is defined and agent_controller_service_ensure_result is changed) else [])
                 + (['restarted the service'] if (agent_controller_service_restart_result is defined and agent_controller_service_restart_result is changed) else [])
                 ) }}

        - name: "ROLLBACK — stop the newly (mis)configured service"
          tags: [always]
          ansible.builtin.systemd:
            name: pilot-agent-controller.service
            state: stopped
            enabled: false
          register: agent_controller_rescue_stop
          ignore_errors: true
          when: agent_controller_rollback is defined and agent_controller_rollback.install_started

        # A stop that failed is either a service that cannot be stopped or no service at
        # all. A status-only query does not fail on a missing unit: it reports
        # LoadState=not-found (ansible-core 2.19.2 and systemd 259, captured; the same
        # module with state: stopped fails with "Could not find the requested service").
        # A query that itself fails leaves the "could NOT be stopped" message.
        - name: "ROLLBACK — read whether systemd knows the unit (status only)"
          tags: [always]
          ansible.builtin.systemd:
            name: pilot-agent-controller.service
          register: agent_controller_rescue_unit
          ignore_errors: true
          when: agent_controller_rescue_stop is failed

        # Restore only what this invocation snapshotted and validated (Steps 4f/5d/5e).
        # No fallback to shared historical backup names: when this run took no snapshot
        # there is nothing to put back. Both sources are rechecked against the checksums
        # recorded before Step 6; a stop that failed refuses every data mutation.
        - name: "ROLLBACK — restore only this invocation's validated material"
          tags: [always]
          when: agent_controller_rollback is defined and agent_controller_rollback.install_started and agent_controller_rollback.binary_ready
          block:
            - name: "ROLLBACK — require the service to have stopped before restoring data"
              tags: [always]
              ansible.builtin.assert:
                that:
                  - agent_controller_rescue_stop is succeeded

            - name: "ROLLBACK — recheck the private binary snapshot"
              tags: [always]
              when: agent_controller_rollback is defined
              ansible.builtin.stat:
                path: "{{ agent_controller_rollback.path }}/pilot-agent-controller.prev"
                checksum_algorithm: sha256
              register: agent_controller_rescue_binary_source

            - name: "ROLLBACK — refuse a missing or changed binary snapshot"
              tags: [always]
              when: agent_controller_rollback is defined
              ansible.builtin.assert:
                that:
                  - agent_controller_rescue_binary_source.stat.isreg | default(false)
                  - not (agent_controller_rescue_binary_source.stat.islnk | default(false))
                  - agent_controller_rescue_binary_source.stat.checksum | default('') == agent_controller_rollback.binary_sha256

            - name: "ROLLBACK — recheck the private database snapshot"
              tags: [always]
              ansible.builtin.stat:
                path: "{{ agent_controller_rollback.path }}/pre-upgrade.db"
                checksum_algorithm: sha256
              register: agent_controller_rescue_db_source
              when: agent_controller_rollback is defined and agent_controller_rollback.db_ready

            - name: "ROLLBACK — refuse a missing or changed database snapshot"
              tags: [always]
              ansible.builtin.assert:
                that:
                  - agent_controller_rescue_db_source.stat.isreg | default(false)
                  - not (agent_controller_rescue_db_source.stat.islnk | default(false))
                  - agent_controller_rescue_db_source.stat.checksum | default('') == agent_controller_rollback.db_sha256
              when: agent_controller_rollback is defined and agent_controller_rollback.db_ready

            - name: "ROLLBACK — restore the previous binary"
              tags: [always]
              when: agent_controller_rollback is defined
              ansible.builtin.copy:
                src: "{{ agent_controller_rollback.path }}/pilot-agent-controller.prev"
                dest: "{{ agent_controller_bin_dest }}"
                remote_src: true
                mode: "0755"

            - name: "ROLLBACK — remove the new database's WAL and SHM before restoring the snapshot"
              tags: [always]
              ansible.builtin.file:
                path: "{{ agent_controller_db_path }}{{ item }}"
                state: absent
              loop: [-wal, -shm]
              when: agent_controller_rollback is defined and agent_controller_rollback.db_ready

            - name: "ROLLBACK — restore the pre-upgrade database"
              tags: [always]
              ansible.builtin.copy:
                src: "{{ agent_controller_rollback.path }}/pre-upgrade.db"
                dest: "{{ agent_controller_db_path }}"
                remote_src: true
                mode: "0600"
                owner: "{{ agent_controller_user }}"
                group: "{{ agent_controller_user }}"
              when: agent_controller_rollback is defined and agent_controller_rollback.db_ready

            - name: "ROLLBACK — checksum the restored binary"
              tags: [always]
              ansible.builtin.stat:
                path: "{{ agent_controller_bin_dest }}"
                checksum_algorithm: sha256
              register: agent_controller_rescue_binary_stat

            - name: "ROLLBACK — verify the restored binary checksum"
              tags: [always]
              when: agent_controller_rollback is defined
              ansible.builtin.assert:
                that:
                  - agent_controller_rescue_binary_stat.stat.checksum | default('') == agent_controller_rollback.binary_sha256

            # As the service user, so a read-only open does not leave root-owned
            # -wal/-shm files the service cannot open.
            - name: "ROLLBACK — verify the restored SQLite database"
              tags: [always]
              become: true
              become_user: "{{ agent_controller_user }}"
              ansible.builtin.command:
                argv: ["{{ agent_controller_bin_dest }}", db, check, --db, "{{ agent_controller_db_path }}"]
              register: agent_controller_rescue_db_check
              changed_when: false
              failed_when: agent_controller_rescue_db_check.rc != 0 or agent_controller_rescue_db_check.stdout | trim != 'ok'
              when: agent_controller_rollback is defined and agent_controller_rollback.db_ready

            - name: "ROLLBACK — record that the previous binary (and database) are back"
              tags: [always]
              when: agent_controller_rollback is defined
              ansible.builtin.set_fact:
                agent_controller_rollback_restored: true

          rescue:
            - name: "ROLLBACK — record that restoring failed; keep the service stopped"
              tags: [always]
              ansible.builtin.set_fact:
                agent_controller_rollback_failed: true

        - name: "ROLLBACK — restart with the restored previous binary"
          tags: [always]
          ansible.builtin.systemd:
            name: pilot-agent-controller.service
            state: restarted
            enabled: true
          when: agent_controller_rollback_restored
          register: agent_controller_rescue_restart
          ignore_errors: true

        - name: "ROLLBACK — surface the original failure (evidence preserved)"
          tags: [always]
          ansible.builtin.fail:
            msg: >-
              agent-controller apply FAILED (see task output above).
              {% if agent_controller_rescue_stop is skipped %}{% if agent_controller_rescue_changes | length == 0 %}It
              failed before Step 6 replaced the binary (or this run did not select Step 6): no
              binary, config.yaml, webhook-secret.env or unit was rewritten and the service was
              not started, enabled or restarted, so it was left as it was.
              {% else %}No binary was replaced (it failed before Step 6, or this run did not
              select Step 6), but before it failed this run
              {{ agent_controller_rescue_changes | join(', ') }}. None of that was rolled
              back; check `journalctl -u pilot-agent-controller`.
              {% endif %}
              {% elif agent_controller_rescue_stop is failed and agent_controller_rescue_unit is succeeded and (agent_controller_rescue_unit.status.LoadState | default('')) == 'not-found' %}systemd
              has no pilot-agent-controller.service (LoadState=not-found, for example a first
              install that failed before the unit was rendered and loaded), so there was no
              service to stop and nothing was restored. This run had started replacing the
              binary at {{ agent_controller_bin_dest }}; fix the cause and re-run to finish the
              install.
              {% elif agent_controller_rescue_stop is failed %}The service could NOT be stopped;
              it may still be running the binary this run installed. Nothing was restored.
              {% elif agent_controller_rollback_restored and agent_controller_rescue_restart is succeeded %}This
              run had replaced the binary; the previous binary (and state.db, when one existed)
              were restored from this run's apply-* snapshot directory under
              {{ agent_controller_backup_dir }} and the service was restarted with them.
              {% elif agent_controller_rollback_restored %}The previous binary (and state.db, when
              one existed) were restored from this run's apply-* snapshot directory under
              {{ agent_controller_backup_dir }}, but restarting the service FAILED; check
              `journalctl -u pilot-agent-controller`.
              {% elif agent_controller_rollback_failed %}Restoring this run's snapshots from its
              apply-* directory under {{ agent_controller_backup_dir }} FAILED; the service is
              stopped and disabled. Restore it by hand before restarting.
              {% else %}This run took no rollback snapshot (first install, or the binary did not
              change), so nothing was restored; the service was stopped and disabled and left
              in place for inspection.{% endif %}

    - name: "Publish agent-controller health metrics via the textfile collector"
      ansible.builtin.wait_for:
        path: "{{ agent_controller_textfile_path }}"
        timeout: 60
      changed_when: false
