---
# Apply playbook for docs/verification/reverse-proxy.md
#
# Installs and enables nginx, removes the distribution default site so it
# cannot intercept a Pilot-owned endpoint, and establishes the
# /etc/nginx/conf.d/pilot-internal-endpoint-<stable-id>.conf ownership
# namespace (spec.md §6.1, §6.3, §6.4). Does not render any specific
# internal-endpoint vhost — that belongs to internal-endpoint-apply.yml.
#
# Usage (sandbox):
#
#   go run ./cmd/pilot vm-target run --name web-1 \
#       playbooks/apply/reverse-proxy-apply.yml \
#       -e target_group=reverse-proxy
#
# Stage gating (same convention as other apply playbooks):
#   sandbox  default; runs immediately
#   staging  requires -e confirm_staging=true
#   prod     requires -e confirm_prod=true AND staging_attested_within_hours<=168
- name: Reverse proxy (nginx) base apply
  hosts: "{{ target_group | default('reverse-proxy') }}"
  become: true
  gather_facts: true
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168
    target_group: reverse-proxy

  pre_tasks:
    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or
            (stage == 'staging' and confirm_staging | bool) or
            (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm flag. Pass -e confirm_staging=true or confirm_prod=true."

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - stage != 'prod'
          - (staging_attested_within_hours | int) <= 168
        fail_msg: "prod gate: staging attestation missing or older than 168h."
      when: stage == 'prod'

  tasks:
    # Spec: docs/verification/reverse-proxy.md C1
    - name: "Install nginx (Debian family)"
      tags: [C1]
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: "Install nginx (RedHat family)"
      tags: [C1]
      ansible.builtin.dnf:
        name: nginx
        state: present
      when: ansible_os_family == 'RedHat'

    # Spec: docs/verification/reverse-proxy.md C2
    - name: "Enable and start nginx.service"
      tags: [C2]
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      # On a genuinely fresh host, --check mode only simulates the apt/dnf
      # install above (package/unit never actually lands on disk), so the
      # service module has no real nginx.service to enable/start and fails
      # hard instead of predicting a change — same class of gap as the
      # docker_container/-image check-mode issue this repo already hit
      # (pilot-checkmode-fresh-bootstrap-docker-gap memory). Caught for real
      # on rp-ubuntu's first --check --diff dry-run (2026-08-13).
      when: not ansible_check_mode

    # Spec: docs/verification/reverse-proxy.md C4 (spec.md §6.4)
    - name: "Remove the Debian/Ubuntu default site (sites-enabled symlink + sites-available file)"
      tags: [C4]
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/default
        - /etc/nginx/sites-available/default
      when: ansible_os_family == 'Debian'

    - name: "Remove the RedHat-family default vhost file (older nginx package variants that ship one)"
      tags: [C4]
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      when: ansible_os_family == 'RedHat'

    # RedHat-family nginx (confirmed on AlmaLinux 9, 2026-08-13 vm-target run)
    # bakes its default catch-all directly into /etc/nginx/nginx.conf's
    # http{} block as a plain `server { listen 80; server_name _; }` with
    # no conf.d/default.conf file at all — removing files alone leaves it
    # fully active. Rather than regex-editing vendor content, claim the
    # default_server slot explicitly ourselves: nginx always prefers an
    # explicit default_server over an implicit first-block default,
    # regardless of file/definition order, so this wins on every distro
    # without ever touching nginx.conf. Applied on both families so the
    # end state converges instead of only being defended on one of them.
    - name: "Claim the default_server slot so no unmatched Host header reaches a distro default (spec.md §6.4)"
      tags: [C4]
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/pilot-reverse-proxy-default.conf
        content: |
          # Managed by pilot (reverse-proxy-apply.yml). Explicitly claims the
          # default_server slot for HTTP so no request for a hostname that
          # doesn't match a Pilot-owned endpoint vhost is ever served by the
          # distro's own default content (spec.md §6.4). Do not hand-edit.
          # No server_name here on purpose: default_server alone already
          # means "match when nothing else does"; declaring server_name _
          # too collides with RedHat-family nginx's own vendor default
          # block (also named "_") and makes nginx -t warn about a
          # duplicate server name on every run.
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              return 444;
          }
        owner: root
        group: root
        mode: "0644"
      notify: reload nginx

    # Spec: docs/verification/reverse-proxy.md C5 (spec.md §6.3)
    - name: "Establish the Pilot-owned nginx config namespace"
      tags: [C5]
      block:
        - name: "Ensure /etc/nginx/conf.d/ exists"
          ansible.builtin.file:
            path: /etc/nginx/conf.d
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: "Drop the Pilot-owned-namespace marker"
          ansible.builtin.copy:
            dest: /etc/nginx/conf.d/.pilot-owned-namespace
            content: |
              # Managed by pilot (reverse-proxy-apply.yml). Per-endpoint vhosts
              # from internal-endpoint-apply.yml render as
              # pilot-internal-endpoint-<stable-id>.conf in this directory
              # (spec.md §6.3). Do not hand-edit; foreign *.conf files in this
              # directory are left untouched.
            owner: root
            group: root
            mode: "0644"

  handlers:
    # spec.md §13's "nginx -t succeeds before reload" convention, applied
    # here too: a config error from this base install must never take down
    # an already-running nginx. Both guarded with not ansible_check_mode —
    # same reasoning as the C2 service task above: on a genuinely fresh
    # host under --check, nginx was never really installed, so there is no
    # real service to validate/reload yet.
    - name: validate nginx config before reload
      ansible.builtin.command: nginx -t
      changed_when: false
      when: not ansible_check_mode
      listen: reload nginx

    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: not ansible_check_mode
      listen: reload nginx
