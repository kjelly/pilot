# Apply playbook for docs/verification/freeipa-realm-replacement.md.
#
# This is deliberately a client-wave migration, not a FreeIPA server restore.
# The old server must remain available if automatic local rollback is expected
# to yield a working old login path: the rescue re-enrolls the client there
# with its preserved host keys.  A rebuilt/retired old server makes the old
# archive forensic material only, not a trust rollback mechanism.
---
- name: Replace a client's FreeIPA realm enrollment
  hosts: "{{ target_group | default('freeipa-client') }}"
  become: true
  gather_facts: true
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168
    freeipa_realm_replacement_confirm: false
    freeipa_realm_replacement_finalize_only: false
    freeipa_realm_replacement_ticket: ""
    freeipa_realm_replacement_verify_user: admin
    freeipa_realm_replacement_state_dir: /etc/pilot
    freeipa_realm_replacement_state_file: /etc/pilot/freeipa-realm-replacement.env
    freeipa_realm_replacement_expected_realm_file: /etc/pilot/freeipa-realm-replacement.expected-realm
    freeipa_realm_replacement_expected_host_file: /etc/pilot/freeipa-realm-replacement.expected-host
    freeipa_realm_replacement_expected_user_file: /etc/pilot/freeipa-realm-replacement.expected-user
    freeipa_realm_replacement_backup_link: /etc/pilot/freeipa-realm-replacement.backup
    freeipa_realm_replacement_backup_dir: /var/backups/pilot/freeipa-realm-replacement
    freeipa_realm_replacement_backup_archive: >-
      {{ freeipa_realm_replacement_backup_dir }}/{{ inventory_hostname }}-{{ ansible_date_time.iso8601_basic_short }}.tar.gz

  pre_tasks:
    - name: "Gate: realm replacement requires explicit human confirmation"
      ansible.builtin.assert:
        that:
          - freeipa_realm_replacement_confirm | bool
          - freeipa_realm_replacement_ticket | length >= 3
          - freeipa_realm_replacement_old_realm is defined and freeipa_realm_replacement_old_realm | length > 0
          - freeipa_realm_replacement_new_domain is defined and freeipa_realm_replacement_new_domain | length > 0
          - freeipa_realm_replacement_new_realm is defined and freeipa_realm_replacement_new_realm | length > 0
          - freeipa_realm_replacement_new_server_fqdn is defined and freeipa_realm_replacement_new_server_fqdn | length > 0
          - freeipa_realm_replacement_new_server_ip is defined and freeipa_realm_replacement_new_server_ip | length > 0
          - freeipa_realm_replacement_client_fqdn is defined and freeipa_realm_replacement_client_fqdn | length > 0
          - ipa_admin_password is defined and ipa_admin_password | length >= 8
          - freeipa_realm_replacement_old_realm != freeipa_realm_replacement_new_realm
          - freeipa_realm_replacement_new_realm == (freeipa_realm_replacement_new_domain | upper)
        fail_msg: >-
          This destructive client-wave migration is fail-closed. Supply every
          old/new realm coordinate, a vault-backed ipa_admin_password, a change
          ticket, and -e freeipa_realm_replacement_confirm=true. The new realm
          must differ from the old realm and equal NEW_DOMAIN upper-cased.
      tags: [always]

    - name: "Gate: supported client OS"
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'RedHat']
        fail_msg: "Only Debian/Ubuntu and Enterprise Linux FreeIPA clients are supported."
      tags: [always]

    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or (stage == 'staging' and confirm_staging | bool) or (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm_staging=true or confirm_prod=true."
      tags: [always]

    - name: "Gate: stage must match this host's inventory environment group"
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。
      tags: [always]

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
      when: stage == 'prod'
      tags: [always]

    - name: "Gate: reject a second migration without explicit recovery review"
      ansible.builtin.stat:
        path: "{{ freeipa_realm_replacement_state_file }}"
      register: freeipa_realm_replacement_prior_state
      tags: [always]

    - name: "Gate: client must still be enrolled in the declared old realm"
      ansible.builtin.shell: >-
        test -f /etc/ipa/default.conf &&
        awk -F= -v want="{{ freeipa_realm_replacement_old_realm }}"
        '/^realm[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); exit $2 != want}'
        /etc/ipa/default.conf
      changed_when: false
      when: not freeipa_realm_replacement_prior_state.stat.exists
      tags: [C1]

    - name: "Gate: prior migration state must be absent"
      ansible.builtin.assert:
        that:
          - freeipa_realm_replacement_finalize_only | bool or not freeipa_realm_replacement_prior_state.stat.exists
        fail_msg: >-
          {{ freeipa_realm_replacement_state_file }} already exists. This host
          has a recorded migration; inspect its archive and run a separately
          reviewed recovery procedure instead of re-running destructive cleanup.
      tags: [always]

  tasks:
    - name: "Realm replacement — create local state and backup directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - "{{ freeipa_realm_replacement_state_dir }}"
        - "{{ freeipa_realm_replacement_backup_dir }}"
      tags: [always, C2]

    - name: "Realm replacement — snapshot old client trust before mutation"
      ansible.builtin.command:
        argv:
          - tar
          - --ignore-failed-read
          - --xattrs
          - -czf
          - "{{ freeipa_realm_replacement_backup_archive }}"
          - /etc/ipa
          - /etc/krb5.conf
          - /etc/krb5.keytab
          - /etc/sssd
          - /etc/nsswitch.conf
          - /etc/hosts
      changed_when: true
      no_log: true
      tags: [always, C2]

    - name: "Realm replacement — destructive switch with automatic local restore"
      block:
        - name: "Realm replacement — preflight new server HTTPS reachability"
          ansible.builtin.wait_for:
            host: "{{ freeipa_realm_replacement_new_server_ip }}"
            port: 443
            timeout: 15
          changed_when: false
          tags: [C1]

        # The old realm's servers, from the client's own configuration, before
        # the uninstall removes it: /etc/ipa/default.conf `server`, and SSSD's
        # ipa_server/ipa_backup_server failover lists.
        - name: "Realm replacement — read the old realm's client configuration"
          ansible.builtin.slurp:
            src: "{{ item }}"
          loop: [/etc/ipa/default.conf, /etc/sssd/sssd.conf]
          register: freeipa_realm_replacement_old_config
          failed_when: false
          tags: [always, C3]

        # What the rescue needs to re-enroll this client in the old realm:
        # default.conf's domain and host, and every server it was configured
        # with.
        - name: "Realm replacement — record the old enrollment"
          ansible.builtin.set_fact:
            freeipa_realm_replacement_old_enrollment:
              domain: >-
                {{ (freeipa_realm_replacement_old_config.results[0].content | default('') | b64decode
                    | regex_findall('(?m)^\s*domain\s*=\s*(\S+)') + ['']) | first | lower }}
              host: >-
                {{ (freeipa_realm_replacement_old_config.results[0].content | default('') | b64decode
                    | regex_findall('(?m)^\s*host\s*=\s*(\S+)') + ['']) | first | lower }}
              servers: >-
                {{ freeipa_realm_replacement_old_config.results
                   | selectattr('content', 'defined') | map(attribute='content')
                   | map('b64decode')
                   | map('regex_findall', '(?m)^\s*(?:server|ipa_server|ipa_backup_server)\s*=\s*(.*)$') | flatten
                   | map('split', ',') | flatten | map('trim') | map('lower')
                   | reject('equalto', '_srv_') | reject('equalto', '')
                   | unique | list }}
          tags: [always, C3]

        - name: "Realm replacement — the old enrollment can be restored"
          ansible.builtin.assert:
            that:
              - freeipa_realm_replacement_old_enrollment.domain | length > 0
              - freeipa_realm_replacement_old_enrollment.host | length > 0
              - freeipa_realm_replacement_old_enrollment.servers | length > 0
            fail_msg: >-
              /etc/ipa/default.conf and /etc/sssd/sssd.conf do not name the old
              enrollment's domain, host and servers
              ({{ freeipa_realm_replacement_old_enrollment }}), so a failed switch
              could not re-enroll this client in {{ freeipa_realm_replacement_old_realm }}.
          tags: [C3]

        - name: "Realm replacement — list the old realm's servers"
          ansible.builtin.set_fact:
            freeipa_realm_replacement_old_servers: >-
              {{ freeipa_realm_replacement_old_enrollment.servers
                 | difference([freeipa_realm_replacement_new_server_fqdn | lower]) }}
          tags: [C3]

        # ipa-client-install --uninstall unenrolls the host with its own keys
        # (`ipa-join --unenroll`, which calls host_disable), and that voids the
        # old realm's host keys on the old server: after a failed switch the
        # archive's keytab no longer worked there, and the old realm stayed
        # offline (2026-10-12). Remove the old realm's keys from the keytab
        # first; the archive keeps them. The unenroll then cannot
        # authenticate, and the uninstall logs "Unenrolling host failed" and
        # carries on (ipaclient/install/client.py, FreeIPA 4.11 and 4.12).
        # The old host entry stays enabled; the completion marker records it.
        - name: "Realm replacement — keep the old host enabled on the old server"
          ansible.builtin.command:
            argv: [ipa-rmkeytab, -k, /etc/krb5.keytab, -r, "{{ freeipa_realm_replacement_old_realm }}"]
          register: freeipa_realm_replacement_old_keys
          changed_when: freeipa_realm_replacement_old_keys.rc == 0
          failed_when: freeipa_realm_replacement_old_keys.rc not in [0, 5]
          tags: [C3]

        - name: "Realm replacement — remove old client enrollment"
          ansible.builtin.command:
            argv: [ipa-client-install, --uninstall, -U]
          changed_when: true
          no_log: true
          tags: [C3]

        # freeipa-client-apply.yml pins the old realm's servers in /etc/hosts,
        # and the uninstall leaves them. With the old pin still there (its short
        # name, e.g. `ipa1`, the same as the new server's), SSSD on Ubuntu 24.04
        # sent the new host principal's AS requests to the old KDC, got "Client
        # ... not found in Kerberos database" and stayed offline, so the
        # identity wait failed (2026-07-29, root-caused 2026-10-12). Remove
        # them after the uninstall, which still talks to the old server, and
        # before the new enrollment. The rescue's archive restores them.
        - name: "Realm replacement — remove the old realm's server pool block from /etc/hosts"
          ansible.builtin.blockinfile:
            path: /etc/hosts
            marker: "# {mark} PILOT FREEIPA SERVER POOL"
            state: absent
          tags: [C3]

        - name: "Realm replacement — remove other /etc/hosts pins of the old realm's servers"
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: '(?i)\s{{ item | regex_escape }}(\s|$)'
            state: absent
          loop: "{{ freeipa_realm_replacement_old_servers }}"
          tags: [C3]

        # After the old pins are gone. When the new server keeps the old
        # server's FQDN, that name's line is inside the pool block removed
        # above: a pin written before the removal went with the block, and the
        # enrollment had to resolve the name through DNS, which may still
        # point at the old server (review of #53, 2026-10-13). Pinning here
        # also leaves the uninstall talking to the old server. Any case: the
        # resolver matches names case-insensitively.
        - name: "Realm replacement — pin new server FQDN before enrollment"
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: '(?i)\s{{ freeipa_realm_replacement_new_server_fqdn | regex_escape }}(\s|$)'
            line: >-
              {{ freeipa_realm_replacement_new_server_ip }}
              {{ freeipa_realm_replacement_new_server_fqdn }}
              {{ freeipa_realm_replacement_new_server_fqdn.split('.')[0] }}
            state: present
          tags: [C3]

        - name: "Realm replacement — enroll client in the new realm"
          ansible.builtin.command:
            argv:
              - ipa-client-install
              - -U
              - "--server={{ freeipa_realm_replacement_new_server_fqdn }}"
              - "--domain={{ freeipa_realm_replacement_new_domain }}"
              - "--realm={{ freeipa_realm_replacement_new_realm }}"
              - --principal=admin
              - "--password={{ ipa_admin_password }}"
              - "--hostname={{ freeipa_realm_replacement_client_fqdn }}"
              - --mkhomedir
              - --no-ntp
              - --no-dns-sshfp
              - --force-join
          changed_when: true
          no_log: true
          tags: [C3]

        - name: "Realm replacement — enable and start SSSD"
          ansible.builtin.systemd:
            name: sssd
            state: started
            enabled: true
          tags: [C4]

        - name: "Realm replacement — pin SSSD to the new server"
          ansible.builtin.lineinfile:
            path: /etc/sssd/sssd.conf
            regexp: '^ipa_server\s*='
            line: "ipa_server = {{ freeipa_realm_replacement_new_server_fqdn }}"
            insertafter: '^\[domain/'
            owner: root
            group: root
            mode: "0600"
          notify: Restart SSSD after realm replacement
          tags: [C4]

        - name: "Realm replacement — wait for new realm identity resolution"
          ansible.builtin.command:
            argv:
              - getent
              - passwd
              - "{{ freeipa_realm_replacement_verify_user }}@{{ freeipa_realm_replacement_new_domain }}"
          register: freeipa_realm_replacement_identity
          changed_when: false
          until: freeipa_realm_replacement_identity.rc == 0
          retries: 30
          delay: 10
          tags: [C5]

        - name: "Realm replacement — record completed migration without secrets"
          ansible.builtin.copy:
            dest: "{{ freeipa_realm_replacement_state_file }}"
            owner: root
            group: root
            mode: "0600"
            content: |
              ticket={{ freeipa_realm_replacement_ticket }}
              old_realm={{ freeipa_realm_replacement_old_realm }}
              new_domain={{ freeipa_realm_replacement_new_domain }}
              new_realm={{ freeipa_realm_replacement_new_realm }}
              new_server_fqdn={{ freeipa_realm_replacement_new_server_fqdn }}
              new_server_ip={{ freeipa_realm_replacement_new_server_ip }}
              client_fqdn={{ freeipa_realm_replacement_client_fqdn }}
              verify_user={{ freeipa_realm_replacement_verify_user }}
              backup_archive={{ freeipa_realm_replacement_backup_archive }}
              old_host_still_enabled=host/{{ freeipa_realm_replacement_old_enrollment.host }}@{{ freeipa_realm_replacement_old_realm }}
          no_log: true
          tags: [C6]

        - name: "Realm replacement — record derived verification expectations"
          ansible.builtin.copy:
            dest: "{{ item.path }}"
            owner: root
            group: root
            mode: "0600"
            content: "{{ item.content }}\n"
          loop:
            - path: "{{ freeipa_realm_replacement_expected_realm_file }}"
              content: "realm = {{ freeipa_realm_replacement_new_realm }}"
            - path: "{{ freeipa_realm_replacement_expected_host_file }}"
              content: "host/{{ freeipa_realm_replacement_client_fqdn }}@{{ freeipa_realm_replacement_new_realm }}"
            - path: "{{ freeipa_realm_replacement_expected_user_file }}"
              content: "{{ freeipa_realm_replacement_verify_user }}@{{ freeipa_realm_replacement_new_domain }}"
          no_log: true
          tags: [C3, C4, C5, C6]

        - name: "Realm replacement — expose archive through a stable root-only link"
          ansible.builtin.file:
            src: "{{ freeipa_realm_replacement_backup_archive }}"
            dest: "{{ freeipa_realm_replacement_backup_link }}"
            state: link
            owner: root
            group: root
          tags: [C6]
      # Restoring the archive alone does not bring the old realm back once the
      # old enrollment is gone: the uninstall also reverts authselect/PAM,
      # the hostname, SSSD's and sshd's IPA settings, the CA trust and the
      # installer's own state. So when the client is no longer enrolled in
      # the old realm, re-enroll it there with the archived host keys (which
      # the switch kept valid on the old server), then put the archived
      # files back over that enrollment, except its fresh keytab.
      rescue:
        - name: "Realm replacement — read the realm this client is enrolled in now"
          tags: [always]
          ansible.builtin.slurp:
            src: /etc/ipa/default.conf
          register: freeipa_realm_replacement_rescue_conf
          failed_when: false

        - name: "Realm replacement — decide how to restore the old enrollment"
          tags: [always]
          ansible.builtin.set_fact:
            freeipa_realm_replacement_rescue_realm: >-
              {{ (freeipa_realm_replacement_rescue_conf.content | default('') | b64decode
                  | regex_findall('(?m)^\s*realm\s*=\s*(\S+)') + ['']) | first }}
            freeipa_realm_replacement_rescue_reenroll: >-
              {{ freeipa_realm_replacement_old_enrollment is defined
                 and (freeipa_realm_replacement_rescue_conf.content | default('') | b64decode
                      | regex_findall('(?m)^\s*realm\s*=\s*(\S+)') + ['']) | first
                     != freeipa_realm_replacement_old_realm }}

        - name: "Realm replacement — remove the new realm's enrollment"
          tags: [always]
          ansible.builtin.command:
            argv: [ipa-client-install, --uninstall, -U]
          register: freeipa_realm_replacement_rescue_uninstall
          changed_when: true
          failed_when: false
          no_log: true
          when:
            - freeipa_realm_replacement_rescue_reenroll | bool
            - freeipa_realm_replacement_rescue_realm | length > 0

        - name: "Realm replacement — put back the old server pins"
          tags: [always]
          ansible.builtin.command:
            argv: [tar, -xpf, "{{ freeipa_realm_replacement_backup_archive }}", -C, /, etc/hosts]
          register: freeipa_realm_replacement_rescue_pins
          changed_when: true
          failed_when: false
          when: freeipa_realm_replacement_rescue_reenroll | bool

        - name: "Realm replacement — create a private directory for the archived host keytab"
          tags: [always]
          ansible.builtin.tempfile:
            state: directory
            suffix: .realm-replacement
          register: freeipa_realm_replacement_rescue_tmp
          failed_when: false
          when: freeipa_realm_replacement_rescue_reenroll | bool

        - name: "Realm replacement — extract the archived host keytab"
          tags: [always]
          ansible.builtin.command:
            argv:
              - tar
              - -xpf
              - "{{ freeipa_realm_replacement_backup_archive }}"
              - -C
              - "{{ freeipa_realm_replacement_rescue_tmp.path }}"
              - etc/krb5.keytab
          register: freeipa_realm_replacement_rescue_keytab
          changed_when: true
          failed_when: false
          no_log: true
          when:
            - freeipa_realm_replacement_rescue_reenroll | bool
            - freeipa_realm_replacement_rescue_tmp.path is defined

        # The same options as freeipa-client-apply.yml's enrollment;
        # --force-join has no effect with --keytab.
        - name: "Realm replacement — re-enroll in the old realm with the archived host keys"
          tags: [always]
          ansible.builtin.command:
            argv: >-
              {{
                ['ipa-client-install', '-U',
                 '--keytab=' ~ freeipa_realm_replacement_rescue_tmp.path ~ '/etc/krb5.keytab']
                + (freeipa_realm_replacement_old_enrollment.servers | map('regex_replace', '^(.*)$', '--server=\1') | list)
                + [
                  '--domain=' ~ freeipa_realm_replacement_old_enrollment.domain,
                  '--realm=' ~ freeipa_realm_replacement_old_realm,
                  '--hostname=' ~ freeipa_realm_replacement_old_enrollment.host,
                  '--mkhomedir',
                  '--no-ntp',
                  '--no-dns-sshfp',
                ]
              }}
          register: freeipa_realm_replacement_reenroll
          changed_when: true
          failed_when: false
          no_log: true
          when:
            - freeipa_realm_replacement_rescue_reenroll | bool
            - (freeipa_realm_replacement_rescue_keytab.rc | default(1)) == 0

        - name: "Realm replacement — remove the extracted host keytab"
          tags: [always]
          ansible.builtin.file:
            path: "{{ freeipa_realm_replacement_rescue_tmp.path }}"
            state: absent
          when: freeipa_realm_replacement_rescue_tmp.path is defined

        # After a re-enrollment the keytab holds the old host's new keys;
        # the archived one no longer works. Without a re-enrollment, the
        # archive is all there is.
        - name: "Realm replacement — restore local pre-migration archive"
          tags: [always]
          ansible.builtin.command:
            argv: >-
              {{
                ['tar']
                + (['--exclude=etc/krb5.keytab'] if (freeipa_realm_replacement_reenroll.rc | default(1)) == 0 else [])
                + ['-xpf', freeipa_realm_replacement_backup_archive, '-C', '/']
              }}
          register: freeipa_realm_replacement_rescue_restore
          changed_when: true
          no_log: true
          failed_when: false

        - name: "Realm replacement — restart restored SSSD when present"
          tags: [always]
          ansible.builtin.systemd:
            name: sssd
            state: restarted
            enabled: true
          failed_when: false

        - name: "Realm replacement — stop with the rollback boundary"
          tags: [always]
          ansible.builtin.fail:
            msg: >-
              New realm enrollment failed.
              {% if ansible_check_mode %}Check mode: nothing was removed,
              enrolled or restored.
              {% elif not (freeipa_realm_replacement_rescue_reenroll | bool) %}/etc/ipa/default.conf
              still named {{ freeipa_realm_replacement_old_realm }}, so the client
              was not re-enrolled; the prior local files were restored from
              {{ freeipa_realm_replacement_backup_archive }}
              (tar rc={{ freeipa_realm_replacement_rescue_restore.rc | default('n/a') }}).
              {% elif (freeipa_realm_replacement_reenroll.rc | default(1)) == 0 %}The
              client was re-enrolled in {{ freeipa_realm_replacement_old_realm }} as
              {{ freeipa_realm_replacement_old_enrollment.host }} with its archived
              host keys, and the prior local files were restored over that
              enrollment from {{ freeipa_realm_replacement_backup_archive }}.
              {% else %}Re-enrolling in {{ freeipa_realm_replacement_old_realm }}
              failed too (new realm uninstall rc={{ freeipa_realm_replacement_rescue_uninstall.rc | default('n/a') }},
              keytab extract rc={{ freeipa_realm_replacement_rescue_keytab.rc | default('n/a') }},
              enrollment rc={{ freeipa_realm_replacement_reenroll.rc | default('n/a') }};
              see /var/log/ipaclient-install.log). The prior local files were
              restored from {{ freeipa_realm_replacement_backup_archive }}, but
              the old realm's login path is not working: re-enroll this client by
              hand.
              {% endif %}A rebuilt or retired old server cannot be recovered
              from this client.

  handlers:
    - name: Restart SSSD after realm replacement
      ansible.builtin.systemd:
        name: sssd
        state: restarted
