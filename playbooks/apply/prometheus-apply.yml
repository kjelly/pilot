# Apply playbook for docs/verification/prometheus.md v1.1
#
# Per-site role: runs Prometheus + a Thanos Sidecar as a pair of Docker
# containers on the SAME host, sharing Prometheus's TSDB data directory so
# the sidecar can ship completed 2h blocks to S3-compatible object storage
# and serve recent local data over its gRPC StoreAPI. Designed to be applied
# independently per machine-room/site (like wazuh-fim is applied per agent
# host) — this role never needs to know where the central
# docs/verification/thanos-query.md host is; the relationship is inverted,
# the central Thanos Query reaches OUT to each site's sidecar.
#
# v1.1 also wires each site's Prometheus to the central Alertmanager
# (docs/verification/alertmanager.md) for alerting: seed rules
# (Watchdog + PrometheusDown + HostDown) are always loaded and evaluated
# locally, and the `alerting.alertmanagers` block is rendered only when
# `alertmanager_target_host` is set (escape hatch, see spec §1.5).
#
# Pre-flight: docs/verification/docker.md PASS (docker.io + docker.service).
#
# Usage (default: SeaweedFS S3 gateway built by seaweedfs-s3-apply.yml):
#
#   go run ./cmd/pilot vm-target run --name site-a \
#       playbooks/apply/prometheus-apply.yml \
#       -e target_group=prometheus \
#       -e prometheus_site_label=site-a \
#       -e thanos_s3_target_host=<seaweedfs-s3 IP> \
#       -e alertmanager_target_host=<alertmanager central IP> \
#       -e thanos_aws_access_key_id=<key> \
#       -e thanos_aws_secret_access_key=<secret>
#
# Usage (external S3, fully overridden endpoint — no /etc/hosts pin):
#
#   ... -e thanos_s3_endpoint=s3.internal.example.com:443 \
#       -e thanos_aws_access_key_id=... -e thanos_aws_secret_access_key=...
#
# Per-host custom scrape scope (see docs/verification/prometheus.md §1.5):
#
#   -e '{"prometheus_scrape_configs": "- job_name: node\n  static_configs:\n    - targets: [\"localhost:9100\"]\n"}'
#   (in a real inventory, set this in host_vars/<hostname>.yml instead of -e)
#
# Per-host custom alert rules (override the seed; usually leave default):
#
#   -e @host_vars/<hostname>.yml  # with prometheus_alert_rules: |
#
# External monitoring targets (docs/verification/prometheus-external-targets.md,
# spec.md §7-24) — scrape a third-party exporter Pilot doesn't manage via
# Ansible, without touching prometheus_scrape_configs:
#
#   -e monitoring_targets_file=monitoring/targets.yml \
#   -e monitoring_profiles_file=monitoring/scrape-profiles.yml \
#   -e '{"monitoring_auth": {"my-auth-ref": {"type": "basic", "username": "...", "password": "..."}}}'
#   (paths are relative to this playbook's own directory, same convention
#   as prometheus_alert_rules_file above; monitoring_auth only needed when
#   a profile declares an authRef)
#
# Variables: see docs/verification/prometheus.md §1.5 and
# docs/verification/prometheus-external-targets.md §1.5.
#
# Stage gating (same convention as freeipa-server-apply.yml):
#   sandbox  default; runs immediately
#   staging  requires -e confirm_staging=true
#   prod     requires -e confirm_prod=true AND staging_attested_within_hours<=168
- name: Apply prometheus (per-site Prometheus + Thanos Sidecar)
  hosts: "{{ target_group | default('prometheus') }}"
  become: true
  gather_facts: true
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168
    prometheus_version: "v2.53.0"
    thanos_version: "v0.36.1"
    prometheus_host_data_dir: /var/lib/pilot/prometheus
    prometheus_config_dir: /etc/pilot/prometheus
    thanos_config_dir: /etc/pilot/thanos
    docker_network_name: pilot-metrics
    # prometheus_site_label / thanos_s3_target_host / alertmanager_target_host
    # / node_exporter_targets are DELIBERATELY NOT declared here (not even as
    # `default('')`). Ansible
    # play-level `vars:` outrank both group_vars and host_vars, so declaring
    # them with a hardcoded "" here would silently shadow any value a caller
    # sets via `pilot edit`'s group_vars editor, forcing `-e` for every
    # deploy (real bug, found + fixed post-hoc — see
    # docs/runbooks/minimal-poc-architecture.md § Real bugs #1). Leaving
    # them undeclared lets normal precedence apply: group_vars/host_vars
    # values now win with no `-e` needed, while `-e` still overrides on top.
    # Every task below that references one of these four uses
    # `| default('', true)` (or `| default([], true)` for the list-typed
    # node_exporter_targets) at the point of use instead, so an unset value
    # still resolves to an empty string/list (never an undefined-variable
    # error).
    prometheus_scrape_interval: "15s"
    prometheus_retention_time: "6h"
    prometheus_scrape_configs: |
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
    thanos_s3_alias: thanos-s3-backend
    thanos_s3_port: 8333
    thanos_s3_bucket: pilot-thanos-metrics
    thanos_s3_endpoint: "{{ thanos_s3_alias }}:{{ thanos_s3_port }}"
    alertmanager_alias: alertmanager-backend
    alertmanager_port: 9093
    # node_exporter_basic_auth_user has a safe universal default (not a
    # secret). node_exporter_basic_auth_password is DELIBERATELY NOT
    # declared here, same undeclared-secret convention as
    # thanos_aws_access_key_id below — it must be the SAME value given to
    # host-monitoring-apply.yml's node_exporter_basic_auth_password (see
    # docs/verification/host-monitoring.md §1.5).
    node_exporter_basic_auth_user: prometheus
    # Host path (where this playbook writes the file) vs. container path
    # (what prometheus.yml's basic_auth.password_file must point to, since
    # the prom/prometheus process reads it through its OWN bind-mount, not
    # the host's path) — deliberately two separate variables, wired
    # together by an explicit volume line below (same host/container path
    # split as prometheus.yml and alert-rules.yml themselves).
    node_exporter_basic_auth_password_host_path: "{{ prometheus_config_dir }}/node-exporter-basic-auth-password"
    node_exporter_basic_auth_password_container_path: /etc/prometheus/node-exporter-basic-auth-password
    # prometheus_alert_rules_file: path (relative to the playbook) to a
    # Prometheus rules YAML file. The default is the seed file shipped in
    # playbooks/apply/files/. Operators override by passing
    # `-e prometheus_alert_rules_file=host_vars/mysite-alerts.yml` (the
    # path is still relative to the playbook's directory at apply time).
    # The file content is NOT rendered through Jinja — Prometheus's own
    # `{{ $labels.X }}` template syntax is preserved verbatim. This is
    # why the contract is a file path, not an inline string (mirroring
    # the trade-off taken for `prometheus_scrape_configs` would clash
    # with Jinja on the `{{ ... }}` inside alert annotations).
    prometheus_alert_rules_file: files/pilot-alert-rules-seed.yml

    # ---- External monitoring targets (docs/verification/
    # prometheus-external-targets.md, spec.md §7-24) ----
    # monitoring_targets_file/monitoring_profiles_file point at workspace
    # YAML files (same relative-to-this-playbook-directory convention as
    # prometheus_alert_rules_file above), NOT inline -e JSON — operators
    # edit real files instead of hand-quoting YAML. Left as empty strings
    # (the default) this whole feature is a no-op: no directory, no scrape
    # block, no volume mount — existing deployments with no monitoring/
    # directory apply exactly as they did before this feature existed
    # (spec.md §64, AC12/AC13/AC14).
    monitoring_targets_file: ""
    monitoring_profiles_file: ""
    # monitoring_auth (authRef -> {type, username, password}) is
    # DELIBERATELY NOT declared here — same undeclared-secret convention as
    # thanos_aws_secret_access_key above.
    prometheus_targets_host_dir: "{{ prometheus_config_dir }}/targets"
    prometheus_targets_container_dir: /etc/prometheus/targets
    monitoring_secrets_host_dir: "{{ prometheus_config_dir }}/monitoring-secrets"
    monitoring_secrets_container_dir: /etc/prometheus/monitoring-secrets

  pre_tasks:
    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or
            (stage == 'staging' and confirm_staging | bool) or
            (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm flag. Pass -e confirm_staging=true or confirm_prod=true."
      tags: [always]

    - name: "Gate: stage must match this host's inventory environment group"
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。inventory 的 staging/prod group 只是給
          target_group 篩選用的標籤,不會自動決定 stage——必須自己帶對的 -e stage=,
          且要跟這台機器所屬的環境 group 一致。
      tags: [always]

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
        fail_msg: "prod gate: staging attestation missing or older than 168h."
      when: stage == 'prod'
      tags: [always]

    # Auto-fallback for the common single-inventory case: if the caller left
    # alertmanager_target_host genuinely unset (no -e/group_vars/host_vars)
    # and this inventory happens to define an alertmanager group, use that
    # host's own connection address instead of silently leaving alerting
    # disabled. `pilot deploy`'s single-component wizard already offers
    # this as an interactive prompt (deploy_catalog.go's prometheus
    # AutoHostVars); this makes a site-wide `playbooks/site.yml` run get
    # the same default, mirroring restic-backup-apply.yml's own
    # "Auto-detect backup destination host from this inventory's
    # seaweedfs-s3 group" task.
    - name: "Auto-detect Alertmanager host from this inventory's alertmanager group"
      ansible.builtin.set_fact:
        alertmanager_target_host: >-
          {{ hostvars[(groups.get('alertmanager', []) | first)]['ansible_host']
             | default(groups.get('alertmanager', []) | first, true) }}
      when: >-
        (alertmanager_target_host | default('') | length == 0)
        and (groups.get('alertmanager', []) | length > 0)
      tags: [always]

    # Auto-discover node_exporter scrape targets (docs/verification/
    # host-monitoring.md) from this inventory's host-monitoring group when
    # node_exporter_targets was left genuinely unset — same "explicit
    # override wins, otherwise walk the inventory group" convention as the
    # Alertmanager auto-detect above and freeipa-dns-client-apply.yml's
    # freeipa_dns_client_servers. Assumes each host-monitoring host runs on
    # the contract's default port (9100); if a site overrode
    # node_exporter_port there, pass -e node_exporter_targets=[...] here
    # explicitly instead of relying on this auto-detect.
    - name: "Auto-detect node-exporter scrape targets from this inventory's host-monitoring group"
      ansible.builtin.set_fact:
        prometheus_node_exporter_targets: >-
          {{ (node_exporter_targets | default([], true))
             if ((node_exporter_targets | default([], true)) | length > 0)
             else (groups.get('host-monitoring', [])
                   | map('extract', hostvars, 'ansible_host')
                   | map('regex_replace', '$', ':9100')
                   | list) }}
      tags: [always]

    # Built as a native list/dict and serialized with to_nice_yaml, not
    # hand-concatenated with literal "\n" — Jinja string literals here do
    # NOT unescape \n inside a `>-` folded scalar (verified: it comes
    # through as a literal backslash+n, not a real newline, silently
    # corrupting prometheus.yml into invalid YAML). to_nice_yaml sidesteps
    # the whole class of escaping bugs.
    - name: "Render the node-exporter scrape job block (spec C13; empty string when no targets)"
      ansible.builtin.set_fact:
        prometheus_node_exporter_scrape_block: >-
          {{ ([{'job_name': 'node',
                'basic_auth': {'username': node_exporter_basic_auth_user | default('', true),
                                'password_file': node_exporter_basic_auth_password_container_path},
                'static_configs': [{'targets': prometheus_node_exporter_targets}]}]
             | to_nice_yaml(indent=2))
             if (prometheus_node_exporter_targets | length > 0) else '' }}
      tags: [always]

    # Gate placed right after the targets/credentials are resolved (not
    # earlier) so a site with zero host-monitoring hosts is never forced to
    # supply this — same "required only when actually used" shape as
    # alertmanager_target_host.
    - name: "Gate: node-exporter basic-auth credentials required when there are scrape targets"
      ansible.builtin.assert:
        that:
          - (node_exporter_basic_auth_user | default('', true) | length > 0)
          - (node_exporter_basic_auth_password | default('', true) | length > 0)
        fail_msg: >-
          prometheus_node_exporter_targets resolved to at least one target,
          but node_exporter_basic_auth_user/node_exporter_basic_auth_password
          are not both set. node_exporter always requires Basic Auth (see
          docs/verification/host-monitoring.md §1.5) — pass the SAME
          credential that was given to host-monitoring-apply.yml's
          node_exporter_basic_auth_password.
      when: prometheus_node_exporter_targets | length > 0

    # prometheus_site_label has no safe default (see spec §1.5 for why —
    # unlike wazuh_manager_host/siem_forward_host, a blank/placeholder
    # default would silently collide across sites once a second one is
    # deployed instead of failing loudly).
    - name: "Gate: prometheus_site_label required"
      ansible.builtin.assert:
        that:
          - prometheus_site_label is defined and prometheus_site_label | length > 0
        fail_msg: >-
          prometheus_site_label is required (e.g. -e prometheus_site_label=site-a)
          — see docs/verification/prometheus.md §1.5 for why there is no default.

    - name: "Gate: required S3 secrets present (fail early, before any mutation)"
      ansible.builtin.assert:
        that:
          - thanos_aws_access_key_id is defined and thanos_aws_access_key_id | length > 0
          - thanos_aws_secret_access_key is defined and thanos_aws_secret_access_key | length > 0
        fail_msg: >-
          Missing required secrets. Pass -e thanos_aws_access_key_id=... -e
          thanos_aws_secret_access_key=... (vault file recommended over -e
          in real inventories).

    # Same "no reachable destination" trap as restic-backup.md's gate.
    - name: "Gate: S3 destination must be resolvable"
      ansible.builtin.assert:
        that:
          - (thanos_s3_target_host | default('', true) | length > 0) or (thanos_s3_alias not in thanos_s3_endpoint)
        fail_msg: >-
          thanos_s3_target_host is empty AND thanos_s3_endpoint still uses
          the default thanos-s3-backend alias — Thanos would have no
          reachable object storage. Either pass -e thanos_s3_target_host=<S3
          IP/FQDN> (default SeaweedFS S3 gateway target), or override
          -e thanos_s3_endpoint=... to a fully externally-resolvable
          host:port.

    # ---- External monitoring targets: load, validate, compile ----
    # (docs/verification/prometheus-external-targets.md, spec.md §7-24).
    # This is pure computation (no host mutation) so it belongs in
    # pre_tasks, mirroring the node-exporter target-resolution block above
    # (prometheus_node_exporter_scrape_block). Actual file writes happen
    # later in tasks:, inside the same not-ansible_check_mode block as
    # every other artifact this playbook renders.
    - name: "Load monitoring target registry file (empty string when unset/missing)"
      ansible.builtin.set_fact:
        monitoring_targets_raw: >-
          {{ lookup('file', monitoring_targets_file, errors='ignore')
             if (monitoring_targets_file | default('', true) | length > 0)
             else '' }}
      tags: [always]

    - name: "Load scrape profiles file (empty string when unset/missing)"
      ansible.builtin.set_fact:
        monitoring_profiles_raw: >-
          {{ lookup('file', monitoring_profiles_file, errors='ignore')
             if (monitoring_profiles_file | default('', true) | length > 0)
             else '' }}
      tags: [always]

    # An unset/missing file resolves to schemaVersion:1, targets:[] (empty
    # list/dict) — spec.md §64: no monitoring/ directory must be exactly
    # equivalent to an empty registry, not an error.
    - name: "Parse monitoring target registry"
      ansible.builtin.set_fact:
        monitoring_targets_resolved: >-
          {{ ((monitoring_targets_raw | from_yaml).targets | default([], true))
             if (monitoring_targets_raw | length > 0) else [] }}
      tags: [always]

    - name: "Parse scrape profiles"
      ansible.builtin.set_fact:
        monitoring_profiles_resolved: >-
          {{ ((monitoring_profiles_raw | from_yaml).profiles | default({}, true))
             if (monitoring_profiles_raw | length > 0) else {} }}
      tags: [always]

    # `selectattr('enabled', 'default', true)` is NOT valid Jinja — 'default'
    # is a FILTER, not a selectattr TEST name ("No test named 'default'" at
    # apply time, found via a real vm-target run). Normalize once, here, into
    # a real boolean on every item (spec.md §8.5: default true when unset) so
    # every later `selectattr('enabled')` downstream is a plain truthy check
    # with no missing-key ambiguity. Accumulates into a DIFFERENT variable
    # (monitoring_targets_normalized) than the loop source
    # (monitoring_targets_resolved) — reusing one name for both would make
    # the source list a moving target as the loop reassigns it — then
    # overwrites monitoring_targets_resolved once at the end, same two-step
    # shape as monitoring_scrape_jobs below (loop source there is
    # monitoring_profiles_resolved, a different variable than the
    # accumulator monitoring_scrape_jobs).
    - name: "Normalize each monitoring target's 'enabled' (spec.md §8.5 default: true)"
      ansible.builtin.set_fact:
        monitoring_targets_normalized: >-
          {{ (monitoring_targets_normalized | default([]))
             + [ ({'enabled': true} | combine(item)) ] }}
      loop: "{{ monitoring_targets_resolved }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Replace monitoring_targets_resolved with its normalized form"
      ansible.builtin.set_fact:
        monitoring_targets_resolved: "{{ monitoring_targets_normalized | default([]) }}"

    # Gate placed right after parsing (same "resolve then gate" ordering as
    # the node-exporter basic-auth gate above). These are static properties
    # of the two registry files themselves — no live Prometheus/network
    # state needed — so they stand in for the `pilot monitoring validate`
    # Go CLI described in spec.md §22/§32, which does not exist yet (see
    # this spec's §1.5 DRAFT note).
    - name: "Gate: every enabled monitoring target references an existing scrape profile"
      ansible.builtin.assert:
        that:
          - item.profile in monitoring_profiles_resolved
        fail_msg: >-
          monitoring target "{{ item.name }}" references unknown scrape
          profile "{{ item.profile }}" (see {{ monitoring_targets_file }} /
          {{ monitoring_profiles_file }}).
      loop: "{{ monitoring_targets_resolved | selectattr('enabled') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Gate: scrape profile jobName values are unique"
      ansible.builtin.assert:
        that:
          - (monitoring_profiles_resolved.values() | map(attribute='jobName') | list | length)
            == (monitoring_profiles_resolved.values() | map(attribute='jobName') | unique | list | length)
        fail_msg: >-
          two or more profiles in {{ monitoring_profiles_file }} declare the
          same jobName — spec.md §18 requires jobName to be unique across
          profiles.

    - name: "Gate: profile jobName must not use a reserved name (prometheus/node)"
      ansible.builtin.assert:
        that:
          - (monitoring_profiles_resolved.values() | map(attribute='jobName')
             | select('in', ['prometheus', 'node']) | list | length) == 0
        fail_msg: >-
          a profile in {{ monitoring_profiles_file }} uses a reserved
          jobName ("prometheus" or "node" — spec.md §63); rename it.

    - name: "Gate: every profile authRef resolves to a complete basic-auth credential"
      ansible.builtin.assert:
        that:
          - item in (monitoring_auth | default({}, true))
          - (monitoring_auth | default({}, true))[item].type | default('') == 'basic'
          - (monitoring_auth | default({}, true))[item].username | default('') | length > 0
          - (monitoring_auth | default({}, true))[item].password | default('') | length > 0
        fail_msg: >-
          profile authRef "{{ item }}" is not defined in monitoring_auth as
          a complete basic-auth credential (type/username/password) —
          spec.md §46; monitoring_auth must be supplied via vault/-e, never
          committed plaintext.
      loop: "{{ monitoring_profiles_resolved.values() | selectattr('authRef', 'defined') | map(attribute='authRef') | unique | list }}"
      no_log: true

    # Warning, not fail (spec.md §40) — an external target address that
    # coincides with a host-monitoring-managed node_exporter is allowed
    # (different job/profile/auth is a legitimate reason).
    - name: "Warn if an external target's address overlaps a host-monitoring managed endpoint"
      ansible.builtin.debug:
        msg: "warning: endpoint {{ item }} is also managed by host-monitoring"
      loop: >-
        {{ (monitoring_targets_resolved | selectattr('enabled')
            | map(attribute='address') | list)
           | intersect(prometheus_node_exporter_targets) }}

    # One Prometheus scrape job per profile (jobName uniqueness is already
    # gated above, so this is a 1:1 mapping — no groupby needed). Built via
    # Ansible's own `loop:` iterating simple per-item `{{ }}` expressions,
    # not a Jinja `{% for %}` block — same "native list/dict via filters,
    # never hand-built control-flow strings" discipline as
    # prometheus_node_exporter_scrape_block above (see that task's comment
    # on the \n-escaping trap).
    - name: "Accumulate one Prometheus scrape job dict per scrape profile (spec.md §17)"
      ansible.builtin.set_fact:
        monitoring_scrape_jobs: >-
          {{ (monitoring_scrape_jobs | default([]))
             + [ ({'job_name': item.value.jobName,
                   'scheme': item.value.scheme | default('http', true),
                   'metrics_path': item.value.metricsPath | default('/metrics', true),
                   'file_sd_configs': [{'files': [prometheus_targets_container_dir ~ '/' ~ item.value.jobName ~ '.json']}]}
                  | combine({'scrape_interval': item.value.scrapeInterval}
                            if (item.value.scrapeInterval | default('', true) | length > 0) else {})
                  | combine({'scrape_timeout': item.value.scrapeTimeout}
                            if (item.value.scrapeTimeout | default('', true) | length > 0) else {})
                  | combine({'basic_auth': {'username': monitoring_auth[item.value.authRef].username,
                                             'password_file': monitoring_secrets_container_dir ~ '/' ~ item.value.authRef ~ '.password'}}
                            if (item.value.authRef | default('', true) | length > 0) else {})
                  | combine({'tls_config': ({'server_name': item.value.tls.serverName}
                                             if (item.value.tls.serverName | default('', true) | length > 0) else {})
                                            | combine({'insecure_skip_verify': item.value.tls.insecureSkipVerify | default(false, true)})}
                            if (item.value.tls is defined) else {}) ) ] }}
      loop: "{{ monitoring_profiles_resolved | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # Empty string (not an empty list rendered by to_nice_yaml, which would
    # emit "[]" — an invalid extra scrape_configs entry) when there are no
    # profiles at all, same convention as prometheus_node_exporter_scrape_block.
    - name: "Render the external monitoring scrape block (spec.md §17/§20; empty string when no profiles)"
      ansible.builtin.set_fact:
        prometheus_external_scrape_block: >-
          {{ (monitoring_scrape_jobs | default([]) | to_nice_yaml(indent=2))
             if (monitoring_scrape_jobs | default([]) | length > 0) else '' }}
      tags: [always, ext-target, ext-target-C3]

  tasks:
    - name: "Pin {{ thanos_s3_alias }} -> {{ thanos_s3_target_host | default('', true) }} in /etc/hosts"
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\s{{ thanos_s3_alias }}$'
        line: "{{ thanos_s3_target_host | default('', true) }}\t{{ thanos_s3_alias }}"
        state: present
      when: thanos_s3_target_host | default('', true) | length > 0

    - name: "Pin {{ alertmanager_alias }} -> {{ alertmanager_target_host | default('', true) }} in /etc/hosts"
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\s{{ alertmanager_alias }}$'
        line: "{{ alertmanager_target_host | default('', true) }}\t{{ alertmanager_alias }}"
        state: present
      when: alertmanager_target_host | default('', true) | length > 0

    # docker_container/docker_container_exec need a live daemon (and, for
    # the nested Thanos S3 bucket step, a real pilot-seaweedfs container) to
    # compute their diff even under --check; deferred to the real apply on a
    # from-scratch host, same convention as wazuh-manager-apply.yml. A
    # block's `when` applies to every task at every nesting level, so this
    # also covers the nested "Ensure Thanos S3 bucket exists" block below.
    - when: not ansible_check_mode
      block:
        # prom/prometheus's official image runs as the "nobody" user
        # (uid/gid 65534), not root — the bind-mounted data dir must be
        # owned by that uid or Prometheus fails to write its TSDB at
        # startup (permission denied). Thanos Sidecar only needs read
        # access to this same directory (mounted :ro below), so it doesn't
        # need matching ownership.
        - name: "Ensure Prometheus host data dir (owned by container's nobody uid)"
          ansible.builtin.file:
            path: "{{ prometheus_host_data_dir }}"
            state: directory
            owner: "65534"
            group: "65534"
            mode: "0755"

        - name: "Ensure config dirs exist"
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ prometheus_config_dir }}"
            - "{{ thanos_config_dir }}"

        # Only created when at least one scrape profile is declared — an
        # always-present-but-empty directory would still be harmless, but
        # scoping it to "feature actually in use" keeps an unconfigured
        # deployment's filesystem footprint identical to before this
        # feature existed (spec.md §64).
        - name: "Ensure file_sd target directory exists (docs/verification/prometheus-external-targets.md C1)"
          tags: [ext-target, ext-target-C1]
          ansible.builtin.file:
            path: "{{ prometheus_targets_host_dir }}"
            state: directory
            mode: "0755"
          when: monitoring_profiles_resolved | length > 0

        # Spec: docs/verification/prometheus.md C8, C11
        # --storage.tsdb.min-block-duration/max-block-duration are both
        # pinned to 2h below (not just retention): this disables
        # Prometheus's own local compaction into larger blocks, which is a
        # hard requirement for the Sidecar to be able to ship 2h blocks to
        # object storage — Thanos Compactor (on the thanos-query host) owns
        # compaction/downsampling/retention from that point on.
        - name: "Render prometheus.yml (with alerting.alertmanagers)"
          tags: [C8, C11, C13, ext-target, ext-target-C3]
          ansible.builtin.copy:
            dest: "{{ prometheus_config_dir }}/prometheus.yml"
            mode: "0644"
            content: |
              global:
                scrape_interval: {{ prometheus_scrape_interval }}
                external_labels:
                  site: {{ prometheus_site_label }}
              rule_files:
                - /etc/prometheus/alert-rules.yml
              alerting:
                alertmanagers:
                  - static_configs:
                      - targets:
                          - "{{ alertmanager_alias }}:{{ alertmanager_port }}"
              scrape_configs:
              {{ prometheus_scrape_configs }}
              {{ prometheus_node_exporter_scrape_block }}
              {{ prometheus_external_scrape_block }}
          register: prometheus_yml_with_am
          when: alertmanager_target_host | default('', true) | length > 0

        - name: "Render prometheus.yml (without alerting — alertmanager_target_host empty)"
          tags: [C8, C13, ext-target, ext-target-C3]
          ansible.builtin.copy:
            dest: "{{ prometheus_config_dir }}/prometheus.yml"
            mode: "0644"
            content: |
              global:
                scrape_interval: {{ prometheus_scrape_interval }}
                external_labels:
                  site: {{ prometheus_site_label }}
              rule_files:
                - /etc/prometheus/alert-rules.yml
              scrape_configs:
              {{ prometheus_scrape_configs }}
              {{ prometheus_node_exporter_scrape_block }}
              {{ prometheus_external_scrape_block }}
          register: prometheus_yml_no_am
          when: alertmanager_target_host | default('', true) | length == 0

        - name: "Consolidate prometheus.yml result (for unified restart-gate below)"
          ansible.builtin.set_fact:
            prometheus_yml_result: >-
              {{ prometheus_yml_with_am
                 | default({'changed': False})
                 | combine(prometheus_yml_no_am | default({'changed': False})) }}

        # The credential Prometheus presents on every node_exporter scrape.
        # mode 0644 (not 0600) is the SAME deliberate tradeoff as the Thanos
        # objstore.yml secret_key below: prom/prometheus's official image
        # reads this via a bind-mount as its own fixed uid (65534), not a
        # uid this playbook controls. no_log keeps the plaintext out of
        # Ansible's own output/logs; the main prometheus.yml render above
        # needed no such guard because the secret lives here instead of
        # inline (contrast objstore.yml, which mixes secret+non-secret
        # content and has to no_log the whole render).
        - name: "Render node-exporter basic-auth password file for Prometheus's scrape config"
          ansible.builtin.copy:
            dest: "{{ node_exporter_basic_auth_password_host_path }}"
            mode: "0644"
            content: "{{ node_exporter_basic_auth_password | default('', true) }}"
          when: prometheus_node_exporter_targets | length > 0
          no_log: true
          register: node_exporter_password_file_result

        # ---- External monitoring targets: secrets + file_sd JSON + GC ----
        # (docs/verification/prometheus-external-targets.md, spec.md §12/
        # §15/§16/§46/§47/§49).
        - name: "Ensure monitoring secrets directory exists (only when a profile references authRef)"
          ansible.builtin.file:
            path: "{{ monitoring_secrets_host_dir }}"
            state: directory
            mode: "0755"
          when: (monitoring_profiles_resolved.values() | selectattr('authRef', 'defined') | list | length) > 0

        # mode 0644 (not 0600) is the SAME deliberate tradeoff as
        # node_exporter_basic_auth_password above and Thanos objstore.yml's
        # secret_key below — prom/prometheus reads this via a bind-mount as
        # its own fixed uid (65534), which a stricter 0600 (owned by
        # whichever uid this playbook runs as) would leave unreadable.
        - name: "Render monitoring basic-auth password files (spec.md §46/§47)"
          ansible.builtin.copy:
            dest: "{{ monitoring_secrets_host_dir }}/{{ item }}.password"
            mode: "0644"
            content: "{{ monitoring_auth[item].password | default('', true) }}"
          loop: "{{ monitoring_profiles_resolved.values() | selectattr('authRef', 'defined') | map(attribute='authRef') | unique | list }}"
          no_log: true
          register: monitoring_secret_files_result

        # One file per scrape profile/jobName, one JSON entry per enabled
        # target in that profile (spec.md §16 — entries stay separate so
        # per-target labels never bleed into each other). Built with a
        # Jinja `{% for %}` text loop (not a native set_fact list) because
        # the output IS the file content, not an intermediate Ansible
        # value — to_json per-field sidesteps hand-escaping addresses/labels.
        - name: "Render file_sd JSON — one file per scrape profile/jobName (docs/verification/prometheus-external-targets.md C2)"
          tags: [ext-target, ext-target-C2]
          ansible.builtin.copy:
            dest: "{{ prometheus_targets_host_dir }}/{{ item.value.jobName }}.json"
            mode: "0644"
            content: |
              [
              {% for t in (monitoring_targets_resolved | selectattr('enabled') | selectattr('profile', 'equalto', item.key) | list) %}
                {
                  "targets": [{{ t.address | to_json }}],
                  "labels": {{ ({'pilot_target': t.name, 'pilot_source': 'external'}
                                 | combine({'site': t.site} if (t.site | default('', true) | length > 0) else {})
                                 | combine(t.labels | default({}, true))) | to_json }}
                }{{ "," if not loop.last else "" }}
              {% endfor %}
              ]
          loop: "{{ monitoring_profiles_resolved | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          register: monitoring_file_sd_result

        - name: "Check whether the file_sd target directory exists (GC path-safety, spec.md §49)"
          ansible.builtin.stat:
            path: "{{ prometheus_targets_host_dir }}"
          register: monitoring_targets_dir_stat

        - name: "Discover existing generated file_sd JSON files (for GC of removed profiles)"
          ansible.builtin.find:
            paths: "{{ prometheus_targets_host_dir }}"
            patterns: "*.json"
          register: monitoring_existing_target_files
          when: monitoring_targets_dir_stat.stat.exists

        # GC only ever removes files under prometheus_targets_host_dir whose
        # basename doesn't match a currently-declared jobName — this whole
        # directory is 100% Pilot-generated (spec.md §49's "only allowed to
        # delete Pilot-owned generated files" exception), never
        # user-authored, so per-file removal here is safe.
        - name: "Remove stale file_sd JSON for profiles no longer declared"
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ monitoring_existing_target_files.files | default([]) }}"
          loop_control:
            label: "{{ item.path | basename }}"
          when: >-
            (monitoring_existing_target_files is defined) and
            ((item.path | basename | regex_replace('\.json$', ''))
             not in (monitoring_profiles_resolved.values() | map(attribute='jobName') | list))
          register: monitoring_gc_result

        - name: "Consolidate monitoring file_sd/GC/secret change flags (for unified restart-gate below)"
          ansible.builtin.set_fact:
            monitoring_files_changed: >-
              {{ (monitoring_file_sd_result is defined and monitoring_file_sd_result is changed)
                 or (monitoring_gc_result is defined and monitoring_gc_result is changed)
                 or (monitoring_secret_files_result is defined and monitoring_secret_files_result is changed) }}

        # Spec: docs/verification/prometheus.md C10
        # Use `copy: src:` (not `content:`) because Prometheus rules files
        # contain `{{ $labels.X }}` template syntax that would clash with
        # Ansible's Jinja pass on an inline `content` string (this was a
        # real apply-time failure before switching to file-path semantics).
        - name: "Render alert-rules.yml (seed by default, override per host via prometheus_alert_rules_file)"
          tags: [C10]
          ansible.builtin.copy:
            src: "{{ prometheus_alert_rules_file }}"
            dest: "{{ prometheus_config_dir }}/alert-rules.yml"
            mode: "0644"
          register: alert_rules_result

        # SeaweedFS never implicitly creates a bucket on PutObject, so a
        # fresh destination makes the Thanos sidecar's upload (and, once
        # thanos-query-apply.yml also runs, Store Gateway/Compactor) crash
        # or retry forever instead of failing fast (docker logs
        # pilot-thanos-sidecar / pilot-thanos-store would show "The
        # specified bucket does not exist"). This used to require a manual
        # `docker exec pilot-seaweedfs ... weed shell` before the first
        # apply — same idea as restic-backup-apply.yml's "Step 2b", which
        # this mirrors. thanos-query-apply.yml has the identical block for
        # its own bucket_use, so this bucket ends up ensured regardless of
        # whether prometheus or thanos-query happens to run first.
        - name: "Step: Ensure Thanos S3 bucket exists on the SeaweedFS host (idempotent)"  # noqa run-once[task]
          when: >-
            thanos_s3_alias in thanos_s3_endpoint
            and (groups.get('seaweedfs-s3', []) | length > 0)
          run_once: true
          delegate_to: "{{ groups.get('seaweedfs-s3', [inventory_hostname]) | first }}"
          block:
            - name: "Step: check Thanos S3 bucket exists"
              community.docker.docker_container_exec:
                container: pilot-seaweedfs
                command: sh -c "echo 's3.bucket.list' | weed shell"
              register: thanos_seaweedfs_bucket_list
              changed_when: false
              check_mode: false

            - name: "Step: create Thanos S3 bucket if missing"
              community.docker.docker_container_exec:
                container: pilot-seaweedfs
                command: "sh -c \"echo 's3.bucket.create -name {{ thanos_s3_bucket }}' | weed shell\""
              when: thanos_s3_bucket not in thanos_seaweedfs_bucket_list.stdout
              changed_when: true

        # Contains the S3 secret key — no_log so it never hits Ansible's
        # own output/logs. mode 0644 (not 0600) is a deliberate tradeoff:
        # both prom/prometheus and thanosio/thanos containers read this via
        # a bind-mount as their own (non-root, non-matching-uid) user, and
        # matching every possible image's uid exactly is brittle across
        # version bumps. Acceptable for this project's sandbox/lab scope;
        # a real production deployment should prefer a secrets-manager
        # integration instead of a mounted file.
        # Docker auto-creates a directory at a bind-mount source path that
        # doesn't exist when the container is (re)created; the rescue block
        # below only deletes this file (not the container) after a failed
        # apply, so a later container recreate can leave a directory here
        # instead of a file, permanently breaking `copy` on retry. `stat`
        # (not the `directory` Jinja test, which checks the control host)
        # runs on the managed node, where this path actually lives.
        - name: "Guard: check for stray directory left at objstore.yml path"
          ansible.builtin.stat:
            path: "{{ thanos_config_dir }}/objstore.yml"
          register: objstore_yml_stat

        - name: "Guard: clear stray directory left at objstore.yml path"
          ansible.builtin.file:
            path: "{{ thanos_config_dir }}/objstore.yml"
            state: absent
          when: objstore_yml_stat.stat.exists and objstore_yml_stat.stat.isdir

        - name: "Render Thanos objstore config (S3 backend)"
          ansible.builtin.copy:
            dest: "{{ thanos_config_dir }}/objstore.yml"
            mode: "0644"
            content: |
              type: S3
              config:
                bucket: "{{ thanos_s3_bucket }}"
                endpoint: "{{ thanos_s3_endpoint }}"
                access_key: "{{ thanos_aws_access_key_id }}"
                secret_key: "{{ thanos_aws_secret_access_key }}"
                insecure: true
          no_log: true
          register: objstore_yml_result

        - name: "Ensure docker network {{ docker_network_name }} exists"
          community.docker.docker_network:
            name: "{{ docker_network_name }}"
            state: present

        # Spec: docs/verification/prometheus.md C1, C3, C4, C7, C8, C12
        - name: "Prometheus — run pilot-prometheus container"
          tags: [C1, C3, C4, C7, C8, C12]
          community.docker.docker_container:
            name: pilot-prometheus
            image: "prom/prometheus:{{ prometheus_version }}"
            state: started
            restart_policy: unless-stopped
            restart: >-
              {{ prometheus_yml_result is changed
                 or alert_rules_result is changed
                 or node_exporter_password_file_result is changed
                 or monitoring_files_changed | default(false) }}
            networks:
              - name: "{{ docker_network_name }}"
            command: >-
              --config.file=/etc/prometheus/prometheus.yml
              --storage.tsdb.path=/prometheus
              --storage.tsdb.retention.time={{ prometheus_retention_time }}
              --storage.tsdb.min-block-duration=2h
              --storage.tsdb.max-block-duration=2h
              --web.enable-lifecycle
            # The node-exporter password-file mount is appended
            # conditionally, not as an unconditional list item: Docker
            # auto-creates an empty DIRECTORY at a bind-mount source path
            # that doesn't exist on the host, which would permanently break
            # this path once a real file is later expected there (same
            # stray-mount trap this file's own "Guard: check for stray
            # directory left at objstore.yml path" task exists to catch —
            # here the fix is to just never mount a path whose file we
            # didn't render, rather than mount-then-clean-up).
            volumes: >-
              {{ [
                   prometheus_config_dir ~ '/prometheus.yml:/etc/prometheus/prometheus.yml:ro',
                   prometheus_config_dir ~ '/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro',
                   prometheus_host_data_dir ~ ':/prometheus'
                 ] + ([node_exporter_basic_auth_password_host_path ~ ':' ~ node_exporter_basic_auth_password_container_path ~ ':ro']
                      if (prometheus_node_exporter_targets | length > 0) else [])
                   + ([prometheus_targets_host_dir ~ ':' ~ prometheus_targets_container_dir ~ ':ro']
                      if (monitoring_profiles_resolved | length > 0) else [])
                   + ([monitoring_secrets_host_dir ~ ':' ~ monitoring_secrets_container_dir ~ ':ro']
                      if ((monitoring_profiles_resolved.values() | selectattr('authRef', 'defined') | list | length) > 0) else []) }}
            ports:
              - "9090:9090"

        - name: "Wait for Prometheus to become ready"
          ansible.builtin.uri:
            url: "http://127.0.0.1:9090/-/ready"
            status_code: 200
          register: prometheus_ready
          until: prometheus_ready.status == 200
          retries: 30
          delay: 2

        # Spec: docs/verification/prometheus.md C2, C5, C6, C9
        - name: "Thanos Sidecar — run pilot-thanos-sidecar container"
          tags: [C2, C5, C6, C9]
          community.docker.docker_container:
            name: pilot-thanos-sidecar
            image: "thanosio/thanos:{{ thanos_version }}"
            state: started
            restart_policy: unless-stopped
            restart: "{{ objstore_yml_result is changed }}"
            networks:
              - name: "{{ docker_network_name }}"
            command: >-
              sidecar
              --tsdb.path=/prometheus
              --prometheus.url=http://pilot-prometheus:9090
              --objstore.config-file=/etc/thanos/objstore.yml
              --http-address=0.0.0.0:10902
              --grpc-address=0.0.0.0:10901
            volumes:
              - "{{ prometheus_host_data_dir }}:/prometheus:ro"
              - "{{ thanos_config_dir }}/objstore.yml:/etc/thanos/objstore.yml:ro"
            ports:
              - "10901:10901"
              - "10902:10902"

        - name: "Wait for Thanos Sidecar to become ready"
          ansible.builtin.uri:
            url: "http://127.0.0.1:10902/-/ready"
            status_code: 200
          register: sidecar_ready
          until: sidecar_ready.status == 200
          retries: 30
          delay: 2

      rescue:
        - name: "ROLLBACK — remove the objstore config file (contains S3 secret)"
          ansible.builtin.file:
            path: "{{ thanos_config_dir }}/objstore.yml"
            state: absent

        # Same "don't leave a secret file behind after a failed apply"
        # posture as the objstore.yml cleanup above — this does NOT attempt
        # to roll back the file_sd JSON or prometheus.yml content itself
        # (neither does the existing rescue, for objstore.yml's own
        # config), only the credential material.
        - name: "ROLLBACK — remove monitoring basic-auth password files (contain secrets)"
          ansible.builtin.file:
            path: "{{ monitoring_secrets_host_dir }}"
            state: absent

        - name: "ROLLBACK — surface the original failure"
          ansible.builtin.fail:
            msg: >-
              prometheus apply FAILED (see task output above); the objstore
              secret file was removed. Containers (if created) are left in
              place for inspection via `docker logs pilot-prometheus` /
              `docker logs pilot-thanos-sidecar`.
