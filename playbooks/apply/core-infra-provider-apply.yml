---
# Apply playbook for docs/verification/core-infra-provider.md — the NTP
# provider role (`-e infra_role=ntp`): install + configure chrony (or ntpd /
# ntpsec) with a sane pool so this host itself becomes a stratum source.
#
# The DNS role that used to live here (`-e infra_role=dns`) moved to its own
# playbook, playbooks/apply/dns-apply.yml (docs/verification/dns.md), the same
# way docker, keycloak, and keycloak-db were split out earlier:
#
#   playbooks/apply/dns-apply.yml
#   playbooks/apply/docker-apply.yml
#   playbooks/apply/keycloak-apply.yml
#   playbooks/apply/keycloak-db-apply.yml
#
# `infra_role` is kept so existing `-e infra_role=ntp` callers and the
# site.yml import keep working; any other value fails the gate below.
#
# Usage:
#
#   ansible-playbook -i inventory.yaml \
#       playbooks/apply/core-infra-provider-apply.yml \
#       -e infra_role=ntp \
#       -e ntp_provider=chrony \
#       -e ntp_pool="ntp.ubuntu.com pool.ntp.org"
#
# Stage gating:
#   sandbox  default; runs immediately
#   staging  requires -e confirm_staging=true
#   prod     requires -e confirm_prod=true AND -e staging_attested_within_hours<=168
- name: Core infra provider apply (ntp)
  hosts: "{{ target_group | default(infra_role) | default('ntp') }}"
  become: true
  gather_facts: true
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168
    ntp_provider: chrony
    target_group: "{{ infra_role }}"

  pre_tasks:
    - name: "Gate: infra_role must be ntp"
      tags: [always]
      ansible.builtin.assert:
        that:
          - infra_role == 'ntp'
        fail_msg: >-
          infra_role={{ infra_role }} invalid. Pass -e infra_role=ntp.
          (dns moved to playbooks/apply/dns-apply.yml; docker, keycloak, and db to their own playbooks.)

    - name: "Gate: staging or prod requires explicit confirm"
      tags: [always]
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or
            (stage == 'staging' and confirm_staging | bool) or
            (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm flag. Pass -e confirm_staging=true or confirm_prod=true."

    - name: "Gate: stage must match this host's inventory environment group"
      tags: [always]
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。inventory 的 staging/prod group 只是給
          target_group 篩選用的標籤,不會自動決定 stage——必須自己帶對的 -e stage=,
          且要跟這台機器所屬的環境 group 一致。

    - name: "Gate: prod requires recent staging attestation"
      tags: [always]
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
        fail_msg: "prod gate: staging attestation missing or older than 168h."
      when: stage == 'prod'

  tasks:
    ### NTP role
    - name: "NTP — install chrony"
      tags: [ntp, ntp-C1]
      ansible.builtin.include_tasks:
        file: tasks/apt-package-install.yml
        apply:
          tags: [ntp, ntp-C1]
      vars:
        pilot_apt_packages: ["{{ ntp_provider }}"]
        pilot_apt_policy: tolerant
        pilot_apt_component: core-infra-ntp
        pilot_apt_required_sources:
          - id: ubuntu-os
            class: os
      when: not ansible_check_mode

    - name: "NTP — write chrony.conf"
      tags: [ntp, ntp-C3]
      ansible.builtin.copy:
        dest: /etc/chrony/chrony.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          {% for srv in (ntp_pool | default('ntp.ubuntu.com')).split() %}
          server {{ srv }} iburst maxsources 4
          {% endfor %}
          sourcedir /run/chrony-dhcp
          driftfile /var/lib/chrony/chrony.drift
          makestep 1.0 3
          rtcsync
          logdir /var/log/chrony
          allow 10.0.0.0/8
          allow 192.168.0.0/16
          local stratum 3
      when: not ansible_check_mode
      notify: restart chrony

    - name: "NTP — enable + start chronyd"
      tags: [ntp, ntp-C2]
      ansible.builtin.systemd:
        name: "{{ ntp_provider }}"
        state: started
        enabled: true
      when: not ansible_check_mode
      notify: restart chrony

    - name: "NTP — final check: chronyd active"
      tags: [ntp, ntp-C2]
      ansible.builtin.command: systemctl is-active chronyd
      register: ntp_post
      failed_when: ntp_post.stdout != 'active'
      changed_when: false

  handlers:
    - name: restart chrony
      ansible.builtin.systemd:
        name: chrony
        state: restarted
