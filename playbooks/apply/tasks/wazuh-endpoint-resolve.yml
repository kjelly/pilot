---
# Caller holds the Wazuh host writer. Only bounded inventory identity fields
# enter this read-only resolver; raw/TLS names stay separate from transport.
- name: Reset the Wazuh endpoint inventory evidence
  ansible.builtin.set_fact:
    wazuh_endpoint_records: []

- name: Collect only trusted inventory endpoint identity fields
  ansible.builtin.set_fact:
    wazuh_endpoint_records: >-
      {{ wazuh_endpoint_records + [{'name': item,
           'address': hostvars[item].ansible_host | default(item, true),
           'fqdn': hostvars[item].ansible_fqdn | default('')}] }}
  loop: "{{ wazuh_endpoint_inventory | default(groups.get('all', [])) }}"
  no_log: true

- name: Associate the raw Wazuh endpoint before transport resolution
  ansible.builtin.script:
    cmd: >-
      files/wazuh-endpoint.py select {{ {'raw': wazuh_endpoint_value, 'records': wazuh_endpoint_records, 'manager': wazuh_endpoint_manager | default('')} | to_json | quote }}
  timeout: 30
  register: wazuh_endpoint_selection
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve the selected Wazuh transport with the shared inventory-aware resolver
  ansible.builtin.include_tasks:
    file: resolve-hosts-alias-target.yml
    apply:
      timeout: 30
  vars:
    hosts_alias_target_host: "{{ (wazuh_endpoint_selection.stdout | from_json).transport }}"

- name: Bind one canonical numeric Wazuh transport to its inventory evidence
  ansible.builtin.script:
    cmd: >-
      files/wazuh-endpoint.py bind {{ {'raw': wazuh_endpoint_value, 'records': wazuh_endpoint_records, 'manager': wazuh_endpoint_manager | default(''), 'resolved': hosts_alias_resolved_ip} | to_json | quote }}
  timeout: 30
  register: wazuh_endpoint_binding
  changed_when: false
  check_mode: false
  no_log: true

- name: Retain the single bound transport for this invocation
  ansible.builtin.set_fact:
    wazuh_endpoint_address: "{{ (wazuh_endpoint_binding.stdout | from_json).address }}"
