# Shared task file: can this host resolve the names that `kinit` and `ipa`
# need, BEFORE the enrolled-only admin kinit in freeipa-host-annotations.yml
# and freeipa-host-access-policy.yml runs (GitHub issue #168).
#
# Why: MIT kinit resolves the KDC names in /etc/krb5.conf with the host's own
# resolver (glibc getaddrinfo). A name that does not resolve makes kinit fail
# before any packet reaches a KDC ("Cannot contact any KDC for realm"; the
# KDC log shows nothing), and the kinit task is no_log. A host whose resolver
# list drifted (a public DNS in the list, the FreeIPA DNS dead) failed the
# whole --check preview with a censored message, and the repair for it (the
# /etc/hosts server-pool pin in freeipa-client-apply.yml) is a mutation that
# --check never writes.
#
# What this does (read-only, check_mode: false so --check runs it too):
#   1. Parses the realm stanza of /etc/krb5.conf (+ includes) and resolves
#      every KDC/admin name, plus the selected admin endpoint FQDN and the
#      FreeIPA server pool FQDNs, with socket.getaddrinfo (the same libc path
#      kinit and `ipa` use).
#   2. Decides what is REQUIRED: kinit succeeds when ANY listed KDC name
#      resolves and answers, so a stale extra KDC name alone is not a
#      failure; but if no KDC name resolves, or the admin endpoint FQDN
#      (`ipa -e xmlrpc_uri=https://<fqdn>/...`) does not resolve, the host
#      cannot do its job.
#   3. State `freeipa_client_kdc_preflight_state`:
#        ok       every required name resolves
#        deferred --check only: something required is unresolvable, the
#                 /etc/hosts server-pool pin task WOULD change this run
#                 (it is a real mutation, so --check does not write it), and
#                 the pin covers every unresolved name. Callers skip the
#                 kinit-dependent reads and say "deferred to apply"; apply
#                 writes the pin first and self-repairs.
#        failed   any other unresolved case (check mode without a pending pin
#                 or with names the pin does not cover; a real run). The
#                 assert at the end fails with the host, the FQDNs, the
#                 resolver list and the likely cause. Nothing here handles
#                 secrets, so nothing is no_log: the failure is never
#                 censored.
#        skipped  callers set this when the host is not enrolled (this file
#                 is not included then).
#
# `--tags host-annotations` / `--tags host-access-policy` skip the pin task
# (it is tagged freeipa-client, C3), so the pin register is absent: in that
# case a --check preview fails explicitly instead of deferring.
#
# Included TWICE per play (annotations, then access policy), so the first
# task resets every fact this file owns (AGENTS.md §4.5 item 2).
#
# Inputs: ipa_realm, ipa_client_fqdn, freeipa_admin_server_fqdn,
# freeipa_server_fqdns, freeipa_client_hosts_pool_pin (the register of the
# pool-pin blockinfile in freeipa-client-apply.yml), and from the caller
# freeipa_client_kdc_preflight_caller (label for messages).
# Optional overrides (tests): freeipa_client_kdc_preflight_krb5_paths,
# freeipa_client_kdc_preflight_resolv_conf, freeipa_client_kdc_preflight_resolvectl,
# freeipa_client_kdc_preflight_budget_seconds.
---
- name: "FreeIPA KDC preflight — reset this file's per-include state"
  ansible.builtin.set_fact:
    freeipa_client_kdc_preflight_state: skipped
    freeipa_client_kdc_preflight_unresolved: []
    freeipa_client_kdc_preflight_required_unresolved: []
    freeipa_client_kdc_preflight_resolvers: []
    freeipa_client_kdc_preflight_reason: ""
    freeipa_client_kdc_preflight_summary: ""

- name: "FreeIPA KDC preflight — resolve the KDC and FreeIPA server names with this host's own resolver (read-only)"
  ansible.builtin.command:
    argv:
      - timeout
      - "75"
      - python3
      - -c
      - "{{ freeipa_client_kdc_preflight_script }}"
      - "{{ freeipa_client_kdc_preflight_input | to_json }}"
  vars:
    freeipa_client_kdc_preflight_input:
      realm: "{{ ipa_realm }}"
      krb5_paths: "{{ freeipa_client_kdc_preflight_krb5_paths | default(['/etc/krb5.conf', '/etc/krb5.conf.d']) }}"
      required_names: "{{ [freeipa_admin_server_fqdn | default('')] | select | list }}"
      extra_names: "{{ freeipa_server_fqdns | default([]) }}"
      resolv_conf: "{{ freeipa_client_kdc_preflight_resolv_conf | default('/etc/resolv.conf') }}"
      resolvectl: "{{ freeipa_client_kdc_preflight_resolvectl | default('resolvectl') }}"
      budget_seconds: "{{ freeipa_client_kdc_preflight_budget_seconds | default(45) | int }}"
    freeipa_client_kdc_preflight_script: |
      import ipaddress, json, os, re, socket, subprocess, sys, threading, time

      cfg = json.loads(sys.argv[1])
      realm = cfg.get('realm') or ''
      KDC_KEYS = ('kdc', 'master_kdc')
      OTHER_KEYS = ('admin_server', 'kpasswd_server')
      REL_RE = re.compile(r'^(kdc|master_kdc|admin_server|kpasswd_server)\s*=\s*(.+?)\s*$')


      def is_ip(text):
          try:
              ipaddress.ip_address(text.split('%')[0])
              return True
          except ValueError:
              return False


      def host_of(value):
          v = re.sub(r'^(?:tcp|udp)/', '', value.strip())
          m = re.match(r'^https?://([^/]+)', v)
          if m:
              v = m.group(1)
          if v.startswith('['):
              end = v.find(']')
              v = v[1:end] if end > 0 else v[1:]
          elif v.count(':') == 1:
              v = v.split(':')[0]
          return v.strip().rstrip('.').lower()


      def expand(path, files, seen, depth=0):
          if depth > 5 or path in seen:
              return
          seen.add(path)
          if os.path.isdir(path):
              for name in sorted(os.listdir(path)):
                  if re.match(r'^[A-Za-z0-9_-]+$', name) or name.endswith('.conf'):
                      expand(os.path.join(path, name), files, seen, depth + 1)
              return
          try:
              with open(path) as handle:
                  text = handle.read()
          except OSError:
              return
          files.append((path, text))
          for line in text.splitlines():
              m = re.match(r'^\s*(include|includedir)\s+(\S+)', line)
              if m:
                  expand(m.group(2), files, seen, depth + 1)


      def realm_relations(text):
          """Relations of the `realm` stanza inside [realms] of one krb5.conf file."""
          found = []
          section = None
          depth = 0
          in_realm = False
          for line in text.splitlines():
              s = line.strip()
              if not s or s[0] in '#;':
                  continue
              if depth == 0:
                  m = re.match(r'^\[(\w+)\]', s)
                  if m:
                      section = m.group(1)
                      continue
                  if section == 'realms':
                      m = re.match(r'^(\S+)\s*=\s*\{\s*$', s)
                      if m:
                          in_realm = (m.group(1) == realm)
                          depth = 1
                  continue
              if s.endswith('{'):
                  depth += 1
              elif s == '}':
                  depth -= 1
                  if depth == 0:
                      in_realm = False
              elif depth == 1 and in_realm:
                  m = REL_RE.match(s)
                  if m:
                      found.append((m.group(1), m.group(2)))
          return found


      files = []
      seen = set()
      for p in cfg.get('krb5_paths') or []:
          expand(p, files, seen)
      kdc_names, other_names, ip_kdc = [], [], False
      for _path, text in files:
          for key, value in realm_relations(text):
              h = host_of(value)
              if not h:
                  continue
              if key in KDC_KEYS:
                  if is_ip(h):
                      ip_kdc = True
                  elif h not in kdc_names:
                      kdc_names.append(h)
              elif not is_ip(h) and h not in other_names:
                  other_names.append(h)

      required_names = [host_of(n) for n in cfg.get('required_names') or [] if n]
      extra_names = [host_of(n) for n in cfg.get('extra_names') or [] if n]
      names = []
      for n in kdc_names + other_names + required_names + extra_names:
          if n and not is_ip(n) and n not in names:
              names.append(n)

      results = {}


      def probe(name):
          try:
              socket.getaddrinfo(name, 88, 0, socket.SOCK_STREAM)
              results[name] = None
          except Exception as exc:  # gaierror, or UnicodeError for a malformed label
              results[name] = str(exc)


      threads = [threading.Thread(target=probe, args=(n,)) for n in names]
      for t in threads:
          t.daemon = True
          t.start()
      deadline = time.time() + float(cfg.get('budget_seconds') or 45)
      for t in threads:
          t.join(max(0.0, deadline - time.time()))
      for n in names:
          if n not in results:
              results[n] = 'timed out'

      unresolved = [n for n in names if results[n] is not None]
      required_unresolved = []
      if kdc_names and not ip_kdc and all(results[n] is not None for n in kdc_names):
          required_unresolved.extend(kdc_names)
      for n in required_names:
          if n in results and results[n] is not None and n not in required_unresolved:
              required_unresolved.append(n)


      def nameservers():
          # Diagnostics only: a missing file or resolvectl just shortens the list.
          from_conf, from_resolved = [], []
          try:
              with open(cfg.get('resolv_conf') or '/etc/resolv.conf') as handle:
                  for line in handle:
                      m = re.match(r'^\s*nameserver\s+(\S+)', line)
                      if m:
                          from_conf.append(m.group(1))
          except OSError:
              pass
          tool = cfg.get('resolvectl')
          if tool:
              try:
                  proc = subprocess.Popen([tool, 'dns'], stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                          universal_newlines=True)
                  out, _err = proc.communicate(timeout=5)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  out = ''
              except OSError:
                  out = ''
              for line in out.splitlines():
                  if ':' not in line:
                      continue
                  for tok in line.split(':', 1)[1].split():
                      tok = tok.split('#')[0]
                      if is_ip(tok) and tok not in from_resolved:
                          from_resolved.append(tok)
          merged = list(from_resolved)
          for ns in from_conf:
              if ns in ('127.0.0.53', '127.0.0.54') and from_resolved:
                  continue
              if ns not in merged:
                  merged.append(ns)
          return merged


      print(json.dumps({
          'names': names,
          'kdc_names': kdc_names,
          'resolved': [n for n in names if results[n] is None],
          'unresolved': unresolved,
          'errors': dict((n, results[n]) for n in unresolved),
          'required_unresolved': required_unresolved,
          'nameservers': nameservers(),
          'krb5_files': [p for p, _t in files],
      }))
  register: freeipa_client_kdc_preflight_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Gate: the name-resolution probe itself must complete (fail closed)"
  ansible.builtin.assert:
    that:
      - freeipa_client_kdc_preflight_probe.rc == 0
    fail_msg: >-
      {{ inventory_hostname }}: the KDC name-resolution probe did not complete
      (rc={{ freeipa_client_kdc_preflight_probe.rc }}; 124 means it hit its
      75 s limit, anything else usually means timeout or python3 is missing
      from PATH). Probe stderr:
      {{ freeipa_client_kdc_preflight_probe.stderr | default('') | truncate(400) }}

- name: "FreeIPA KDC preflight — decide: ok, deferred to apply, or failed"
  ansible.builtin.set_fact:
    freeipa_client_kdc_preflight_unresolved: "{{ freeipa_client_kdc_preflight_result.unresolved }}"
    freeipa_client_kdc_preflight_required_unresolved: "{{ freeipa_client_kdc_preflight_required }}"
    freeipa_client_kdc_preflight_resolvers: "{{ freeipa_client_kdc_preflight_result.nameservers }}"
    freeipa_client_kdc_preflight_state: >-
      {{ 'ok' if (freeipa_client_kdc_preflight_required | length) == 0
         else ('deferred' if (ansible_check_mode and freeipa_client_kdc_preflight_pin_pending | bool
                              and freeipa_client_kdc_preflight_covered | bool)
               else 'failed') }}
    freeipa_client_kdc_preflight_reason: >-
      {{ '' if (freeipa_client_kdc_preflight_required | length) == 0
         else ('pin_pending' if (ansible_check_mode and freeipa_client_kdc_preflight_pin_pending | bool
                                 and freeipa_client_kdc_preflight_covered | bool)
               else ('not_covered_by_pin' if not (freeipa_client_kdc_preflight_covered | bool)
                     else ('no_pending_pin' if ansible_check_mode
                           else 'unresolved_after_pin'))) }}
    freeipa_client_kdc_preflight_summary: >-
      {{ inventory_hostname }} cannot resolve
      {{ freeipa_client_kdc_preflight_required | join(', ') }}
      (resolver: {{ freeipa_client_kdc_preflight_result.nameservers | join(', ') | default('none found', true) }})
  vars:
    freeipa_client_kdc_preflight_result: "{{ freeipa_client_kdc_preflight_probe.stdout | from_json }}"
    freeipa_client_kdc_preflight_required: "{{ freeipa_client_kdc_preflight_result.required_unresolved }}"
    freeipa_client_kdc_preflight_pool: "{{ freeipa_server_fqdns | default([]) | map('lower') | list }}"
    # The pin task is a mutation: under --check it is not written, it only
    # reports whether it WOULD change. Absent (not run under --tags, or not
    # reached) reads as "not pending".
    freeipa_client_kdc_preflight_pin_pending: "{{ (freeipa_client_hosts_pool_pin | default({})) is changed }}"
    freeipa_client_kdc_preflight_covered: "{{ (freeipa_client_kdc_preflight_required | difference(freeipa_client_kdc_preflight_pool) | length) == 0 }}"

- name: "FreeIPA KDC preflight — report the deferral (check mode: apply repairs this first)"
  ansible.builtin.debug:
    msg: >-
      {{ freeipa_client_kdc_preflight_caller | default('FreeIPA client reads') }}
      deferred to apply: {{ freeipa_client_kdc_preflight_summary }}; the
      /etc/hosts FreeIPA server-pool pin (pending in this run, written by
      apply before this step) will repair this, so kinit and the FreeIPA
      reads are skipped in this preview.
  when: freeipa_client_kdc_preflight_state == 'deferred'

- name: "FreeIPA KDC preflight — note names that do not resolve but are not required"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: these names from /etc/krb5.conf or the
      FreeIPA server pool do not resolve here, but kinit and the FreeIPA
      reads do not need them (another KDC name and the admin endpoint
      resolve): {{ freeipa_client_kdc_preflight_unresolved | join(', ') }}.
  when:
    - freeipa_client_kdc_preflight_state == 'ok'
    - (freeipa_client_kdc_preflight_unresolved | length) > 0

- name: "Gate: the KDC and FreeIPA admin server names must resolve before any kinit (never censored)"
  ansible.builtin.assert:
    that:
      - freeipa_client_kdc_preflight_state != 'failed'
    fail_msg: >-
      {{ freeipa_client_kdc_preflight_summary }}; kinit would fail before it
      reached any KDC. {{ freeipa_client_kdc_preflight_hint }}
      All names that failed to resolve:
      {{ freeipa_client_kdc_preflight_unresolved | join(', ') }}.
  vars:
    freeipa_client_kdc_preflight_hint: >-
      {{ {
        'not_covered_by_pin':
          'The /etc/hosts FreeIPA server-pool pin does not cover every unresolved name (it only pins the active pool members: '
          ~ (freeipa_server_fqdns | default([]) | join(', '))
          ~ '), so apply cannot repair this. Fix the host resolver or /etc/hosts, or the stale name in /etc/krb5.conf.',
        'no_pending_pin':
          'This --check run has no pending /etc/hosts server-pool pin to repair it (the pin is already present, or --tags '
          ~ 'skipped the pin task), so apply would not fix it either. Check the resolver list in this message and that '
          ~ '/etc/nsswitch.conf hosts: includes files.',
        'unresolved_after_pin':
          'The /etc/hosts server-pool pin was already applied in this run, so the resolver and /etc/nsswitch.conf hosts: are '
          ~ 'the cause. Check the resolver list in this message (a dead FreeIPA DNS, or a public DNS in the list that cannot '
          ~ 'resolve the internal domain) and that hosts: includes files.',
      }.get(freeipa_client_kdc_preflight_reason, '') }}
