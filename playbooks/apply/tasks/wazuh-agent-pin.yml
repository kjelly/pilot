---
# Natively protect the installed Wazuh agent version (Debian: dpkg/APT hold plus a
# version preference; EL: an owned global DNF versionlock rule), so that no
# ordinary updater can drift it past the manager. Included by wazuh-fim-apply.yml
# after the agent is installed or kept; the coordinator reads the installed package
# itself, so this never names a version of its own choosing. Idempotent: it reports
# changed only when it actually changed the guard.
- name: "Refuse foreign native package policy ownership before managed writes"
  ansible.builtin.command:
    argv: [/usr/local/sbin/pilot-wazuh-transaction, agent-policy-check, --family, "{{ ansible_os_family }}", --owner, "{{ wazuh_writer_owner }}"]
  changed_when: false

- name: "Pin the effective Debian agent version and exclude all other versions"
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/pilot-wazuh-agent
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: wazuh-agent
      Pin: version {{ wazuh_agent_version_plan.package }}
      Pin-Priority: 1000

      Package: wazuh-agent
      Pin: version *
      Pin-Priority: -1
  when: ansible_os_family == 'Debian'

- name: "Protect the installed version with a native APT hold or global DNF versionlock"
  ansible.builtin.command:
    argv: [/usr/local/sbin/pilot-wazuh-transaction, agent-protect, --family, "{{ ansible_os_family }}", --owner, "{{ wazuh_writer_owner }}"]
  register: wazuh_agent_protection
  changed_when: (wazuh_agent_protection.stdout | from_json).changed | bool
