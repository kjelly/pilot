---
# Shared task: point THIS host's OS-level DNS resolver at whichever
# FreeIPA server/replica already runs native FreeIPA DNS (ipa-server-install
# / ipa-replica-install --setup-dns). Included by both
# playbooks/apply/freeipa-dns-client-apply.yml (hosts: freeipa-dns-client)
# and playbooks/apply/internal-endpoint-apply.yml (Phase 3 fleet-wide DNS
# resolver baseline, spec.md §26 point 1, §28) so the two playbooks never
# fork into two different implementations — mirrors
# tasks/freeipa-ca-trust.yml's own sharing convention (same two callers).
#
# Requires the including play to have gather_facts: true and
# ansible_os_family in [Debian, RedHat]. Optional overrides the including
# play MAY already have set (both default sensibly if absent):
#   freeipa_domain             -- FreeIPA DNS domain (default ipa.pilot.internal)
#   freeipa_dns_client_servers -- explicit nameserver IP list, bypassing
#                                 inventory auto-detection
#
# Auto-detection (no override needed in the common case): walks
# groups['freeipa-server'] (freeipa_setup_dns defaults true there) and
# groups['freeipa-server-replica'] (freeipa_setup_dns defaults false there
# — opt-in per replica), collecting each DNS-providing host's own
# ansible_host. If THIS host is itself one of those providers, its own
# resolver is pointed at itself (127.0.0.1) first, with the remaining
# providers as fallback.
#
# Unlike tasks/freeipa-ca-trust.yml, this file does not use notify/handlers
# for the post-write restart (a handler notified from an included task file
# must also be defined in whichever play includes it — a needless coupling
# between this file and its two very different callers) — each restart is
# an explicit task gated on `when: <write task> is changed` instead.

- name: "FreeIPA DNS client — Gate: supported OS (Debian/Ubuntu systemd-resolved; EL NetworkManager)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: >-
      freeipa-dns-client resolver logic supports Debian/Ubuntu (systemd-resolved) and
      Enterprise Linux (NetworkManager). Detected {{ ansible_distribution }}
      {{ ansible_distribution_version }} ({{ ansible_os_family }}).

- name: "FreeIPA DNS client — normalize freeipa_domain / freeipa_dns_client_servers"
  # A play-level `vars:` entry that self-references its own key (e.g.
  # `freeipa_domain: "{{ freeipa_domain | default(...) }}"`) recurses until
  # "Recursive loop detected in template" (confirmed live on a real
  # vm-target 2026-07-31) — normalizing via a plain set_fact task instead
  # resolves the expression exactly once.
  ansible.builtin.set_fact:
    freeipa_domain: "{{ freeipa_domain | default('ipa.pilot.internal') }}"
    freeipa_dns_client_servers: "{{ freeipa_dns_client_servers | default([], true) }}"
    freeipa_dns_client_resolv_conf_marker: "pilot-freeipa-dns-client"
    freeipa_dns_client_resolved_dropin_path: /etc/systemd/resolved.conf.d/90-pilot-freeipa-dns-client.conf
    freeipa_dns_client_netplan_dropin_path: /etc/netplan/99-pilot-freeipa-dns-client.yaml
    freeipa_dns_client_snapshot_dir: /var/lib/pilot/freeipa-dns-client/pre-apply

# `-e freeipa_dns_client_servers=[10.0.0.10]` on an ansible-playbook/ansible
# command line — a bare `[...]` with no surrounding quotes recognizable as
# JSON — is NOT parsed as a list. Ansible's k=v extra-vars parser only
# recovers a native type via `ast.literal_eval`, which raises on
# `[10.0.0.10]` (an IPv4 octet has more than one '.', so it isn't a valid
# Python float literal either), and silently falls back to the raw string
# "[10.0.0.10]". That string is truthy, so the `default([], true)` above
# never replaces it, and the Jinja `{% for ip in
# freeipa_dns_client_effective_servers %}` two tasks down then iterates a
# STRING character-by-character — not the list an operator obviously
# intended — silently writing one garbage `nameserver <char>` line per
# character instead of failing loudly. Confirmed live on a vm-target
# 2026-08-17 (see docs/verification/freeipa-dns-client.md §8). Fail closed
# here, before any of that templating happens, rather than let it produce a
# resolv.conf full of single-character "nameservers".
- name: "FreeIPA DNS client — Gate: freeipa_dns_client_servers, if given, is a real list"
  ansible.builtin.assert:
    that:
      - freeipa_dns_client_servers | type_debug == 'list'
    fail_msg: >-
      freeipa_dns_client_servers must be a YAML/JSON list, not a bare string
      (got: {{ freeipa_dns_client_servers }}). A bare
      `-e freeipa_dns_client_servers=[10.0.0.10]` on the command line is
      parsed as the literal string "[10.0.0.10]", not a list. Pass it as
      JSON extra-vars instead:
      -e '{"freeipa_dns_client_servers": ["10.0.0.10", "10.0.0.11"]}',
      or set it as a real YAML list in a group_vars/host_vars file.

# ── Auto-detect FreeIPA DNS-providing hosts from inventory ──────────────────
- name: "FreeIPA DNS client — init DNS-provider list"
  ansible.builtin.set_fact:
    freeipa_dns_providers: []

- name: "FreeIPA DNS client — add primary freeipa-server if it provides DNS"
  ansible.builtin.set_fact:
    freeipa_dns_providers: >-
      {{ freeipa_dns_providers + [{'host': item, 'ip': hostvars[item].ansible_host | default(item, true)}] }}
  loop: "{{ groups['freeipa-server'] | default([]) }}"
  when: hostvars[item].freeipa_setup_dns | default(true) | bool

- name: "FreeIPA DNS client — add freeipa-server-replica hosts that provide their own DNS"
  ansible.builtin.set_fact:
    freeipa_dns_providers: >-
      {{ freeipa_dns_providers + [{'host': item, 'ip': hostvars[item].ansible_host | default(item, true)}] }}
  loop: "{{ groups['freeipa-server-replica'] | default([]) }}"
  when: hostvars[item].freeipa_setup_dns | default(false) | bool

- name: "FreeIPA DNS client — compute effective nameserver list for THIS host"
  ansible.builtin.set_fact:
    freeipa_dns_client_effective_servers: >-
      {{
        (freeipa_dns_client_servers)
        if (freeipa_dns_client_servers | length > 0)
        else (
          (['127.0.0.1'] + (freeipa_dns_providers | rejectattr('host', 'equalto', inventory_hostname) | map(attribute='ip') | list))
          if (inventory_hostname in (freeipa_dns_providers | map(attribute='host') | list))
          else (freeipa_dns_providers | map(attribute='ip') | list)
        )
      }}

- name: "FreeIPA DNS client — Gate: at least one FreeIPA DNS server resolved (explicit or inventory)"
  ansible.builtin.assert:
    that:
      - freeipa_dns_client_effective_servers | length > 0
    fail_msg: >-
      No FreeIPA DNS-providing host found. Either set freeipa_dns_client_servers=[ip1,ip2]
      explicitly, or make sure this inventory has a freeipa-server (or
      freeipa-server-replica with freeipa_setup_dns=true) host.

# bind9-dnsutils is the package that ships /usr/bin/dig (Ubuntu 20.10+,
# Debian 11+); `dnsutils` is only a transitional package that depends on
# it, so asking for it made a host that already had dig download
# something. It goes through the apt framework rather than plain
# ansible.builtin.apt: on the vm-target golden image, whose apt index was
# stale, the plain task hit a 404 and failed the apply before the block
# below ran (2026-09-24, docs/evidence/freeipa-dns-client/2026-09-24-583df40.md).
# The framework does nothing when the package is already installed and
# recovers from stale metadata when it is not.
- name: "FreeIPA DNS client — install dig (Debian, apt framework)"
  ansible.builtin.include_tasks:
    file: apt-package-install.yml
    # This file is included by two playbooks with different row tags, so
    # it cannot name the caller's tags. `always` on the pulled-in tasks
    # means "whenever this include runs": the include itself carries the
    # caller's `apply` tags, so a --tags run that deselects the caller
    # skips it too.
    apply:
      tags: [always]
  vars:
    pilot_apt_packages: [bind9-dnsutils]
    pilot_apt_policy: tolerant
    pilot_apt_component: freeipa-dns-client-dig
    pilot_apt_required_sources:
      - id: distro-os
        class: os
  when:
    - ansible_os_family == 'Debian'
    - not ansible_check_mode

- name: "FreeIPA DNS client — install dig (RedHat)"
  ansible.builtin.dnf:
    name: bind-utils
    state: present
  when:
    - ansible_os_family == 'RedHat'
    - not ansible_check_mode

# ── Pre-apply snapshot for the rescue below ────────────────────────────────
# The rescue puts the host back the way this run found it. Before
# 2026-09-24 it restored only /etc/resolv.conf, from the copy task's
# `backup: true` file, and on Ubuntu that was not enough: the resolved.conf.d
# and netplan drop-ins stayed, so lookups still went to the server that had
# just failed; the backup was taken after systemd-resolved had already been
# restarted with the new drop-in; and copying it back turned the stub
# symlink into a regular file (docs/evidence/freeipa-dns-client/2026-09-24-583df40.md).
# So this snapshots every file the block writes, with `cp -a
# --no-dereference` (a symlink stays a symlink; an absent file is recorded
# as absent) and, on EL, the active connection's DNS settings that the
# nmcli task changes. It runs outside the block: if the snapshot fails,
# nothing has been changed yet and the play stops here. It is refreshed on
# every run and only read by the rescue, hence changed_when: false.
- name: "FreeIPA DNS client — snapshot resolver state before changing it"
  ansible.builtin.shell: |
    set -euo pipefail
    snap={{ freeipa_dns_client_snapshot_dir | quote }}
    rm -rf "$snap"
    mkdir -p "$snap"
    chmod 0700 "$snap"
    for f in /etc/resolv.conf {{ freeipa_dns_client_resolved_dropin_path | quote }} {{ freeipa_dns_client_netplan_dropin_path | quote }}; do
      if [ -e "$f" ] || [ -L "$f" ]; then
        cp -a --no-dereference "$f" "$snap/$(printf '%s' "$f" | tr / _)"
      fi
    done
    if [ {{ ansible_os_family | quote }} = RedHat ] && command -v nmcli >/dev/null; then
      active="$(nmcli -t -f NAME,DEVICE connection show --active | head -n1)"
      if [ -n "$active" ]; then
        printf '%s' "${active%%:*}" > "$snap/nm.conn"
        printf '%s' "${active#*:}" > "$snap/nm.device"
        for field in ipv4.dns ipv4.dns-search ipv4.ignore-auto-dns; do
          nmcli -g "$field" connection show "${active%%:*}" > "$snap/nm.$field"
        done
      fi
    fi
    ls -A "$snap"
  args:
    executable: /bin/bash
  register: freeipa_dns_client_snapshot
  changed_when: false
  when: not ansible_check_mode

- name: "FreeIPA DNS client — configure DNS resolver and verify it actually resolves via FreeIPA"
  block:
    # ── Debian/Ubuntu: systemd-resolved ──────────────────────────────────
    - name: "Debian — ensure /etc/systemd/resolved.conf.d/ exists"
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: ansible_os_family == 'Debian'

    - name: "Debian — write systemd-resolved drop-in (nss-resolve/resolvectl path)"
      ansible.builtin.copy:
        dest: "{{ freeipa_dns_client_resolved_dropin_path }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          # {{ freeipa_dns_client_resolv_conf_marker }}: managed by tasks/freeipa-dns-client-resolver.yml — DO NOT EDIT BY HAND
          [Resolve]
          DNS={{ freeipa_dns_client_effective_servers | join(' ') }}
          Domains={{ freeipa_domain }}
      when: ansible_os_family == 'Debian'
      register: freeipa_dns_client_resolved_dropin

    - name: "Debian — restart systemd-resolved (drop-in changed)"
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when:
        - ansible_os_family == 'Debian'
        - freeipa_dns_client_resolved_dropin is changed

    - name: "Debian/EL — write /etc/resolv.conf (glibc-resolver/dig path; symlink- and bind-mount-safe)"
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: '0644'
        follow: false
        unsafe_writes: true
        backup: true
        content: |
          # {{ freeipa_dns_client_resolv_conf_marker }}: managed by tasks/freeipa-dns-client-resolver.yml — DO NOT EDIT BY HAND
          search {{ freeipa_domain }}
          {% for ip in freeipa_dns_client_effective_servers %}
          nameserver {{ ip }}
          {% endfor %}

    # Empirically confirmed on a real vm-target (2026-08-17, Ubuntu 24.04):
    # writing the resolved.conf.d drop-in above only sets systemd-resolved's
    # GLOBAL DNS server. It does nothing about the DHCP-supplied PER-LINK
    # DNS server that netplan's default `dhcp4: true` already installs on
    # the primary interface — `resolvectl status` showed both
    # simultaneously (`Global: <configured IP>` AND `Link N (<iface>):
    # <DHCP gateway> (+DefaultRoute)`), and `resolvectl query` was actually
    # answered by the per-link (DHCP) entry, not Global — proven by
    # clearing the per-link entry (`resolvectl dns <iface> ""`) and
    # re-querying, which then correctly timed out against the
    # Global-only server. So this role looked correctly configured (drop-in
    # present, Global DNS correct) while ordinary lookups could silently
    # keep going through DHCP DNS instead of FreeIPA the whole time. The
    # EL/NetworkManager branch below already avoids this class of bug via
    # `dns4_ignore_auto: true`; the two tasks below are the Debian-side
    # equivalent.
    #
    # Ubuntu-only (`ansible_distribution`, narrower than the `ansible_os_family
    # == 'Debian'` this whole branch otherwise gates on): plain Debian does
    # not ship netplan by default, and every real Debian-family target in
    # this fleet is Ubuntu 24.04 (docs/runbooks/vm-target.md's base image)
    # — a host with systemd-resolved but no netplan should silently skip
    # this pair rather than fail the whole apply.
    #
    # Deliberately a NEW, pilot-owned file (99- sorts after cloud-init's own
    # 50-cloud-init.yaml) instead of editing that file directly: netplan
    # merges per-device settings across every file in lexical order, so
    # this stacks on top of whatever cloud-init's own DHCP config says
    # without pilot ever touching a file cloud-init itself regenerates (the
    # same vm-target run confirmed `cloud-init clean` + reboot re-renders
    # 50-cloud-init.yaml's mtime but never its dhcp4/dhcp6 content, and
    # never touches this file at all).
    #
    # The rescue removes this file again if this run created it (restores
    # it if it existed before). An earlier version deliberately kept it,
    # so DHCP DNS would not mask FreeIPA DNS; but a failed apply has not
    # moved the host to FreeIPA DNS, and keeping this file (with DHCP DNS
    # off and the resolved drop-in pointing at a server that just failed)
    # left the host with no working DNS at all (2026-09-24 vm-target run).
    - name: "Debian(Ubuntu) — inspect the active interface kind for netplan"
      ansible.builtin.command:
        argv:
          - ip
          - -o
          - -d
          - link
          - show
          - dev
          - "{{ ansible_default_ipv4.interface }}"
      register: freeipa_dns_client_netplan_interface_details
      check_mode: false
      changed_when: false
      when:
        - ansible_os_family == 'Debian'
        - ansible_distribution == 'Ubuntu'
        - ansible_default_ipv4.interface is defined

    - name: "Debian(Ubuntu) — select the netplan interface section"
      ansible.builtin.set_fact:
        freeipa_dns_client_netplan_interface_section: >-
          {{
            'vlans'
            if (freeipa_dns_client_netplan_interface_details.stdout is search('(^| )vlan protocol '))
            else 'bonds'
            if (freeipa_dns_client_netplan_interface_details.stdout is search('(^| )bond '))
            else 'bridges'
            if (freeipa_dns_client_netplan_interface_details.stdout is search('(^| )bridge '))
            else 'ethernets'
          }}
      when:
        - ansible_os_family == 'Debian'
        - ansible_distribution == 'Ubuntu'
        - ansible_default_ipv4.interface is defined
        - freeipa_dns_client_netplan_interface_details.rc == 0

    - name: "Debian(Ubuntu) — write netplan drop-in disabling DHCP-supplied per-link DNS"
      ansible.builtin.copy:
        dest: "{{ freeipa_dns_client_netplan_dropin_path }}"
        owner: root
        group: root
        mode: '0600'
        content: |
          # {{ freeipa_dns_client_resolv_conf_marker }}: managed by tasks/freeipa-dns-client-resolver.yml — DO NOT EDIT BY HAND
          network:
            version: 2
            {{ freeipa_dns_client_netplan_interface_section }}:
              {{ ansible_default_ipv4.interface }}:
                dhcp4-overrides:
                  use-dns: false
                dhcp6-overrides:
                  use-dns: false
      when:
        - ansible_os_family == 'Debian'
        - ansible_distribution == 'Ubuntu'
        - ansible_default_ipv4.interface is defined
      register: freeipa_dns_client_netplan_dropin

    - name: "Debian(Ubuntu) — netplan apply (DHCP DNS override changed)"
      ansible.builtin.command: netplan apply
      when:
        - ansible_os_family == 'Debian'
        - ansible_distribution == 'Ubuntu'
        - freeipa_dns_client_netplan_dropin is changed
      changed_when: true

    # ── EL/RHEL: NetworkManager ──────────────────────────────────────────
    - name: "EL — discover the active NetworkManager connection"
      ansible.builtin.command: nmcli -t -f NAME,DEVICE connection show --active
      register: freeipa_dns_client_nm_active
      # Read-only diagnostic: ansible.builtin.command is otherwise skipped
      # under --check (it isn't idempotency-aware), which would leave the
      # gate right after this evaluating an undefined
      # freeipa_dns_client_nm_conn and crash instead of failing closed —
      # caught for real on p11-el/p11-ipa's first-ever --check run of this
      # logic (2026-08-14; the pre-extraction playbook had this same bug,
      # just never dry-run before).
      check_mode: false
      changed_when: false
      when: ansible_os_family == 'RedHat'

    - name: "EL — parse active connection name/device"
      ansible.builtin.set_fact:
        freeipa_dns_client_nm_conn: "{{ (freeipa_dns_client_nm_active.stdout_lines | first).split(':')[0] }}"
        freeipa_dns_client_nm_device: "{{ (freeipa_dns_client_nm_active.stdout_lines | first).split(':')[1] }}"
      when:
        - ansible_os_family == 'RedHat'
        - freeipa_dns_client_nm_active.stdout_lines | default([]) | length > 0

    - name: "EL — gate: an active NetworkManager connection was found"
      ansible.builtin.assert:
        that:
          - freeipa_dns_client_nm_conn is defined
          - freeipa_dns_client_nm_conn | length > 0
        fail_msg: >-
          No active NetworkManager connection found (`nmcli connection show --active`
          returned nothing) — cannot set dns4 on a non-existent profile.
      when: ansible_os_family == 'RedHat'

    - name: "EL — set dns4/dns4_search on the active connection"
      community.general.nmcli:
        conn_name: "{{ freeipa_dns_client_nm_conn }}"
        dns4: "{{ freeipa_dns_client_effective_servers }}"
        dns4_search: ["{{ freeipa_domain }}"]
        dns4_ignore_auto: true
        state: present
      when: ansible_os_family == 'RedHat'
      register: freeipa_dns_client_nm_mod

    - name: "EL — reapply the connection onto the live device (no disconnect)"
      ansible.builtin.command: "nmcli device reapply {{ freeipa_dns_client_nm_device }}"
      when:
        - ansible_os_family == 'RedHat'
        - freeipa_dns_client_nm_mod is changed
      register: freeipa_dns_client_nm_reapply
      failed_when: false
      changed_when: freeipa_dns_client_nm_reapply.rc == 0

    - name: "EL — fall back to `nmcli con up` if reapply was rejected"
      ansible.builtin.command: "nmcli con up {{ freeipa_dns_client_nm_conn }}"
      when:
        - ansible_os_family == 'RedHat'
        - freeipa_dns_client_nm_mod is changed
        - freeipa_dns_client_nm_reapply is defined
        - freeipa_dns_client_nm_reapply.rc != 0
      changed_when: true

    # ── functional proof (both OS) ──────────────────────────────────────
    - name: "FreeIPA DNS client — FreeIPA server FQDN actually resolves via DNS"
      ansible.builtin.command: >-
        sh -c 'dig +short {{ freeipa_server_fqdn | default("ipa1." ~ freeipa_domain) }} | grep -qE "^[0-9]+\." && echo 0 || echo 1'
      register: freeipa_dns_client_functional_check
      changed_when: false
      failed_when: freeipa_dns_client_functional_check.stdout | trim != '0'

  rescue:
    # Put back what the pre-apply snapshot recorded and say exactly what
    # happened: each ROLLBACK task echoes one line per step, and the final
    # message reports those lines instead of claiming success. bash, not
    # the shell module's default /bin/sh (dash on Debian/Ubuntu rejects
    # `set -o pipefail`; AGENTS.md §4.5 point 7). failed_when: false so a
    # partial rollback still runs the remaining steps and reaches the
    # message; a non-zero rc is reported there as "rollback incomplete".
    - name: "ROLLBACK — restore resolver files from the pre-apply snapshot"
      ansible.builtin.shell: |
        set -uo pipefail
        snap={{ freeipa_dns_client_snapshot_dir | quote }}
        if [ ! -d "$snap" ]; then echo "no pre-apply snapshot at $snap, files left unchanged"; exit 1; fi
        rc=0
        for f in /etc/resolv.conf {{ freeipa_dns_client_resolved_dropin_path | quote }} {{ freeipa_dns_client_netplan_dropin_path | quote }}; do
          saved="$snap/$(printf '%s' "$f" | tr / _)"
          if [ -e "$saved" ] || [ -L "$saved" ]; then
            if cp -a --no-dereference --remove-destination "$saved" "$f"; then echo "$f restored"; else echo "$f restore failed"; rc=1; fi
          elif [ -e "$f" ] || [ -L "$f" ]; then
            if rm -f "$f"; then echo "$f removed (did not exist before)"; else echo "$f removal failed"; rc=1; fi
          fi
        done
        exit "$rc"
      args:
        executable: /bin/bash
      register: freeipa_dns_client_rollback_files
      changed_when: true
      failed_when: false

    - name: "ROLLBACK — reload systemd-resolved and netplan from the restored files (Debian)"
      ansible.builtin.shell: |
        set -uo pipefail
        rc=0
        if systemctl restart systemd-resolved; then echo "systemd-resolved restarted"; else echo "systemd-resolved restart failed"; rc=1; fi
        if command -v netplan >/dev/null; then
          if netplan apply; then echo "netplan applied"; else echo "netplan apply failed"; rc=1; fi
        fi
        exit "$rc"
      args:
        executable: /bin/bash
      register: freeipa_dns_client_rollback_reload
      changed_when: true
      failed_when: false
      when: ansible_os_family == 'Debian'

    - name: "ROLLBACK — restore the connection's DNS settings (EL NetworkManager)"
      ansible.builtin.shell: |
        set -uo pipefail
        snap={{ freeipa_dns_client_snapshot_dir | quote }}
        if [ ! -s "$snap/nm.conn" ]; then echo "no NetworkManager snapshot, connection left unchanged"; exit 1; fi
        conn="$(cat "$snap/nm.conn")"
        dev="$(cat "$snap/nm.device")"
        if nmcli connection modify "$conn" \
            ipv4.dns "$(cat "$snap/nm.ipv4.dns")" \
            ipv4.dns-search "$(cat "$snap/nm.ipv4.dns-search")" \
            ipv4.ignore-auto-dns "$(cat "$snap/nm.ipv4.ignore-auto-dns")"; then
          echo "connection '$conn' DNS settings restored"
        else
          echo "connection '$conn' DNS settings restore failed"; exit 1
        fi
        if nmcli device reapply "$dev" >/dev/null; then echo "device $dev reapplied"
        elif nmcli connection up "$conn" >/dev/null; then echo "connection '$conn' brought up again"
        else echo "reapply of '$conn' failed"; exit 1; fi
      args:
        executable: /bin/bash
      register: freeipa_dns_client_rollback_nm
      changed_when: true
      failed_when: false
      when: ansible_os_family == 'RedHat'

    - name: "ROLLBACK — surface the original failure"
      vars:
        freeipa_dns_client_rollback_results: >-
          {{ [freeipa_dns_client_rollback_files | default({}),
              freeipa_dns_client_rollback_reload | default({}),
              freeipa_dns_client_rollback_nm | default({})]
             | select | rejectattr('skipped', 'defined') | list }}
      ansible.builtin.fail:
        msg: >-
          freeipa-dns-client resolver apply failed.
          {% if ansible_check_mode %}Check mode: nothing was changed, so nothing was rolled back.
          {% else %}Rollback: {{ freeipa_dns_client_rollback_results | map(attribute='stdout_lines', default=[])
          | flatten | join('; ') or 'no rollback step ran' }}.
          {% if freeipa_dns_client_rollback_results | map(attribute='rc', default=0) | select('ne', 0) | list %}Rollback
          incomplete: check the ROLLBACK tasks above before re-running.
          {% endif %}{% endif %}Fix the failing task and re-run.
