# Shared task file: classify a failed admin `kinit` without printing its raw
# output (GitHub issue #168).
#
# The kinit tasks in freeipa-host-annotations.yml and
# freeipa-host-access-policy.yml are no_log (the password is on stdin) and
# used to fail with a censored message, so "name does not resolve", "no KDC
# answered", "wrong password" and "clock skew" all looked the same. The
# callers now register the result and include this file with ONLY the exit
# code and stderr; it classifies stderr and fails with a fixed, secret-free
# text: the class, the principal, the host and the exit code. The raw stderr
# is never printed (the classification tasks are no_log, and the assert
# never references it).
#
# Classes (token: libkrb5 text it is matched from):
#   cannot_resolve      `Cannot find KDC for realm "R"` (no KDC name usable) or
#                       `Cannot resolve network address for KDC in requested
#                       realm`; also `Cannot contact any KDC` when the KDC
#                       preflight (tasks/freeipa-client-kdc-preflight.yml)
#                       saw an unresolved name: the two cases print the same
#                       stderr (MIT krb5 1.22.2: an unresolvable KDC name and
#                       a closed KDC port both give `Cannot contact any KDC
#                       for realm 'R'`), so stderr alone cannot separate them.
#   cannot_contact_kdc  `Cannot contact any KDC for realm 'R'` with every
#                       KDC name resolving (or no preflight evidence)
#   preauth_failed      `Password incorrect` (MIT KDC) or
#                       `Preauthentication failed` / `Pre-authentication
#                       failed` (FreeIPA KDC)
#   client_not_found    `Client 'p@R' not found in Kerberos database`
#   clock_skew          `Clock skew too great`
#   other               anything else; only the exit code is printed
#
# Inputs (include vars): freeipa_client_kinit_rc, freeipa_client_kinit_stderr.
# Also reads ipa_enroll_principal, ipa_realm and, when set,
# freeipa_client_kdc_preflight_unresolved.
---
- name: "FreeIPA kinit result — classify the exit code and stderr (stderr is never printed)"
  ansible.builtin.set_fact:
    freeipa_client_kinit_class: >-
      {{ 'ok' if (freeipa_client_kinit_rc | int) == 0
         else ('cannot_resolve' if (freeipa_client_kinit_stderr is search(freeipa_client_kinit_re_resolve)
                                    or (freeipa_client_kinit_stderr is search(freeipa_client_kinit_re_contact)
                                        and (freeipa_client_kdc_preflight_unresolved | default([]) | length) > 0))
               else ('cannot_contact_kdc' if freeipa_client_kinit_stderr is search(freeipa_client_kinit_re_contact)
               else ('preauth_failed' if freeipa_client_kinit_stderr is search(freeipa_client_kinit_re_preauth)
               else ('client_not_found' if freeipa_client_kinit_stderr is search(freeipa_client_kinit_re_client_not_found)
               else ('clock_skew' if freeipa_client_kinit_stderr is search(freeipa_client_kinit_re_clock_skew)
               else 'other'))))) }}
  vars:
    freeipa_client_kinit_re_resolve: '(?i)cannot find KDC for (requested )?realm|cannot resolve network address for KDC'
    freeipa_client_kinit_re_contact: '(?i)cannot contact any KDC'
    freeipa_client_kinit_re_preauth: '(?i)password incorrect|pre-?authentication failed'
    freeipa_client_kinit_re_client_not_found: '(?i)client .* not found in kerberos database'
    freeipa_client_kinit_re_clock_skew: '(?i)clock skew too great'
  no_log: true

- name: "FreeIPA kinit result — gate: admin kinit must succeed (fixed text only, raw stderr withheld)"
  ansible.builtin.assert:
    that:
      - freeipa_client_kinit_class == 'ok'
    fail_msg: >-
      kinit {{ ipa_enroll_principal }}@{{ ipa_realm }} failed on
      {{ inventory_hostname }}: {{ freeipa_client_kinit_class_text[freeipa_client_kinit_class] }}
      (class={{ freeipa_client_kinit_class }}, kinit rc={{ freeipa_client_kinit_rc }}; the raw
      kinit output is withheld because the task handles the admin password).
  vars:
    freeipa_client_kinit_class_text:
      cannot_resolve: "a KDC name from /etc/krb5.conf cannot be resolved by this host's resolver, so kinit never reached a KDC"
      cannot_contact_kdc: "no KDC answered (the KDC names resolve, but the KDC is down, firewalled or on another port)"
      preauth_failed: "pre-authentication failed: the KDC rejected the admin password (check ipa_enroll_password)"
      client_not_found: "the admin principal does not exist in the Kerberos database (check ipa_enroll_principal)"
      clock_skew: "clock skew too great: synchronise time on this host and the KDC (chrony/ntp)"
      other: "an unclassified kinit failure"
      ok: ""
