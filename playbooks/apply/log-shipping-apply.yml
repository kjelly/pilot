# Apply playbook for docs/verification/log-shipping.md v1.1
#
# Agent role that layers ON TOP of docs/verification/log-server.md (same
# inventory group, same host) WITHOUT modifying that playbook/spec at all —
# see log-server.md's own note anticipating exactly this extension. Runs
# Promtail as a Docker container that tails the log files log-server.md's
# rsyslog writes under siem_log_root, and pushes them to the Loki container
# docs/verification/dashboard.md runs on a separate central host.
#
# siem_log_root is ALWAYS scraped (job_name = promtail_job_label). When a
# wazuh-manager container is also co-located on this host, its real
# alerts-log volume (resolved via `docker inspect`, not an assumed volume
# name) is scraped ADDITIONALLY under a second, separate job_name
# (promtail_wazuh_job_label) — never as a replacement for siem_log_root.
# (v1.0 had this backwards: the wazuh path REPLACED siem_log_root whenever
# a wazuh-manager container was present, which combined with a since-fixed
# bug in log-server-apply.yml to silently drop every forwarded
# local6/auth/authpriv log in production — see log-server-apply.yml's own
# v1.1 changelog entry for the full incident.)
#
# Uses the same "agent knows the central address" idiom as
# audit-log-forwarding-apply.yml (siem_forward_host/siem_forward_alias) —
# NOT the inverted discovery direction thanos-query-apply.yml uses, because
# Promtail has to actively push; there is no equivalent "central discovers
# agents via inventory" mechanism for it.
#
# Pre-flight: docs/verification/log-server.md PASS (siem_log_root exists
# and rsyslog is landing files under it), docs/verification/docker.md PASS.
#
# Usage:
#
#   go run ./cmd/pilot vm-target run --name log-server \
#       playbooks/apply/log-shipping-apply.yml \
#       -e target_group=log-server \
#       -e loki_target_host=<dashboard host IP>
#
# Variables: see docs/verification/log-shipping.md §1.5.
#
# Stage gating (same convention as freeipa-server-apply.yml):
#   sandbox  default; runs immediately
#   staging  requires -e confirm_staging=true
#   prod     requires -e confirm_prod=true AND staging_attested_within_hours<=168
- name: "Apply log-shipping (Promtail: log-server -> dashboard Loki)"
  hosts: "{{ target_group | default('log-server') }}"
  become: true
  gather_facts: true
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168
    promtail_version: "2.9.8"
    promtail_config_dir: /etc/pilot/promtail
    promtail_positions_dir: /var/lib/pilot/promtail
    docker_network_name: pilot-metrics
    loki_target_host: ""
    # Prefer an explicit value; otherwise resolve the first dashboard host from the
    # actual inventory. Use ansible_host when present, then inventory hostname.
    loki_inventory_target_host: >-
      {{ hostvars[groups["dashboard"][0]].ansible_host | default(groups["dashboard"][0], true)
         if (groups["dashboard"] | default([]) | length > 0) else "" }}
    loki_effective_target_host: >-
      {{ loki_target_host | default("", true) or loki_inventory_target_host }}
    loki_alias: pilot-loki-backend
    loki_port: 3100
    loki_endpoint: "{{ loki_alias }}:{{ loki_port }}"
    # siem_log_root is ALWAYS scraped (explicit override, else the
    # log-server default) — this is log-server.md's real receiver output,
    # and docs/verification/log-shipping.md's C3 hardcodes this exact
    # path, so it must never be silently swapped out.
    #
    # Previously this variable was *replaced* by a wazuh-manager container's
    # real alerts-log volume whenever one was co-located, on the assumption
    # that "log-server is empty and wazuh-manager is the de facto SIEM
    # receiver" — that assumption is false in production (confirmed via a
    # real incident: log-server never actually ran because of a now-removed
    # bug in log-server-apply.yml, so siem_log_root/{hostname}/*.log was
    # never created and never scraped, silently losing every forwarded
    # local6/auth/authpriv log). log-server-apply.yml now runs correctly
    # co-located with wazuh-manager, so siem_log_root is real going forward.
    #
    # The wazuh-manager alerts-log detection below is kept as an ADDITIONAL,
    # separate scrape source (its own job_name) when a wazuh-manager
    # container is present — that capability was already working and is
    # worth keeping alongside the fixed siem_log_root path, not instead of
    # it.
    siem_log_root: ""
    siem_log_root_default: /var/log/siem
    siem_wazuh_manager_container: single-node-wazuh.manager-1
    promtail_job_label: pilot-siem
    promtail_wazuh_job_label: "{{ promtail_job_label }}-wazuh-alerts"

  pre_tasks:
    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or
            (stage == 'staging' and confirm_staging | bool) or
            (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm flag. Pass -e confirm_staging=true or confirm_prod=true."
      tags: [always]

    - name: "Gate: stage must match this host's inventory environment group"
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。inventory 的 staging/prod group 只是給
          target_group 篩選用的標籤,不會自動決定 stage——必須自己帶對的 -e stage=,
          且要跟這台機器所屬的環境 group 一致。
      tags: [always]

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
        fail_msg: "prod gate: staging attestation missing or older than 168h."
      when: stage == 'prod'
      tags: [always]

    # Composability gate: without a resolvable Loki target (no explicit
    # -e loki_target_host and an empty dashboard group) shipping has nowhere
    # to go — end this host cleanly instead of failing halfway through the
    # docker tasks, mirroring audit-log-forwarding's optional
    # siem_forward_host semantics (site.yml: 之後 dashboard 就緒、補上變數
    # 重跑即可補齊). Found live 2026-07-18: a site-wide fresh deploy with a
    # plain rsyslog log-server and no dashboard host died here.
    - name: "Skip log-shipping: no Loki target (dashboard group empty and no -e loki_target_host)"
      ansible.builtin.debug:
        msg: >-
          loki_target_host is unset and the dashboard group has no hosts —
          nothing to ship to. Skipping log-shipping on
          {{ inventory_hostname }}; rerun with -e loki_target_host=<dashboard
          IP> (or after filling the dashboard group) to enable it.
      when: (loki_effective_target_host | trim | length) == 0
      tags: [always]

    - name: "End host: no Loki target"
      ansible.builtin.meta: end_host
      when: (loki_effective_target_host | trim | length) == 0
      tags: [always]

    # Same fail-early gate as wazuh-manager-apply.yml / keycloak-db-apply.yml
    # — Promtail runs as a container, so a host without a docker engine must
    # fail HERE with an actionable message (apply docker-apply.yml first),
    # not inside docker_container_info/docker_network several tasks later
    # with a bare "Error while fetching server API version".
    - name: "Pre-flight: docker engine is up (Promtail runs as a container; see docker-apply.yml)"
      ansible.builtin.command: docker info
      register: logship_docker_pre
      changed_when: false
      failed_when: logship_docker_pre.rc != 0 and not ansible_check_mode
      tags: [always]

  tasks:
    # Read-only `docker inspect` — safe to run even when no wazuh-manager
    # container exists on this host (exists: false, container: none). It
    # still needs a live daemon to connect to though, which doesn't exist
    # yet on a from-scratch host under check mode (docker's own install is
    # deferred to the real apply) — deferred here too, same convention as
    # wazuh-manager-apply.yml.
    - name: "Detect a co-located wazuh-manager container (for real alerts-log path resolution)"
      community.docker.docker_container_info:
        name: "{{ siem_wazuh_manager_container }}"
      register: siem_wazuh_container_info
      changed_when: false
      when: not ansible_check_mode

    # siem_log_root_effective is ALWAYS log-server's own path (explicit
    # override, else the default) — never swapped out for the wazuh path.
    # siem_log_root_wazuh_detected is a SEPARATE, additive fact: when
    # non-empty, the config/volumes tasks below add it as a second,
    # independent scrape source instead of replacing the first.
    - name: "Resolve siem_log_root_effective (log-server's own receiver output — always scraped)"
      ansible.builtin.set_fact:
        siem_log_root_effective: "{{ siem_log_root | default('', true) or siem_log_root_default }}"

    - name: "Resolve siem_log_root_wazuh_detected (additive: co-located wazuh-manager's real alerts-log volume, if any)"
      ansible.builtin.set_fact:
        siem_log_root_wazuh_detected: >-
          {{ (siem_wazuh_logs_mount | map(attribute='Source') | first)
             if (siem_wazuh_container_info is not skipped
                 and siem_wazuh_container_info.exists | default(false)
                 and siem_wazuh_logs_mount | length > 0)
             else '' }}
      vars:
        siem_wazuh_logs_mount: >-
          {{ (siem_wazuh_container_info.container.Mounts | default([]))
             | selectattr('Destination', 'equalto', '/var/ossec/logs') | list
             if siem_wazuh_container_info is not skipped
             else [] }}

    - name: "Pin {{ loki_alias }} -> {{ loki_effective_target_host }} in /etc/hosts"
      tags: [C5]
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\s{{ loki_alias }}$'
        line: "{{ loki_effective_target_host }}\t{{ loki_alias }}"
        state: present
      when: loki_effective_target_host | length > 0

    # docker_container needs a live daemon to compute its diff even under
    # --check; deferred to the real apply on a from-scratch host, same
    # convention as wazuh-manager-apply.yml.
    - when: not ansible_check_mode
      block:
        - name: "Ensure config + positions dirs exist"
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ promtail_config_dir }}"
            - "{{ promtail_positions_dir }}"

        # Spec: docs/verification/log-shipping.md C3, C4
        - name: "Render Promtail config"
          tags: [C3, C4, C8]
          ansible.builtin.copy:
            dest: "{{ promtail_config_dir }}/promtail-config.yml"
            mode: "0644"
            content: |
              server:
                http_listen_port: 9080
                grpc_listen_port: 0
              positions:
                filename: /var/lib/promtail/positions.yaml
              clients:
                - url: "http://{{ loki_endpoint }}/loki/api/v1/push"
              scrape_configs:
                - job_name: {{ promtail_job_label }}
                  static_configs:
                    - targets: [localhost]
                      labels:
                        job: {{ promtail_job_label }}
                        __path__: {{ siem_log_root_effective }}/**/*.log
                  pipeline_stages:
                    - regex:
                        source: filename
                        expression: '^{{ siem_log_root_effective }}/(?P<host>[^/]+)/[^/]+\.log$'
                    - labels:
                        host:
              {% if siem_log_root_wazuh_detected | trim | length > 0 %}
                - job_name: {{ promtail_wazuh_job_label }}
                  static_configs:
                    - targets: [localhost]
                      labels:
                        job: {{ promtail_wazuh_job_label }}
                        __path__: {{ siem_log_root_wazuh_detected }}/alerts/alerts.json
                  pipeline_stages:
                    - json:
                        expressions:
                          host: agent.name
                    - labels:
                        host:
              {% endif %}
          register: promtail_config_result

        - name: "Ensure docker network {{ docker_network_name }} exists"
          community.docker.docker_network:
            name: "{{ docker_network_name }}"
            state: present

        # Spec: docs/verification/log-shipping.md C1, C2, C6, C7
        # grafana/promtail's official image runs as root, so it doesn't
        # need chowned host dirs to read log-server's rsyslog-owned files
        # under siem_log_root (mounted :ro) or write its own positions dir.
        - name: "Promtail — run pilot-promtail container"
          tags: [C1, C2, C6, C7, C9]
          community.docker.docker_container:
            name: pilot-promtail
            image: "grafana/promtail:{{ promtail_version }}"
            state: started
            restart_policy: unless-stopped
            restart: "{{ promtail_config_result is changed }}"
            command: "-config.file=/etc/promtail/config.yml"
            networks:
              - name: "{{ docker_network_name }}"
            volumes: >-
              {{
                [
                  promtail_config_dir + '/promtail-config.yml:/etc/promtail/config.yml:ro',
                  siem_log_root_effective + ':' + siem_log_root_effective + ':ro',
                  promtail_positions_dir + ':/var/lib/promtail'
                ]
                + ([siem_log_root_wazuh_detected + ':' + siem_log_root_wazuh_detected + ':ro']
                   if siem_log_root_wazuh_detected | trim | length > 0 else [])
              }}
            ports:
              - "9080:9080"

        - name: "Wait for Promtail to become ready"
          ansible.builtin.uri:
            url: "http://127.0.0.1:9080/ready"
            status_code: 200
          register: promtail_ready
          until: promtail_ready.status == 200
          retries: 30
          delay: 2

      rescue:
        - name: "ROLLBACK — surface the original failure"
          ansible.builtin.fail:
            msg: >-
              log-shipping apply FAILED (see task output above). Container
              (if created) is left in place for inspection via `docker logs
              pilot-promtail`.
