# Apply playbook for docs/verification/log-server.md v1.2
# rsyslog central receiver (SIEM forward target) for audit-log-forwarding.md
# client hosts. Additive-only (no existing /etc file is mutated), so rescue
# just removes the two drop-in files it created and restarts rsyslog back to
# its pre-apply state.
#
# Usage (dry run):
#   ./pilot vm-target run --name log-server \
#     playbooks/apply/log-server-apply.yml -e target_group=all --check --diff
#
# Real apply:
#   ./pilot vm-target run --name log-server \
#     playbooks/apply/log-server-apply.yml -e target_group=all
#
# Variables (all optional, see docs/verification/log-server.md §1.5):
#   siem_receiver_tcp_port  default: 514
#   siem_log_root           default: /var/log/siem
#   siem_logrotate_rotate   default: 14
#   siem_logrotate_maxage   default: 90
#
# TCP only (v1.2, 2026-08-06): audit-log-forwarding-apply.yml only ever
# forwards over TCP (`@@`), and nothing else in this repo forwards syslog at
# all — v1.0/v1.1's UDP receiver (imudp) was unused capability that existed
# only for a hypothetical future non-TCP producer. Dropped entirely rather
# than kept conditional: simpler to reason about, nothing to lose today, and
# it removes the whole 514/udp-vs-wazuh-manager-compose conflict this file
# used to work around (siem_receiver_udp_enabled, now gone). If a real UDP
# syslog producer (e.g. a network appliance) ever needs this, re-add imudp
# then — TCP-only until that's an actual requirement, not a speculative one.
#
# Stage gating (same convention as freeipa-server-apply.yml):
#   sandbox  default; runs immediately
#   staging  requires -e confirm_staging=true
#   prod     requires -e confirm_prod=true AND staging_attested_within_hours<=168
- name: Apply log-server (rsyslog central SIEM receiver)
  hosts: "{{ target_group | default('log-server') }}"
  become: true
  gather_facts: true
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168
    siem_receiver_conf: /etc/rsyslog.d/10-siem-receiver.conf
    siem_logrotate_conf: /etc/logrotate.d/siem-incoming
    # Debian/Ubuntu's rsyslog package creates and runs rsyslogd as the
    # unprivileged "syslog" user; RHEL/EL historically runs it as root
    # with no dedicated syslog user. The landing dir must be owned by
    # whichever user actually creates the per-hostname dynaFile subdirs
    # (createDirs="on"), or rsyslog gets "Permission denied".
    siem_log_owner: "{{ 'syslog' if ansible_os_family == 'Debian' else 'root' }}"
    # siem_log_root must not be, or resolve to, one of these (see the gates).
    siem_log_root_system_trees: [/bin, /boot, /dev, /etc, /lib, /lib32, /lib64, /libx32, /proc,
                                 /run, /sbin, /sys, /usr]
    siem_log_root_reserved: [/home, /media, /mnt, /opt, /root, /srv, /tmp, /var, /var/cache,
                             /var/lib, /var/log, /var/mail, /var/opt, /var/run, /var/spool,
                             /var/tmp]
  pre_tasks:
    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or
            (stage == 'staging' and confirm_staging | bool) or
            (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm flag. Pass -e confirm_staging=true or confirm_prod=true."
      tags: [always]

    - name: "Gate: stage must match this host's inventory environment group"
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。inventory 的 staging/prod group 只是給
          target_group 篩選用的標籤,不會自動決定 stage——必須自己帶對的 -e stage=,
          且要跟這台機器所屬的環境 group 一致。
      tags: [always]

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
        fail_msg: "prod gate: staging attestation missing or older than 168h."
      when: stage == 'prod'
      tags: [always]

    # Values an operator may set in group_vars/host_vars (contract groupVars,
    # group_vars/<role>.example.yml). They are defaulted here instead of in
    # the play's vars:, which outrank group_vars/host_vars and silently
    # replaced the operator's value (AGENTS.md §4.5 point 3); -e still wins.
    # siem_log_root is also log-shipping's input, and Promtail tails it on
    # these same hosts: both playbooks must resolve the same value
    # (docs/verification/log-shipping.md §1.5), so an empty or null value
    # falls back to the default here as it does there. An empty logrotate
    # count would render `rotate ` and logrotate would skip the whole file.
    # siem_receiver_tcp_port must equal the clients' siem_forward_port
    # (audit-log-forwarding-apply.yml), which falls back the same way.
    # siem_receiver_tcp_port is rendered into imtcp's port= and compared, as
    # a string, with the clients' siem_forward_port: 2514.0, 0x9C4, 02514 or
    # 70000 would be read differently by rsyslog or not at all. Checked
    # before the fallback below so that 0 is refused instead of silently
    # becoming 514; unset, null and "" still mean the default.
    # An unquoted 02514 or 0x9C4 in YAML inventory is already another number
    # (1356, 2500) when Ansible reads it and passes as that number; write
    # ports in plain decimal.
    - name: "Gate: siem_receiver_tcp_port is a TCP port number"
      ansible.builtin.assert:
        that:
          - >-
            siem_receiver_tcp_port is not defined or siem_receiver_tcp_port is none
            or (siem_receiver_tcp_port | string) == ''
            or ((siem_receiver_tcp_port | string) is match('^[1-9][0-9]{0,4}\Z')
                and (siem_receiver_tcp_port | int) <= 65535)
        fail_msg: >-
          siem_receiver_tcp_port={{ siem_receiver_tcp_port | default('') }} must be a TCP port
          number from 1 to 65535, written in decimal without a sign, a fraction or leading zeros.
          Leave it unset for 514.
      tags: [always]

    - name: "Resolve inventory-overridable defaults without shadowing group_vars/host_vars"
      ansible.builtin.set_fact:
        siem_log_root: "{{ siem_log_root | default('/var/log/siem', true) }}"
        siem_logrotate_maxage: "{{ siem_logrotate_maxage | default(90, true) }}"
        siem_logrotate_rotate: "{{ siem_logrotate_rotate | default(14, true) }}"
        siem_receiver_tcp_port: "{{ siem_receiver_tcp_port | default('514', true) }}"
      tags: [always]

    # Step 2 makes siem_log_root owned by the rsyslog user (file:
    # state=directory follows a symlink) and Step 4 rotates
    # siem_log_root/*/*.log: a directory that already belongs to something
    # else (/var/log, /var/log/journal, /home/<user>, ...) would be taken
    # over and its logs rotated. The name checks refuse system trees and
    # shared directories, both for the path as written and for the path it
    # resolves to: a symlink to /var/log is refused, while a host whose /var
    # is itself a symlink still uses the default. The last check refuses an
    # existing directory this role did not create.
    - name: "Gate: siem_log_root is a dedicated absolute directory"
      ansible.builtin.assert:
        that:
          - siem_log_root is string
          - siem_log_root is match('^/[A-Za-z0-9._/-]+\Z')
          - (siem_log_root.split('/')[1:] | select('in', ['', '.', '..']) | list | length) == 0
          - siem_log_root not in siem_log_root_reserved
          - (siem_log_root.split('/')[:2] | join('/')) not in siem_log_root_system_trees
        fail_msg: >-
          siem_log_root={{ siem_log_root }} must be an absolute path without
          empty, '.' or '..' segments or a trailing '/', must not be under
          {{ siem_log_root_system_trees | join(', ') }}, and must not be a
          shared directory ({{ siem_log_root_reserved | join(', ') }}).
          Use a dedicated directory such as /var/log/siem.
      tags: [always]

    - name: "Gate: siem_log_root — resolve the directory it names"
      ansible.builtin.command:
        argv: [realpath, -m, --, "{{ siem_log_root }}"]
      register: siem_log_root_realpath
      changed_when: false
      check_mode: false
      tags: [always]

    - name: "Gate: siem_log_root — remember the resolved path"
      ansible.builtin.set_fact:
        siem_log_root_real: "{{ siem_log_root_realpath.stdout }}"
      tags: [always]

    - name: "Gate: siem_log_root — inspect the resolved directory and its parent"
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop:
        - "{{ siem_log_root_real }}"
        - "{{ siem_log_root_real | dirname }}"
      register: siem_log_root_path_stat
      tags: [always]

    - name: "Gate: siem_log_root — list the existing directory"
      ansible.builtin.find:
        paths: "{{ siem_log_root_real }}"
        file_type: any
        hidden: true
        recurse: false
      register: siem_log_root_entries
      when:
        - siem_log_root_path_stat.results[0].stat.exists
        - siem_log_root_path_stat.results[0].stat.isdir | default(false)
      tags: [always]

    # An existing siem_log_root must already be what Step 2 leaves behind:
    # siem_log_owner:siem_log_owner, mode 0755, holding only the per-host
    # directories rsyslog's dynaFile creates. Reruns pass, while a directory
    # that belongs to something else fails, even an empty one such as
    # /var/log/private. On EL siem_log_owner is root, so a root-owned system
    # directory differs from this role's own only by its mode, and the mode
    # has to match too; a changed mode is refused with the command that
    # restores it. The one other directory accepted is the root of a newly
    # mounted filesystem: a mount point holding nothing but lost+found (an
    # empty bind mount or btrfs subvolume passes too, which takes setting up
    # on purpose). pw_name/gr_name are missing for a uid without a passwd
    # entry, hence their defaults.
    # ansible-core renders fail_msg before the assertion runs, so every
    # value it reads has a default.
    - name: "Gate: siem_log_root resolves to a new directory or one this role created"
      ansible.builtin.assert:
        that:
          - siem_log_root_real is match('^/[A-Za-z0-9._/-]+\Z')
          - siem_log_root_real not in siem_log_root_reserved
          - (siem_log_root_real.split('/')[:2] | join('/')) not in siem_log_root_system_trees
          - >-
            not siem_log_root_stat.exists
            or (siem_log_root_stat.isdir
                and (siem_log_root_files | length) == 0
                and (((siem_log_root_stat.pw_name | default('')) == siem_log_owner
                      and (siem_log_root_stat.gr_name | default('')) == siem_log_owner
                      and siem_log_root_stat.mode == '0755')
                     or (siem_log_root_stat.dev != siem_log_root_parent.dev
                         and (siem_log_root_dirs | difference(['lost+found']) | length) == 0)))
        fail_msg: >-
          siem_log_root={{ siem_log_root }} resolves to {{ siem_log_root_real }}, which
          {% if siem_log_root_real is not match('^/[A-Za-z0-9._/-]+\Z') %}holds characters
          other than letters, digits, '.', '_', '-' and '/'; the AppArmor rule for it
          would not parse or would match other paths.
          {% elif siem_log_root_real is not match('^/[^/]') or siem_log_root_real in siem_log_root_reserved
                or (siem_log_root_real.split('/')[:2] | join('/')) in siem_log_root_system_trees %}is a
          shared or system directory.
          {% elif not (siem_log_root_stat.isdir | default(false)) %}exists and is not a directory.
          {% elif siem_log_root_files %}holds entries other than per-host directories: {{ siem_log_root_files }}.
          {% else %}exists as {{ siem_log_root_stat.pw_name | default('-') }}:{{ siem_log_root_stat.gr_name | default('-') }}
          mode {{ siem_log_root_stat.mode | default('-') }}; an existing siem_log_root must be
          {{ siem_log_owner }}:{{ siem_log_owner }} mode 0755, as this role creates it. If it is this
          role's directory with a changed owner or mode, restore it with
          `chown {{ siem_log_owner }}:{{ siem_log_owner }} {{ siem_log_root_real }} && chmod 0755 {{ siem_log_root_real }}`;
          otherwise use a new directory.{% endif %}
      vars:
        siem_log_root_stat: "{{ siem_log_root_path_stat.results[0].stat }}"
        siem_log_root_parent: "{{ siem_log_root_path_stat.results[1].stat }}"
        siem_log_root_files: "{{ siem_log_root_entries.files | default([]) | rejectattr('isdir') | map(attribute='path') | list }}"
        siem_log_root_dirs: "{{ siem_log_root_entries.files | default([]) | selectattr('isdir') | map(attribute='path') | map('basename') | list }}"
      tags: [always]
  tasks:
    # Previously: unconditionally end_play'd this whole host whenever
    # ANY host in inventory had wazuh-manager, on the assumption that
    # wazuh-manager's own 514/udp port mapping made it "a syslog collector"
    # and log-server therefore redundant ("avoid double-deployed syslog
    # collectors"). That assumption was false in production: the official
    # wazuh-docker compose's 514/udp mapping is never wired into anything
    # that parses/routes local6/auth/authpriv content (confirmed via a real
    # incident — 6 client hosts forwarding to a wazuh-manager host with no
    # TCP/514 listener at all; see docs/runbooks/audit-log-forwarding.md and
    # docs/verification/wazuh-manager.md §5's own note that this port is
    # intentionally unused). log-server must run on every host assigned to
    # it, regardless of whether wazuh-manager also runs there. TCP/514 (the
    # only protocol this role uses since v1.2) never conflicted with
    # anything wazuh-manager's compose maps, so there is no conflict left
    # to work around here at all.
    - name: "Step 1: Install rsyslog (Debian family)"
      tags: [C1]
      ansible.builtin.include_tasks:
        file: tasks/apt-package-install.yml
        apply:
          tags: [C1]
      vars:
        pilot_apt_packages: [rsyslog]
        pilot_apt_policy: tolerant
        pilot_apt_component: log-server-rsyslog
        pilot_apt_required_sources:
          - id: ubuntu-os
            class: os
      when: ansible_os_family == "Debian"

    - name: "Step 1a: Install rsyslog (RedHat family)"
      tags: [C1]
      ansible.builtin.dnf:
        name: rsyslog
        state: present
      when: ansible_os_family == "RedHat"

    # Step 4 renders a logrotate policy and validates it with logrotate, and
    # the policy does nothing without logrotate; minimal images such as
    # pilot-target-ubuntu do not ship it. Tagged with Step 4's rows so a
    # --tags C9/C10 run installs it too.
    - name: "Step 1b: Install logrotate (Debian family)"
      tags: [C1, C9, C10]
      ansible.builtin.include_tasks:
        file: tasks/apt-package-install.yml
        apply:
          tags: [C1, C9, C10]
      vars:
        pilot_apt_packages: [logrotate]
        pilot_apt_policy: tolerant
        pilot_apt_component: log-server-logrotate
        pilot_apt_required_sources:
          - id: ubuntu-os
            class: os
      when: ansible_os_family == "Debian"

    - name: "Step 1c: Install logrotate (RedHat family)"
      tags: [C1, C9, C10]
      ansible.builtin.dnf:
        name: logrotate
        state: present
      when: ansible_os_family == "RedHat"

    - block:
        - name: "Step 2: Ensure {{ siem_log_root }} exists"
          # C7, C8: Step 2a labels this directory under SELinux and runs
          # under those tags too.
          tags: [C6, C7, C8]
          ansible.builtin.file:
            # The gates checked the directory siem_log_root resolves to. Work
            # on that path and do not follow a symlink: on Ubuntu the rsyslog
            # user may write /var/log, and a symlink put in place of the
            # directory since the gates must fail this step rather than have
            # it change the owner of whatever the symlink points to.
            path: "{{ siem_log_root_real }}"
            follow: false
            state: directory
            owner: "{{ siem_log_owner }}"
            group: "{{ siem_log_owner }}"
            mode: "0755"

        # rsyslogd is confined to /var/log by AppArmor on Ubuntu and SELinux on
        # EL: for any other siem_log_root it could not create the per-host
        # files and discarded every message while the apply succeeded (see
        # the task file).
        - name: "Step 2a: Reset the log-root access results"
          tags: [C6, C7, C8]
          ansible.builtin.set_fact:
            rsyslog_apparmor_local: {}
            rsyslog_selinux_fcontext: {}
            rsyslog_selinux_relabel: {}

        - name: "Step 2a: Let a confined rsyslogd write siem_log_root"
          tags: [C6, C7, C8]
          ansible.builtin.include_tasks:
            file: tasks/rsyslog-confined-log-root.yml
            apply:
              tags: [C6, C7, C8]
          vars:
            rsyslog_log_root: "{{ siem_log_root_real }}"

        # Under SELinux, imtcp may bind siem_receiver_tcp_port only once the
        # port is labelled for rsyslogd (see the task file).
        # The task file registers rsyslog_selinux_port_label; reset it so a
        # label added earlier in this site.yml run (by another play on this
        # host) does not trigger the restart below.
        - name: "Step 2b: Reset the SELinux port label result"
          tags: [C3, C4, C7, C8, C11]
          ansible.builtin.set_fact:
            rsyslog_selinux_port_label: {}

        - name: "Step 2b: Let rsyslogd bind siem_receiver_tcp_port under SELinux"
          tags: [C3, C4, C7, C8, C11]
          ansible.builtin.include_tasks:
            file: tasks/rsyslog-selinux-tcp-port.yml
            apply:
              tags: [C3, C4, C7, C8, C11]
          vars:
            rsyslog_selinux_tcp_port: "{{ siem_receiver_tcp_port }}"

        - name: "Step 3: Render 10-siem-receiver.conf (imtcp + %HOSTNAME% dynaFile routing)"
          tags: [C3, C4, C7, C8, C11]
          ansible.builtin.copy:
            dest: "{{ siem_receiver_conf }}"
            owner: root
            group: root
            mode: "0644"
            backup: true
            content: |
              # Managed by ansible (log-server-apply.yml) — DO NOT EDIT BY HAND
              # Central SIEM receiver: accepts rsyslog forwarding from
              # audit-log-forwarding.md client hosts (auth,authpriv.* + local6.*)
              # and routes each by source %HOSTNAME% into {{ siem_log_root }}.
              # TCP only (v1.2) — audit-log-forwarding-apply.yml only ever
              # forwards over TCP; see this file's own header comment.
              #
              # v1.3: the imtcp input is bound to its own dedicated ruleset
              # rather than falling into rsyslog's default ruleset. This
              # topology always co-locates log-server with an
              # audit-log-forwarding client on the same host (the central
              # SIEM host needs its own logs collected too), which forwards
              # this host's own local6/auth/authpriv traffic to itself over
              # TCP. If the received copy re-entered the default ruleset, it
              # would match audit-log-forwarding-apply.yml's own forwarding
              # rule (99-siem-forward.conf, also unscoped/default-ruleset)
              # again and re-forward itself forever — a real incident
              # (confirmed live 2026-08-07, minimal-poc round 20) filled a
              # 77GB disk with a single host's auth.log (121M+ lines) in
              # under an hour. Scoping the receiver to its own ruleset means
              # a network-received message is written to the per-host
              # dynaFile exactly once and never reaches the forwarding rule.
              module(load="imtcp")

              template(name="SiemAuditPath" type="string" string="{{ siem_log_root }}/%HOSTNAME%/audit.log")
              template(name="SiemAuthPath" type="string" string="{{ siem_log_root }}/%HOSTNAME%/auth.log")

              ruleset(name="siemReceiver") {
                  if $syslogfacility-text == 'local6' then {
                      action(type="omfile" dynaFile="SiemAuditPath" createDirs="on")
                  }
                  if ($syslogfacility-text == 'auth' or $syslogfacility-text == 'authpriv') then {
                      action(type="omfile" dynaFile="SiemAuthPath" createDirs="on")
                  }
                  stop
              }

              input(type="imtcp" port="{{ siem_receiver_tcp_port }}" ruleset="siemReceiver")
          register: siem_receiver_conf_result

        - name: "Step 4: Render /etc/logrotate.d/siem-incoming"
          tags: [C9, C10]
          ansible.builtin.copy:
            dest: "{{ siem_logrotate_conf }}"
            owner: root
            group: root
            mode: "0644"
            # Fails when logrotate reports an error about this file
            # ("error: <file>:<line> ..." or "error: <file>:prerotate,
            # postrotate or preremove without endscript"), which makes it skip
            # the whole policy. `logrotate -d` alone also exits 1 for a
            # fragment that relies on /etc/logrotate.conf's global `su`
            # (Ubuntu's distro rsyslog policy: "error: skipping ..."), so its
            # rc is not used (captured on Ubuntu 24.04 and AlmaLinux 9.8,
            # 2026-10-14). Without logrotate (Step 1b installs it) it fails.
            validate: >-
              /bin/sh -c 'command -v logrotate >/dev/null && ! logrotate -d "$0" 2>&1 | grep -F -e "error: $0:"' %s
            content: |
              # Managed by ansible (log-server-apply.yml) — DO NOT EDIT BY HAND
              {{ siem_log_root }}/*/*.log {
                  daily
                  rotate {{ siem_logrotate_rotate }}
                  maxage {{ siem_logrotate_maxage }}
                  missingok
                  notifempty
                  compress
                  delaycompress
                  sharedscripts
                  postrotate
                      systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true
                  endscript
              }

        - name: "Step 5: Validate the effective rsyslog config (rsyslogd -N1)"
          ansible.builtin.command: rsyslogd -N1 -f /etc/rsyslog.conf
          register: rsyslog_syntax
          changed_when: false
          failed_when: rsyslog_syntax.rc != 0

        - name: "Step 6: Ensure rsyslog enabled + started (spec C2, C5)"
          tags: [C2, C5]
          ansible.builtin.systemd:
            name: rsyslog
            state: started
            enabled: true

        # A confined rsyslogd that was refused the log root keeps that dynaFile
        # action failed and its imtcp queue full until it restarts (captured
        # 2026-10-15: after reloading the AppArmor profile, nothing landed
        # until rsyslog restarted), so a new AppArmor rule or SELinux label
        # restarts it too.
        - name: "Step 6a: Restart rsyslog only if the receiver config, its SELinux port label or its log-root access changed"
          tags: [C2, C5, C6, C7, C8]
          ansible.builtin.systemd:
            name: rsyslog
            state: restarted
          when: >-
            ((siem_receiver_conf_result | default({})) is changed)
            or ((rsyslog_selinux_port_label | default({})) is changed)
            or ((rsyslog_apparmor_local | default({})) is changed)
            or ((rsyslog_selinux_relabel | default({})) is changed)

        - name: "Step 6a: Best-effort firewall opening — ufw (Debian)"
          when: ansible_os_family == "Debian"
          block:
            - name: "Check ufw status"
              ansible.builtin.command: ufw status
              register: ufw_status
              changed_when: false
              failed_when: false

            - name: "Open 514/tcp (only if ufw is active)"
              ansible.builtin.command: "ufw allow {{ siem_receiver_tcp_port }}/tcp"
              when: "'Status: active' in ufw_status.stdout"

        - name: "Step 6b: Best-effort firewall opening — firewalld (RedHat)"
          when: ansible_os_family == "RedHat"
          block:
            - name: "Check firewalld state"
              ansible.builtin.command: firewall-cmd --state
              register: firewalld_state
              changed_when: false
              failed_when: false

            - name: "Open 514/tcp (only if firewalld is running)"
              ansible.posix.firewalld:
                port: "{{ siem_receiver_tcp_port }}/tcp"
                permanent: true
                immediate: true
                state: enabled
              when: firewalld_state.stdout == "running"

      rescue:
        - name: "ROLLBACK — remove siem receiver drop-in config"
          tags: [always]
          ansible.builtin.file:
            path: "{{ siem_receiver_conf }}"
            state: absent

        - name: "ROLLBACK — remove siem logrotate config"
          tags: [always]
          ansible.builtin.file:
            path: "{{ siem_logrotate_conf }}"
            state: absent

        - name: "ROLLBACK — restart rsyslog with the drop-ins removed"
          tags: [always]
          ansible.builtin.systemd:
            name: rsyslog
            state: restarted

        - name: "ROLLBACK — surface the original failure"
          tags: [always]
          ansible.builtin.fail:
            msg: >-
              log-server apply failed (see task output above); the siem
              receiver drop-in configs were removed and rsyslog restarted
              back to its pre-apply state. Fix the failing task and re-run.
