---
# Security-only patching; native failures are fatal. Policy is restored on
# failure, but packages already updated require an external snapshot/backup.
# See docs/verification/os-patch-sla.md for stage and self-attestation policy.
- name: OS patch SLA apply (stage={{ patch_stage }}, target={{ target_group | default(patch_stage) }})
  hosts: "{{ target_group | default(patch_stage) }}"
  become: true
  gather_facts: true
  # target_group is intentionally NOT declared in play vars: a play var would
  # shadow the `hosts:` default above (issue #177), so -e patch_stage=staging|prod
  # (all that pilot deploy / site.yml pass) would still select `sandbox`. Only an
  # explicit -e target_group= overrides; otherwise the group is named by patch_stage.
  vars:
    patch_stage: sandbox
    unattended_origins: "{{ os_patch_security_origins.stdout | from_json }}"
    os_patch_policy_path: /etc/apt/apt.conf.d/99pilot-security-upgrades
    os_patch_policy_content: |
      # Managed by pilot: only trusted security archives for this release.
      #clear Unattended-Upgrade::Allowed-Origins;
      #clear Unattended-Upgrade::Origins-Pattern;
      Unattended-Upgrade::Allowed-Origins {
      {% for origin in unattended_origins %}
          "{{ origin }}";
      {% endfor %}
      };
      Unattended-Upgrade::DevRelease "false";
      Unattended-Upgrade::MinimalSteps "true";
    reboot_if_needed: false
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168
  tasks:
    # docs/verification/os-patch-sla.md is explicitly Debian/Ubuntu-only
    # (title + §5 exception row C6: RHEL/CentOS uses dnf-automatic instead
    # of unattended-upgrades, "暫停支援" — paused, not yet implemented).
    # Every task below is apt/unattended-upgrades-specific, so without this
    # gate an EL host in target_group (e.g. a FreeIPA server sharing the
    # sandbox/staging/prod group with Debian hosts) would blow up on Step 1
    # with a confusing apt error instead of a clear "not supported" message.
    - name: "Gate: os-patch-sla only supports Debian/Ubuntu (RHEL/EL not yet implemented)"
      tags: [always]
      ansible.builtin.debug:
        msg: >-
          Skipping {{ inventory_hostname }}: os-patch-sla-apply.yml only
          supports Debian/Ubuntu (apt + unattended-upgrades).
          {{ ansible_distribution }} {{ ansible_distribution_version }}
          ({{ ansible_os_family }}) is RHEL/EL family, which
          docs/verification/os-patch-sla.md §5 documents as paused/not yet
          supported (needs dnf-automatic instead of unattended-upgrades).
          No changes made on this host.
      when: ansible_os_family != 'Debian'

    - name: "Gate: end play here for non-Debian hosts"
      tags: [always]
      ansible.builtin.meta: end_host
      when: ansible_os_family != 'Debian'

    - name: "Gate: patch_stage must be sandbox|staging|prod"
      tags: [always]
      ansible.builtin.assert:
        that:
          - patch_stage in ['sandbox', 'staging', 'prod']
        fail_msg: "patch_stage={{ patch_stage }} invalid. Use sandbox|staging|prod."
    - name: "Gate: staging/prod requires explicit confirm"
      tags: [always]
      ansible.builtin.assert:
        that:
          - (patch_stage == 'sandbox') or
            (patch_stage == 'staging' and confirm_staging | bool) or
            (patch_stage == 'prod' and confirm_prod | bool)
        fail_msg: "patch_stage={{ patch_stage }} but confirm flag is false. Pass -e confirm_staging=true / confirm_prod=true to actually patch."
    - name: "Gate: patch_stage must match this host's inventory environment group"
      tags: [always]
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and patch_stage != 'prod')
          - not ('staging' in group_names and patch_stage != 'staging')
          - not (patch_stage in ['staging', 'prod'] and patch_stage not in group_names)
        fail_msg: >-
          patch_stage={{ patch_stage }} 與 {{ inventory_hostname }} 的 inventory 環境
          group 不一致(group_names: {{ group_names }})。inventory 的 staging/prod
          group 只是給 target_group 篩選用的標籤,不會自動決定 patch_stage——必須自己
          帶對的 -e patch_stage=,且要跟這台機器所屬的環境 group 一致。
    - name: "Gate: prod requires recent staging attestation"
      tags: [always]
      ansible.builtin.assert:
        that:
          # Operator self-attestation age, not an automated observation.
          - (staging_attested_within_hours | int) >= 0
          - (staging_attested_within_hours | int) <= 168
        fail_msg: "prod gate: no staging attestation within 168h; re-attest staging or specify -e staging_attested_within_hours=..."
      when: patch_stage == 'prod'

    - name: "Step 1: Refresh apt cache"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # Presence is read with dpkg-query (not package_facts): `db:Status-Status`
    # is exactly `installed` for a usable package, while a removed-but-not-
    # purged one (`config-files`) also makes plain `dpkg-query -W` exit 0.
    # check_mode: false because a command is skipped under --check and the
    # gates below need a real answer; it only reads dpkg's database.
    - name: "Step 1b: Read whether the unattended-upgrades package is installed (spec C8)"
      ansible.builtin.command:
        argv: [dpkg-query, -W, -f, "${db:Status-Status}", unattended-upgrades]
      register: uu_pkg_probe
      changed_when: false
      failed_when: uu_pkg_probe.rc not in [0, 1]
      check_mode: false

    - name: "Step 1b: Record unattended-upgrades presence"
      ansible.builtin.set_fact:
        unattended_upgrades_present: "{{ (uu_pkg_probe.stdout | default('') | trim) == 'installed' }}"

    # Not included under --check: the shared include runs real apt-get
    # update / download-only probes (check_mode: false inside), so a
    # preview must not touch the network or apt locks. The play has no tags,
    # so the include needs no apply.tags; the file:/apply: form is the one
    # TestAptPackageInstallCallSitesUseApplyTags expects.
    - name: "Step 1c: Install unattended-upgrades (strict apt policy, spec C8)"
      ansible.builtin.include_tasks:
        file: tasks/apt-package-install.yml
      vars:
        pilot_apt_packages: [unattended-upgrades]
        pilot_apt_policy: strict
        pilot_apt_component: os-patch-sla
        pilot_apt_required_sources:
          - id: ubuntu-os
            class: os
      when:
        - not ansible_check_mode
        - not (unattended_upgrades_present | bool)

    - name: "Step 1d: Re-read unattended-upgrades presence after the install"
      ansible.builtin.command:
        argv: [dpkg-query, -W, -f, "${db:Status-Status}", unattended-upgrades]
      register: uu_pkg_probe_after
      changed_when: false
      failed_when: uu_pkg_probe_after.rc not in [0, 1]
      check_mode: false
      when: not ansible_check_mode

    - name: "Step 1d: Record presence after the install, and whether the steps that need the package can run"
      ansible.builtin.set_fact:
        unattended_upgrades_present: >-
          {{ ((uu_pkg_probe_after.stdout | default('') | trim) == 'installed')
             if not ansible_check_mode else (unattended_upgrades_present | bool) }}

    # Defined under --check too, so the handler can read it. A real run with
    # the package missing never gets past Step 1e.
    - name: "Step 1d: unattended-upgrades is usable (present, or this is a real run that has just installed it)"
      ansible.builtin.set_fact:
        unattended_upgrades_usable: "{{ (unattended_upgrades_present | bool) or not ansible_check_mode }}"

    - name: "Step 1e: Fail closed when the package is still missing after the install"
      ansible.builtin.assert:
        that:
          - unattended_upgrades_present | bool
        fail_msg: >-
          unattended-upgrades is not installed on {{ inventory_hostname }}
          after Step 1c (dpkg status: {{ uu_pkg_probe_after.stdout | default('') | trim | default('absent', true) }}).
          Steps 3-5 need the package; without it unattended-upgrade is
          missing and the service unit does not exist (spec C8).
      when: not ansible_check_mode

    - name: "Step 2a: Discover trusted native security archives"
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import apt, json, platform
            r = platform.freedesktop_os_release()
            d = r["ID"].capitalize()
            c = apt.Cache()
            origins = {o.origin + ":" + o.archive
                       for p in c for v in p.versions for o in v.origins
                       if o.trusted and o.origin == d and
                       (o.archive == r["VERSION_CODENAME"] + "-security" if d == "Ubuntu"
                        else o.codename == r["VERSION_CODENAME"] + "-security" and o.label == "Debian-Security")}
            print(json.dumps(sorted(origins)))
      register: os_patch_security_origins
      changed_when: false
      check_mode: false

    - name: "Gate: origins must be a nonempty subset of native trusted security archives"
      ansible.builtin.assert:
        that:
          - unattended_origins is sequence and unattended_origins is not string
          - unattended_origins | length > 0
          - unattended_origins | difference(os_patch_security_origins.stdout | from_json) | length == 0
        fail_msg: "unattended_origins must select trusted security origins from current apt metadata; refresh metadata before applying."
      when: not ansible_check_mode or (os_patch_security_origins.stdout | from_json | length > 0)

    - name: "Step 2b: Read the managed policy before mutation"
      ansible.builtin.stat:
        path: "{{ os_patch_policy_path }}"
      register: os_patch_policy_before

    - name: "Step 2c: Read the existing managed policy bytes"
      ansible.builtin.slurp:
        src: "{{ os_patch_policy_path }}"
      register: os_patch_policy_bytes
      when: os_patch_policy_before.stat.exists

    - name: "Step 2d: Snapshot the previous managed policy before changing it"
      ansible.builtin.copy:
        content: "{{ os_patch_policy_bytes.content | b64decode }}"
        dest: /etc/apt/99pilot-security-upgrades.pre-os-patch-sla.bak
        owner: root
        group: root
        mode: '0600'
      when:
        - os_patch_policy_before.stat.exists
        - (os_patch_policy_bytes.content | b64decode) != os_patch_policy_content

    - name: "Apply security policy and updates; restore policy on failure"
      block:
        - name: "Step 5: Install security-only policy before unattended-upgrade"
          ansible.builtin.copy:
            dest: "{{ os_patch_policy_path }}"
            owner: root
            group: root
            mode: '0644'
            content: "{{ os_patch_policy_content }}"
          notify: restart unattended-upgrades
          when: unattended_origins | length > 0

        - name: "Step 2e: Validate the effective native security policy"
          ansible.builtin.shell: >-
            /usr/bin/python3 -c 'import apt, apt_pkg, platform; r=platform.freedesktop_os_release(); d=r["ID"].capitalize(); c=apt.Cache(); want={o.origin+":"+o.archive for p in c for v in p.versions for o in v.origins if o.trusted and o.origin==d and (o.archive==r["VERSION_CODENAME"]+"-security" if d=="Ubuntu" else o.codename==r["VERSION_CODENAME"]+"-security" and o.label=="Debian-Security")}; a=apt_pkg.config.value_list("Unattended-Upgrade::Allowed-Origins"); p=apt_pkg.config.value_list("Unattended-Upgrade::Origins-Pattern"); print(a,p,sorted(want)); raise SystemExit(not want or not a or not set(a).issubset(want) or bool(p))'
          changed_when: false
          when: not ansible_check_mode

        - name: "Step 2: Capture pre-upgrade package set"
          ansible.builtin.command:
            argv: [dpkg-query, -W, -f, "${binary:Package}\t${db:Status-Status}\t${Version}\n"]
          register: pre_upgrade_pkgs
          changed_when: false
          when: not ansible_check_mode

        - name: "Step 3: Run unattended-upgrades in non-interactive mode (security only)"
          ansible.builtin.command:
            argv: [unattended-upgrade, --debug]
          environment:
            DEBIAN_FRONTEND: noninteractive
          register: uu_run
          changed_when: false
          when:
            - unattended_upgrades_usable | bool
            - not ansible_check_mode

        - name: "Step 3c: Capture post-upgrade package set and report actual package changes"
          ansible.builtin.command:
            argv: [dpkg-query, -W, -f, "${binary:Package}\t${db:Status-Status}\t${Version}\n"]
          register: post_upgrade_pkgs
          changed_when: pre_upgrade_pkgs.stdout != post_upgrade_pkgs.stdout
          when: not ansible_check_mode

        - name: "Step 3d: Fail closed if security upgrades remain"
          ansible.builtin.shell: >-
            /usr/bin/python3 -c 'import apt, apt_pkg; c=apt.Cache(); n=sum(p.is_installed and any(apt_pkg.version_compare(v.version,p.installed.version)>0 and any(o.archive.endswith("-security") for o in v.origins) for v in p.versions) for p in c); print(n); raise SystemExit(n != 0)'
          changed_when: false
          when: not ansible_check_mode

        - name: "Step 4 (check mode): unattended-upgrades is not installed, so there is no unit to preview"
          ansible.builtin.debug:
            msg: >-
              Check mode: unattended-upgrades is not installed; apply will install
              the package and start and enable the service. No upgrades run in preview.
          when: not (unattended_upgrades_usable | bool)

        - name: "Step 4: Ensure unattended-upgrades is enabled + timer active"
          ansible.builtin.systemd:
            name: unattended-upgrades
            state: started
            enabled: true
          when: unattended_upgrades_usable | bool

      rescue:
        - name: "Restore existing managed policy after failure"
          ansible.builtin.copy:
            content: "{{ os_patch_policy_bytes.content | b64decode }}"
            dest: "{{ os_patch_policy_path }}"
            owner: "{{ os_patch_policy_before.stat.uid }}"
            group: "{{ os_patch_policy_before.stat.gid }}"
            mode: "{{ os_patch_policy_before.stat.mode }}"
          when: os_patch_policy_before.stat.exists

        - name: "Remove newly created managed policy after failure"
          ansible.builtin.file:
            path: "{{ os_patch_policy_path }}"
            state: absent
          when: not os_patch_policy_before.stat.exists

        - name: "Fail after restoring policy; package rollback requires external recovery"
          ansible.builtin.fail:
            msg: >-
              OS security patching failed: {{ ansible_failed_result.msg | default('native operation failed') }}
              (rc={{ ansible_failed_result.rc | default('n/a') }}).
              Managed policy restored; already updated packages are not rolled back.

  post_tasks:
    - name: "Step 6: Observe general updates independently of security convergence"
      ansible.builtin.shell: >-
        /usr/bin/python3 -c 'import apt; c=apt.Cache(); print("general-updates=" + str(sum(p.is_upgradable for p in c)))'
      changed_when: false
      check_mode: false

    - name: "Step 7: Reboot if required (sandbox/staging only)"
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - reboot_if_needed | bool
        - patch_stage != 'prod'

  handlers:
    - name: restart unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: restarted
      when: unattended_upgrades_usable | bool
