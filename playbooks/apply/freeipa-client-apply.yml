# Apply playbook for docs/verification/freeipa-client.md
#
# Enrolls an UBUNTU host into an existing FreeIPA realm (see
# freeipa-server-apply.yml) so that FreeIPA becomes this host's source of:
#   * Authentication — Kerberos + LDAP identities via SSSD (getent/id/kinit).
#   * Authorization   — HBAC (who may log in here) + centrally-defined sudo
#                       rules (SSSD ipa sudo provider).
#   * Audit/Accounting— host has a Kerberos machine identity so its actions
#                       are attributable on the IPA KDC; the local audit
#                       daemon (auditd) captures the login/sudo events that
#                       FreeIPA authorizes.
#
# Client-first-on-Ubuntu (spec §1): package is apt `freeipa-client`, which
# provides `ipa-client-install` and pulls in sssd + krb5. EL clients would use
# `dnf install ipa-client`; only the package-install task differs — the
# enrollment + SSSD wiring is identical, so this playbook gates on the OS
# family and installs the right package.
#
# No SRV-based KDC discovery in this pilot: we always pass --server /
# --domain / --realm explicitly and pin the server FQDN in /etc/hosts,
# whether or not the selected FreeIPA server runs native DNS.
# NO NTP here (--no-ntp): time sync is owned by the existing `ntp`(chrony)
# role; Kerberos needs clock skew < 5 min — asserted/warned below.
#
# Host DNS registration (spec.md: freeipa-client-host-dns-registration):
# when the selected FreeIPA server provides native DNS (freeipa_setup_dns,
# see freeipa-dns-client-apply.yml's own hostvars-walk convention), this
# playbook also registers this client's own A/AAAA record in FreeIPA's
# authoritative DNS as part of enrollment (--ip-address=) or, for an
# already-enrolled host, backfills it via an idempotent kinit + dnsrecord-add
# (tasks/freeipa-client-host-dns.yml, tagged C11). This is host-enrollment
# lifecycle DNS, not the freeipa-dns.yaml service-DNS manifest — do not add
# per-client entries there (spec.md §2.3).
#   freeipa_client_register_dns    : bool, default = selected server's
#                                    freeipa_setup_dns when unset
#   freeipa_client_dns_addresses   : explicit address list; falls back to
#                                    ansible_default_ipv4.address
#
# Secrets: ipa_admin_password (the enrollment principal's password) comes from
# a vault file, NEVER hard-coded (and the enroll task is no_log):
#   -e @~/.vault/main.yaml
#
# Usage:
#
#   ansible-playbook -i inventory-freeipa.yaml \
#       playbooks/apply/freeipa-client-apply.yml \
#       -e ipa_server_ip=10.0.0.10 \
#       -e @~/.vault/main.yaml \
#       --check --diff
#
#   # against a pilot vm-target (host lives in group `all`, not freeipa-client):
#   pilot vm-target run --name freeipa-client playbooks/apply/freeipa-client-apply.yml \
#       -e target_group=all -e ipa_server_ip=<server-vm-ip> \
#       -e @~/.vault/main.yaml
#
# Stage gating (same convention as freeipa-server-apply.yml):
#   sandbox  default; runs immediately
#   staging  requires -e confirm_staging=true
#   prod     requires -e confirm_prod=true AND staging_attested_within_hours<=168
---
- name: FreeIPA client enroll
  hosts: "{{ target_group | default('freeipa-client') }}"
  become: true
  # Deliberately NOT `gather_facts: true`: this repo's ansible.cfg enables
  # fact_caching (jsonfile, 1h TTL) for speed across ordinary site-wide
  # deploys. That is fine for most roles, but this playbook's whole Day-2
  # IP-replacement premise (docs/superpowers/specs/2026-09-02-freeipa-
  # client-host-dns-ip-replacement-spec.md) is detecting the host's
  # CURRENT ansible_default_ipv4.address — a stale cache entry from a
  # pre-migration run would silently make "desired" equal the OLD address
  # again, masking a real IP change instead of detecting it (confirmed
  # live: a rerun against a freshly-migrated host reused the prior IP from
  # cache and produced a false NOOP). An explicit `setup` task always
  # executes for real (unlike the implicit gather-facts optimization, it is
  # never skipped by the fact cache), so this play always sees the host's
  # true current state.
  gather_facts: false
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168

    # Realm coordinates — MUST match the FreeIPA server (freeipa-server.md §1.5).
    # Overridable from group_vars/freeipa.yml (freeipa_domain / freeipa_realm /
    # freeipa_server_fqdn); defaults preserve original behaviour. Keep these in
    # sync with the server by setting them ONCE in a shared group_vars file.
    ipa_domain: "{{ freeipa_domain | default('ipa.pilot.internal') }}"
    # Auto-resolve the FreeIPA server's IP from this inventory's
    # freeipa-server group when not explicitly passed via -e/group_vars —
    # same "explicit overrides inventory-derived, else empty" idiom as
    # audit-log-forwarding-apply.yml's siem_forward_inventory_host. The old
    # `default(ansible_host)` fallback silently resolved to THIS (client)
    # host's own IP instead of the server's, pinning the server FQDN to the
    # wrong address in /etc/hosts and failing ipa-client-install — the
    # required-vars gate below never caught it because ansible_host is
    # always defined and non-empty (runbook v4.2 real bug #13).
    ipa_server_inventory_ip: >-
      {{ (hostvars[groups['freeipa-server'][0]].ansible_host | default('', true))
         if (groups['freeipa-server'] | default([]) | length > 0)
         else '' }}
    ipa_server_ip: "{{ freeipa_server_ip | default('', true) or ipa_server_inventory_ip }}"
    ipa_realm: "{{ freeipa_realm | default(ipa_domain | upper) }}"
    ipa_server_fqdn: "{{ freeipa_server_fqdn | default('ipa1.' ~ ipa_domain) }}"

    # Enrollment principal — reuses the same admin creds as the server vault.
    ipa_enroll_principal: admin
    ipa_enroll_password: "{{ ipa_admin_password }}"

    # This client's own FQDN (must be a resolvable, non-loopback name). Default
    # derives from the host's short name under the realm domain.
    ipa_client_fqdn: "{{ ansible_hostname | lower }}.{{ ipa_domain }}"

    ipa_config_marker: /etc/ipa/default.conf   # created iff already enrolled
    ipa_enroll_timeout_s: 300

    # Host DNS registration inputs (spec.md freeipa-client-host-dns-registration).
    # freeipa_client_register_dns left UNSET on purpose: the effective value is
    # computed in pre_tasks from the selected FreeIPA server's freeipa_setup_dns
    # when the operator hasn't set it explicitly (spec.md §4.2/§7).
    freeipa_client_dns_addresses: []
    # Record name relative to the zone (`dnsrecord-add <zone> <name> ...` wants
    # the short label, not the FQDN) — reused by both enrollment planning and
    # the existing-client backfill path below.
    ipa_client_dns_record_name: "{{ ipa_client_fqdn | regex_replace('\\.' ~ (ipa_domain | regex_escape) ~ '$', '') }}"

    # Ubuntu package that provides ipa-client-install (EL uses ipa-client).
    ipa_client_packages_debian: [freeipa-client]
    ipa_client_packages_redhat: [ipa-client]
    # Local host-audit daemon (the "audit/accounting" leg of AAA).
    ipa_audit_packages_debian: [auditd]
    ipa_audit_packages_redhat: [audit]

  pre_tasks:
    - name: "FreeIPA client — gather fresh facts (bypasses fact_caching; see gather_facts: false note above)"
      ansible.builtin.setup:
      tags: [always]

    - name: "Gate: required vars present (fail early, before any mutation)"
      ansible.builtin.assert:
        that:
          - ipa_admin_password is defined and ipa_admin_password | length >= 8
          - ipa_server_ip is defined and ipa_server_ip | length > 0
        fail_msg: >-
          Missing required vars. Pass -e ipa_server_ip=<FreeIPA server IP> and a
          vault file with ipa_admin_password (>=8 chars), e.g. -e @~/.vault/main.yaml
      tags: [always]

    - name: "Gate: supported client OS (Debian/Ubuntu primary; EL also handled)"
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'RedHat']
        fail_msg: >-
          freeipa-client-apply supports Debian/Ubuntu (apt freeipa-client) and
          Enterprise Linux (dnf ipa-client). Detected {{ ansible_distribution }}
          {{ ansible_distribution_version }} ({{ ansible_os_family }}).
      tags: [always]

    # Server pool + HA/single topology mode (docs/tmp/now/freeipa-client-ha-spec.md
    # §3): computes freeipa_server_pool(_active)/freeipa_server_fqdns/
    # freeipa_server_ips/freeipa_dns_server_ips/freeipa_client_topology_mode_effective
    # from inventory role-group membership. In single mode (the default when
    # there is no freeipa-server-replica host) this collapses to exactly one
    # FQDN — the same primary this playbook has always enrolled against —
    # so existing single-server inventories see no behavior change.
    # freeipa-server-pool.yml's own contract input is the RAW freeipa_domain
    # var (shared verbatim by every consumer); this playbook's `ipa_domain`
    # has already resolved it against the built-in default, so pass that
    # resolved value through explicitly — otherwise a deployment that never
    # sets freeipa_domain anywhere would leave it genuinely undefined and
    # error inside the included task's Jinja (`'ipa1.' ~ freeipa_domain`).
    # MUST go through an intermediate set_fact under a DISTINCT name first:
    # passing `vars: {freeipa_domain: "{{ ipa_domain }}"}` directly on the
    # include_tasks call creates a same-named shadow of `freeipa_domain`
    # inside the included task's scope, and `ipa_domain` is ITSELF defined
    # as `{{ freeipa_domain | default(...) }}` — Jinja then re-resolves
    # `ipa_domain` under the NEW local `freeipa_domain`, which points back
    # at `ipa_domain`: infinite recursion (confirmed live: "Recursive loop
    # detected in template: maximum recursion depth exceeded"). A concrete
    # fact (evaluated once, no longer a lazy template) breaks the cycle.
    - name: "FreeIPA server pool — resolve domain input for the shared task (avoid var-name collision)"
      ansible.builtin.set_fact:
        freeipa_server_pool_domain_input: "{{ ipa_domain }}"
      tags: [always]

    - name: "FreeIPA server pool — compute desired pool + effective topology mode"
      ansible.builtin.include_tasks:
        file: tasks/freeipa-server-pool.yml
        apply:
          tags: [always]
      vars:
        freeipa_domain: "{{ freeipa_server_pool_domain_input }}"
      tags: [always]

    # Control-plane admin endpoint selection (spec §13): lets THIS
    # playbook's own `ipa` CLI mutations/reads target a live, reachable
    # pool member instead of always hitting whatever
    # /etc/ipa/default.conf happens to point at (Phase 0 confirmed live
    # that stays pinned to a single server even after HA client
    # enrollment).
    - name: "FreeIPA admin endpoint — select a live server for this playbook's own ipa CLI calls"
      ansible.builtin.include_tasks:
        file: tasks/freeipa-admin-endpoint-select.yml
        apply:
          tags: [always]
      tags: [always]

    # freeipa-client-host-dns.yml's authoritative-DNS reads (plan/apply/
    # verify) redirect to this same selected endpoint's IP instead of
    # always querying the primary (spec §12's "not綁死 primary" concern) —
    # confirmed live: with the primary stopped, the OLD hard-coded
    # `dig @{{ ipa_server_ip }}` failed the plan-phase's own fail-closed
    # gate ("Cannot verify the authoritative DNS state"), blocking even a
    # plain DNS backfill ADD that a surviving replica could have answered.
    # Deliberately does NOT implement §12's full "compare >=2 authorities,
    # fail closed on replication-lag disagreement" split-brain guard — that
    # requires touching this file's existing CAS/TOCTOU/identity-proof
    # state machine (Day-2 IP-replacement spec), which is a large, already
    # heavily-tested surface; out of scope for this pass, see
    # docs/tmp/now/freeipa-client-ha-spec.md's Phase 5 section.
    - name: "FreeIPA client DNS — resolve which authority IP to read from (redirects off the primary-only default)"
      ansible.builtin.set_fact:
        freeipa_dns_read_authority_ip: >-
          {{
            (freeipa_server_pool_active
             | selectattr('fqdn', 'equalto', freeipa_admin_server_fqdn)
             | map(attribute='ip') | list | first)
            | default(ipa_server_ip, true)
          }}
      tags: [always]

    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or
            (stage == 'staging' and confirm_staging | bool) or
            (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm flag. Pass -e confirm_staging=true or confirm_prod=true."
      tags: [always]

    - name: "Gate: stage must match this host's inventory environment group"
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。inventory 的 staging/prod group 只是給
          target_group 篩選用的標籤,不會自動決定 stage——必須自己帶對的 -e stage=,
          且要跟這台機器所屬的環境 group 一致。
      tags: [always]

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
        fail_msg: "prod gate: staging attestation missing or older than 168h."
      when: stage == 'prod'
      tags: [always]

    - name: "Pre-condition: chrony/NTP active (Kerberos needs clock skew < 5min)"
      ansible.builtin.command: systemctl is-active chronyd ntpd systemd-timesyncd
      register: ipa_ntp_check
      changed_when: false
      failed_when: false
      tags: [always]

    - name: "Warn if no active time sync (client enrolls with --no-ntp; ntp role must cover this)"
      ansible.builtin.debug:
        msg: >-
          WARNING: no active time sync on this host ({{ ipa_ntp_check.stdout | default('') }}).
          The client enrolls with --no-ntp; apply the `ntp`(chrony) role first or Kerberos
          auth will fail on clock skew (> 5 min).
      when: "'active' not in (ipa_ntp_check.stdout | default(''))"
      tags: [always]

    # Enrollment + keytab probe, moved here (ahead of both the DNS plan
    # include below and the /etc/hosts pin) per docs/superpowers/specs/
    # 2026-09-02-freeipa-client-host-dns-ip-replacement-spec.md §6.2: the
    # Day-2 replacement identity proof needs to know whether this host is
    # already enrolled BEFORE the DNS plan phase decides whether a
    # replacement is even a candidate, and the installer gate later in
    # tasks: reuses this SAME registered result rather than probing twice.
    - name: "FreeIPA client — detect prior enrollment ({{ ipa_config_marker }})"
      ansible.builtin.stat:
        path: "{{ ipa_config_marker }}"
      register: ipa_cfg
      tags: [freeipa-client, C1, C11]

    - name: "FreeIPA client — detect host Kerberos keytab presence (read-only, Day-2 spec §6.1)"
      ansible.builtin.stat:
        path: /etc/krb5.keytab
      register: ipa_client_dns_keytab_stat
      tags: [freeipa-client, C1, C11]

    # The DNS preflight below queries authoritative DNS with dig. A fresh
    # AlmaLinux 9 image has no bind-utils: the first dig returned rc=127 and
    # the fail-closed gate stopped every fresh EL client before enrollment
    # (2026-09-24 vm-target run). Ubuntu images ship dig (bind9-dnsutils), so
    # this never showed there. Installing the query tool is the only change
    # made before the preflight; it does not touch DNS or enrollment state.
    # A check-mode preview on a host without dig ends here with a message
    # (AGENTS.md §4.5 point 4); the real run installs it and continues.
    - name: "FreeIPA client DNS — check whether dig is installed (read-only)"
      ansible.builtin.command:
        argv: [sh, -c, "command -v dig"]
      register: ipa_client_dns_dig_probe
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [freeipa-client, C11]

    - name: "FreeIPA client DNS — install dig for the preflight (RedHat)"
      ansible.builtin.dnf:
        name: bind-utils
        state: present
      when:
        - ansible_os_family == 'RedHat'
        - not ansible_check_mode
        - ipa_client_dns_dig_probe.rc != 0
      tags: [freeipa-client, C11]

    - name: "FreeIPA client DNS — install dig for the preflight (Debian)"
      ansible.builtin.include_tasks:
        file: tasks/apt-package-install.yml
        apply:
          tags: [freeipa-client, C11]
      vars:
        pilot_apt_packages: [bind9-dnsutils]
        pilot_apt_policy: tolerant
        pilot_apt_component: freeipa-client-dig
        pilot_apt_required_sources:
          - id: ubuntu-os
            class: os
      when:
        - ansible_os_family == 'Debian'
        - not ansible_check_mode
        - ipa_client_dns_dig_probe.rc != 0
      tags: [freeipa-client, C11]

    - name: "FreeIPA client DNS — check-mode preview without dig ends here"
      when:
        - ansible_check_mode
        - ipa_client_dns_dig_probe.rc != 0
      tags: [freeipa-client, C11]
      block:
        - name: "FreeIPA client DNS — explain why the preview stops"
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} has no dig yet, so the authoritative DNS
              preflight cannot run in check mode. The real run installs
              {{ 'bind-utils' if ansible_os_family == 'RedHat' else 'bind9-dnsutils' }}
              first and then runs the preflight; nothing else is previewed for
              this host.

        - name: "FreeIPA client DNS — end the check-mode preview for this host"
          ansible.builtin.meta: end_host

    # Host DNS registration preflight (spec.md freeipa-client-host-dns-registration
    # §9/§16: "DNS preflight" must run before ANY mutation, including the
    # /etc/hosts pin below — hence pre_tasks, not tasks. All read-only.
    - name: "FreeIPA client DNS — resolve + preflight (plan, no mutation)"
      ansible.builtin.include_tasks:
        file: tasks/freeipa-client-host-dns.yml
        apply:
          tags: [freeipa-client, C11]
      vars:
        freeipa_client_dns_phase: plan
      tags: [freeipa-client, C11]

  tasks:
    # ipa-client-install needs this host's own FQDN to resolve to a
    # non-loopback address, and (with no DNS) it must resolve the SERVER FQDN
    # too. Pin BOTH in /etc/hosts BEFORE changing the hostname — otherwise the
    # moment the hostname becomes an FQDN that /etc/hosts can't resolve, every
    # `sudo` does a slow failing name lookup (~10–30s) and the next become task
    # times out with "waiting for privilege escalation prompt". Pinning first
    # keeps sudo fast throughout. The client FQDN must be the FIRST (canonical)
    # name for its IP.
    # Without this, the pins below are only correct until the next reboot —
    # cloud-init's own hosts-management module regenerates /etc/hosts from
    # its template on every boot and silently drops them again (see
    # cloud-init-freeipa-incident-report.md, 2026-08-18: yk-pro6k-dev-01/02/03).
    - name: "FreeIPA client — stop cloud-init from wiping our /etc/hosts pins on next boot"
      ansible.builtin.include_tasks:
        file: tasks/cloud-init-etc-hosts-guard.yml
        apply:
          tags: [freeipa-client, C1, C3]
      tags: [freeipa-client, C1, C3]

    - name: "FreeIPA client — pin this host {{ ipa_client_fqdn }} to its own IP in /etc/hosts (FQDN canonical)"
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '(?i)\s{{ ipa_client_fqdn | regex_escape }}(\s|$)'
        line: "{{ ansible_default_ipv4.address }} {{ ipa_client_fqdn }} {{ ipa_client_fqdn.split('.')[0] }}"
        state: present
        create: false
      tags: [freeipa-client, C1]

    # Legacy migration (spec §6.1): remove the OLD single unmarked primary
    # pin this playbook used to write, but ONLY when it matches EXACTLY the
    # legacy format for the CURRENT desired primary (same regex the old
    # task used to WRITE the line, anchored start-to-end) — never touch a
    # foreign or user-edited /etc/hosts entry.
    #
    # Gated on the pool-aware block NOT already existing: the block's own
    # per-member line for the primary renders as the SAME three-field text
    # this legacy regex targets (`<ip> <fqdn> <shortname>`), just inside the
    # marker block instead of standalone. Without this gate, the anchored
    # `^...$` regex can't tell "legacy standalone line" from "this exact
    # text sitting between the block markers" and deletes the block's own
    # primary entry every run — confirmed live: `changed` on every rerun,
    # oscillating between this task removing it and blockinfile re-adding
    # it. Once the block exists, migration is done; skip entirely rather
    # than risk reaching into it.
    - name: "FreeIPA client — /etc/hosts migration: check whether the pool-aware block already exists"
      ansible.builtin.command:
        argv: [grep, -qF, "BEGIN PILOT FREEIPA SERVER POOL", /etc/hosts]
      register: freeipa_hosts_pool_block_present
      changed_when: false
      failed_when: false
      tags: [freeipa-client, C3]

    - name: "FreeIPA client — /etc/hosts migration: remove legacy unmarked primary pin (spec §6.1)"
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^{{ ipa_server_ip | regex_escape }} {{ ipa_server_fqdn | regex_escape }} {{ ipa_server_fqdn.split(".")[0] | regex_escape }}$'
        state: absent
      when: freeipa_hosts_pool_block_present.rc != 0
      tags: [freeipa-client, C3]

    # Pool-aware managed block (spec §6): pins EVERY active pool member
    # (primary + replicas in ha mode; just the primary in single mode, which
    # collapses to the same single-line content the old task wrote — single
    # mode sees no functional change). Kept separate from this client's own
    # self-pin above, per spec §6's explicit "不要混入 server pool block".
    - name: "FreeIPA client — pin the FreeIPA server pool to /etc/hosts (pool-aware managed block, spec §6)"
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} PILOT FREEIPA SERVER POOL"
        block: |
          {% for member in freeipa_server_pool_active %}
          {{ member.ip }} {{ member.fqdn }} {{ member.fqdn.split('.')[0] }}
          {% endfor %}
        state: present
        create: false
      tags: [freeipa-client, C3]

    - name: "FreeIPA client — set system hostname to the client FQDN (after /etc/hosts pin so sudo stays fast)"
      ansible.builtin.hostname:
        name: "{{ ipa_client_fqdn }}"
      tags: [freeipa-client, C1]

    - name: "FreeIPA client — install ipa-client package (apt freeipa-client on Ubuntu)"
      ansible.builtin.include_tasks:
        file: tasks/apt-package-install.yml
        # `apply` is required: tags on a dynamic include_tasks gate only the
        # include statement itself, they are NOT inherited by the tasks it
        # pulls in (unlike a static import_tasks) — without this, running
        # `--tags C1` alone (a common per-row dev workflow, AGENTS.md §4)
        # silently skips the entire framework and installs nothing, with no
        # error (found via a live vm-target run testing this exact spec).
        apply:
          tags: [freeipa-client, C1]
      vars:
        pilot_apt_packages: "{{ ipa_client_packages_debian }}"
        pilot_apt_policy: tolerant
        pilot_apt_component: freeipa-client
        pilot_apt_required_sources:
          - id: ubuntu-os
            class: os
      when:
        - not ansible_check_mode
        - ansible_os_family == 'Debian'
      tags: [freeipa-client, C1]

    - name: "FreeIPA client — install ipa-client package (dnf ipa-client on EL)"
      ansible.builtin.dnf:
        name: "{{ ipa_client_packages_redhat }}"
        state: present
      when:
        - not ansible_check_mode
        - ansible_os_family == 'RedHat'
      tags: [freeipa-client, C1]

    # Debian through the apt framework, like C1/C8: a plain package install
    # uses whatever apt index the host already has and 404s when it is
    # stale (AGENTS.md §4.5 point 9).
    - name: "FreeIPA client — install host-audit daemon (auditd, Debian)"
      ansible.builtin.include_tasks:
        file: tasks/apt-package-install.yml
        apply:
          tags: [freeipa-client, C9]
      vars:
        pilot_apt_packages: "{{ ipa_audit_packages_debian }}"
        pilot_apt_policy: tolerant
        pilot_apt_component: freeipa-client-auditd
        pilot_apt_required_sources:
          - id: ubuntu-os
            class: os
      when:
        - not ansible_check_mode
        - ansible_os_family == 'Debian'
      tags: [freeipa-client, C9]

    - name: "FreeIPA client — install host-audit daemon (audit, RedHat)"
      ansible.builtin.package:
        name: "{{ ipa_audit_packages_redhat }}"
        state: present
      when:
        - not ansible_check_mode
        - ansible_os_family == 'RedHat'
      tags: [freeipa-client, C9]

    - name: "FreeIPA client — install SSSD cache tools (Debian)"
      ansible.builtin.include_tasks:
        file: tasks/apt-package-install.yml
        apply:
          tags: [freeipa-client, C8]
      vars:
        pilot_apt_packages: [sssd-tools]
        pilot_apt_policy: tolerant
        pilot_apt_component: freeipa-client-sssd-tools
        pilot_apt_required_sources:
          - id: ubuntu-os
            class: os
      when:
        - not ansible_check_mode
        - ansible_os_family == 'Debian'
      tags: [freeipa-client, C8]

    - name: "FreeIPA client — install SSSD cache tools (RedHat)"
      ansible.builtin.dnf:
        name: sssd-tools
        state: present
      when:
        - not ansible_check_mode
        - ansible_os_family == 'RedHat'
      tags: [freeipa-client, C8]

    # Bootstrap reachability gate (spec §5): read-only TCP/443 probe of every
    # ACTIVE pool member. This does NOT decide desired pool membership (that
    # stays fixed per freeipa-server-pool.yml) — it only fails fast with a
    # clear message when literally none are reachable, matching the installer's
    # own behavior (confirmed live in Phase 0: ipa-client-install probes every
    # --server given and silently drops an unreachable one from the resulting
    # config, succeeding as long as >=1 responds). Argv order below does NOT
    # need to be reachable-first — the installer already does its own per-
    # server connectivity check regardless of argv order.
    - name: "FreeIPA server pool — probe reachability (read-only, spec §5)"
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 443
        timeout: 5
        state: started
      loop: "{{ freeipa_server_pool_active }}"
      loop_control: {label: "{{ item.fqdn }}"}
      register: freeipa_server_pool_reachability
      ignore_errors: true
      when: not ansible_check_mode
      tags: [freeipa-client, C1]

    - name: "FreeIPA server pool — compute reachable subset"
      ansible.builtin.set_fact:
        freeipa_server_pool_reachable_fqdns: >-
          {{
            freeipa_server_pool_active
            | zip(freeipa_server_pool_reachability.results | default([]))
            | selectattr('1.failed', 'equalto', false)
            | map(attribute='0.fqdn')
            | list
          }}
      when: not ansible_check_mode
      tags: [freeipa-client, C1]

    - name: "Gate: at least one FreeIPA server pool member reachable before enrollment (spec §5)"
      ansible.builtin.assert:
        that:
          - (freeipa_server_pool_reachable_fqdns | default([]) | length) > 0
        fail_msg: >-
          None of the FreeIPA server pool members
          ({{ freeipa_server_pool_active | map(attribute='fqdn') | list }}) answered on
          TCP/443. Cannot enroll or reconcile this client.
      when: not ansible_check_mode
      tags: [freeipa-client, C1]

    # ipa-client-install is NOT idempotent (re-running on an enrolled host errors
    # "IPA client is already configured"). `creates:` makes this a no-op once
    # /etc/ipa/default.conf exists, so the playbook is idempotent by
    # construction. no_log: true keeps the enrollment password out of Ansible's
    # logs (it is still only ever supplied from vault).
    #   --server (repeated)       : one per active pool member (spec §4) —
    #                               single mode collapses to exactly one, byte-
    #                               for-byte the same as before this change.
    #   --domain/--realm          : explicit (no DNS SRV discovery in this pilot)
    #   --mkhomedir               : create home dirs for IPA users on first login
    #   --no-ntp                  : time sync owned by the ntp role
    #   --no-dns-sshfp            : SSHFP publication stays out of scope regardless
    #                               of A/AAAA host DNS registration (spec.md §3.2)
    #   --force-join              : recover cleanly if a stale host entry exists
    #
    # Deliberately does NOT pass --ip-address, contrary to spec.md §9.1's
    # original design. Live vm-target testing (2026-08-21) found that
    # --ip-address does NOT register DNS via a server-side host-add call —
    # it makes ipa-client-install itself attempt a client-side `nsupdate`
    # GSS-TSIG dynamic-DNS update (functionally the same class of mechanism
    # as the always-on dynamic-DNS-updates flag this feature deliberately
    # never defaults to — spec.md §2.2 — just scoped to these addresses
    # instead of every interface). That update requires the
    # client's OS resolver to already point at FreeIPA DNS to find the
    # authoritative server via SOA lookup — a DIFFERENT component's job
    # (freeipa-dns-client-apply.yml), which spec.md §18 explicitly keeps
    # independent of enrollment. Without it, nsupdate's SOA discovery walks
    # up to the real internet root servers and times out (~37s), logs
    # "ERROR Failed to update DNS records.", and creates nothing — confirmed
    # via `ipa dnsrecord-find` and `ipa host-show` showing no IP recorded at
    # all. So DNS registration always goes through the admin-kinit +
    # `dnsrecord-add` path below (tasks/freeipa-client-host-dns.yml, apply
    # phase) for BOTH a fresh enroll and an already-enrolled host — there is
    # no functional difference between "new" and "existing" once enrollment
    # itself has completed, so both converge on one registration mechanism.
    - name: "FreeIPA client — run ipa-client-install (enroll into {{ ipa_realm }})"
      ansible.builtin.command:
        argv: >-
          {{
            ['ipa-client-install', '-U']
            + (freeipa_server_fqdns | map('regex_replace', '^(.*)$', '--server=\1') | list)
            + [
              '--domain=' ~ ipa_domain,
              '--realm=' ~ ipa_realm,
              '--principal=' ~ ipa_enroll_principal,
              '--password=' ~ ipa_enroll_password,
              '--hostname=' ~ ipa_client_fqdn,
              '--mkhomedir',
              '--no-ntp',
              '--no-dns-sshfp',
              '--force-join',
            ]
          }}
        creates: "{{ ipa_config_marker }}"
      register: ipa_enroll
      no_log: true
      when: not ansible_check_mode
      tags: [freeipa-client, C2]

    # ipa-client-install on Ubuntu does NOT always wire nsswitch's `sudoers`
    # database or enable the SSSD `sudo` service the way it does on EL. Make
    # both explicit and idempotent so centrally-defined sudo rules resolve.
    - name: "FreeIPA client — route sudoers lookups through SSSD (nsswitch)"
      ansible.builtin.lineinfile:
        path: /etc/nsswitch.conf
        regexp: '^sudoers:'
        line: "sudoers:        files sss"
        state: present
        create: true
        mode: "0644"
      when: not ansible_check_mode
      tags: [freeipa-client, C7]

    # Deliberately does NOT list "sudo" here. SSSD >= 2.3 socket-activates the
    # sudo responder (sssd-sudo.socket, enabled by the package by default) —
    # putting "sudo" in `services=` too is a documented misconfiguration:
    # `sssd_check_socket_activated_responders` refuses to start the socket
    # ("Misconfiguration found for the sudo responder ... still mentioned in
    # the services' line"), the responder never comes up, and `sudo -l`
    # silently reports "not allowed" for every user — no error, just a wrong
    # answer. Confirmed live on Ubuntu 24.04 (sssd 2.9.4): adding "sudo" here
    # broke C8 end-to-end; removing it (socket activation handles the rest)
    # fixed it with no other change. nss/pam/ssh/autofs below are deliberately
    # explicit responders, so their matching socket units must be disabled
    # before SSSD is restarted; otherwise systemd starts a second copy and
    # `sssd_check_socket_activated_responders` fails with exit status 17.
    # Preserve the optional autofs responder installed by the NFS client role.
    # site.yml deliberately runs this base client role before the NFS overlay;
    # on later site runs, replacing the whole line with only nss/pam/ssh would
    # silently undo the already-configured automount integration.
    - name: "FreeIPA client — inspect the current SSSD services line"
      ansible.builtin.command:
        argv:
          - awk
          - -F=
          - '/^services[[:space:]]*=/{print $2; exit}'
          - /etc/sssd/sssd.conf
      register: ipa_sssd_services_current
      changed_when: false
      check_mode: false
      # A fresh-host preview predicts package/enrollment changes but cannot
      # read the SSSD file until the real ipa-client-install has created it.
      # The consumers below are also apply-only, so this probe is unnecessary
      # (and unsafe) during --check.
      when: not ansible_check_mode
      tags: [freeipa-client, C8]

    - name: "FreeIPA client — disable socket activation for explicit SSSD responders"
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - sssd-nss.socket
        - sssd-pam.socket
        - sssd-pam-priv.socket
        - sssd-ssh.socket
        - sssd-autofs.socket
      register: ipa_sssd_explicit_responder_sockets
      # EL distributions do not consistently ship these socket units; their
      # explicit responders remain valid, so a missing unit is not a failure.
      failed_when: false
      when:
        - not ansible_check_mode
        - ansible_os_family == 'Debian'
      tags: [freeipa-client, C8]

    - name: "FreeIPA client — clear stale SSSD responder socket failures"
      ansible.builtin.command:
        argv: [systemctl, reset-failed]
      changed_when: false
      when:
        - not ansible_check_mode
        - ansible_os_family == 'Debian'
      tags: [freeipa-client, C8]

    - name: "FreeIPA client — ensure SSSD's services line does not fight socket-activated sudo"
      ansible.builtin.lineinfile:
        path: /etc/sssd/sssd.conf
        regexp: '^services\s*='
        line: >-
          services = nss, pam, ssh{{ ', autofs'
          if 'autofs' in
          ((ipa_sssd_services_current.stdout | default(''))
          | split(',') | map('trim') | list) else '' }}
        state: present
        create: false
      register: ipa_sssd_services
      when: not ansible_check_mode
      tags: [freeipa-client, C8]

    - name: "FreeIPA client — ensure SSSD uses IPA as the sudo provider"
      ansible.builtin.lineinfile:
        path: /etc/sssd/sssd.conf
        regexp: '^sudo_provider\s*='
        line: "sudo_provider = ipa"
        insertafter: '^ipa_domain\s*='
        state: present
        create: false
      register: ipa_sssd_sudo_provider
      when: not ansible_check_mode
      tags: [freeipa-client, C8]

    # v3.2 §16 persistent SSSD client hardening: offline/cached
    # authentication policy. Both are optional host_vars (undefined ->
    # task skipped entirely, existing sssd.conf value left untouched —
    # matching this playbook's own "MAY be included" posture rather than
    # forcing an opinion every client must adopt). Persistent after one
    # shot: sssd.conf is a plain file SSSD itself enforces from then on,
    # no Pilot loop involved (spec.md §16's own "Allowed: Pilot applies
    # config once -> host service persistently enforces it" framing).
    #
    # Live IdM-unavailable verification (spec.md §16.3's "confirm the
    # outage behavior, not just the file content") is NOT part of this
    # delivery — same blocker v3.1 §17 hit and deferred (docs/superpowers/
    # specs/2026-08-27-pilot-roster-v3.2-identity-credential-hardening-spec.md
    # §16), and the same one this repo's own drift/hygiene work already
    # flagged as out of scope for a single-VM session. Confirmed live
    # ONLY that these lines land correctly in sssd.conf and SSSD restarts
    # cleanly with them present — not that a real network-partition
    # actually behaves as configured.
    - name: "FreeIPA client — set SSSD offline credential caching policy"
      ansible.builtin.lineinfile:
        path: /etc/sssd/sssd.conf
        regexp: '^cache_credentials\s*='
        line: "cache_credentials = {{ freeipa_client_sssd_cache_credentials | bool | ternary('True', 'False') }}"
        insertafter: '^ipa_domain\s*='
        state: present
        create: false
      register: ipa_sssd_cache_credentials
      when:
        - not ansible_check_mode
        - freeipa_client_sssd_cache_credentials is defined
      tags: [freeipa-client, sssd_hardening]

    - name: "FreeIPA client — set SSSD offline credentials expiration (days)"
      ansible.builtin.lineinfile:
        path: /etc/sssd/sssd.conf
        regexp: '^offline_credentials_expiration\s*='
        line: "offline_credentials_expiration = {{ freeipa_client_sssd_offline_credentials_expiration | int }}"
        insertafter: '^ipa_domain\s*='
        state: present
        create: false
      register: ipa_sssd_offline_credentials_expiration
      when:
        - not ansible_check_mode
        - freeipa_client_sssd_offline_credentials_expiration is defined
      tags: [freeipa-client, sssd_hardening]

    - name: "FreeIPA client — restart SSSD after wiring responders"
      ansible.builtin.systemd:
        name: sssd
        state: restarted
      when:
        - not ansible_check_mode
        - >-
          ipa_sssd_services is changed or
          ipa_sssd_sudo_provider is changed or
          ipa_sssd_cache_credentials is changed or
          ipa_sssd_offline_credentials_expiration is changed or
          (ipa_sssd_explicit_responder_sockets.results | default([]) |
           selectattr('changed', 'defined') | selectattr('changed') | list | length > 0)
      tags: [freeipa-client, C8]

    - name: "FreeIPA client — enable + start SSSD (survives reboot)"
      ansible.builtin.systemd:
        name: sssd
        state: started
        enabled: true
      when: not ansible_check_mode
      tags: [freeipa-client, C2]

    - name: "FreeIPA client — enable socket-activated sudo responder"
      ansible.builtin.systemd:
        name: sssd-sudo.socket
        enabled: true
        state: started
      when:
        - not ansible_check_mode
        - ansible_os_family == 'Debian'
      tags: [freeipa-client, C8]

    # ipa-client-install's own sshd drop-in (04-ipa.conf) only sets
    # ChallengeResponseAuthentication (the deprecated alias for
    # KbdInteractiveAuthentication) — it never touches PasswordAuthentication.
    # On Ubuntu (cloud image) sshd_config.d/ also ships a
    # 50-cloud-init.conf/60-cloudimg-settings.conf pair forcing
    # "PasswordAuthentication no". sshd's Include splices every matched file
    # in at the Include line, in glob (lexical) order, and then keeps only
    # the FIRST value seen for each directive across the whole expanded
    # config — so whichever of these sorts first wins, NOT whichever sorts
    # last. A drop-in name that sorts *after* 50-/60- (e.g. "99-...") is
    # silently ignored; ours must sort *before* them (but after 04-ipa.conf,
    # so it doesn't fight ipa-client-install's own file) to actually take
    # effect. Without this, a FreeIPA account with no SSH key yet (the
    # common case for a brand-new user) can never log in with a password at
    # all, regardless of HBAC.
    - name: "FreeIPA client — allow password/keyboard-interactive SSH (FreeIPA users may have no key yet)"
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/05-freeipa-client-password-auth.conf
        content: |
          # Managed by freeipa-client-apply.yml — do not edit by hand.
          # Cloud-image defaults (50-cloud-init.conf / 60-cloudimg-settings.conf)
          # and the base sshd_config both disable password/keyboard-interactive
          # auth; FreeIPA accounts with no SSH key need it to log in at all.
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
        owner: root
        group: root
        mode: "0644"
      register: ipa_sshd_password_auth
      when: not ansible_check_mode
      tags: [freeipa-client, C8]

    - name: "FreeIPA client — restart sshd after enabling password auth"
      ansible.builtin.systemd:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: restarted
      when:
        - not ansible_check_mode
        - ipa_sshd_password_auth is changed
      tags: [freeipa-client, C8]

    # ipa-client-install's own ssh_config drop-in (04-ipa.conf) sets
    # PubkeyAuthentication + a known-hosts proxy, but never touches
    # GSSAPIAuthentication/GSSAPIDelegateCredentials. GSSAPIAuthentication
    # already defaults to "yes" in stock /etc/ssh/ssh_config (Ubuntu's
    # own `Host *` block), but GSSAPIDelegateCredentials does not default
    # on anywhere — so a client SSHing into a pilot-access-gateway host
    # never forwards a Kerberos ticket unless something turns this on.
    # Confirmed live on vm-target (2026-09-16, see
    # docs/evidence/pilot-access-gateway/2026-09-16-gssapi-no-password-fallback.md):
    # with delegation on, a client → gateway → target chain authenticates
    # end-to-end via GSSAPI alone, with zero password/pubkey/keyboard-
    # interactive fallback available anywhere; without it, the gateway's
    # own onward "Connect" hop to a target fails outright (no ticket to
    # relay). Scoped to `Host *.{{ ipa_domain }}` (not `Host *`) so this
    # client only ever offers to delegate its ticket to hosts inside this
    # same Kerberos realm — a foreign host wouldn't complete GSSAPI auth
    # against this realm's KDC in the first place, but scoping by domain
    # keeps that safe by construction rather than by accident. This makes
    # every freeipa-client host — including a future portal user's own
    # enrolled desktop — GSSAPI-relay-ready by default, so disabling
    # password SSH login site-wide does not strand anyone who still needs
    # to reach a target through a pilot-access-gateway bastion.
    - name: "FreeIPA client — enable GSSAPI ticket delegation within the realm (SSH client)"
      ansible.builtin.copy:
        dest: /etc/ssh/ssh_config.d/05-freeipa-client-gssapi-delegate.conf
        content: |
          # Managed by freeipa-client-apply.yml — do not edit by hand.
          # Lets this host's SSH client forward a Kerberos ticket into
          # any host in this realm (pilot-access-gateway bastions rely on
          # this to relay the connection onward without a password).
          Host *.{{ ipa_domain }}
              GSSAPIAuthentication yes
              GSSAPIDelegateCredentials yes
        owner: root
        group: root
        mode: "0644"
      when: not ansible_check_mode
      tags: [freeipa-client, C12]

    - name: "FreeIPA client — enable + start auditd (survives reboot)"
      ansible.builtin.systemd:
        name: auditd
        state: started
        enabled: true
      when: not ansible_check_mode
      tags: [freeipa-client, C9]

    # Existing-client Day-2 HA reconciliation (spec §7): runs unconditionally
    # after enrollment (fresh or a no-op on an already-enrolled host) — see
    # tasks/freeipa-client-server-failover.yml's own header for why this is
    # load-bearing, not just an idempotent safety net.
    # Tagged C1 (not a new row): this keeps krb5.conf/sssd.conf's server
    # list in the state ipa-client-install itself would have produced —
    # squarely the same "FreeIPA client is correctly configured" concern
    # C1 already covers, not a distinct topology-dependent behavior this
    # single-server reference spec could give a meaningful static check
    # (see docs/tmp/now/freeipa-client-ha-spec.md's Phase 7 acceptance
    # matrix for where this actually gets exercised, on the dedicated HA
    # topology).
    - name: "FreeIPA client — Day-2 server-list reconciliation (krb5.conf + sssd.conf)"
      ansible.builtin.include_tasks:
        file: tasks/freeipa-client-server-failover.yml
        apply:
          tags: [freeipa-client, C1]
      when: not ansible_check_mode
      tags: [freeipa-client, C1]

    - name: "FreeIPA client — post-enroll health + AAA checks"
      when: not ansible_check_mode
      tags: [freeipa-client, freeipa-client-verify]
      block:
        - name: "FreeIPA client — wait until SSSD resolves an IPA identity (spec C5)"
          ansible.builtin.command: "id {{ ipa_verify_user | default('admin') }}@{{ ipa_domain }}"
          register: ipa_id
          changed_when: false
          until: ipa_id.rc == 0
          retries: "{{ (ipa_enroll_timeout_s | int) // 10 }}"
          delay: 10
          failed_when: false

        - name: "FreeIPA client — fail loudly if SSSD never resolved an IPA user (spec C5)"
          ansible.builtin.assert:
            that:
              - ipa_id.rc == 0
            fail_msg: >-
              SSSD never resolved {{ ipa_verify_user | default('admin') }}@{{ ipa_domain }}
              within {{ ipa_enroll_timeout_s }}s. Check enrollment (`ipa-client-install`)
              and that the server {{ ipa_server_fqdn }} ({{ ipa_server_ip }}) is reachable.

        - name: "FreeIPA client — confirm host Kerberos keytab exists (spec C4)"
          ansible.builtin.command: klist -k /etc/krb5.keytab
          register: ipa_keytab
          changed_when: false
          failed_when: "'host/' + ipa_client_fqdn not in ipa_keytab.stdout"

      rescue:
        - name: "FreeIPA client — rescue: dump SSSD status"
          ansible.builtin.command: sssctl domain-status "{{ ipa_domain }}"
          register: ipa_rescue_sssd
          changed_when: false
          failed_when: false

        - name: "FreeIPA client — rescue: tail client-install log"
          ansible.builtin.command: tail -n 60 /var/log/ipaclient-install.log
          register: ipa_rescue_log
          changed_when: false
          failed_when: false

        - name: "FreeIPA client — rescue: surface diagnostics + fail"
          ansible.builtin.fail:
            msg: |
              FreeIPA client enrollment/health FAILED. Diagnostics:
              --- sssctl domain-status {{ ipa_domain }} ---
              {{ ipa_rescue_sssd.stdout | default('(unavailable)') }}
              {{ ipa_rescue_sssd.stderr | default('') }}
              --- /var/log/ipaclient-install.log (tail 60) ---
              {{ ipa_rescue_log.stdout | default('(unavailable)') }}
              Common causes: server FQDN {{ ipa_server_fqdn }} not resolving (check
              /etc/hosts has "{{ ipa_server_ip }} {{ ipa_server_fqdn }}"); clock skew
              (apply ntp role — Kerberos needs < 5 min); a half-finished prior enroll
              (run `ipa-client-install --uninstall -U` then rerun).

    # Host DNS registration apply + verify (spec.md §11/§16): runs AFTER
    # enrollment/health succeeds, whether this host was freshly enrolled this
    # run (--ip-address already registered it) or was already enrolled
    # (ipa_cfg.stat.exists, captured before ipa-client-install ran — the
    # existing-client backfill path). Either way, ends by re-querying
    # authoritative DNS and failing loudly (never rolling back enrollment) if
    # it still doesn't match desired.
    - name: "FreeIPA client DNS — existing-client backfill + post-apply verify"
      ansible.builtin.include_tasks:
        file: tasks/freeipa-client-host-dns.yml
        apply:
          tags: [freeipa-client, C11]
      vars:
        freeipa_client_dns_phase: apply
      tags: [freeipa-client, C11]

    # Host annotations projection (docs/superpowers/specs/2026-09-09-host-
    # annotations-freeipa-sync-spec.md §9.1): runs AFTER enrollment/health
    # succeeds, same "never mutate before the host object is confirmed to
    # exist" rule as DNS above. Independent of DNS registration — always
    # included, even when pilot_annotations is unset (a no-op reconcile in
    # that case, or a prune if annotations were previously set and removed).
    - name: "FreeIPA host annotations — reconcile pilot_annotations to FreeIPA userClass/nshostlocation"
      ansible.builtin.include_tasks:
        file: tasks/freeipa-host-annotations.yml
        apply:
          tags: [freeipa-client, host-annotations]
      tags: [freeipa-client, host-annotations]
