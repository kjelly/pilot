# Apply playbook for pilot gateway-scope plan/reconcile/enable-auto/disable-auto.
# The shared server-side lifecycle binds domain/scope/exact immutable group ID
# in a root-owned durable ledger. Names/descriptions never establish ownership.
# Existing legacy groups require explicit gateway_scope_adopt_id after the
# operator inspects their live ipauniqueid. ipa_server_fqdn designates the
# single authority; selecting a replica or multiple servers fails closed.
#
# Publication and identity retirement share the full probe/mutate/journal
# lock. Durable retiring-FQDN barriers suppress stale desired host lists and
# install exact escaped-FQDN automember exclusions, retaining shared rules.
# plan and --check inspect live state without changing managed state.
# enable-auto backfills the expanded host list and enables automembership;
# disable-auto leaves membership untouched and removes only the auto rule.
# The CLI expands --hosts all from actual inventory before invocation.
# ipa_admin_password is supplied through the operator's vault.
---
- name: Gateway scope publication
  hosts: "{{ target_group | default('freeipa-server') }}"
  become: false
  gather_facts: false
  vars:
    gateway_scope_automember_action: none
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168
  pre_tasks:
    # Same stage-gate convention as every other apply playbook (AGENTS.md
    # §4.3: "新增 playbook 一律要帶，沒有預設豁免") — this mutates a live
    # FreeIPA hostgroup that gates real SSH/sudo access, so it gets the
    # same staging/prod discipline as freeipa-realm-replacement-apply.yml.
    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or (stage == 'staging' and confirm_staging | bool) or (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm_staging=true or confirm_prod=true."
      tags: [always]

    - name: "Gate: stage must match this host's inventory environment group"
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。
      tags: [always]

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
      when: stage == 'prod'
      tags: [always]

    # Values an operator may set in group_vars/host_vars (contract groupVars,
    # group_vars/<role>.example.yml). They are defaulted here instead of in
    # the play's vars:, which outrank group_vars/host_vars and silently
    # replaced the operator's value (AGENTS.md §4.5 point 3); -e still wins.
    - name: "Resolve inventory-overridable defaults without shadowing group_vars/host_vars"
      ansible.builtin.set_fact:
        gateway_scope_plan_only: "{{ gateway_scope_plan_only | default(false) }}"
      tags: [always]
  tasks:
    - name: Validate required vars (common)
      tags: [always]
      ansible.builtin.assert:
        that:
          - gateway_scope is defined
          - gateway_scope | length > 0
          - ipa_admin_password is defined
          - gateway_scope_automember_action in ['none', 'enable', 'disable']
        fail_msg: >-
          Missing required vars. Pass -e gateway_scope=<scope> and a vault
          file defining ipa_admin_password. gateway_scope_automember_action
          must be one of none/enable/disable if set at all.

    # disable-auto only removes the automember rule — it never touches
    # hostgroup membership, so gateway_scope_hosts is neither required nor
    # read on that path (see the file header comment).
    - name: Validate required vars (host list; not needed for disable-auto)
      tags: [always]
      ansible.builtin.assert:
        that:
          - gateway_scope_hosts is defined
          - gateway_scope_hosts is sequence
          - gateway_scope_hosts is not string
          - gateway_scope_hosts | length > 0
          - (gateway_scope_hosts | map('trim') | select('equalto', 'all') | list | length) == 0
        fail_msg: >-
          Missing gateway_scope_hosts='["host1","host2"]'. The literal `all`
          is only supported by the pilot gateway-scope CLI, which expands
          the inventory freeipa-client group before invoking this playbook.
      when: gateway_scope_automember_action != 'disable'

    - name: Compute target hostgroup name
      tags: [always]
      ansible.builtin.set_fact:
        gateway_target_hostgroup: "pilot-target-{{ gateway_scope }}"

    - name: "Gateway scope reconcile with a private Kerberos cache for the admin ticket"
      environment:
        KRB5CCNAME: "{{ pilot_krb5ccname | default('FILE:/nonexistent/pilot-krb5cc-not-open') }}"
      block:
        - name: "Private Kerberos cache for the tickets below (issue #69)"
          ansible.builtin.include_tasks:
            file: tasks/freeipa-private-ccache-open.yml
            apply:
              tags: [always]
          tags: [always]

        - name: Kinit admin
          tags: [always]
          ansible.builtin.command:
            argv: [kinit, admin]
            stdin: "{{ ipa_admin_password }}"
          check_mode: false
          changed_when: false
          no_log: true

        - name: "Publish the owned gateway scope under its lifecycle lock"
          ansible.builtin.include_tasks:
            file: tasks/freeipa-gateway-scope-lifecycle.yml
            apply:
              tags: [C1, C2, C3, AG_automember]
          vars:
            ipa_gateway_lifecycle_operation: publish
            ipa_gateway_lifecycle_authority: "{{ ipa_server_fqdn | default(freeipa_server_fqdn | default('')) }}"
            ipa_gateway_lifecycle_readonly: "{{ gateway_scope_plan_only | bool or ansible_check_mode }}"
            ipa_gateway_lifecycle_request:
              scope: "{{ gateway_scope }}"
              hosts: "{{ gateway_scope_hosts | default([]) }}"
              automember: "{{ gateway_scope_automember_action }}"
              adopt_id: "{{ gateway_scope_adopt_id | default('') }}"
              adopt_automember_id: "{{ gateway_scope_adopt_automember_id | default('') }}"
          tags: [C1, C2, C3, AG_automember]

        - name: "Plan: add / remove / keep"
          ansible.builtin.debug:
            msg: "{{ ipa_gateway_lifecycle_result.stdout | from_json }}"
          tags: [C1, C2, C3, AG_automember]
      always:
        - name: "Destroy the private Kerberos cache"
          ansible.builtin.include_tasks:
            file: tasks/freeipa-private-ccache-close.yml
            apply:
              tags: [always]
          tags: [always]
