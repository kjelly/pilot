---
# Canonical freeipa-identity roster (schema_version: 2).
#
# Keep the real file outside git and encrypt it with ansible-vault. Because
# `groups` and `hosts` are Ansible magic variables, DO NOT pass this file with
# `-e @file`. Load it through the playbook's namespaced entrypoint instead:
#
#   pilot vm-target run --name <server> \
#     playbooks/apply/freeipa-identity-apply.yml \
#     -e target_group=all \
#     -e freeipa_roster_file=~/.vault/ipa-identity.yaml \
#     --vault-password-file ~/.vault/vault-pass
#
# Identity, HBAC/sudo, Kerberos NFSv4 server, and IPA automount clients are
# supported. An old schema_version: 1 roster auto-migrates the first time
# `pilot edit`/the MCP roster driver/`pilot deploy`/`pilot reconcile` opens
# it (EnsureRosterCurrent) — or run `pilot roster migrate <file>` explicitly.
# `migration` (declarative bulk rename/removal) remains a separate
# fail-closed delivery batch.
schema_version: 2

freeipa:
  server: ipa1.ipa.pilot.internal
  admin:
    principal: admin
    password: CHANGE-ME-min-8-chars
  defaults:
    group_type: posix
    managed_group_membership: authoritative
    prune_unmanaged: false
  safety:
    require_posix_data_groups: true

users:
  - name: alice
    state: present
    first: Alice
    last: Wang
    display_name: Alice Wang
    email: alice@example.internal
    uid: null
    gid: null
    login_shell: /bin/bash
    home_directory: /home/alice
    password:
      initial: CHANGE-ME-alice-initial
      force_change: true
      preserve_existing: false
    ssh_keys:
      authoritative: true
      values:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI...EXAMPLE... alice@laptop
    enabled: true

  - name: bob
    state: disabled
    first: Bob
    last: Lee
    login_shell: /bin/bash
    home_directory: /home/bob
    password:
      preserve_existing: true
    ssh_keys:
      authoritative: true
      values: []
    enabled: false

groups:
  - name: team-developers
    state: present
    category: team
    type: posix
    description: Application development team
    gid: null
    membership:
      authoritative: true
      users:
        - alice
        - bob
      groups: []

  - name: data-project-alpha-rw
    state: present
    category: filesystem
    type: posix
    description: Project Alpha read-write access
    membership:
      authoritative: true
      users: []
      groups:
        - team-developers

  - name: role-web-service-admin
    state: present
    category: role
    type: posix
    description: Web service administrators
    membership:
      authoritative: true
      users: [alice]
      groups: []

hosts:
  - name: web01.ipa.pilot.internal
    state: present
    ip_address: 192.168.50.21
    description: Web server 01
  - name: web02.ipa.pilot.internal
    state: present
    ip_address: 192.168.50.22
    description: Web server 02

hostgroups:
  - name: web-servers
    state: present
    description: Web servers
    membership:
      authoritative: true
      hosts: [web01.ipa.pilot.internal, web02.ipa.pilot.internal]
      hostgroups: []

  # Nested hostgroup membership (membership.hostgroups) is authoritative and
  # fully reconciled, same as membership.hosts.
  - name: production-linux
    state: present
    description: All production Linux systems
    membership:
      authoritative: true
      hosts: []
      hostgroups: [web-servers]

# Netgroups are optional and v2-only: a FreeIPA netgroup can contain users,
# groups, hosts, hostgroups, and nested netgroups, feeding NSS/NFS/legacy
# UNIX consumers (not HBAC/sudo, which stay hostgroup-scoped). Names must
# match ^ng-[a-z0-9][a-z0-9_.-]*$ and not collide with a hostgroup name;
# membership.authoritative must be true; every reference must resolve to
# something else declared in this roster; no netgroup may directly or
# transitively contain itself.
netgroups:
  - name: ng-project-alpha-clients
    state: present
    description: Project Alpha client machines
    nis_domain: null
    membership:
      authoritative: true
      users: []
      groups: []
      hosts: []
      hostgroups: [web-servers]
      netgroups: []

  - name: ng-build-environment
    state: present
    description: Build environment
    membership:
      authoritative: true
      users: []
      groups: []
      hosts: []
      hostgroups: [production-linux]
      netgroups: [ng-project-alpha-clients]

hbac:
  disable_allow_all: true
  services:
    - {name: sshd, state: present}
  rules:
    # A team is only an identity set — login is granted only because this
    # enabled rule explicitly references it. HBAC subjects.groups accepts
    # team/role groups directly (and legacy access-category groups, for
    # rosters that still have them); no access-*/wrapper group is needed.
    - name: developer-ssh
      state: present
      enabled: true
      subjects: {users: [], groups: [team-developers]}
      targets: {hosts: [], hostgroups: [web-servers]}
      services: [sshd]

    - name: breakglass-admin-access
      state: present
      enabled: true
      subjects: {users: [admin], groups: []}
      targets: {hostcat: all, hosts: [], hostgroups: []}
      services: [sshd]

sudo:
  command_groups:
    - name: web-service-read
      state: present
      commands:
        - /usr/bin/systemctl status nginx
        - /usr/bin/journalctl -u nginx
  rules:
    - name: web-service-administration
      state: present
      enabled: true
      subjects: {users: [], groups: [role-web-service-admin]}
      targets: {hostcat: all, hosts: [], hostgroups: []}
      allow: {command_groups: [web-service-read], commands: []}
      deny: {command_groups: [], commands: []}
      run_as: {users: [root], groups: []}
      options: ['!authenticate']

nfs:
  servers:
    - host: nfs1.ipa.pilot.internal
      state: present
      service_principal:
        ensure: true
        principal: nfs/nfs1.ipa.pilot.internal
        keytab: /etc/krb5.keytab
      # Packages and the NFS server systemd unit are derived from the target
      # OS by freeipa-nfs-server-apply.yml (RedHat or Debian/Ubuntu).
      shares:
        - name: project-alpha
          state: present
          source_path: /srv/nfs/projects/alpha
          ownership: {owner: root, group: data-project-alpha-rw, mode: '2770'}
          acl:
            mode: authoritative
            access:
              owner: rwx
              owning_group: rwx
              others: '---'
              mask: rwx
              named_users: []
              named_groups:
                - {name: data-project-alpha-rw, permissions: rwx}
            default:
              enabled: true
              owner: rwx
              owning_group: rwx
              others: '---'
              mask: rwx
              named_users: []
              named_groups:
                - {name: data-project-alpha-rw, permissions: rwx}
          export:
            # network/host render as a bare value; hostgroup/netgroup render
            # as @value (implemented once, shared by the pseudo-root export
            # and every individual share — see
            # playbooks/apply/templates/freeipa-nfs-exports.j2). `raw` also
            # exists but is a migration compatibility escape hatch only —
            # never hand-author it.
            clients:
              - {type: network, value: 192.168.50.0/24}
              - {type: hostgroup, value: web-servers}
              - {type: netgroup, value: ng-project-alpha-clients}
            options: [rw, sync, root_squash, sec=krb5i]
          automount:
            enabled: true
            location: default
            mount_root: /projects
            map: auto.projects
            key: alpha
            server: nfs1.ipa.pilot.internal
            remote_path: /projects/alpha
            options: [fstype=nfs4, sec=krb5i, hard, timeo=600, retrans=2]

nfs_clients:
  - hostgroup: nfsclients
    state: present
    automount: {location: default, enable_service: true}
    verification_mounts: [/projects/alpha]

# ---------------------------------------------------------------------------
# v3.2 Identity & Credential Hardening fields — password_policies,
# credential_policies, security.privileged_identity, users[].authentication
# — are schema_version: 3 only, so they are commented out here rather than
# live YAML (this file is schema_version: 2 above; grafting v3-only fields
# into it live would make the example fail its own declared schema). Field
# names/units below are confirmed against a real FreeIPA server, not
# guessed — see docs/verification/freeipa-identity.md §10 for the full
# vm-target evidence (2026-08-27) this was verified against, including the
# real `ipa pwpolicy-show --raw` output these values compile to.
#
# password_policies:
#   - name: privileged-users
#     state: present
#     group: role-privileged          # MUST be an existing role-*/team-* group; never access-*
#     priority: 10                     # required; FreeIPA requires this unique across all group policies
#     min_length: 16
#     history_size: 24
#     max_life: 90d                    # ipa pwpolicy-add --maxlife (days); stored live as krbmaxpwdlife in SECONDS
#     min_life: 1h                     # ipa pwpolicy-add --minlife (hours); stored live as krbminpwdlife in SECONDS
#     lockout:
#       max_failures: 5
#       failure_reset_interval: 15m    # stored live as krbpwdfailurecountinterval, already in seconds
#       lockout_duration: 15m          # stored live as krbpwdlockoutduration, already in seconds
#
# users:
#   - name: alice
#     authentication:
#       allowed: [otp, pkinit]         # -> ipa user-mod --user-auth-type=otp --user-auth-type=pkinit
#
# security:
#   privileged_identity:
#     match_groups: [role-privileged]  # effective membership, nested groups included
#     require:
#       auth_types: [otp, pkinit]      # any ONE satisfies (same convention as auth_policies[].require_any)
#       no_password_only: true
#       ssh_key_policy: privileged-ssh # must reference an existing credential_policies[].name
#
# credential_policies:
#   - name: privileged-ssh
#     state: present
#     match:
#       users: []
#       groups: [role-privileged]
#     ssh:
#       allowed_algorithms: [ssh-ed25519, ecdsa-sha2-nistp256]  # unset = no algorithm restriction at all
#       require_comment: true
#       max_age: 365d                  # report-only — pilot never derives real key age; always reports "unknown"
#     review:                          # optional; managed via `pilot identity review list/mark`, never this file
#       interval: 180d
