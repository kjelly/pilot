# Apply playbook for docs/verification/pilot-access-gateway.md
# (docs/superpowers/specs/2026-09-14-pilot-access-gateway-stateless-freeipa-portal-spec.md §50-§58, Phase 7).
#
# Installs pilot-access-gateway on ONE gateway host that is already a
# FreeIPA client (playbooks/apply/freeipa-client-apply.yml) enrolled in
# the same realm the target FreeIPA server(s) serve. Order matches
# spec.md §55 exactly, up to and including step 18 — step 19
# (sshd ForceCommand) is gated behind
# pilot_access_gateway_install_forcecommand (default TRUE — changed from
# spec.md §0 G4/§55.1's originally-specified default of false on
# 2026-09-14, after the §55.1 lockout regression test had already passed
# on vm-target). §55.1's rules still apply in full: never run this
# against a non-disposable host without the lockout regression test
# having actually been run there, and production deployment still needs
# explicit per-deployment human approval — the changed default does NOT
# substitute for that approval, it only changes what happens if a caller
# forgets to pass the flag at all. Pass
# `-e pilot_access_gateway_install_forcecommand=false` explicitly to get
# the old opt-in behavior.
#
# This does NOT create the FreeIPA service principal from an admin
# session inline via kinit+shell the way freeipa-identity-apply.yml
# does for user/group state — see the "Provision reader keytab" task
# below for why, and why it is guarded to run at most once.
#
# Usage (two already-provisioned vm-targets — one FreeIPA server, one
# FreeIPA client — see docs/evidence/pilot-access-gateway/2026-09-14-
# phase7-deployment-integration.md for the exact commands used):
#
#   pilot vm-target run --name <gateway-vm> \
#       playbooks/apply/pilot-access-gateway-apply.yml \
#       -e target_group=all \
#       -e gateway_id=gpu-01 -e gateway_scope=gpu \
#       -e '{"freeipa_servers": ["ipa1.ipa.pilot.internal"]}' \
#       -e ipa_realm=IPA.PILOT.INTERNAL \
#       -e pilot_binary_path=dist/pilot-linux-amd64 \
#       -e pilot_access_gateway_binary_path=dist/pilot-access-gateway-linux-amd64 \
#       -e @~/.vault/main.yaml
#
# Secrets: ipa_admin_password comes from a vault file, never hard-coded
# (matching every other FreeIPA-touching apply playbook in this repo).
---
- name: Pilot Access Gateway install
  hosts: "{{ target_group | default('pilot-access-gateway') }}"
  become: true
  gather_facts: true
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168

    # gateway_id / gateway_scope / pilot_binary_path / pilot_access_gateway_
    # binary_path are contracts/pilot-access-gateway.yaml's required
    # groupVars — deliberately NOT given a play-vars entry here. Ansible's
    # precedence puts play vars ABOVE inventory group_vars/host_vars, so
    # declaring them here (even as "" placeholders) would silently shadow
    # whatever `pilot deploy`'s inventory-driven contract actually supplies,
    # and the assert right below would always see the placeholder instead
    # (found live 2026-09-15: a fully-populated host_vars/group_vars
    # deployment still failed "Missing required vars" because of exactly
    # this shadowing — `ansible-inventory` showed the real values, the play
    # never saw them). Leaving them undeclared lets normal inventory
    # precedence resolve them, and "Gate: required gateway identity vars"
    # below is still what actually enforces their presence before anything
    # uses them.
    gateway_target_hostgroup: "pilot-target-{{ gateway_scope }}"
    # pilot-gateway-<scope> (docs/tmp/now/spec.md §7) is a DIFFERENT
    # hostgroup family from pilot-target-<scope> above: it lists which
    # Gateway INSTANCES serve one scope (for pilot-access-directory
    # routing), not which target hosts belong to it. Not to be confused
    # with the pre-existing `pilot gateway-scope` CLI (cmd/pilot/cmd/
    # gateway_scope.go), which only ever manages pilot-target-<scope>
    # target membership and has nothing to do with this hostgroup.
    gateway_instance_hostgroup: "pilot-gateway-{{ gateway_scope }}"
    gateway_socket_path: /run/pilot/access-gateway.sock
    ipa_ca_file: /etc/ipa/ca.crt

    pilot_gateway_user: pilot-gateway

    # `pilot portal` obtains a short-lived user TGT when an SSH-key login did
    # not delegate one. These packages provide the fixed-argv kinit/klist/
    # kdestroy binaries used by that session-scoped helper. freeipa-client
    # normally brings them in already; declaring them here keeps this role's
    # runtime dependency explicit and self-healing.
    gateway_kerberos_client_packages_debian: [krb5-user]
    gateway_kerberos_client_packages_redhat: [krb5-workstation]

    pilot_binary_sha256: ""
    pilot_access_gateway_binary_sha256: ""

    # gateway_fqdn / gateway_portal_user_group / pilot_access_gateway_
    # install_forcecommand are optional groupVars with a real default —
    # same shadowing hazard as above, but a bare self-referencing default
    # (`x: "{{ x | default(...) }}"`) recurses infinitely under this
    # ansible-core, so each gets its own "_effective_" name instead; every
    # use below reads the _effective_ name, never the raw one.
    gateway_effective_fqdn: "{{ gateway_fqdn | default(ansible_fqdn) }}"

    # SSH session recording (docs/superpowers/specs/2026-09-23-pilot-access-
    # gateway-per-host-session-recording-spec.md §14/§27.1). Same "_effective_"
    # convention as above so group_vars/host_vars are never shadowed.
    # pilot_session_recording_mode has NO default on purpose: when unset the
    # rendered config omits `mode:` and the gateway reports its source as
    # built_in_default (metadata). Per-host FreeIPA markers override it.
    gateway_effective_recording_failure_policy: "{{ pilot_session_recording_failure_policy | default('fail_closed') }}"
    gateway_effective_recording_queue_events: "{{ pilot_session_recording_queue_events | default(1024) }}"
    gateway_effective_recording_flush_interval: "{{ pilot_session_recording_flush_interval | default('500ms') }}"
    gateway_effective_recording_failure_grace: "{{ pilot_session_recording_failure_grace | default('10s') }}"
    gateway_effective_recording_max_session_duration: "{{ pilot_session_recording_max_session_duration | default('24h') }}"
    gateway_effective_session_store_url: "{{ pilot_session_store_url | default('') }}"
    gateway_effective_session_store_ca_file: "{{ pilot_session_store_ca_file | default('/etc/ipa/ca.crt') }}"
    gateway_session_store_signing_key_file: /etc/pilot/session-store-ingest-signing.key
    # Metrics (per-host recording spec §31) are written only when
    # node_exporter's textfile collector directory already exists.
    gateway_metrics_textfile_dir: /var/lib/node_exporter/textfile
    # Left behind by the Phase 8 manual session-store wiring (a static
    # bearer token); per-session tokens replace it, so it is removed.
    gateway_legacy_session_store_token_file: /etc/pilot/session-store-ingest-token
    gateway_effective_portal_user_group: "{{ gateway_portal_user_group | default('role-pilot-portal-user') }}"

    # Default TRUE (2026-09-16): every FreeIPA account automatically joins
    # gateway_effective_portal_user_group instead of an operator having to
    # list members in the freeipa-identity roster one at a time — combined
    # with pilot_access_gateway_effective_install_forcecommand's own
    # default of true, this makes "FreeIPA account gets a portal session,
    # never a shell, on this gateway" the out-of-the-box behavior. Pass
    # -e pilot_access_gateway_portal_automember=false to opt back into a
    # roster-curated portal population. See the automember task block below
    # for why the exclude list defaults to ["admin"].
    pilot_access_gateway_effective_portal_automember: "{{ pilot_access_gateway_portal_automember | default(true) }}"
    pilot_access_gateway_effective_portal_automember_exclude_users: "{{ pilot_access_gateway_portal_automember_exclude_users | default(['admin']) }}"

    # freeipa_servers / ipa_realm auto-derive from the shared realm config
    # (group_vars/freeipa.yml: freeipa_domain, and optionally freeipa_realm/
    # freeipa_server_fqdn — the same override vars freeipa-client-apply.yml
    # already reads) using freeipa-client-apply.yml's own established
    # convention (realm = upper(domain), server = "ipa1.<domain>"),
    # matching the pattern every other freeipa-client host on the same
    # inventory already enrolled with. An explicit freeipa_servers/ipa_realm
    # in group_vars/pilot-access-gateway.yml still wins (checked first).
    # `default(X, true)` treats an explicitly-empty value (freeipa_servers:
    # [], ipa_realm: "" — what an un-filled-in group_vars/pilot-access-
    # gateway.example.yml copy leaves behind) the same as unset, not a real
    # override to an empty value (found live 2026-09-15: a real site's
    # group_vars/pilot-access-gateway.yml still had the example's literal
    # `freeipa_servers: []`/`ipa_realm: ""`, both contracts/pilot-access-
    # gateway.yaml required=true, so `pilot deploy` refused to even start —
    # the contract now marks both required=false and documents this
    # fallback instead).
    gateway_effective_ipa_realm: >-
      {{ (ipa_realm | default('', true))
         or (freeipa_realm | default('', true))
         or ((freeipa_domain | default('ipa.pilot.internal', true)) | upper) }}
    gateway_effective_freeipa_servers: >-
      {{ (freeipa_servers | default([], true))
         or [ (freeipa_server_fqdn | default('', true))
              or ('ipa1.' ~ (freeipa_domain | default('ipa.pilot.internal', true))) ] }}

    # Gate for spec.md §55 step 19 — see the file header comment.
    # Default TRUE as of 2026-09-14. Pass
    # -e pilot_access_gateway_install_forcecommand=false, or set it in
    # group_vars/host_vars, to opt out. Never let this install against a
    # non-disposable host without the §55.1 lockout regression test
    # having actually been run there.
    pilot_access_gateway_effective_install_forcecommand: "{{ pilot_access_gateway_install_forcecommand | default(true) }}"

  pre_tasks:
    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or (stage == 'staging' and confirm_staging | bool) or (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm_staging=true or confirm_prod=true."
      tags: [always]

    - name: "Gate: stage must match this host's inventory environment group"
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。
      tags: [always]

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
      when: stage == 'prod'
      tags: [always]

    - name: "Gate: required gateway identity vars"
      ansible.builtin.assert:
        that:
          - gateway_id | length > 0
          - gateway_scope | length > 0
          - gateway_effective_freeipa_servers | length > 0
          - gateway_effective_ipa_realm | length > 0
          - ipa_admin_password is defined
          - pilot_binary_path | length > 0
          - pilot_access_gateway_binary_path | length > 0
        fail_msg: >-
          Missing required vars: gateway_id, gateway_scope, ipa_admin_password
          (vault), pilot_binary_path, pilot_access_gateway_binary_path.
          freeipa_servers/ipa_realm auto-derive from group_vars/freeipa.yml's
          freeipa_domain if not set — this only fires if freeipa_domain is
          ALSO missing (see gateway_effective_freeipa_servers/
          gateway_effective_ipa_realm above).
      tags: [always]

    - name: "Gate: SSH session recording settings are valid"
      ansible.builtin.assert:
        that:
          - pilot_session_recording_mode is not defined or pilot_session_recording_mode in ['metadata', 'terminal_output', 'terminal_io']
          - gateway_effective_recording_failure_policy in ['best_effort', 'fail_closed']
          - >-
            pilot_session_recording_mode | default('metadata') == 'metadata'
            or (gateway_effective_session_store_url | length > 0)
          - gateway_effective_session_store_url | length == 0 or gateway_effective_session_store_url is match('^https://')
          - >-
            gateway_effective_session_store_url | length == 0
            or (pilot_session_store_ingest_signing_key is defined
                and pilot_session_store_ingest_signing_key is match('^[0-9a-fA-F]{64}$'))
        fail_msg: >-
          Invalid SSH session recording settings:
          pilot_session_recording_mode must be metadata|terminal_output|terminal_io
          (or unset), pilot_session_recording_failure_policy best_effort|fail_closed;
          a terminal recording mode requires pilot_session_store_url; the URL
          must be https://, and requires pilot_session_store_ingest_signing_key
          (vault, 64 hex chars, the same value pilot-session-store uses). There
          is no local recording fallback.
      tags: [always]

    - name: "Resolve local artifact paths (relative = repo-root relative)"
      ansible.builtin.set_fact:
        pilot_binary_abs_path: >-
          {{ pilot_binary_path if (pilot_binary_path is match('^/'))
          else (playbook_dir ~ '/../../' ~ pilot_binary_path) }}
        pilot_access_gateway_binary_abs_path: >-
          {{ pilot_access_gateway_binary_path if (pilot_access_gateway_binary_path is match('^/'))
          else (playbook_dir ~ '/../../' ~ pilot_access_gateway_binary_path) }}
      tags: [always]

    # AG-artifact gates (step "before step 1" in spirit): both binaries
    # must exist and actually run, same discipline as
    # agent-controller-apply.yml's own artifact gate.
    - name: "Gate: pilot binary exists on the controller"
      ansible.builtin.stat:
        path: "{{ pilot_binary_abs_path }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: pilot_binary_stat
      tags: [always]

    - name: "Gate: pilot binary exists"
      ansible.builtin.assert:
        that:
          - pilot_binary_stat.stat.get('exists', false)
        fail_msg: >-
          pilot binary {{ pilot_binary_abs_path }} is missing — build it
          first (e.g. CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o
          dist/pilot-linux-amd64 ./cmd/pilot).
      run_once: true
      tags: [always]

    - name: "Gate: pilot binary's own version subcommand succeeds"
      ansible.builtin.command:
        argv: ["{{ pilot_binary_abs_path }}", "version"]
      delegate_to: localhost
      become: false
      run_once: true
      register: pilot_binary_version
      changed_when: false
      check_mode: false
      tags: [always]

    - name: "Gate: pilot-access-gateway binary exists on the controller"
      ansible.builtin.stat:
        path: "{{ pilot_access_gateway_binary_abs_path }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: pilot_access_gateway_binary_stat
      tags: [always]

    - name: "Gate: pilot-access-gateway binary exists"
      ansible.builtin.assert:
        that:
          - pilot_access_gateway_binary_stat.stat.get('exists', false)
        fail_msg: >-
          pilot-access-gateway binary {{ pilot_access_gateway_binary_abs_path }}
          is missing — build it with scripts/build-pilot-access-gateway.sh
          first.
      run_once: true
      tags: [always]

    - name: "Gate: pilot-access-gateway binary's own version subcommand succeeds and matches the contract"
      ansible.builtin.command:
        argv: ["{{ pilot_access_gateway_binary_abs_path }}", "version"]
      delegate_to: localhost
      become: false
      run_once: true
      register: pilot_access_gateway_binary_version
      changed_when: false
      check_mode: false
      failed_when: pilot_access_gateway_binary_version.stdout is not match('^pilot-access-gateway \S+')
      tags: [always]

  tasks:
    - name: "Install Portal Kerberos client tools (Debian)"
      ansible.builtin.include_tasks:
        file: tasks/apt-package-install.yml
        apply:
          tags: [AG33]
      vars:
        pilot_apt_packages: "{{ gateway_kerberos_client_packages_debian }}"
        pilot_apt_policy: tolerant
        pilot_apt_component: pilot-access-gateway-kerberos-client
        pilot_apt_required_sources:
          - id: ubuntu-os
            class: os
      when:
        - not ansible_check_mode
        - ansible_os_family == 'Debian'
      tags: [AG33]

    - name: "Install Portal Kerberos client tools (RedHat)"
      ansible.builtin.dnf:
        name: "{{ gateway_kerberos_client_packages_redhat }}"
        state: present
      when:
        - not ansible_check_mode
        - ansible_os_family == 'RedHat'
      tags: [AG33]

    # Step 2 (spec.md §55): verify FreeIPA client enrollment.
    - name: "Step 2: verify FreeIPA client enrollment"
      ansible.builtin.stat:
        path: /etc/ipa/default.conf
      register: gateway_ipa_default_conf
      tags: [always]

    # A --check preview of a host that the same run would enroll first
    # (site.yml or a topology test on fresh VMs): freeipa-client's real
    # enrollment is skipped in check mode, so enrollment, the forward DNS
    # record, the FreeIPA CA and SSSD group resolution cannot exist yet.
    # Only in that preview are the gates asserting them relaxed
    # (AGENTS.md §4.0).
    - name: "Step 2: detect a check-mode preview of a host that is not enrolled yet"
      ansible.builtin.set_fact:
        gateway_fresh_preview: "{{ ansible_check_mode and not gateway_ipa_default_conf.stat.exists }}"
      tags: [always]

    - name: "Step 2: gate — this host must already be FreeIPA-enrolled"
      ansible.builtin.assert:
        that:
          - gateway_ipa_default_conf.stat.exists or gateway_fresh_preview
        fail_msg: "{{ inventory_hostname }} is not FreeIPA-enrolled — run freeipa-client-apply.yml first."
      tags: [AG_enrollment]

    # `ipa service-add` (step 8, below) requires this host to already
    # have a forward DNS record — live testing found freeipa-client-
    # apply.yml's own DNS auto-registration does not always fire (see
    # docs/evidence/pilot-access-gateway/2026-09-14-phase7-deployment-
    # integration.md). Verify it here with an actionable error rather
    # than let service-add fail with a generic FreeIPA error message —
    # this playbook does not attempt to register DNS itself, that
    # remains freeipa-client-apply.yml's job.
    - name: "Step 2: check this host resolves in FreeIPA DNS"
      ansible.builtin.command:
        argv: [getent, hosts, "{{ gateway_effective_fqdn }}"]
      register: gateway_dns_check
      changed_when: false
      failed_when: false
      tags: [AG_enrollment]

    - name: "Step 2: gate — this host must have a forward DNS record before FreeIPA service enrollment"
      ansible.builtin.assert:
        that:
          - gateway_dns_check.rc == 0 or gateway_fresh_preview
        fail_msg: >-
          {{ gateway_effective_fqdn }} does not resolve. `ipa service-add` (step 8)
          requires a forward DNS record. Re-run freeipa-client-apply.yml
          with DNS registration enabled, or register it manually:
          `ipa dnsrecord-add <zone> {{ gateway_effective_fqdn.split('.')[0] }} --a-rec=<ip>`.
      tags: [AG_enrollment]

    # Step 3 groundwork: kinit once for every FreeIPA-mutating task below.
    - name: "Kinit admin (management-plane operations only — never shipped to this host)"
      ansible.builtin.shell: |
        set -euo pipefail
        echo '{{ ipa_admin_password }}' | kinit admin
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true
      tags: [AG_enrollment, AG_keytab]

    # Step 3 (spec.md §55, spec.md §9.1): this gateway host joins
    # pilot-access-gateways — the hostgroup that controls who may SSH TO
    # the gateway itself, separate from pilot-target-<scope> (which
    # controls where the gateway may take a user). Deliberately
    # implemented here, not in Phase 6's gateway-scope-apply.yml (spec.md
    # §60 Phase 6 landing gate note): this is a gateway HOST's own install
    # step, not a target-scope publication concern.
    - name: "Step 3: ensure pilot-access-gateways hostgroup exists"
      ansible.builtin.command:
        argv: [ipa, hostgroup-add, pilot-access-gateways, "--desc=Pilot Access Gateway hosts"]
      register: gateway_hostgroup_add
      changed_when: "'Added hostgroup' in (gateway_hostgroup_add.stdout | default(''))"
      failed_when:
        - gateway_hostgroup_add.rc != 0
        - "'already exists' not in (gateway_hostgroup_add.stderr | default(''))"
      tags: [AG_enrollment]

    - name: "Step 3: add this host to pilot-access-gateways"
      ansible.builtin.command:
        argv: [ipa, hostgroup-add-member, pilot-access-gateways, "--hosts={{ gateway_effective_fqdn }}"]
      register: gateway_hostgroup_member_add
      changed_when: "'Number of members added 1' in (gateway_hostgroup_member_add.stdout | default(''))"
      failed_when:
        - gateway_hostgroup_member_add.rc != 0
        - "'already a member' not in (gateway_hostgroup_member_add.stdout | default('') + gateway_hostgroup_member_add.stderr | default(''))"
      tags: [AG_enrollment]

    # Step 3b (defense-in-depth, spec.md §9.1/§57): a gateway host must
    # never itself be a member of any pilot-target-<scope> hostgroup —
    # that hostgroup means "somewhere a portal user may be taken", and any
    # sudo/HBAC rule later scoped to it (the established pilot-grant-
    # sudo-<scope>/pilot-grant-login-<scope> convention) would otherwise
    # silently apply to this gateway too, the opposite of the separation
    # this file's own Step 3 above establishes (gateway login authorization
    # lives in pilot-access-gateways, never pilot-target-<scope>). Since
    # contracts/pilot-access-gateway.yaml requires freeipa-client as a
    # sameHosts dependency, every gateway is always ALSO a freeipa-client
    # host — anything that treats "every freeipa-client host" as a target
    # set (e.g. `pilot gateway-scope reconcile --hosts all` before its own
    # 2026-09-15 fix) can publish a gateway as one of its own targets.
    # Scrubbed idempotently on every (re)apply; `ipa hostgroup-find` exits
    # 1 on zero matches (the common case), hence failed_when: false.
    - name: "Step 3b: discover any pilot-target-<scope> hostgroups this host is wrongly a member of"
      ansible.builtin.command:
        argv: [ipa, hostgroup-find, "--hosts={{ gateway_effective_fqdn }}", --raw]
      register: gateway_stale_target_memberships
      changed_when: false
      failed_when: false
      tags: [AG_enrollment]

    - name: "Step 3b: remove this host from every stale pilot-target-<scope> hostgroup"
      ansible.builtin.command:
        argv: [ipa, hostgroup-remove-member, "{{ item }}", "--hosts={{ gateway_effective_fqdn }}"]
      loop: >-
        {{ gateway_stale_target_memberships.stdout | default('')
           | regex_findall('^  cn: (.*)$', multiline=True)
           | select('match', '^pilot-target-') | list }}
      register: gateway_stale_target_removed
      changed_when: "'Number of members removed 1' in (gateway_stale_target_removed.stdout | default(''))"
      failed_when: gateway_stale_target_removed.rc != 0
      tags: [AG_enrollment]

    # Step 3c (docs/tmp/now/spec.md §7): publish this gateway instance into
    # pilot-gateway-<scope>, the live source of truth pilot-access-directory
    # reads to route a user to the right Gateway for a scope — never derived
    # from Gateway hostname (spec.md D3). Mirrors Step 3's
    # add-hostgroup/add-member pattern exactly, just against the
    # gateway_instance_hostgroup computed from this host's own
    # gateway_scope, not pilot-access-gateways.
    - name: "Step 3c: ensure pilot-gateway-<scope> hostgroup exists"
      ansible.builtin.command:
        argv: [ipa, hostgroup-add, "{{ gateway_instance_hostgroup }}", "--desc=Pilot Access Gateway instances for scope: {{ gateway_scope }}"]
      register: gateway_instance_hostgroup_add
      changed_when: "'Added hostgroup' in (gateway_instance_hostgroup_add.stdout | default(''))"
      failed_when:
        - gateway_instance_hostgroup_add.rc != 0
        - "'already exists' not in (gateway_instance_hostgroup_add.stderr | default(''))"
      tags: [AG_enrollment]

    - name: "Step 3c: add this host to pilot-gateway-<scope>"
      ansible.builtin.command:
        argv: [ipa, hostgroup-add-member, "{{ gateway_instance_hostgroup }}", "--hosts={{ gateway_effective_fqdn }}"]
      register: gateway_instance_member_add
      changed_when: "'Number of members added 1' in (gateway_instance_member_add.stdout | default(''))"
      failed_when:
        - gateway_instance_member_add.rc != 0
        - "'already a member' not in (gateway_instance_member_add.stdout | default('') + gateway_instance_member_add.stderr | default(''))"
      tags: [AG_enrollment]

    # Step 3d (spec.md §7.2): self-scrub stale pilot-gateway-<scope>
    # membership left over from a PREVIOUS gateway_scope value — a gateway
    # host must never be published under more than one scope at once, or
    # pilot-access-directory could route a user to it under a scope it no
    # longer actually serves. Same discover-then-remove shape as Step 3b,
    # scoped to the pilot-gateway- prefix and excluding the CURRENT
    # gateway_instance_hostgroup so this doesn't remove what Step 3c just
    # (re)added.
    - name: "Step 3d: discover any pilot-gateway-<scope> hostgroups this host is wrongly a member of"
      ansible.builtin.command:
        argv: [ipa, hostgroup-find, "--hosts={{ gateway_effective_fqdn }}", --raw]
      register: gateway_stale_instance_memberships
      changed_when: false
      failed_when: false
      tags: [AG_enrollment]

    - name: "Step 3d: remove this host from every stale pilot-gateway-<scope> hostgroup"
      ansible.builtin.command:
        argv: [ipa, hostgroup-remove-member, "{{ item }}", "--hosts={{ gateway_effective_fqdn }}"]
      loop: >-
        {{ gateway_stale_instance_memberships.stdout | default('')
           | regex_findall('^  cn: (.*)$', multiline=True)
           | select('match', '^pilot-gateway-')
           | reject('equalto', gateway_instance_hostgroup) | list }}
      register: gateway_stale_instance_removed
      changed_when: "'Number of members removed 1' in (gateway_stale_instance_removed.stdout | default(''))"
      failed_when: gateway_stale_instance_removed.rc != 0
      tags: [AG_enrollment]

    # Step 4 (spec.md §55): getent works via SSSD once enrolled — proven
    # in Phase 3's evidence; a live check here just confirms this
    # specific host, not the general mechanism.
    - name: "Step 4: verify getent resolves the FreeIPA admin account (SSSD sanity check)"
      ansible.builtin.command:
        argv: [getent, passwd, admin]
      changed_when: false
      tags: [AG_enrollment]

    # Step 5/6 (spec.md §55): sshd and systemd are both prerequisites
    # this host already has as an ordinary Linux + FreeIPA-client host;
    # confirm rather than assume.
    - name: "Step 5: verify sshd is active"
      ansible.builtin.command:
        argv: [systemctl, is-active, ssh]
      register: gateway_sshd_active
      changed_when: false
      failed_when: gateway_sshd_active.stdout not in ['active']
      tags: [AG_enrollment]

    - name: "Step 6: verify systemd is PID 1"
      ansible.builtin.command:
        argv: [systemctl, --version]
      changed_when: false
      tags: [AG_enrollment]

    # Step 7 (spec.md §55): FreeIPA CA is installed by ipa-client-install.
    - name: "Step 7: verify FreeIPA CA is present"
      ansible.builtin.stat:
        path: "{{ ipa_ca_file }}"
      register: gateway_ca_stat
      failed_when: not gateway_ca_stat.stat.exists and not gateway_fresh_preview
      tags: [AG_enrollment, AG04]

    - name: "Create pilot-gateway system user (spec.md §25)"
      ansible.builtin.user:
        name: "{{ pilot_gateway_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        home: /nonexistent
      tags: [AG_service, AG02]

    # gateway_effective_portal_user_group and the pilot-access-gateway-login
    # HBAC rule that lets its members reach this host over sshd are
    # structural FreeIPA scaffolding this component needs to function —
    # no different in kind from the pilot-access-gateways hostgroup Step 3
    # above already self-manages. Self-provision them here (idempotent,
    # same command+register+changed_when+failed_when idiom as Step 3)
    # instead of hard-failing and telling an operator to go hand-edit the
    # freeipa-identity roster out of band: found live 2026-09-15, every
    # site-wide deploy touching a freshly-added gateway host failed here
    # until someone did exactly that.
    #
    # This does NOT reintroduce the local-fallback-group incident this
    # block used to warn about: `ipa group-add` creates the REAL FreeIPA
    # group (resolved via SSSD, identical to what freeipa-identity's
    # roster would have created) — the incident was creating a LOCAL Unix
    # group of the same name as a substitute, a different operation this
    # playbook still never performs.
    #
    # Group MEMBERSHIP (which humans get portal access) is deliberately
    # NOT managed here — that stays roster-owned identity data (see
    # docs/verification/pilot-access-gateway.md §5), the same split
    # gateway-scope-apply.yml already draws for pilot-target-<scope>
    # ("pre-provision scaffolding, never human identity/membership").
    # Likewise, changing gateway_portal_user_group later does not retract
    # the HBAC rule's authorization of the old group name — only additive
    # reconciliation is done here, matching Step 3's own scope.
    - name: "Ensure portal-user group exists"
      ansible.builtin.command:
        argv: [ipa, group-add, "{{ gateway_effective_portal_user_group }}", "--desc=Pilot Access Gateway portal users"]
      register: gateway_portal_group_add
      changed_when: "'Added group' in (gateway_portal_group_add.stdout | default(''))"
      failed_when:
        - gateway_portal_group_add.rc != 0
        - "'already exists' not in (gateway_portal_group_add.stderr | default(''))"
      tags: [AG_service]

    - name: "Ensure pilot-access-gateway-login HBAC rule exists"
      ansible.builtin.command:
        argv: [ipa, hbacrule-add, pilot-access-gateway-login]
      register: gateway_login_hbac_add
      changed_when: "'Added HBAC rule' in (gateway_login_hbac_add.stdout | default(''))"
      failed_when:
        - gateway_login_hbac_add.rc != 0
        - "'already exists' not in (gateway_login_hbac_add.stderr | default(''))"
      tags: [AG_service]

    - name: "Ensure pilot-access-gateway-login targets pilot-access-gateways"
      ansible.builtin.command:
        argv: [ipa, hbacrule-add-host, pilot-access-gateway-login, --hostgroups=pilot-access-gateways]
      register: gateway_login_hbac_hostgroup
      changed_when: "'Number of members added 1' in (gateway_login_hbac_hostgroup.stdout | default(''))"
      failed_when:
        - gateway_login_hbac_hostgroup.rc != 0
        - "'already a member' not in (gateway_login_hbac_hostgroup.stdout | default('') + gateway_login_hbac_hostgroup.stderr | default(''))"
      tags: [AG_service]

    - name: "Ensure pilot-access-gateway-login allows sshd"
      ansible.builtin.command:
        argv: [ipa, hbacrule-add-service, pilot-access-gateway-login, --hbacsvcs=sshd]
      register: gateway_login_hbac_service
      changed_when: "'Number of members added 1' in (gateway_login_hbac_service.stdout | default(''))"
      failed_when:
        - gateway_login_hbac_service.rc != 0
        - "'already a member' not in (gateway_login_hbac_service.stdout | default('') + gateway_login_hbac_service.stderr | default(''))"
      tags: [AG_service]

    - name: "Ensure pilot-access-gateway-login authorizes the portal-user group"
      ansible.builtin.command:
        argv: [ipa, hbacrule-add-user, pilot-access-gateway-login, "--groups={{ gateway_effective_portal_user_group }}"]
      register: gateway_login_hbac_group
      changed_when: "'Number of members added 1' in (gateway_login_hbac_group.stdout | default(''))"
      failed_when:
        - gateway_login_hbac_group.rc != 0
        - "'already a member' not in (gateway_login_hbac_group.stdout | default('') + gateway_login_hbac_group.stderr | default(''))"
      tags: [AG_service]

    # Now a genuine SSSD-visibility sanity check (Step 4's getent-admin
    # check above proves SSSD works in general; this proves it specifically
    # for the group this playbook just created/confirmed above) rather than
    # "an operator forgot to run the roster" — the group-add task above
    # already fails closed on any error `already exists` doesn't explain.
    - name: "Verify portal-user group resolves via SSSD (never a local fallback)"
      ansible.builtin.command:
        argv: [getent, group, "{{ gateway_effective_portal_user_group }}"]
      register: gateway_portal_group_check
      changed_when: false
      failed_when: false
      tags: [AG_service]

    - name: "Gate: portal-user group must resolve via SSSD"
      ansible.builtin.assert:
        that:
          # In check mode the group-add above is skipped, so a group this
          # run would create cannot resolve yet.
          - gateway_portal_group_check.rc == 0 or ansible_check_mode
        fail_msg: >-
          Group {{ gateway_effective_portal_user_group }} was just
          created/confirmed in FreeIPA above but does not resolve locally
          via getent. This points at an SSSD/enrollment problem on this
          host, not a missing group — this playbook deliberately never
          creates a local fallback group, which would silently shadow the
          real FreeIPA group forever once SSSD does catch up
          (nsswitch.conf's "files" source is checked before "sss").
      tags: [AG_service]

    # Default TRUE (pilot_access_gateway_portal_automember): make every
    # FreeIPA account a portal user automatically via a FreeIPA automember
    # rule on gateway_effective_portal_user_group, instead of an operator
    # hand-listing members in the freeipa-identity roster. Same
    # self-provisioning principle as the group/HBAC rule above, and the
    # same command+register+changed_when+failed_when idiom gateway-scope-
    # apply.yml already uses for its own (hostgroup-type) automember rule.
    - name: "Automember: ensure rule exists for the portal-user group"
      ansible.builtin.command:
        argv: [ipa, automember-add, "{{ gateway_effective_portal_user_group }}", --type=group, "--desc=Pilot Access Gateway: every FreeIPA account joins automatically (except excluded)"]
      register: gateway_portal_automember_add
      changed_when: "'Added automember rule' in (gateway_portal_automember_add.stdout | default(''))"
      failed_when:
        - gateway_portal_automember_add.rc != 0
        - "'already exists' not in (gateway_portal_automember_add.stderr | default(''))"
      when: pilot_access_gateway_effective_portal_automember | bool
      tags: [AG_service]

    - name: "Automember: ensure inclusive uid=.* condition exists (matches every FreeIPA account)"
      ansible.builtin.command:
        argv: [ipa, automember-add-condition, "{{ gateway_effective_portal_user_group }}", --type=group, --key=uid, --inclusive-regex=.*]
      register: gateway_portal_automember_inclusive
      changed_when: "'Number of conditions added 1' in (gateway_portal_automember_inclusive.stdout | default(''))"
      failed_when: gateway_portal_automember_inclusive.rc != 0
      when: pilot_access_gateway_effective_portal_automember | bool
      tags: [AG_service]

    # Found live on vm-target (2026-09-16): an unqualified `uid=.*`
    # inclusive condition also sweeps in FreeIPA's own `admin` account —
    # the same account this site's `admin-breakglass-access` HBAC rule
    # (hostcat=all) exists to give unconditional emergency shell access to
    # every host, including this gateway. Excluding it here keeps that
    # break-glass path intact; pass an empty
    # pilot_access_gateway_portal_automember_exclude_users list to opt out
    # of this safety default and truly sweep in every account.
    - name: "Automember: exclude break-glass accounts from auto-joining"
      ansible.builtin.command:
        argv: [ipa, automember-add-condition, "{{ gateway_effective_portal_user_group }}", --type=group, --key=uid, "--exclusive-regex=^{{ item }}$"]
      register: gateway_portal_automember_exclusive
      changed_when: "'Number of conditions added 1' in (gateway_portal_automember_exclusive.stdout | default(''))"
      failed_when: gateway_portal_automember_exclusive.rc != 0
      loop: "{{ pilot_access_gateway_effective_portal_automember_exclude_users }}"
      when: pilot_access_gateway_effective_portal_automember | bool
      tags: [AG_service]

    # Automember conditions are only evaluated at object-creation time (see
    # gateway-scope-apply.yml's own comment on the same limitation for
    # hosts), so without a one-time backfill, accounts that existed before
    # this rule was added would never join. MUST be the untargeted form:
    # found live that `ipa automember-rebuild --type=group --users=<name>`
    # silently ignores exclusive-regex conditions and re-adds an excluded
    # account anyway, while the untargeted `automember-rebuild --type=group`
    # (no --users/--hosts filter) correctly honors them. changed_when is
    # deliberately false — ipa's own output only reports how many entries
    # it evaluated, never whether membership actually changed, so treating
    # this as always-changed would just spam the play recap; the operation
    # itself converges to the same membership regardless of how many times
    # it runs, so running it on every apply is safe.
    - name: "Automember: backfill existing FreeIPA accounts into the portal-user group"
      ansible.builtin.command:
        argv: [ipa, automember-rebuild, --type=group]
      register: gateway_portal_automember_rebuild
      changed_when: false
      failed_when: gateway_portal_automember_rebuild.rc != 0
      when: pilot_access_gateway_effective_portal_automember | bool
      tags: [AG_service]

    - name: "Ensure /etc/pilot exists"
      ansible.builtin.file:
        path: /etc/pilot
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [AG_service]

    # Step 8 (spec.md §55/§56): provision the read-only reader keytab.
    # Idempotent by construction (spec.md §56: "禁止每次 ordinary apply
    # 無條件 rotate keytab") — ipa-getkeytab always increments kvno and
    # invalidates the previous key material, so it must only ever run
    # once per host; a real rotation is a deliberate, separate lifecycle
    # operation (spec.md §47), not something an ordinary reapply does.
    - name: "Step 8: check whether the gateway keytab already exists"
      ansible.builtin.stat:
        path: /etc/pilot/pilot-access-gateway.keytab
      register: gateway_keytab_stat
      tags: [AG_keytab]

    - name: "Step 8: create the gateway service principal (idempotent)"
      ansible.builtin.command:
        argv: [ipa, service-add, "pilot-access-gateway/{{ gateway_effective_fqdn }}"]
      register: gateway_service_add
      changed_when: "'Added service' in (gateway_service_add.stdout | default(''))"
      failed_when:
        - gateway_service_add.rc != 0
        - "'already exists' not in (gateway_service_add.stderr | default(''))"
      tags: [AG_keytab]

    - name: "Step 8: fetch the gateway keytab (ONLY when it does not exist yet)"
      ansible.builtin.command:
        argv:
          - ipa-getkeytab
          - -s
          - "{{ gateway_effective_freeipa_servers[0] }}"
          - -p
          - "pilot-access-gateway/{{ gateway_effective_fqdn }}"
          - -k
          - /etc/pilot/pilot-access-gateway.keytab
      when: not gateway_keytab_stat.stat.exists
      changed_when: true
      tags: [AG_keytab]

    # Under --check on a fresh host the keytab retrieval above is skipped,
    # so there is no file to fix up yet (AGENTS.md §4.0 fresh-host check).
    - name: "Step 8: keytab ownership/mode (spec.md §10.3, AG03)"
      ansible.builtin.file:
        path: /etc/pilot/pilot-access-gateway.keytab
        owner: "{{ pilot_gateway_user }}"
        group: "{{ pilot_gateway_user }}"
        mode: "0400"
      when: not (ansible_check_mode and not gateway_keytab_stat.stat.exists)
      tags: [AG_keytab, AG03]

    # Step 11 (spec.md §55): access-gateway.yaml — matches
    # internal/gatewayconfig/config.go's Config struct exactly (kept in
    # sync manually; see docs/evidence for the cross-check test).
    #
    # 2026-09-16: cache_ttl/connect_max_age removed — spec.md §26's
    # original example config had them, but no code anywhere ever read
    # them (see FreeIPASection's own doc comment in config.go). Every
    # gateway generated one into its config regardless, misleading an
    # operator into thinking access decisions are cached when they never
    # were (accessportal.LoadUserAccess always hits FreeIPA fresh).
    # Metrics (per-host recording spec §31): soft — enabled only when the
    # node_exporter textfile directory exists, never a failure. Both tasks
    # are tagged always because Step 11 and the service unit read the
    # result (AGENTS.md §4.4).
    - name: "Metrics: check for the node_exporter textfile directory"
      ansible.builtin.stat:
        path: "{{ gateway_metrics_textfile_dir }}"
      register: gateway_metrics_dir
      tags: [always]

    - name: "Metrics: decide the metrics textfile path"
      ansible.builtin.set_fact:
        gateway_metrics_textfile_path: >-
          {{ gateway_metrics_dir.stat.get('isdir', false)
             | ternary(gateway_metrics_textfile_dir ~ '/pilot_access_gateway.prom', '') }}
      tags: [always]

    - name: "Metrics: note that metrics stay disabled without node_exporter's textfile directory"
      ansible.builtin.debug:
        msg: >-
          {{ gateway_metrics_textfile_dir }} does not exist, so pilot-access-gateway
          writes no metrics textfile. Deploy host-monitoring (node_exporter) and
          re-apply to enable them.
      when: gateway_metrics_textfile_path | length == 0
      tags: [AG55]

    - name: "Step 11: install access-gateway.yaml"
      ansible.builtin.copy:
        dest: /etc/pilot/access-gateway.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          gateway:
            id: {{ gateway_id }}
            scope: {{ gateway_scope }}
            fqdn: {{ gateway_effective_fqdn }}
            target_hostgroup: {{ gateway_target_hostgroup }}
            socket_path: {{ gateway_socket_path }}
            portal_user_group: {{ gateway_effective_portal_user_group }}
            freeipa:
              servers:
          {% for server in gateway_effective_freeipa_servers %}
                - {{ server }}
          {% endfor %}
              ca_file: {{ ipa_ca_file }}
              service_principal: pilot-access-gateway/{{ gateway_effective_fqdn }}@{{ gateway_effective_ipa_realm }}
              keytab: /etc/pilot/pilot-access-gateway.keytab
              request_timeout: 5s
            recording:
          {% if pilot_session_recording_mode is defined %}
              mode: {{ pilot_session_recording_mode }}
          {% endif %}
              failure_policy: {{ gateway_effective_recording_failure_policy }}
              queue_events: {{ gateway_effective_recording_queue_events }}
              flush_interval: {{ gateway_effective_recording_flush_interval }}
              failure_grace: {{ gateway_effective_recording_failure_grace }}
              max_session_duration: {{ gateway_effective_recording_max_session_duration }}
          {% if gateway_effective_session_store_url | length > 0 %}
              session_store_url: {{ gateway_effective_session_store_url }}
              session_store_ca_file: {{ gateway_effective_session_store_ca_file }}
              session_store_ingest_signing_key_file: {{ gateway_session_store_signing_key_file }}
          {% endif %}
          {% if gateway_metrics_textfile_path | length > 0 %}
            metrics:
              textfile_path: {{ gateway_metrics_textfile_path }}
          {% endif %}
      register: gateway_config_copy
      tags: [AG_config, AG01, AG41, AG55]

    # Per-session ingest token signing key (per-host recording spec §16):
    # present only when a session store is configured, owned by the service
    # user like the keytab. The gateway mints one short-lived token per
    # recorded session with it; the key itself never leaves this host.
    - name: "Install the session-store ingest signing key (AG42)"
      ansible.builtin.copy:
        dest: "{{ gateway_session_store_signing_key_file }}"
        owner: "{{ pilot_gateway_user }}"
        group: "{{ pilot_gateway_user }}"
        mode: "0400"
        content: "{{ pilot_session_store_ingest_signing_key | lower }}\n"
      no_log: true
      register: gateway_signing_key_copy
      when: gateway_effective_session_store_url | length > 0
      tags: [AG_config, AG42]

    - name: "Remove the session-store ingest signing key when no store is configured (AG42)"
      ansible.builtin.file:
        path: "{{ gateway_session_store_signing_key_file }}"
        state: absent
      register: gateway_signing_key_remove
      when: gateway_effective_session_store_url | length == 0
      tags: [AG_config, AG42]

    - name: "Remove the former static session-store bearer token file (AG43)"
      ansible.builtin.file:
        path: "{{ gateway_legacy_session_store_token_file }}"
        state: absent
      tags: [AG_config, AG43]

    # Step 12 (spec.md §55/§32): root-owned SSH client config — MUST stay
    # byte-identical to cmd/pilot/cmd/portal_ssh.go's pilotSSHConfig
    # constant (a Go-level test in that package asserts this; see
    # portal_ssh_config_sync_test.go).
    #
    # 2026-09-16: ProxyCommand switched from "none" + a GlobalKnownHostsFile
    # populated by ssh-keyscan at apply time (removed from Step 13 below) to
    # sss_ssh_knownhostsproxy, the same SSSD-provided host-key resolver
    # freeipa-client-apply.yml's own ssh_config.d/04-ipa.conf already uses
    # for exactly this purpose. Two real problems with the old approach:
    # (1) a host added to pilot-target-<scope> *after* this apply ran had no
    # known_hosts entry and StrictHostKeyChecking rejected it outright until
    # the next re-apply; (2) ssh-keyscan itself is blind TOFU — it trusts
    # whatever key a host presents at scan time with no verification at
    # all, weaker than resolving the host's actual ipaSshPubKey attribute
    # (an authoritative value set at enrollment) via SSSD/FreeIPA on every
    # connection. sss_ssh_knownhostsproxy also doubles as the actual
    # connection relay (it is designed to be used as ProxyCommand, not just
    # a lookup) — but it does NOT by itself satisfy StrictHostKeyChecking;
    # GlobalKnownHostsFile still has to point at SSSD's own dynamically
    # maintained cache (found live on vm-target: dropping
    # GlobalKnownHostsFile entirely, on the theory that ProxyCommand alone
    # was enough, produced "No ED25519 host key is known ... Host key
    # verification failed" — sssd keeps /var/lib/sss/pubconf/known_hosts
    # current as it resolves each host's ipaSshPubKey, which is what
    # verification actually reads).
    - name: "Step 12: install root-owned SSH config (spec.md §32)"
      ansible.builtin.copy:
        dest: /etc/pilot/ssh_config
        owner: root
        group: root
        mode: "0644"
        content: |
          Host *
              ForwardAgent no
              ClearAllForwardings yes

              PermitLocalCommand no
              EnableEscapeCommandline no
              EscapeChar none

              ProxyJump none
              ProxyCommand /usr/bin/sss_ssh_knownhostsproxy -p %p %h

              StrictHostKeyChecking yes
              UserKnownHostsFile /dev/null
              GlobalKnownHostsFile /var/lib/sss/pubconf/known_hosts

              GSSAPIAuthentication yes
              GSSAPIDelegateCredentials no
              PreferredAuthentications gssapi-with-mic

              BatchMode yes
              PubkeyAuthentication no
              KbdInteractiveAuthentication no
              PasswordAuthentication no

              RequestTTY force
        validate: '/usr/bin/ssh -G -F %s target.invalid'
      tags: [AG_config, AG32]

    # Remove the stale ssh-keyscan snapshot an older version of this
    # playbook installed — /etc/pilot/ssh_config no longer references it
    # (see the 2026-09-16 comment on Step 12's ProxyCommand above), and a
    # leftover file would be a confusing dead artifact on any gateway
    # host that was set up before this change.
    - name: "Remove stale /etc/pilot/ssh_known_hosts snapshot (superseded by sss_ssh_knownhostsproxy)"
      ansible.builtin.file:
        path: /etc/pilot/ssh_known_hosts
        state: absent
      tags: [AG_config]

    # Step 13 (spec.md §55): existence check for Step 18's gate below.
    # Host-key trust for the target scope is Step 12's job now, not this
    # one — see the 2026-09-16 comment on /etc/pilot/ssh_config's
    # ProxyCommand for why the old ssh-keyscan-at-apply-time snapshot
    # approach that used to live here was replaced.
    - name: "Step 13: resolve current pilot-target-<scope> membership (existence check)"
      ansible.builtin.command:
        argv: [ipa, hostgroup-show, "{{ gateway_target_hostgroup }}", --all]
      register: gateway_target_hostgroup_show
      changed_when: false
      failed_when: false
      tags: [AG_config]

    # Step 9/10 (spec.md §55): install both binaries.
    - name: "Step 9: install pilot CLI"
      ansible.builtin.copy:
        src: "{{ pilot_binary_abs_path }}"
        dest: /usr/bin/pilot
        owner: root
        group: root
        mode: "0755"
      tags: [AG_service]

    - name: "Ensure /usr/local/libexec exists (spec.md §25 — not all distros pre-create it)"
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [AG_service]

    - name: "Step 10: install pilot-access-gateway binary"
      ansible.builtin.copy:
        src: "{{ pilot_access_gateway_binary_abs_path }}"
        dest: /usr/local/libexec/pilot-access-gateway
        owner: root
        group: root
        mode: "0755"
      register: gateway_binary_copy
      tags: [AG_service]

    # Step 14 (spec.md §55/§33): pilot-session ForceCommand wrapper. No
    # portal.yaml here — Phase 4/5's `pilot portal` already defaults
    # --socket/--ssh-config to spec.md §25/§26's own paths, so a separate
    # config file would be pure redundancy (deliberate simplification
    # from spec.md §33's literal script, recorded in the Phase 7
    # evidence doc).
    #
    # docs/tmp/now/spec.md Phase 5 (§16/§17): this script's own content is
    # UNCHANGED from Phase 7/8 — it still never references
    # $SSH_ORIGINAL_COMMAND itself (D7). Only what it execs into changed:
    # `pilot portal` (always interactive, ignored SSH_ORIGINAL_COMMAND
    # entirely) -> `pilot portal-session` (a hidden dispatcher that reads
    # SSH_ORIGINAL_COMMAND itself, in Go, and either runs the same
    # interactive path, runs the new one-shot `pilot-connect <session-id>
    # <target-fqdn>` handoff, or denies — see cmd/pilot/cmd/portal_session.go).
    - name: "Step 14: install pilot-session"
      ansible.builtin.copy:
        dest: /usr/local/libexec/pilot-session
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu

          [ -t 0 ] || exit 1

          unset SSH_AUTH_SOCK
          unset LD_PRELOAD
          unset LD_LIBRARY_PATH
          unset PILOT_CONFIG
          unset PILOT_DATA_DIR

          export PATH=/usr/bin:/bin

          exec /usr/bin/pilot portal-session
      tags: [AG_service, AG34]

    # Step 15 (spec.md §55/§29/§30): systemd socket + service units.
    - name: "Step 15: install pilot-access-gateway.socket"
      ansible.builtin.copy:
        dest: /etc/systemd/system/pilot-access-gateway.socket
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Pilot Access Gateway Socket

          [Socket]
          ListenStream={{ gateway_socket_path }}
          SocketUser={{ pilot_gateway_user }}
          SocketGroup={{ gateway_effective_portal_user_group }}
          SocketMode=0660
          RemoveOnStop=true
          RuntimeDirectory=pilot

          [Install]
          WantedBy=sockets.target
      register: gateway_socket_unit
      tags: [AG_service, AG09]

    - name: "Step 15: install pilot-access-gateway.service"
      ansible.builtin.copy:
        dest: /etc/systemd/system/pilot-access-gateway.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Pilot Access Gateway
          Requires=pilot-access-gateway.socket
          After=network-online.target sssd.service
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ pilot_gateway_user }}
          Group={{ pilot_gateway_user }}

          ExecStart=/usr/local/libexec/pilot-access-gateway serve --config /etc/pilot/access-gateway.yaml --systemd-socket

          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true

          ReadOnlyPaths=/etc/pilot
          ReadOnlyPaths=/etc/ipa
          {% if gateway_metrics_textfile_path | length > 0 %}
          ReadWritePaths={{ gateway_metrics_textfile_dir }}
          {% endif %}

          [Install]
          WantedBy=multi-user.target
      register: gateway_service_unit
      tags: [AG_service, AG55]

    - name: "Step 15: daemon-reload"
      ansible.builtin.systemd:
        daemon_reload: true
      when: gateway_socket_unit.changed or gateway_service_unit.changed
      tags: [AG_service]

    # Step 16 (spec.md §55): start the socket (not the service directly
    # — socket activation starts the service on first connection).
    # A fresh host previewed with --check --diff never had the unit file
    # written, so systemd cannot find it: skip rather than fail the preview.
    - name: "Step 16: enable + start pilot-access-gateway.socket"
      ansible.builtin.systemd:
        name: pilot-access-gateway.socket
        enabled: true
        state: started
      when: not (ansible_check_mode and gateway_socket_unit.changed)
      tags: [AG_service]

    # `state: started` above is a no-op if the socket unit was already
    # running under an OLDER version of its own unit file — an in-place
    # unit-file edit needs an explicit restart to actually take effect.
    - name: "Restart pilot-access-gateway.socket if its unit file changed"
      ansible.builtin.systemd:
        name: pilot-access-gateway.socket
        state: restarted
      when: gateway_socket_unit.changed and not ansible_check_mode
      tags: [AG_service]

    # A changed binary or config must actually take effect — restart the
    # (stateless — spec.md §46) service so it re-execs with the new
    # binary/config instead of continuing to run the old in-memory one.
    # The socket itself is untouched (RemoveOnStop=true would drop
    # in-flight connections pointlessly here).
    - name: "Restart pilot-access-gateway.service if its unit, binary, config or signing key changed"
      ansible.builtin.systemd:
        name: pilot-access-gateway.service
        state: restarted
      when:
        - not ansible_check_mode
        - >-
          gateway_service_unit.changed or gateway_binary_copy.changed or gateway_config_copy.changed
          or (gateway_signing_key_copy.changed | default(false))
          or (gateway_signing_key_remove.changed | default(false))
      tags: [AG_service]

    # Step 17 (spec.md §55): capability probe — a real connection over
    # the real socket, triggering socket activation, checked via the
    # service's own /v1/health. Both this and its gate below are
    # skipped under --check: the systemd tasks above that would actually
    # start/restart the service are themselves simulated (not real) in
    # check mode, so on a genuinely fresh bootstrap the socket doesn't
    # exist yet to probe — `command` isn't check_mode-aware by default,
    # so without this guard the task silently no-ops and the gate then
    # crashes trying to from_json an empty stdout instead of skipping
    # cleanly (found live 2026-09-15, first --check --diff preview of a
    # from-scratch pilot-access-gateway install).
    - name: "Step 17: capability probe FreeIPA via /v1/health"
      ansible.builtin.command:
        argv: [curl, --silent, --show-error, --fail, --unix-socket, "{{ gateway_socket_path }}", "http://localhost/v1/health"]
      register: gateway_health_probe
      changed_when: false
      retries: 3
      delay: 2
      until: gateway_health_probe.rc == 0
      when: not ansible_check_mode
      tags: [AG_service, AG06]

    - name: "Step 17: gate — health probe reports ok"
      ansible.builtin.assert:
        that:
          - (gateway_health_probe.stdout | from_json).status == 'ok'
        fail_msg: "health probe did not report status=ok: {{ gateway_health_probe.stdout }}"
      when: not ansible_check_mode
      tags: [AG_service]

    # Step 18 (spec.md §55): configured pilot-target-<scope> must
    # actually exist before ForceCommand is ever installed — fail closed
    # (spec.md §9.5) rather than silently proceeding with an empty scope.
    # Skipped under --check: gateway_target_hostgroup_show comes from
    # Step 13's `command` task, itself skipped in check mode (not
    # check_mode-aware by default), so `.rc` doesn't exist on the
    # skipped-task dict there — a bare dot-access on a missing key raises
    # a real AttributeError rather than evaluating Undefined/falsy (the
    # same `x.key` vs. `x.get(key, default)` gotcha already hit in
    # freeipa-dns-apply.yml and internal-endpoint), so this must not run
    # against that placeholder during a preview.
    - name: "Step 18: verify configured pilot-target-<scope> exists"
      ansible.builtin.assert:
        that:
          - gateway_target_hostgroup_show.rc == 0
        fail_msg: "{{ gateway_target_hostgroup }} does not exist — run `pilot gateway-scope reconcile --scope {{ gateway_scope }} ...` first (spec.md Phase 6)."
      when: not ansible_check_mode
      tags: [AG_service, AG12]

    # Step 19-21 (spec.md §55): sshd ForceCommand. GATED — see the file
    # header comment and spec.md §0 G4/§55.1. Deliberately NOT exercised
    # by Phase 7's own vm-target run; Phase 8 owns turning this on for
    # real, only after the §55.1 lockout regression test has passed.
    - name: "Step 19: install sshd ForceCommand drop-in (GATED — see spec.md §55.1)"
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/90-pilot-access-gateway.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          Match Group {{ gateway_effective_portal_user_group }}
              ForceCommand /usr/local/libexec/pilot-session
              PermitTTY yes

              DisableForwarding yes
              AllowAgentForwarding no
              AllowTcpForwarding no
              X11Forwarding no
              PermitTunnel no
              PermitUserRC no
      when: pilot_access_gateway_effective_install_forcecommand | bool
      register: gateway_forcecommand_dropin
      tags: [AG_forcecommand]

    - name: "Step 20: sshd -t"
      ansible.builtin.command:
        argv: [sshd, -t]
      when: pilot_access_gateway_effective_install_forcecommand | bool and gateway_forcecommand_dropin.changed
      changed_when: false
      tags: [AG_forcecommand]

    - name: "Step 21: reload sshd"
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
      when: pilot_access_gateway_effective_install_forcecommand | bool and gateway_forcecommand_dropin.changed
      tags: [AG_forcecommand]

    # Rollback path (spec.md §55.1 step 3): flipping the flag back to
    # false and re-applying must actually remove the drop-in, not just
    # skip re-installing it — otherwise an operator has no declarative
    # way to undo step 19 short of hand-editing the host, which defeats
    # the point of gating this behind a variable at all. Verified live
    # as part of the §55.1 lockout regression test (Phase 8 evidence).
    - name: "Step 19 rollback: remove sshd ForceCommand drop-in when disabled"
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/90-pilot-access-gateway.conf
        state: absent
      when: not (pilot_access_gateway_effective_install_forcecommand | bool)
      register: gateway_forcecommand_dropin_removed
      tags: [AG_forcecommand]

    - name: "Step 20 rollback: sshd -t after removing the drop-in"
      ansible.builtin.command:
        argv: [sshd, -t]
      when: not (pilot_access_gateway_effective_install_forcecommand | bool) and gateway_forcecommand_dropin_removed.changed
      changed_when: false
      tags: [AG_forcecommand]

    - name: "Step 21 rollback: reload sshd after removing the drop-in"
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
      when: not (pilot_access_gateway_effective_install_forcecommand | bool) and gateway_forcecommand_dropin_removed.changed
      tags: [AG_forcecommand]
