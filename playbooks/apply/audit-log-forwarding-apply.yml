# Apply playbook for docs/verification/audit-log-forwarding.md v1.9
# auditd custom rules (setuid/setgid change+exec, sudo, /etc/passwd,
# /etc/sudoers) + logrotate + rsyslog forwarding to a central SIEM receiver
# (docs/verification/log-server.md).
#
# Usage (dry run):
#   ./pilot vm-target run --name audit-log-forwarding \
#     playbooks/apply/audit-log-forwarding-apply.yml \
#     -e siem_forward_host=192.168.122.6 --check --diff
#
# Real apply:
#   ./pilot vm-target run --name audit-log-forwarding \
#     playbooks/apply/audit-log-forwarding-apply.yml \
#     -e siem_forward_host=192.168.122.6
#
# Variables (see docs/verification/audit-log-forwarding.md §1.5):
#   siem_forward_host        optional — IP/FQDN of the log-server target. If
#                            omitted, auto-resolved from inventory (the
#                            log-server group's host, else wazuh-manager's,
#                            since it supersedes log-server as SIEM receiver
#                            when both are wired) — no group_vars/-e needed
#                            in the common case. If neither is wired either,
#                            the host still gets local auditd monitoring but
#                            the /etc/hosts pin and 99-siem-forward.conf are
#                            skipped (spec C15-C17 not applicable — spec §5)
#   siem_forward_port        default: 514
#   audit_logrotate_rotate   default: 14
#   audit_logrotate_maxage   default: 90
#   syslog_logrotate_rotate  default: 14
#   syslog_logrotate_maxage  default: 90
#
# Stage gating (same convention as freeipa-server-apply.yml):
#   sandbox  default; runs immediately
#   staging  requires -e confirm_staging=true
#   prod     requires -e confirm_prod=true AND staging_attested_within_hours<=168
- name: Apply audit-log-forwarding (auditd rules + rsyslog forward to SIEM)
  hosts: "{{ target_group | default('audit-log-forwarding') }}"
  become: true
  gather_facts: true
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168
    audit_syslog_path: "{{ '/var/log/messages' if ansible_os_family == 'RedHat' else '/var/log/syslog' }}"
    audit_syslog_group: "{{ 'root' if ansible_os_family == 'RedHat' else 'syslog' }}"
    audit_rules_dest: /etc/audit/rules.d/99-custom.rules
    siem_forward_conf: /etc/rsyslog.d/99-siem-forward.conf
    siem_forward_alias: siem-log-server
    siem_queue_spool: "{{ '/var/lib/rsyslog/pilot-siem' if ansible_os_family == 'RedHat' else '/var/spool/rsyslog/pilot-siem' }}"
    audit_syslog_plugin_conf: /etc/audit/plugins.d/syslog.conf
    # Prefer an explicit -e/group_vars/host_vars value; otherwise resolve the
    # central SIEM receiver from the actual inventory: the log-server group
    # if it has a host, else wazuh-manager (which supersedes log-server as
    # the syslog receiver when both are wired, see site.yml's own note on
    # this). Same "explicit overrides inventory-derived" pattern as
    # log-shipping-apply.yml's loki_target_host/loki_inventory_target_host.
    siem_forward_inventory_host: >-
      {{ (hostvars[groups['log-server'][0]].ansible_host | default(groups['log-server'][0], true))
         if (groups['log-server'] | default([]) | length > 0)
         else ((hostvars[groups['wazuh-manager'][0]].ansible_host | default(groups['wazuh-manager'][0], true))
               if (groups['wazuh-manager'] | default([]) | length > 0) else '') }}
    siem_forward_effective_host: >-
      {{ siem_forward_host | default('', true) or siem_forward_inventory_host }}
    siem_forwarding_enabled: "{{ siem_forward_effective_host | length > 0 }}"
  pre_tasks:
    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or
            (stage == 'staging' and confirm_staging | bool) or
            (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm flag. Pass -e confirm_staging=true or confirm_prod=true."
      tags: [always]

    - name: "Gate: stage must match this host's inventory environment group"
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。inventory 的 staging/prod group 只是給
          target_group 篩選用的標籤,不會自動決定 stage——必須自己帶對的 -e stage=,
          且要跟這台機器所屬的環境 group 一致。
      tags: [always]

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
        fail_msg: "prod gate: staging attestation missing or older than 168h."
      when: stage == 'prod'
      tags: [always]

    # Values an operator may set in group_vars/host_vars (contract groupVars,
    # group_vars/<role>.example.yml). They are defaulted here instead of in
    # the play's vars:, which outrank group_vars/host_vars and silently
    # replaced the operator's value (AGENTS.md §4.5 point 3); -e still wins.
    # siem_forward_port is also wazuh-manager's input, and the two often
    # share a host. It must equal log-server's siem_receiver_tcp_port
    # (log-server-apply.yml); both fall back to 514 for an empty or null
    # value. The logrotate counts fall back too: an empty count would render
    # `rotate ` and logrotate would skip that whole policy.
    # siem_forward_port is rendered into the omfwd actions and
    # compared, as a string, with log-server's siem_receiver_tcp_port:
    # 2514.0, 0x9C4, 02514 or 70000 would be read differently by rsyslog or
    # not at all. Checked before the fallback below so that 0 is refused
    # instead of silently becoming 514; unset, null and "" mean the default.
    # An unquoted 02514 or 0x9C4 in YAML inventory is already another number
    # (1356, 2500) when Ansible reads it and passes as that number; write
    # ports in plain decimal.
    - name: "Gate: siem_forward_port is a TCP port number"
      ansible.builtin.assert:
        that:
          - >-
            siem_forward_port is not defined or siem_forward_port is none
            or (siem_forward_port | string) == ''
            or ((siem_forward_port | string) is match('^[1-9][0-9]{0,4}\Z')
                and (siem_forward_port | int) <= 65535)
        fail_msg: >-
          siem_forward_port={{ siem_forward_port | default('') }} must be a TCP port number
          from 1 to 65535, written in decimal without a sign, a fraction or leading zeros.
          Leave it unset for 514.
      tags: [always]

    - name: "Resolve inventory-overridable defaults without shadowing group_vars/host_vars"
      ansible.builtin.set_fact:
        audit_logrotate_maxage: "{{ audit_logrotate_maxage | default(90, true) }}"
        audit_logrotate_rotate: "{{ audit_logrotate_rotate | default(14, true) }}"
        siem_forward_port: "{{ siem_forward_port | default('514', true) }}"
        siem_forward_transport: "{{ siem_forward_transport | default('tcp') }}"
        siem_relp_port: "{{ siem_relp_port | default(20514) }}"
        syslog_logrotate_maxage: "{{ syslog_logrotate_maxage | default(90, true) }}"
        syslog_logrotate_rotate: "{{ syslog_logrotate_rotate | default(14, true) }}"
      tags: [always]

    - name: "Reset this run's audit and rsyslog recovery results"
      ansible.builtin.set_fact:
        audit_rules_result: {}
        siem_forward_conf_result: {}
        rsyslog_selinux_port_label: {}
        siem_forward_rsyslog_start_result: {}
        siem_forward_rsyslog_restart_result: {}
      tags: [always]

    - name: "Gate: RELP mTLS inputs"
      ansible.builtin.include_tasks:
        file: tasks/rsyslog-relp-inputs.yml
        apply:
          tags: [always]
      vars:
        siem_tls_role: sender
        siem_tls_enabled: "{{ siem_forward_transport == 'relp' }}"
      tags: [always]

    # siem_forward_port (these clients) and siem_receiver_tcp_port
    # (log-server) are separate inputs, usually set in different group_vars
    # files. When they differ, rsyslog sends where nothing listens and the
    # apply still succeeds, so check them whenever the target is this
    # inventory's log-server: its inventory name, ansible_host, or the FQDN
    # or node name its facts report, compared without case and without a
    # trailing dot (AGENTS.md §5.13). The FQDN and node name come from facts,
    # which exist only when this run gathered them for the log-server
    # (site.yml, or the log-server is also in audit-log-forwarding); in a run
    # without them, name the log-server in siem_forward_host by its inventory
    # name or address. An external receiver, or a name for the log-server
    # that none of those match, is not checked.
    - name: "Gate: siem_forward_port matches the inventory log-server's siem_receiver_tcp_port"
      ansible.builtin.assert:
        that:
          - >-
            ((siem_relp_port if siem_forward_transport == 'relp' else siem_forward_port) | string)
            == (siem_forward_receiver_port | string)
          - >-
            siem_forward_transport != 'relp' or
            (hostvars[siem_forward_log_server].siem_receiver_relp_enabled | default(false) | bool)
        fail_msg: >-
          {{ inventory_hostname }} requires {{ siem_forward_transport }} to
          {{ siem_forward_effective_host }}:{{ siem_relp_port if siem_forward_transport == 'relp' else siem_forward_port }},
          but log-server {{ siem_forward_log_server }} has port {{ siem_forward_receiver_port }}.
          Match the selected transport's port on both sides and enable the receiver's RELP listener for RELP.
      vars:
        siem_forward_target_name: "{{ (siem_forward_effective_host | string | lower).rstrip('.') }}"
        siem_forward_log_server: "{% for h in groups.get('log-server', []) if siem_forward_target_name in ([h, hostvars[h].ansible_host | default(h, true), hostvars[h].ansible_fqdn | default(''), hostvars[h].ansible_nodename | default('')] | map('string') | map('lower') | map('regex_replace', '[.]$', '') | list) %}{% if loop.first %}{{ h }}{% endif %}{% endfor %}"
        siem_forward_receiver_port: "{{ (hostvars[siem_forward_log_server].siem_relp_port | default(20514) if siem_forward_transport == 'relp' else hostvars[siem_forward_log_server].siem_receiver_tcp_port | default('514', true)) if siem_forward_log_server else '' }}"
      when:
        - siem_forwarding_enabled | bool
        # An empty for-loop renders as None, not "", in ansible-core 2.19.
        - (siem_forward_log_server | default('', true)) | length > 0
      tags: [always]
  tasks:
    - name: "Step 0: Report whether SIEM forwarding is enabled this run"
      ansible.builtin.debug:
        msg: >-
          {{ 'siem_forward_host=' + siem_forward_effective_host + ' — forwarding will be configured (spec C15-C17).'
             if siem_forwarding_enabled
             else 'siem_forward_host not provided and no log-server/wazuh-manager host in inventory — skipping /etc/hosts pin and 99-siem-forward.conf; only local auditd monitoring (C1-C14, C18) will be configured. Re-run with -e siem_forward_host=<log-server IP/FQDN>, or add a log-server/wazuh-manager host to inventory, once a SIEM receiver exists to add forwarding.' }}

    - name: "Step 0a0: Check whether Ubuntu universe component is already enabled"
      tags: [C1, C2]
      # Ubuntu 24.04+ cloud images ship a deb822 ubuntu.sources with
      # `Components: main universe restricted multiverse` already set, so
      # blindly dropping a second pilot-ubuntu-universe.list duplicates the
      # universe component and apt warns "configured multiple times" on
      # every apt operation (found via pilot vm-target on ubuntu-24.04,
      # 2026-08-19). Detect any *existing* source (classic .list or deb822
      # .sources, excluding our own managed file) that already provides
      # universe before adding a redundant one.
      ansible.builtin.shell:
        cmd: >-
          grep -rEl '(^deb\b.*\buniverse\b|^Components:.*\buniverse\b)'
          /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          2>/dev/null | grep -v '/pilot-ubuntu-universe\.list$' || true
      register: pilot_ubuntu_universe_precheck
      changed_when: false
      check_mode: false
      when: ansible_distribution == "Ubuntu"

    - name: "Step 0a: Ensure Ubuntu universe repository is enabled (state absent when another source already covers it, so a stale pilot-ubuntu-universe.list from before this fix self-heals instead of leaving a duplicate)"
      tags: [C1, C2]
      ansible.builtin.apt_repository:
        repo: "deb https://archive.ubuntu.com/ubuntu {{ ansible_distribution_release }} universe"
        filename: pilot-ubuntu-universe
        state: "{{ 'absent' if (pilot_ubuntu_universe_precheck.stdout | default('')) | length > 0 else 'present' }}"
        update_cache: false
      # update_cache is deliberately false here: this module's own internal
      # `apt-get update` would refresh (and fail loudly on) every configured
      # source, including unrelated third-party ones that have nothing to do
      # with universe (docs/superpowers/specs/2026-09-14-apt-repository-fault-tolerance-spec.md — the same incident class fixed
      # for freeipa-client). Step 1 below now goes through
      # tasks/apt-package-install.yml, whose own cache-first state machine
      # already refreshes (tolerantly of unrelated sources, fatal if the
      # Ubuntu archive itself is unhealthy) exactly when audispd-plugins has
      # no candidate yet — which is always true right after universe was
      # just enabled — so a separate manual refresh step is redundant.
      check_mode: false
      when: ansible_distribution == "Ubuntu"

    - name: "Step 1: Install auditd + audispd-plugins + rsyslog (Debian family)"
      tags: [C1, C2]
      ansible.builtin.include_tasks:
        file: tasks/apt-package-install.yml
        apply:
          tags: [C1, C2]
      vars:
        pilot_apt_packages: [auditd, audispd-plugins, rsyslog]
        pilot_apt_policy: tolerant
        pilot_apt_component: audit-log-forwarding
        pilot_apt_required_sources:
          - id: ubuntu-os
            class: os
      when: ansible_os_family == "Debian"

    - name: "Step 1a: Install audit + audispd-plugins (RedHat family — audisp is built into audit on EL8+, but the syslog plugin is a separate package on both families)"
      tags: [C1, C2]
      ansible.builtin.dnf:
        name: [audit, audispd-plugins]
        state: present
      when: ansible_os_family == "RedHat"

    # Steps 4, 5 and 5c render or edit logrotate policies and validate them
    # with logrotate, and the policies do nothing without it; minimal images
    # such as pilot-target-ubuntu do not ship it. Tagged with those steps'
    # rows so a tag-scoped run installs it too.
    - name: "Step 1b: Install logrotate (Debian family)"
      tags: [C1, C12, C13, C14, C20]
      ansible.builtin.include_tasks:
        file: tasks/apt-package-install.yml
        apply:
          tags: [C1, C12, C13, C14, C20]
      vars:
        pilot_apt_packages: [logrotate]
        pilot_apt_policy: tolerant
        pilot_apt_component: audit-log-forwarding-logrotate
        pilot_apt_required_sources:
          - id: ubuntu-os
            class: os
      when: ansible_os_family == "Debian"

    - name: "Step 1c: Install logrotate (RedHat family)"
      tags: [C1, C12, C13, C14, C20]
      ansible.builtin.dnf:
        name: logrotate
        state: present
      when: ansible_os_family == "RedHat"

    - block:
        - name: "Step 2: Render audit.rules.j2 (setuid/setgid, sudo, passwd/sudoers watches)"
          tags: [C3, C4, C5, C6, C7, C8, C9]
          ansible.builtin.template:
            src: ../templates/audit.rules.j2
            dest: "{{ audit_rules_dest }}"
            owner: root
            group: root
            mode: "0640"
            backup: true
          register: audit_rules_result

        - name: "Step 3: Load the custom rules into the running kernel audit list (spec C10)"
          tags: [C10]
          ansible.builtin.command: augenrules --load
          register: augenrules_result
          changed_when: false
          failed_when: augenrules_result.rc != 0

        - name: "Step 4: Render /etc/logrotate.d/auditd"
          tags: [C12, C14]
          ansible.builtin.copy:
            dest: /etc/logrotate.d/auditd
            owner: root
            group: root
            mode: "0644"
            backup: true
            # Fails when logrotate reports an error about this file
            # ("error: <file>:<line> ..." or "error: <file>:prerotate,
            # postrotate or preremove without endscript"), which makes it skip
            # the whole policy. `logrotate -d` alone also exits 1 for a
            # fragment that relies on /etc/logrotate.conf's global `su`
            # (Ubuntu's distro rsyslog policy: "error: skipping ..."), so its
            # rc is not used (captured on Ubuntu 24.04 and AlmaLinux 9.8,
            # 2026-10-14). Without logrotate (Step 1b installs it) it fails.
            validate: >-
              /bin/sh -c 'command -v logrotate >/dev/null && ! logrotate -d "$0" 2>&1 | grep -F -e "error: $0:"' %s
            content: |
              # Managed by ansible (audit-log-forwarding-apply.yml) — DO NOT EDIT BY HAND
              /var/log/audit/audit.log {
                  daily
                  rotate {{ audit_logrotate_rotate }}
                  maxage {{ audit_logrotate_maxage }}
                  missingok
                  notifempty
                  compress
                  delaycompress
                  postrotate
                      /sbin/service auditd rotate >/dev/null 2>&1 || true
                  endscript
              }

        - name: "Step 5: Render /etc/logrotate.d/syslog"
          tags: [C13, C14]
          ansible.builtin.copy:
            dest: /etc/logrotate.d/syslog
            owner: root
            group: root
            mode: "0644"
            # See Step 4.
            validate: >-
              /bin/sh -c 'command -v logrotate >/dev/null && ! logrotate -d "$0" 2>&1 | grep -F -e "error: $0:"' %s
            content: |
              # Managed by ansible (audit-log-forwarding-apply.yml) — DO NOT EDIT BY HAND
              {{ audit_syslog_path }} {
                  daily
                  rotate {{ syslog_logrotate_rotate }}
                  maxage {{ syslog_logrotate_maxage }}
                  missingok
                  notifempty
                  compress
                  delaycompress
                  su root {{ audit_syslog_group }}
                  sharedscripts
                  postrotate
                      systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true
                  endscript
              }

        - name: "Step 5a: Check whether the distro-shipped rsyslog logrotate policy exists"
          tags: [C20]
          ansible.builtin.stat:
            path: /etc/logrotate.d/rsyslog
          register: distro_rsyslog_logrotate

        - name: "Step 5b: Count paths the distro rsyslog policy rotates OTHER than {{ audit_syslog_path }}"
          tags: [C20]
          # Both Debian and RedHat family ship their rsyslog package's
          # logrotate policy under this exact filename (Debian: mail.log,
          # kern.log, auth.log, ...; RHEL/AlmaLinux via rsyslog-logrotate:
          # cron, maillog, messages, secure, spooler), each as one shared
          # block also listing audit_syslog_path. Since Step 5 above renders
          # our own /etc/logrotate.d/syslog for the same path, logrotate
          # finds that path declared in two policy files and aborts the
          # ENTIRE run with "duplicate log entry", silently breaking
          # rotation for every log on the host — this is the root cause of
          # the C20 regression (see docs/runbooks/audit-log-forwarding.md
          # §5.5). Only the count is needed here to decide whether removing
          # our path leaves other paths behind.
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail;
              grep -vFx {{ audit_syslog_path | quote }} /etc/logrotate.d/rsyslog
              | grep -cE '^/' || true
            executable: /bin/bash
          register: distro_rsyslog_other_paths
          changed_when: false
          check_mode: false
          when: distro_rsyslog_logrotate.stat.exists | default(false)

        - name: "Step 5c: Drop {{ audit_syslog_path }} from the distro rsyslog policy, keeping its other paths (spec C20)"
          tags: [C20]
          ansible.builtin.lineinfile:
            path: /etc/logrotate.d/rsyslog
            regexp: '^{{ audit_syslog_path | regex_escape }}$'
            state: absent
            # See Step 4: this distro policy relies on the global `su`.
            validate: >-
              /bin/sh -c 'command -v logrotate >/dev/null && ! logrotate -d "$0" 2>&1 | grep -F -e "error: $0:"' %s
          when:
            - distro_rsyslog_logrotate.stat.exists | default(false)
            - (distro_rsyslog_other_paths.stdout | default('0') | trim | int) > 0

        - name: "Step 5d: Remove the distro rsyslog policy entirely if it only rotated {{ audit_syslog_path }} (avoids leaving an orphan block with no filename)"
          tags: [C20]
          ansible.builtin.file:
            path: /etc/logrotate.d/rsyslog
            state: absent
          when:
            - distro_rsyslog_logrotate.stat.exists | default(false)
            - (distro_rsyslog_other_paths.stdout | default('0') | trim | int) == 0

        - name: "Step 6a: Resolve this host's canonical FQDN before pinning SIEM aliases"
          tags: [C15]
          ansible.builtin.command: hostname --fqdn
          check_mode: false
          changed_when: false
          register: siem_local_fqdn

        - name: "Step 6b: Keep a local SIEM receiver's FQDN canonical in /etc/hosts"
          tags: [C15]
          ansible.builtin.blockinfile:
            path: /etc/hosts
            marker: "# {mark} PILOT FQDN CANONICAL HOSTNAME"
            insertbefore: '^127\.0\.1\.1\s'
            block: >-
              {{ ansible_default_ipv4.address }} {{ siem_local_fqdn.stdout | trim }}
              {{ (siem_local_fqdn.stdout | trim).split('.')[0] }}
          when:
            - siem_forwarding_enabled | bool
            - siem_forward_effective_host == ansible_default_ipv4.address

        - name: "Step 6c: Resolve siem_forward_effective_host for the /etc/hosts pin (spec C15)"
          tags: [always]
          ansible.builtin.include_tasks:
            file: tasks/resolve-hosts-alias-target.yml
            apply:
              tags: [always]
          vars:
            hosts_alias_target_host: "{{ siem_forward_effective_host }}"
          when:
            - siem_forwarding_enabled | bool
            - siem_forward_effective_host != ansible_default_ipv4.address

        - name: "Step 6c: Pin a remote {{ siem_forward_alias }} receiver in /etc/hosts (spec C15)"
          tags: [C15]
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: '\s{{ siem_forward_alias }}$'
            line: "{{ hosts_alias_resolved_ip }}\t{{ siem_forward_alias }}"
            state: present
          when:
            - siem_forwarding_enabled | bool
            - siem_forward_effective_host != ansible_default_ipv4.address

        - name: "Step 6d: Preserve the canonical mapping when this host is the {{ siem_forward_alias }} receiver"
          tags: [C15]
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: '^\s*{{ siem_forward_effective_host | regex_escape }}\s+{{ siem_forward_alias | regex_escape }}\s*$'
            line: "{{ siem_forward_effective_host }}\t{{ siem_forward_alias }}"
            state: present
          when:
            - siem_forwarding_enabled | bool
            - siem_forward_effective_host == ansible_default_ipv4.address

        - name: "Step 6e: Enable the audisp-syslog plugin (spec C21) — without this, auditd never emits local6 traffic at all"
          tags: [C21]
          # Both Debian's audispd-plugins and RedHat's audispd-plugins ship
          # this file inactive (`active = no`) by default. Rendering
          # 99-siem-forward.conf's `local6.*` forward rule and log-server's
          # receiver is not sufficient on its own — with the plugin left
          # inactive, auditd never puts anything on local6 in the first
          # place, so /var/log/siem/<host>/audit.log never gets created no
          # matter how correct the forwarding/receiving config is (confirmed
          # live 2026-08-07, minimal-poc round 20: the receiver and forward
          # rule were both correctly deployed and audit.log still never
          # appeared on any host).
          #
          # Steps 1/1a simulate the audispd-plugins install in check mode
          # without actually installing the package (same Ansible dnf/apt
          # module behavior noted on Step 8's auditd start below), so on a
          # host that doesn't already have it, this file doesn't exist yet
          # during --check --diff preview. Deferred to the real apply, same
          # pattern as Step 8's own `when: not ansible_check_mode` guard.
          ansible.builtin.lineinfile:
            path: "{{ audit_syslog_plugin_conf }}"
            regexp: '^active\s*='
            line: "active = yes"
          register: audisp_syslog_active_result
          when: not ansible_check_mode

        - name: "Step 6f: Pin the audisp-syslog plugin's facility to local6 (spec C21)"
          tags: [C21]
          # The plugin's own man page documents an optional facility
          # argument on the args line with no stated default when omitted;
          # rather than rely on undocumented plugin behavior, pin it
          # explicitly to match what 99-siem-forward.conf/log-server.md
          # actually forward and route on (local6). Same check-mode guard
          # as Step 6e — same file, same "might not exist yet" reason.
          ansible.builtin.lineinfile:
            path: "{{ audit_syslog_plugin_conf }}"
            regexp: '^args\s*='
            line: "args = LOG_INFO LOG_LOCAL6"
          register: audisp_syslog_args_result
          when: not ansible_check_mode

        # Under SELinux, rsyslogd may connect to siem_forward_port only once the
        # port is labelled for it (see the task file); without the label every
        # forwarded message is dropped while the apply succeeds.
        # The task file registers rsyslog_selinux_port_label; reset it so the
        # label log-server-apply.yml may have added on this host earlier in
        # the same site.yml run does not trigger the restart in Step 9a.
        - name: "Step 6g: Reset the SELinux port label result"
          tags: [C16, C17]
          ansible.builtin.set_fact:
            rsyslog_selinux_port_label: {}

        - name: "Step 6g: Let rsyslogd connect to siem_forward_port under SELinux"
          tags: [C16, C17]
          ansible.builtin.include_tasks:
            file: tasks/rsyslog-selinux-tcp-port.yml
            apply:
              tags: [C16, C17]
          vars:
            rsyslog_selinux_tcp_port: "{{ siem_forward_port }}"
          when: siem_forwarding_enabled | bool

        - name: "Step 7: Install RELP and certificate validation tools (Debian)"
          tags: [C16, C17]
          ansible.builtin.include_tasks:
            file: tasks/apt-package-install.yml
            apply:
              tags: [C16, C17]
          vars:
            pilot_apt_packages: [rsyslog-relp, openssl]
            pilot_apt_policy: tolerant
            pilot_apt_component: audit-relp
            pilot_apt_required_sources:
              - {id: ubuntu-os, class: os}
          when:
            - siem_forward_transport == 'relp'
            - ansible_os_family == 'Debian'

        - name: "Step 7: Install RELP and certificate validation tools (EL)"
          tags: [C16, C17]
          ansible.builtin.dnf:
            name: [rsyslog-relp, openssl]
            state: present
          when:
            - siem_forward_transport == 'relp'
            - ansible_os_family == 'RedHat'

        - name: "Step 7: Preserve the queue engine and check RELP authentication-retry capability"
          tags: [C16, C17]
          ansible.builtin.include_tasks:
            file: tasks/rsyslog-relp-capability.yml
            apply:
              tags: [C16, C17]
          when: siem_forwarding_enabled | bool

        - name: "Step 7: Provision the sender TLS profile and snapshot its material"
          tags: [C16, C17]
          ansible.builtin.include_tasks:
            file: tasks/rsyslog-relp-tls.yml
            apply:
              tags: [C16, C17]
          vars:
            siem_tls_role: sender
            siem_tls_enabled: "{{ siem_forward_transport == 'relp' }}"
            siem_tls_config: "{{ siem_forward_conf }}"
            siem_tls_owner: "{{ audit_syslog_group }}"
          when: siem_forwarding_enabled | bool

        - name: "Step 7: Label the RELP destination port under SELinux"
          tags: [C16, C17]
          ansible.builtin.include_tasks:
            file: tasks/rsyslog-selinux-tcp-port.yml
            apply:
              tags: [C16, C17]
          vars:
            rsyslog_selinux_tcp_port: "{{ siem_relp_port }}"
          when: siem_forward_transport == 'relp'

        - name: "Step 7: Create the private disk-assisted queue spool"
          tags: [C16, C17]
          ansible.builtin.file:
            path: "{{ siem_queue_spool }}"
            state: directory
            owner: "{{ audit_syslog_group }}"
            group: "{{ audit_syslog_group }}"
            mode: "0700"
          when: siem_forwarding_enabled | bool

        - name: "Step 7: Create the queue probe directory"
          tags: [C16, C17]
          ansible.builtin.file:
            path: /usr/local/libexec
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: "Step 7: Install the loaded-queue probe"
          tags: [C16, C17]
          ansible.builtin.copy:
            src: ../files/pilot-siem-queue-check
            dest: /usr/local/libexec/pilot-siem-queue-check
            owner: root
            group: root
            mode: "0755"

        - name: "Step 7: Snapshot the existing forward config"
          tags: [always]
          ansible.builtin.stat:
            path: "{{ siem_forward_conf }}"
          register: siem_forward_snapshot

        - name: "Step 7: Keep the existing forward config for rollback"
          tags: [C16, C17]
          ansible.builtin.copy:
            src: "{{ siem_forward_conf }}"
            dest: "{{ siem_forward_conf }}.pre-audit-forwarding.bak"
            remote_src: true
            mode: "0644"
          when:
            - siem_forwarding_enabled | bool
            - siem_forward_snapshot.stat.exists
          # A backup is recovery metadata, not a managed-state change.
          changed_when: false

        - name: "Step 7: Render 99-siem-forward.conf (local6.* + auth,authpriv.* -> siem-log-server)"
          tags: [C16, C17]
          ansible.builtin.copy:
            dest: "{{ siem_forward_conf }}"
            owner: root
            group: root
            mode: "0644"
            content: |
              # Managed by ansible (audit-log-forwarding-apply.yml) — DO NOT EDIT BY HAND
              # Forward local6.* (auditd, via audisp-syslog) and auth,authpriv.*
              # to the central SIEM receiver (docs/verification/log-server.md).
              # Queues are independent, capped at 256 MiB each (plus a record).
              # Keep these stable filenames: they hold unsent audit history.
              # Plain TCP has no durable acknowledgement; queued delivery does
              # not guarantee that messages in flight at disconnect are stored.
              {% if siem_forward_transport == 'relp' %}
              module(load="omrelp" tls.tlsLib="gnutls")
              {% endif %}
              local6.* action(
                name="siem_audit" type="{{ 'omrelp' if siem_forward_transport == 'relp' else 'omfwd' }}" target="{{ siem_forward_alias }}"
                port="{{ siem_relp_port if siem_forward_transport == 'relp' else siem_forward_port }}"
              {% if siem_forward_transport == 'relp' %}
                tls="on" tls.authMode="name" tls.permittedPeer="{{ siem_relp_server_name }}"
                tls.caCert="/etc/rsyslog.d/pilot-relp-sender/ca.pem"
                tls.myCert="/etc/rsyslog.d/pilot-relp-sender/cert.pem"
                tls.myPrivKey="/etc/rsyslog.d/pilot-relp-sender/key.pem"
                tls.priorityString="NORMAL:-VERS-TLS1.0:-VERS-TLS1.1"
                timeout="5" conn.timeout="3"
                tls.permanentFailureDisablesAction="off"
                queue.timeoutShutdown="1000" queue.timeoutActionCompletion="10000"
              {% else %}
                protocol="tcp" ResendLastMSGOnReconnect="on"
              {% endif %}
              {% if siem_forward_queue_engine | default('auto') == 'disk' %}
                queue.diskQueueType="disk"
              {% endif %}
                action.resumeRetryCount="-1" action.resumeInterval="1"
                action.resumeIntervalMax="10"
                queue.type="LinkedList" queue.filename="siem_audit"
                queue.spoolDirectory="{{ siem_queue_spool }}"
                queue.size="10000" queue.highWatermark="8000" queue.lowWatermark="2000"
                queue.maxDiskSpace="256m" queue.maxFileSize="1m"
                queue.saveOnShutdown="on" queue.discardSeverity="8"
              )
              auth,authpriv.* action(
                name="siem_auth" type="{{ 'omrelp' if siem_forward_transport == 'relp' else 'omfwd' }}" target="{{ siem_forward_alias }}"
                port="{{ siem_relp_port if siem_forward_transport == 'relp' else siem_forward_port }}"
              {% if siem_forward_transport == 'relp' %}
                tls="on" tls.authMode="name" tls.permittedPeer="{{ siem_relp_server_name }}"
                tls.caCert="/etc/rsyslog.d/pilot-relp-sender/ca.pem"
                tls.myCert="/etc/rsyslog.d/pilot-relp-sender/cert.pem"
                tls.myPrivKey="/etc/rsyslog.d/pilot-relp-sender/key.pem"
                tls.priorityString="NORMAL:-VERS-TLS1.0:-VERS-TLS1.1"
                timeout="5" conn.timeout="3"
                tls.permanentFailureDisablesAction="off"
                queue.timeoutShutdown="1000" queue.timeoutActionCompletion="10000"
              {% else %}
                protocol="tcp" ResendLastMSGOnReconnect="on"
              {% endif %}
              {% if siem_forward_queue_engine | default('auto') == 'disk' %}
                queue.diskQueueType="disk"
              {% endif %}
                action.resumeRetryCount="-1" action.resumeInterval="1"
                action.resumeIntervalMax="10"
                queue.type="LinkedList" queue.filename="siem_auth"
                queue.spoolDirectory="{{ siem_queue_spool }}"
                queue.size="10000" queue.highWatermark="8000" queue.lowWatermark="2000"
                queue.maxDiskSpace="256m" queue.maxFileSize="1m"
                queue.saveOnShutdown="on" queue.discardSeverity="8"
              )
          register: siem_forward_conf_result
          when: siem_forwarding_enabled | bool

        - name: "Step 7: Validate the effective rsyslog configuration before restart"
          tags: [C16, C17, C19]
          ansible.builtin.command: rsyslogd -N1
          changed_when: false
          when: not ansible_check_mode

        - name: "Step 8: Ensure auditd enabled + started (spec C18)"
          tags: [C18]
          ansible.builtin.systemd:
            name: auditd
            state: started
            enabled: true
          # Steps 1/1a simulate the install in check mode without actually
          # installing the package, so on a host that doesn't already have
          # auditd, the unit file doesn't exist yet and this task fails with
          # "Could not find the requested service auditd". Deferred to the
          # real apply, same pattern as seaweedfs-s3-apply.yml's C5/C6/C7
          # guards and freeipa-server-apply.yml's ipa.service start.
          when: not ansible_check_mode

        - name: "Step 8c: Check whether the audisp-syslog plugin process is actually running (spec C21)"
          tags: [C21]
          # Gating the reload purely on "did this run's own lineinfile tasks
          # report changed" is not enough to be idempotent across a failed
          # run: if a PRIOR apply changed active/args but then failed before
          # reaching the reload step (rescued), the file is already correct
          # on the next run, that run's own lineinfile tasks report
          # unchanged, and the reload would be skipped forever even though
          # auditd was never actually reloaded with the new config — auditd
          # keeps running with the plugin it started with (confirmed live
          # 2026-08-07, minimal-poc round 20: exactly this sequence left
          # freeipa-server's auditd running with the plugin still inactive
          # despite a "clean", failed=0 apply). Checking the plugin's own
          # process is what actually decides whether a reload is needed,
          # independent of this run's own change bookkeeping.
          ansible.builtin.command: pgrep -x audisp-syslog
          register: audisp_syslog_process
          changed_when: false
          failed_when: false
          when: not ansible_check_mode

        - name: "Step 8a: Reload auditd if the syslog plugin config changed or isn't actually running (spec C21) — Debian family"
          tags: [C21]
          ansible.builtin.systemd:
            name: auditd
            state: restarted
          when:
            - not ansible_check_mode
            - ansible_os_family == "Debian"
            - (audisp_syslog_active_result is changed) or (audisp_syslog_args_result is changed) or (audisp_syslog_process.rc | default(1) != 0)

        - name: "Step 8b: Reload auditd if the syslog plugin config changed or isn't actually running (spec C21) — RedHat family"
          tags: [C21]
          # RHEL/AlmaLinux's auditd.service unit ships RefuseManualStop=yes
          # (a security-hardening property of the audit package — operators
          # shouldn't be able to trivially stop the audit daemon via generic
          # systemctl). `ansible.builtin.systemd: state: restarted` is a
          # stop-then-start and the stop half is refused outright:
          # "Operation refused, unit auditd.service may be requested by
          # dependency only". The traditional RHEL workaround, the SysV
          # `service` wrapper, does not exist at all on a minimal EL9 image
          # (no `initscripts`/`chkconfig` package — confirmed live
          # 2026-08-07, minimal-poc round 20: `service: command not
          # found`). The actual fix is auditd's own documented signal
          # handler (`man auditd(8)` SIGNALS: "SIGHUP causes auditd to
          # reconfigure... re-reads the configuration file... implement the
          # requested changes") — a raw signal is delivered directly to the
          # process, never goes through systemd's stop path at all, so
          # RefuseManualStop simply does not apply. Confirmed live: sending
          # this respawned the audisp-syslog plugin process and a real
          # audit event (an SSH session open) was forwarded to the central
          # SIEM receiver immediately after.
          ansible.builtin.command: pkill -HUP -x auditd
          changed_when: true
          when:
            - not ansible_check_mode
            - ansible_os_family == "RedHat"
            - (audisp_syslog_active_result is changed) or (audisp_syslog_args_result is changed) or (audisp_syslog_process.rc | default(1) != 0)

        - name: "Step 9: Ensure rsyslog enabled + started (spec C19)"
          tags: [C16, C17, C19]
          ansible.builtin.systemd:
            name: rsyslog
            state: started
            enabled: true
          register: siem_forward_rsyslog_start_result
          when: not ansible_check_mode

        - name: "Step 9a: Detect a forward config written after rsyslog started"
          tags: [C16, C17, C19]
          ansible.builtin.shell:
            executable: /bin/sh
            cmd: |
              test -f {{ siem_forward_conf | quote }} || exit 0
              if test -f /etc/rsyslog.d/pilot-relp-sender/profile.json; then
                /usr/local/libexec/pilot-siem-relp-check pending sender
                exit $?
              fi
              started=$(date -d "$(systemctl show --timestamp=us -p ActiveEnterTimestamp --value rsyslog)" +%s.%N) || exit 1
              written=$(date -r {{ siem_forward_conf | quote }} +%s.%N) || exit 1
              awk -v s="$started" -v w="$written" 'BEGIN { exit !(s < w) }' && echo pending
              exit 0
          register: siem_forward_restart_pending
          changed_when: false
          when: not ansible_check_mode

        - name: "Step 9a: Restart rsyslog only if the forward config or its SELinux port label changed"
          tags: [C16, C17, C19]
          ansible.builtin.systemd:
            name: rsyslog
            state: restarted
          register: siem_forward_rsyslog_restart_result
          when:
            - not ansible_check_mode
            - >-
              ((siem_forward_conf_result | default({})) is changed)
              or ((siem_tls_material_result | default({})) is changed)
              or ((siem_tls_profile_result | default({})) is changed)
              or ((rsyslog_selinux_port_label | default({})) is changed)
              or (rsyslog_selinux_any_port_changed | default(false) | bool)
              or (siem_forward_restart_pending.stdout | default('') == 'pending')

        - name: "Step 9b: Retire sender TLS material after returning to TCP"
          tags: [C16, C17]
          ansible.builtin.include_tasks:
            file: tasks/rsyslog-relp-retire.yml
            apply:
              tags: [C16, C17]
          vars:
            siem_tls_role: sender
          when:
            - siem_forwarding_enabled | bool
            - siem_forward_transport == 'tcp'

      rescue:
        - name: "ROLLBACK — restore sender TLS material before restoring the service"
          tags: [always]
          ansible.builtin.include_tasks:
            file: tasks/rsyslog-relp-restore.yml
            apply:
              tags: [always]
          when:
            - siem_tls_snapshot_role is defined
            - siem_tls_snapshot_role == 'sender'

        - name: "ROLLBACK — restore audit.rules.j2 backup (or remove if this was the first apply)"
          tags: [always]
          ansible.builtin.copy:
            src: "{{ audit_rules_result.backup_file }}"
            dest: "{{ audit_rules_dest }}"
            remote_src: true
            force: true
          when:
            - audit_rules_result is defined
            - audit_rules_result is changed
            - audit_rules_result.backup_file is defined

        - name: "ROLLBACK — remove audit.rules.j2 if this was the first apply (no backup exists)"
          tags: [always]
          ansible.builtin.file:
            path: "{{ audit_rules_dest }}"
            state: absent
          when:
            - audit_rules_result is defined
            - audit_rules_result is changed
            - audit_rules_result.backup_file is not defined

        - name: "ROLLBACK — reload kernel audit rules back to the restored state"
          tags: [always]
          ansible.builtin.command: augenrules --load
          changed_when: false
          failed_when: false

        - name: "ROLLBACK — restore the previous siem forward config"
          tags: [always]
          ansible.builtin.copy:
            src: "{{ siem_forward_conf }}.pre-audit-forwarding.bak"
            dest: "{{ siem_forward_conf }}"
            remote_src: true
            mode: "0644"
          when:
            - siem_forward_conf_result is defined
            - siem_forward_conf_result is changed
            - siem_forward_snapshot.stat.exists
            - not ansible_check_mode

        - name: "ROLLBACK — remove siem forward config only on first apply"
          tags: [always]
          ansible.builtin.file:
            path: "{{ siem_forward_conf }}"
            state: absent
          when:
            - siem_forward_conf_result is defined
            - siem_forward_conf_result is changed
            - not siem_forward_snapshot.stat.exists
            - not ansible_check_mode

        # Keep an untouched loaded daemon on validation failure. TLS rollback
        # can rewrite old material with new mtimes, requiring a reload for the
        # loaded-state checks. Validate the restored global config first.
        - name: "ROLLBACK — validate the restored rsyslog configuration"
          tags: [always]
          ansible.builtin.command: rsyslogd -N1 -f /etc/rsyslog.conf
          register: siem_forward_rescue_syntax
          changed_when: false
          failed_when: false
          when:
            - not ansible_check_mode
            - siem_forward_rsyslog_start_result is defined
            - siem_forward_rsyslog_restart_result is defined
            - >-
              (siem_forward_rsyslog_start_result is changed)
              or (siem_forward_rsyslog_start_result is failed)
              or (siem_forward_rsyslog_restart_result is changed)
              or (siem_forward_rsyslog_restart_result is failed)
              or (siem_tls_snapshot_role is defined and siem_tls_snapshot_role == 'sender' and
                  ((siem_tls_restore_result is defined and siem_tls_restore_result is changed)
                   or (siem_tls_remove_result is defined and siem_tls_remove_result is changed)))

        - name: "ROLLBACK — restart rsyslog with the restored configuration"
          tags: [always]
          ansible.builtin.systemd:
            name: rsyslog
            state: restarted
          when:
            - not ansible_check_mode
            - (siem_forward_rescue_syntax.rc | default(1)) == 0

        - name: "ROLLBACK — surface the original failure"
          tags: [always]
          ansible.builtin.fail:
            msg: >-
              audit-log-forwarding apply failed (see task output above); the
              audit rules and siem forward config were reverted. Runtime recovery
              is attempted after a service operation changed or failed, or TLS rollback
              changed files, and only when the restored global configuration passes validation. Otherwise the
              current rsyslog process is left untouched. Fix the failing task and re-run.
