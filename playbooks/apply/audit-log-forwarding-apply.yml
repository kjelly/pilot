# Apply playbook for docs/verification/audit-log-forwarding.md v1.1
# auditd custom rules (setuid/setgid change+exec, sudo, /etc/passwd,
# /etc/sudoers) + logrotate + rsyslog forwarding to a central SIEM receiver
# (docs/verification/log-server.md).
#
# Usage (dry run):
#   ./pilot vm-target run --name audit-log-forwarding \
#     playbooks/apply/audit-log-forwarding-apply.yml \
#     -e siem_forward_host=192.168.122.6 --check --diff
#
# Real apply:
#   ./pilot vm-target run --name audit-log-forwarding \
#     playbooks/apply/audit-log-forwarding-apply.yml \
#     -e siem_forward_host=192.168.122.6
#
# Variables (see docs/verification/audit-log-forwarding.md §1.5):
#   siem_forward_host        optional — IP/FQDN of the log-server target. If
#                            omitted, auto-resolved from inventory (the
#                            log-server group's host, else wazuh-manager's,
#                            since it supersedes log-server as SIEM receiver
#                            when both are wired) — no group_vars/-e needed
#                            in the common case. If neither is wired either,
#                            the host still gets local auditd monitoring but
#                            the /etc/hosts pin and 99-siem-forward.conf are
#                            skipped (spec C15-C17 not applicable — spec §5)
#   siem_forward_port        default: 514
#   audit_logrotate_rotate   default: 14
#   audit_logrotate_maxage   default: 90
#   syslog_logrotate_rotate  default: 14
#   syslog_logrotate_maxage  default: 90
#
# Stage gating (same convention as freeipa-server-apply.yml):
#   sandbox  default; runs immediately
#   staging  requires -e confirm_staging=true
#   prod     requires -e confirm_prod=true AND staging_attested_within_hours<=168
- name: Apply audit-log-forwarding (auditd rules + rsyslog forward to SIEM)
  hosts: "{{ target_group | default('audit-log-forwarding') }}"
  become: true
  gather_facts: true
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168
    siem_forward_port: "514"
    audit_logrotate_rotate: 14
    audit_logrotate_maxage: 90
    syslog_logrotate_rotate: 14
    syslog_logrotate_maxage: 90
    audit_syslog_path: "{{ '/var/log/messages' if ansible_os_family == 'RedHat' else '/var/log/syslog' }}"
    audit_syslog_group: "{{ 'root' if ansible_os_family == 'RedHat' else 'syslog' }}"
    audit_rules_dest: /etc/audit/rules.d/99-custom.rules
    siem_forward_conf: /etc/rsyslog.d/99-siem-forward.conf
    siem_forward_alias: siem-log-server
    audit_syslog_plugin_conf: /etc/audit/plugins.d/syslog.conf
    # Prefer an explicit -e/group_vars/host_vars value; otherwise resolve the
    # central SIEM receiver from the actual inventory: the log-server group
    # if it has a host, else wazuh-manager (which supersedes log-server as
    # the syslog receiver when both are wired, see site.yml's own note on
    # this). Same "explicit overrides inventory-derived" pattern as
    # log-shipping-apply.yml's loki_target_host/loki_inventory_target_host.
    siem_forward_inventory_host: >-
      {{ (hostvars[groups['log-server'][0]].ansible_host | default(groups['log-server'][0], true))
         if (groups['log-server'] | default([]) | length > 0)
         else ((hostvars[groups['wazuh-manager'][0]].ansible_host | default(groups['wazuh-manager'][0], true))
               if (groups['wazuh-manager'] | default([]) | length > 0) else '') }}
    siem_forward_effective_host: >-
      {{ siem_forward_host | default('', true) or siem_forward_inventory_host }}
    siem_forwarding_enabled: "{{ siem_forward_effective_host | length > 0 }}"
  pre_tasks:
    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or
            (stage == 'staging' and confirm_staging | bool) or
            (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm flag. Pass -e confirm_staging=true or confirm_prod=true."
      tags: [always]

    - name: "Gate: stage must match this host's inventory environment group"
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。inventory 的 staging/prod group 只是給
          target_group 篩選用的標籤,不會自動決定 stage——必須自己帶對的 -e stage=,
          且要跟這台機器所屬的環境 group 一致。
      tags: [always]

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
        fail_msg: "prod gate: staging attestation missing or older than 168h."
      when: stage == 'prod'
      tags: [always]
  tasks:
    - name: "Step 0: Report whether SIEM forwarding is enabled this run"
      ansible.builtin.debug:
        msg: >-
          {{ 'siem_forward_host=' + siem_forward_effective_host + ' — forwarding will be configured (spec C15-C17).'
             if siem_forwarding_enabled
             else 'siem_forward_host not provided and no log-server/wazuh-manager host in inventory — skipping /etc/hosts pin and 99-siem-forward.conf; only local auditd monitoring (C1-C14, C18) will be configured. Re-run with -e siem_forward_host=<log-server IP/FQDN>, or add a log-server/wazuh-manager host to inventory, once a SIEM receiver exists to add forwarding.' }}

    - name: "Step 0a: Ensure Ubuntu universe repository is enabled"
      tags: [C1, C2]
      ansible.builtin.apt_repository:
        repo: "deb https://archive.ubuntu.com/ubuntu {{ ansible_distribution_release }} universe"
        filename: pilot-ubuntu-universe
        state: present
        update_cache: true
      # The site deploy always runs a --check --diff preview first.  Repository
      # metadata is a prerequisite for the following apt task, so this
      # bootstrap must be real even during preview; it does not install or
      # configure the service itself.
      check_mode: false
      when: ansible_distribution == "Ubuntu"

    - name: "Step 0b: Refresh Ubuntu APT metadata after enabling universe"
      tags: [C1, C2]
      ansible.builtin.apt:
        update_cache: true
      # The following package task runs in the same --check preview.  Refresh
      # the package index for real so a fresh target can resolve universe
      # packages during that preview.
      check_mode: false
      when: ansible_distribution == "Ubuntu"

    - name: "Step 1: Install auditd + audispd-plugins + rsyslog (Debian family)"
      tags: [C1, C2]
      ansible.builtin.apt:
        name: [auditd, audispd-plugins, rsyslog]
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"
      register: apt_auditd
      until: apt_auditd is succeeded
      retries: 2

    - name: "Step 1a: Install audit + audispd-plugins (RedHat family — audisp is built into audit on EL8+, but the syslog plugin is a separate package on both families)"
      tags: [C1, C2]
      ansible.builtin.dnf:
        name: [audit, audispd-plugins]
        state: present
      when: ansible_os_family == "RedHat"

    - block:
        - name: "Step 2: Render audit.rules.j2 (setuid/setgid, sudo, passwd/sudoers watches)"
          tags: [C3, C4, C5, C6, C7, C8, C9]
          ansible.builtin.template:
            src: ../templates/audit.rules.j2
            dest: "{{ audit_rules_dest }}"
            owner: root
            group: root
            mode: "0640"
            backup: true
          register: audit_rules_result

        - name: "Step 3: Load the custom rules into the running kernel audit list (spec C10)"
          tags: [C10]
          ansible.builtin.command: augenrules --load
          register: augenrules_result
          changed_when: false
          failed_when: augenrules_result.rc != 0

        - name: "Step 4: Render /etc/logrotate.d/auditd"
          tags: [C12, C14]
          ansible.builtin.copy:
            dest: /etc/logrotate.d/auditd
            owner: root
            group: root
            mode: "0644"
            backup: true
            content: |
              # Managed by ansible (audit-log-forwarding-apply.yml) — DO NOT EDIT BY HAND
              /var/log/audit/audit.log {
                  daily
                  rotate {{ audit_logrotate_rotate }}
                  maxage {{ audit_logrotate_maxage }}
                  missingok
                  notifempty
                  compress
                  delaycompress
                  postrotate
                      /sbin/service auditd rotate >/dev/null 2>&1 || true
                  endscript
              }

        - name: "Step 5: Render /etc/logrotate.d/syslog"
          tags: [C13, C14]
          ansible.builtin.copy:
            dest: /etc/logrotate.d/syslog
            owner: root
            group: root
            mode: "0644"
            content: |
              # Managed by ansible (audit-log-forwarding-apply.yml) — DO NOT EDIT BY HAND
              {{ audit_syslog_path }} {
                  daily
                  rotate {{ syslog_logrotate_rotate }}
                  maxage {{ syslog_logrotate_maxage }}
                  missingok
                  notifempty
                  compress
                  delaycompress
                  su root {{ audit_syslog_group }}
                  sharedscripts
                  postrotate
                      systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true
                  endscript
              }

        - name: "Step 5a: Check whether the distro-shipped rsyslog logrotate policy exists"
          tags: [C20]
          ansible.builtin.stat:
            path: /etc/logrotate.d/rsyslog
          register: distro_rsyslog_logrotate

        - name: "Step 5b: Count paths the distro rsyslog policy rotates OTHER than {{ audit_syslog_path }}"
          tags: [C20]
          # Both Debian and RedHat family ship their rsyslog package's
          # logrotate policy under this exact filename (Debian: mail.log,
          # kern.log, auth.log, ...; RHEL/AlmaLinux via rsyslog-logrotate:
          # cron, maillog, messages, secure, spooler), each as one shared
          # block also listing audit_syslog_path. Since Step 5 above renders
          # our own /etc/logrotate.d/syslog for the same path, logrotate
          # finds that path declared in two policy files and aborts the
          # ENTIRE run with "duplicate log entry", silently breaking
          # rotation for every log on the host — this is the root cause of
          # the C20 regression (see docs/runbooks/audit-log-forwarding.md
          # §5.5). Only the count is needed here to decide whether removing
          # our path leaves other paths behind.
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail;
              grep -vFx {{ audit_syslog_path | quote }} /etc/logrotate.d/rsyslog
              | grep -cE '^/' || true
            executable: /bin/bash
          register: distro_rsyslog_other_paths
          changed_when: false
          check_mode: false
          when: distro_rsyslog_logrotate.stat.exists | default(false)

        - name: "Step 5c: Drop {{ audit_syslog_path }} from the distro rsyslog policy, keeping its other paths (spec C20)"
          tags: [C20]
          ansible.builtin.lineinfile:
            path: /etc/logrotate.d/rsyslog
            regexp: '^{{ audit_syslog_path | regex_escape }}$'
            state: absent
          when:
            - distro_rsyslog_logrotate.stat.exists | default(false)
            - (distro_rsyslog_other_paths.stdout | default('0') | trim | int) > 0

        - name: "Step 5d: Remove the distro rsyslog policy entirely if it only rotated {{ audit_syslog_path }} (avoids leaving an orphan block with no filename)"
          tags: [C20]
          ansible.builtin.file:
            path: /etc/logrotate.d/rsyslog
            state: absent
          when:
            - distro_rsyslog_logrotate.stat.exists | default(false)
            - (distro_rsyslog_other_paths.stdout | default('0') | trim | int) == 0

        - name: "Step 6a: Resolve this host's canonical FQDN before pinning SIEM aliases"
          tags: [C15]
          ansible.builtin.command: hostname --fqdn
          check_mode: false
          changed_when: false
          register: siem_local_fqdn

        - name: "Step 6b: Keep a local SIEM receiver's FQDN canonical in /etc/hosts"
          tags: [C15]
          ansible.builtin.blockinfile:
            path: /etc/hosts
            marker: "# {mark} PILOT FQDN CANONICAL HOSTNAME"
            insertbefore: '^127\.0\.1\.1\s'
            block: >-
              {{ ansible_default_ipv4.address }} {{ siem_local_fqdn.stdout | trim }}
              {{ (siem_local_fqdn.stdout | trim).split('.')[0] }}
          when:
            - siem_forwarding_enabled | bool
            - siem_forward_effective_host == ansible_default_ipv4.address

        - name: "Step 6c: Pin a remote {{ siem_forward_alias }} receiver in /etc/hosts (spec C15)"
          tags: [C15]
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: '\s{{ siem_forward_alias }}$'
            line: "{{ siem_forward_effective_host }}\t{{ siem_forward_alias }}"
            state: present
          when:
            - siem_forwarding_enabled | bool
            - siem_forward_effective_host != ansible_default_ipv4.address

        - name: "Step 6d: Preserve the canonical mapping when this host is the {{ siem_forward_alias }} receiver"
          tags: [C15]
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: '^\s*{{ siem_forward_effective_host | regex_escape }}\s+{{ siem_forward_alias | regex_escape }}\s*$'
            line: "{{ siem_forward_effective_host }}\t{{ siem_forward_alias }}"
            state: present
          when:
            - siem_forwarding_enabled | bool
            - siem_forward_effective_host == ansible_default_ipv4.address

        - name: "Step 6e: Enable the audisp-syslog plugin (spec C21) — without this, auditd never emits local6 traffic at all"
          tags: [C21]
          # Both Debian's audispd-plugins and RedHat's audispd-plugins ship
          # this file inactive (`active = no`) by default. Rendering
          # 99-siem-forward.conf's `local6.*` forward rule and log-server's
          # receiver is not sufficient on its own — with the plugin left
          # inactive, auditd never puts anything on local6 in the first
          # place, so /var/log/siem/<host>/audit.log never gets created no
          # matter how correct the forwarding/receiving config is (confirmed
          # live 2026-08-07, minimal-poc round 20: the receiver and forward
          # rule were both correctly deployed and audit.log still never
          # appeared on any host).
          #
          # Steps 1/1a simulate the audispd-plugins install in check mode
          # without actually installing the package (same Ansible dnf/apt
          # module behavior noted on Step 8's auditd start below), so on a
          # host that doesn't already have it, this file doesn't exist yet
          # during --check --diff preview. Deferred to the real apply, same
          # pattern as Step 8's own `when: not ansible_check_mode` guard.
          ansible.builtin.lineinfile:
            path: "{{ audit_syslog_plugin_conf }}"
            regexp: '^active\s*='
            line: "active = yes"
          register: audisp_syslog_active_result
          when: not ansible_check_mode

        - name: "Step 6f: Pin the audisp-syslog plugin's facility to local6 (spec C21)"
          tags: [C21]
          # The plugin's own man page documents an optional facility
          # argument on the args line with no stated default when omitted;
          # rather than rely on undocumented plugin behavior, pin it
          # explicitly to match what 99-siem-forward.conf/log-server.md
          # actually forward and route on (local6). Same check-mode guard
          # as Step 6e — same file, same "might not exist yet" reason.
          ansible.builtin.lineinfile:
            path: "{{ audit_syslog_plugin_conf }}"
            regexp: '^args\s*='
            line: "args = LOG_INFO LOG_LOCAL6"
          register: audisp_syslog_args_result
          when: not ansible_check_mode
          register: audisp_syslog_args_result

        - name: "Step 7: Render 99-siem-forward.conf (local6.* + auth,authpriv.* -> siem-log-server)"
          tags: [C16, C17]
          ansible.builtin.copy:
            dest: "{{ siem_forward_conf }}"
            owner: root
            group: root
            mode: "0644"
            content: |
              # Managed by ansible (audit-log-forwarding-apply.yml) — DO NOT EDIT BY HAND
              # Forward local6.* (auditd, via audisp-syslog) and auth,authpriv.*
              # to the central SIEM receiver (docs/verification/log-server.md).
              local6.*                       @@{{ siem_forward_alias }}:{{ siem_forward_port }}
              auth,authpriv.*                @@{{ siem_forward_alias }}:{{ siem_forward_port }}
          register: siem_forward_conf_result
          when: siem_forwarding_enabled | bool

        - name: "Step 8: Ensure auditd enabled + started (spec C18)"
          tags: [C18]
          ansible.builtin.systemd:
            name: auditd
            state: started
            enabled: true
          # Steps 1/1a simulate the install in check mode without actually
          # installing the package, so on a host that doesn't already have
          # auditd, the unit file doesn't exist yet and this task fails with
          # "Could not find the requested service auditd". Deferred to the
          # real apply, same pattern as seaweedfs-s3-apply.yml's C5/C6/C7
          # guards and freeipa-server-apply.yml's ipa.service start.
          when: not ansible_check_mode

        - name: "Step 8c: Check whether the audisp-syslog plugin process is actually running (spec C21)"
          tags: [C21]
          # Gating the reload purely on "did this run's own lineinfile tasks
          # report changed" is not enough to be idempotent across a failed
          # run: if a PRIOR apply changed active/args but then failed before
          # reaching the reload step (rescued), the file is already correct
          # on the next run, that run's own lineinfile tasks report
          # unchanged, and the reload would be skipped forever even though
          # auditd was never actually reloaded with the new config — auditd
          # keeps running with the plugin it started with (confirmed live
          # 2026-08-07, minimal-poc round 20: exactly this sequence left
          # freeipa-server's auditd running with the plugin still inactive
          # despite a "clean", failed=0 apply). Checking the plugin's own
          # process is what actually decides whether a reload is needed,
          # independent of this run's own change bookkeeping.
          ansible.builtin.command: pgrep -x audisp-syslog
          register: audisp_syslog_process
          changed_when: false
          failed_when: false
          when: not ansible_check_mode

        - name: "Step 8a: Reload auditd if the syslog plugin config changed or isn't actually running (spec C21) — Debian family"
          tags: [C21]
          ansible.builtin.systemd:
            name: auditd
            state: restarted
          when:
            - not ansible_check_mode
            - ansible_os_family == "Debian"
            - (audisp_syslog_active_result is changed) or (audisp_syslog_args_result is changed) or (audisp_syslog_process.rc | default(1) != 0)

        - name: "Step 8b: Reload auditd if the syslog plugin config changed or isn't actually running (spec C21) — RedHat family"
          tags: [C21]
          # RHEL/AlmaLinux's auditd.service unit ships RefuseManualStop=yes
          # (a security-hardening property of the audit package — operators
          # shouldn't be able to trivially stop the audit daemon via generic
          # systemctl). `ansible.builtin.systemd: state: restarted` is a
          # stop-then-start and the stop half is refused outright:
          # "Operation refused, unit auditd.service may be requested by
          # dependency only". The traditional RHEL workaround, the SysV
          # `service` wrapper, does not exist at all on a minimal EL9 image
          # (no `initscripts`/`chkconfig` package — confirmed live
          # 2026-08-07, minimal-poc round 20: `service: command not
          # found`). The actual fix is auditd's own documented signal
          # handler (`man auditd(8)` SIGNALS: "SIGHUP causes auditd to
          # reconfigure... re-reads the configuration file... implement the
          # requested changes") — a raw signal is delivered directly to the
          # process, never goes through systemd's stop path at all, so
          # RefuseManualStop simply does not apply. Confirmed live: sending
          # this respawned the audisp-syslog plugin process and a real
          # audit event (an SSH session open) was forwarded to the central
          # SIEM receiver immediately after.
          ansible.builtin.command: pkill -HUP -x auditd
          changed_when: true
          when:
            - not ansible_check_mode
            - ansible_os_family == "RedHat"
            - (audisp_syslog_active_result is changed) or (audisp_syslog_args_result is changed) or (audisp_syslog_process.rc | default(1) != 0)

        - name: "Step 9: Ensure rsyslog enabled + started (spec C19)"
          tags: [C19]
          ansible.builtin.systemd:
            name: rsyslog
            state: started
            enabled: true

        - name: "Step 9a: Restart rsyslog only if the forward config actually changed"
          tags: [C19]
          ansible.builtin.systemd:
            name: rsyslog
            state: restarted
          when: siem_forward_conf_result is changed

      rescue:
        - name: "ROLLBACK — restore audit.rules.j2 backup (or remove if this was the first apply)"
          ansible.builtin.copy:
            src: "{{ audit_rules_result.backup_file }}"
            dest: "{{ audit_rules_dest }}"
            remote_src: true
            force: true
          when:
            - audit_rules_result is defined
            - audit_rules_result.backup_file is defined

        - name: "ROLLBACK — remove audit.rules.j2 if this was the first apply (no backup exists)"
          ansible.builtin.file:
            path: "{{ audit_rules_dest }}"
            state: absent
          when:
            - audit_rules_result is defined
            - audit_rules_result.backup_file is not defined

        - name: "ROLLBACK — reload kernel audit rules back to the restored state"
          ansible.builtin.command: augenrules --load
          changed_when: false
          failed_when: false

        - name: "ROLLBACK — remove siem forward config"
          ansible.builtin.file:
            path: "{{ siem_forward_conf }}"
            state: absent

        - name: "ROLLBACK — restart rsyslog with the forward config removed"
          ansible.builtin.systemd:
            name: rsyslog
            state: restarted

        - name: "ROLLBACK — surface the original failure"
          ansible.builtin.fail:
            msg: >-
              audit-log-forwarding apply failed (see task output above); the
              audit rules and siem forward config were reverted. Fix the
              failing task and re-run.
