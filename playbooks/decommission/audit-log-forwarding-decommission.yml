# audit-log-forwarding decommission — local cleanup only.
#
# docs/superpowers/specs/2026-09-02-host-decommission-spec.md §15/§37 Phase
# 5: a generic contract-driven decommission
# (internal/decommission/providers.GenericComponentProvider), same shape as
# host-monitoring-decommission.yml.
#
# There is no registration handshake with the SIEM receiver (plain rsyslog
# `@@host:port` forwarding, no client identity/cert) — nothing central to
# deregister. The receiver's per-source-hostname log files
# (/var/log/siem/<this-host>/{audit,auth}.log, log-server-apply.yml's own
# %HOSTNAME% dynaFile templating) are historical audit-trail records, not
# active residue this component owns — this playbook never touches the
# receiver and never deletes anything there (spec's own historical-record
# semantics, the same principle INV-12 protects for Pilot's own evidence).
#
# Only removes files this component's OWN apply playbook created:
# 99-siem-forward.conf, /etc/logrotate.d/{auditd,syslog}, the custom audit
# rules, the siem_forward_alias /etc/hosts line, and reverts the
# audisp-syslog plugin's `active=` flag back to `no`. Deliberately does
# NOT touch the distro-shipped /etc/logrotate.d/rsyslog file — apply's own
# Steps 5a-5d already leave that file correctly repaired (our path removed,
# the whole file deleted only if it held nothing else), so there is nothing
# left for decommission to restore there. Also deliberately leaves
# `auditd`/`rsyslog` themselves installed and running — they are shared OS
# services, not owned exclusively by this component.
#
# Invoked ONLY by internal/decommission/providers.GenericComponentProvider
# — never directly by an operator.
#
# `--tags inspect` restricts execution to the read-only tasks in pre_tasks
# — no mutating task carries that tag — and prints the standardized marker
# every generic decommission playbook must print (spec.md §15):
# PILOT_COMPONENT_DECOMMISSIONED=true|false.
#
# Usage:
#
#   ansible-playbook -i inventory.yml \
#       playbooks/decommission/audit-log-forwarding-decommission.yml \
#       --limit <retiring-host>
#
#   # read-only enrollment check only (never mutates):
#   ansible-playbook -i inventory.yml \
#       playbooks/decommission/audit-log-forwarding-decommission.yml \
#       --limit <retiring-host> --tags inspect
#
# Stage gating (same convention as every other playbooks/decommission/*.yml):
#   sandbox  default; runs immediately
#   staging  requires -e confirm_staging=true
#   prod     requires -e confirm_prod=true AND staging_attested_within_hours<=168
---
- name: Audit-log-forwarding decommission — local auditd/rsyslog config removal
  hosts: "{{ target_group | default('audit-log-forwarding') }}"
  become: true
  gather_facts: true
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168

    audit_rules_dest: /etc/audit/rules.d/99-custom.rules
    siem_forward_conf: /etc/rsyslog.d/99-siem-forward.conf
    siem_forward_alias: siem-log-server
    audit_syslog_plugin_conf: /etc/audit/plugins.d/syslog.conf
    audit_logrotate_conf: /etc/logrotate.d/auditd
    syslog_logrotate_conf: /etc/logrotate.d/syslog

  pre_tasks:
    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or
            (stage == 'staging' and confirm_staging | bool) or
            (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm flag. Pass -e confirm_staging=true or confirm_prod=true."
      tags: [always]

    - name: "Gate: stage must match this host's inventory environment group"
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。
      tags: [always]

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
        fail_msg: "prod gate: staging attestation missing or older than 168h."
      when: stage == 'prod'
      tags: [always]

    # Read-only detection: any of these component-owned files/flags still
    # present is this component's own enrollment marker.
    - name: "Check whether component-owned files still exist (read-only)"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ audit_rules_dest }}"
        - "{{ siem_forward_conf }}"
        - "{{ audit_logrotate_conf }}"
        - "{{ syslog_logrotate_conf }}"
      register: audit_log_forwarding_decom_stat
      tags: [inspect]

    - name: "Report decommission state for external tooling"
      ansible.builtin.debug:
        msg: >-
          PILOT_COMPONENT_DECOMMISSIONED={{
            (audit_log_forwarding_decom_stat.results | selectattr('stat.exists') | list | length == 0)
            | ternary('true', 'false') }}
      tags: [inspect]

  tasks:
    - name: "Audit-log-forwarding decommission — local removal, with diagnostics on failure"
      block:
        - name: "Remove 99-siem-forward.conf"
          ansible.builtin.file:
            path: "{{ siem_forward_conf }}"
            state: absent
          register: audit_log_forwarding_decom_forward_removed
          when: not ansible_check_mode

        - name: "Restart rsyslog (forward config removed)"
          ansible.builtin.systemd:
            name: rsyslog
            state: restarted
          when:
            - not ansible_check_mode
            - audit_log_forwarding_decom_forward_removed.changed | default(false)

        - name: "Remove this component's own logrotate policies"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ audit_logrotate_conf }}"
            - "{{ syslog_logrotate_conf }}"
          when: not ansible_check_mode

        - name: "Remove the custom audit rules"
          ansible.builtin.file:
            path: "{{ audit_rules_dest }}"
            state: absent
          register: audit_log_forwarding_decom_rules_removed
          when: not ansible_check_mode

        - name: "Reload the kernel audit rule list (custom rules removed)"
          ansible.builtin.command: augenrules --load
          when:
            - not ansible_check_mode
            - audit_log_forwarding_decom_rules_removed.changed | default(false)
          changed_when: false
          failed_when: false

        - name: "Revert the audisp-syslog plugin's active flag to no"
          ansible.builtin.lineinfile:
            path: "{{ audit_syslog_plugin_conf }}"
            regexp: '^active\s*='
            line: "active = no"
          when: not ansible_check_mode
          failed_when: false

        - name: "Remove the SIEM receiver alias from /etc/hosts"
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: '\s{{ siem_forward_alias }}$'
            state: absent
          when: not ansible_check_mode

        - name: "Verify component-owned files are really gone"
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "{{ audit_rules_dest }}"
            - "{{ siem_forward_conf }}"
            - "{{ audit_logrotate_conf }}"
            - "{{ syslog_logrotate_conf }}"
          register: audit_log_forwarding_decom_stat_after
          when: not ansible_check_mode

        - name: "Gate: no component-owned config file may remain"
          ansible.builtin.assert:
            that:
              - audit_log_forwarding_decom_stat_after.results | selectattr('stat.exists') | list | length == 0
            fail_msg: >-
              An audit-log-forwarding config file still exists after removal —
              refusing to report local cleanup as complete.
          when: not ansible_check_mode

      rescue:
        - name: "Rescue: dump auditd/rsyslog status"
          ansible.builtin.command: "{{ item }}"
          loop:
            - "systemctl status auditd --no-pager"
            - "systemctl status rsyslog --no-pager"
          register: audit_log_forwarding_decom_rescue_status
          changed_when: false
          failed_when: false

        - name: "Rescue: surface diagnostics and fail"
          ansible.builtin.fail:
            msg: |
              audit-log-forwarding local decommission FAILED. Diagnostics:
              {% for r in audit_log_forwarding_decom_rescue_status.results | default([]) %}
              --- {{ r.item }} ---
              {{ r.stdout | default('(unavailable)') }}
              {% endfor %}
              No central/receiver-side state was touched by this playbook
              (historical logs are out of scope) — resume via
              `pilot host decommission resume` once the underlying issue
              is fixed.
