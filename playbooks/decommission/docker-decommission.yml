# docker decommission — stops the engine and removes its packages.
#
# docs/superpowers/specs/2026-09-02-host-decommission-spec.md §15/§37 Phase
# 5: a generic contract-driven decommission
# (internal/decommission/providers.GenericComponentProvider), same shape as
# host-monitoring-decommission.yml.
#
# docker-apply.yml's own header lists 10 roles that declare a `sameHosts`
# contract dependency on docker (alertmanager, dashboard, keycloak-db,
# keycloak, log-shipping, snmp-exporter, prometheus, seaweedfs-s3,
# thanos-query, wazuh-manager) — this playbook is safe to fully remove the
# engine anyway: `pilot host decommission plan` always plans EVERY role
# currently on the target host together, and teardown order is dependency-
# aware (sameHosts consumers before providers), so this playbook's own step
# can only ever run once every present sameHosts-dependent role's own step
# already ran — and if any such role has no decommission support of its
# own, the whole plan stays blocked before this step is ever reached
# (INV-7). It is therefore never reached while a live docker-dependent
# role's containers are still expected on this host.
#
# Leaves the `docker` group and /var/lib/docker alone (mirrors
# host-monitoring-decommission.yml leaving the shared textfile dir and
# system user/group untouched) — removing a UID/GID or an unbounded data
# directory is not required for zero active residue and risks colliding
# with, or slowly deleting, state this component does not itself own.
#
# Invoked ONLY by internal/decommission/providers.GenericComponentProvider
# — never directly by an operator.
#
# `--tags inspect` restricts execution to the read-only tasks in pre_tasks
# — no mutating task carries that tag — and prints the standardized marker
# every generic decommission playbook must print (spec.md §15):
# PILOT_COMPONENT_DECOMMISSIONED=true|false.
#
# Usage:
#
#   ansible-playbook -i inventory.yml \
#       playbooks/decommission/docker-decommission.yml \
#       --limit <retiring-host>
#
#   # read-only enrollment check only (never mutates):
#   ansible-playbook -i inventory.yml \
#       playbooks/decommission/docker-decommission.yml \
#       --limit <retiring-host> --tags inspect
#
# Stage gating (same convention as every other playbooks/decommission/*.yml):
#   sandbox  default; runs immediately
#   staging  requires -e confirm_staging=true
#   prod     requires -e confirm_prod=true AND staging_attested_within_hours<=168
---
- name: Docker decommission — engine stop + package removal
  hosts: "{{ target_group | default('docker') }}"
  become: true
  gather_facts: true
  vars:
    stage: sandbox
    confirm_staging: false
    confirm_prod: false
    staging_attested_within_hours: 168

  pre_tasks:
    - name: "Gate: staging or prod requires explicit confirm"
      ansible.builtin.assert:
        that:
          - (stage == 'sandbox') or
            (stage == 'staging' and confirm_staging | bool) or
            (stage == 'prod' and confirm_prod | bool)
        fail_msg: "stage={{ stage }} requires confirm flag. Pass -e confirm_staging=true or confirm_prod=true."
      tags: [always]

    - name: "Gate: stage must match this host's inventory environment group"
      ansible.builtin.assert:
        that:
          - not ('prod' in group_names and stage != 'prod')
          - not ('staging' in group_names and stage != 'staging')
          - not (stage in ['staging', 'prod'] and stage not in group_names)
        fail_msg: >-
          stage={{ stage }} 與 {{ inventory_hostname }} 的 inventory 環境 group 不一致
          (group_names: {{ group_names }})。
      tags: [always]

    - name: "Gate: prod requires recent staging attestation"
      ansible.builtin.assert:
        that:
          - (staging_attested_within_hours | int) <= 168
        fail_msg: "prod gate: staging attestation missing or older than 168h."
      when: stage == 'prod'
      tags: [always]

    # Read-only detection: the docker engine package still being installed
    # is this component's own enrollment marker.
    - name: "Gather installed package facts (read-only)"
      ansible.builtin.package_facts:
      tags: [inspect]

    - name: "Report decommission state for external tooling"
      ansible.builtin.debug:
        msg: >-
          PILOT_COMPONENT_DECOMMISSIONED={{
            (['docker.io', 'docker', 'docker-ce'] | intersect(ansible_facts.packages.keys() | list) | length == 0)
            | ternary('true', 'false') }}
      tags: [inspect]

  tasks:
    - name: "Docker decommission — engine removal, with diagnostics on failure"
      block:
        - name: "Stop and disable docker.service"
          ansible.builtin.systemd:
            name: docker
            state: stopped
            enabled: false
          when: not ansible_check_mode
          failed_when: false

        - name: "Remove docker packages (Debian family)"
          ansible.builtin.apt:
            name: [docker.io, docker-compose-v2]
            state: absent
          when:
            - not ansible_check_mode
            - ansible_os_family == 'Debian'

        - name: "Remove docker packages (RHEL family)"
          ansible.builtin.dnf:
            name: [docker, docker-compose]
            state: absent
          when:
            - not ansible_check_mode
            - ansible_os_family == 'RedHat'

        - name: "Re-gather package facts to verify removal"
          ansible.builtin.package_facts:
          when: not ansible_check_mode

        - name: "Gate: no docker engine package may remain installed"
          ansible.builtin.assert:
            that:
              - (['docker.io', 'docker', 'docker-ce'] | intersect(ansible_facts.packages.keys() | list) | length) == 0
            fail_msg: >-
              A docker engine package still exists after removal — refusing
              to report local cleanup as complete.
          when: not ansible_check_mode

      rescue:
        - name: "Rescue: dump docker.service status"
          ansible.builtin.command: systemctl status docker --no-pager
          register: docker_decom_rescue_status
          changed_when: false
          failed_when: false

        - name: "Rescue: surface diagnostics and fail"
          ansible.builtin.fail:
            msg: |
              docker local decommission FAILED. Diagnostics:
              --- systemctl status docker ---
              {{ docker_decom_rescue_status.stdout | default('(unavailable)') }}
              {{ docker_decom_rescue_status.stderr | default('') }}
              This component has no central/external state — resume via
              `pilot host decommission resume` once the underlying issue
              is fixed.
