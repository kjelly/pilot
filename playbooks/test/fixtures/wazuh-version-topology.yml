---
# Immutable candidate wrapper for the real manager -> agent ordering.
# Selectors remain inherited from the actual component imports.
- name: Install the fresh manager's Docker prerequisite first
  ansible.builtin.import_playbook: ../../apply/docker-apply.yml
  tags: [docker]

- name: Deploy the actual independent SIEM receiver before forwarding
  ansible.builtin.import_playbook: ../../apply/log-server-apply.yml
  tags: [log-server]

- name: Deploy the central Wazuh stack first
  ansible.builtin.import_playbook: ../../apply/wazuh-manager-apply.yml
  tags: [wazuh-manager]

- name: Deploy compatible Wazuh agents second
  ansible.builtin.import_playbook: ../../apply/wazuh-fim-apply.yml
  tags: [wazuh-fim]


# Explicit diagnostic fixture emits one genuine engine alert and a new receiver
# challenge each apply. It is deferred during the mandatory pristine dry-run.
- name: Generate a fresh native alert challenge for actual receiver verification
  ansible.builtin.import_playbook: wazuh-alert-delivery-fixtures.yml
  when: not ansible_check_mode
  tags: [wazuh-delivery]
