---
# Immutable candidate wrapper for the real manager -> agent ordering of the Wazuh
# version contract. Selectors remain inherited from the actual component imports.
- name: Install the fresh manager's Docker prerequisite first
  ansible.builtin.import_playbook: ../../apply/docker-apply.yml
  tags: [docker]

# The manager forwards to this receiver (its C10/C11 rows need one in the inventory).
- name: Deploy the independent log receiver before the manager forwards to it
  ansible.builtin.import_playbook: ../../apply/log-server-apply.yml
  tags: [log-server]

- name: Deploy the central Wazuh stack
  ansible.builtin.import_playbook: ../../apply/wazuh-manager-apply.yml
  tags: [wazuh-manager]

- name: Deploy compatible Wazuh agents last
  ansible.builtin.import_playbook: ../../apply/wazuh-fim-apply.yml
  tags: [wazuh-fim]
