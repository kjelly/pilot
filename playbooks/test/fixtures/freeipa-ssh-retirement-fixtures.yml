---
# Establish unchanged identity-spec fixtures, then the external synthetic
# lifecycle roster. Only for fresh disposable targets, before retirement.
- name: Require a complete standalone retirement fixture invocation
  hosts: "{{ fixtures_target_group | default('freeipa-server') }}"
  gather_facts: false
  tasks:
    - name: Reject partial fixture task selections
      ansible.builtin.assert:
        that:
          - (ansible_run_tags | list) == ['all']
          - ansible_skip_tags | length == 0
        fail_msg: "SSH retirement fixtures require a standalone full run without tags or skip-tags"
      tags: [always]

- name: Establish legacy identity verification fixtures
  ansible.builtin.import_playbook: freeipa-identity-fixtures.yml
  vars:
    freeipa_roster_file: null

- name: Isolate the canonical fixture from legacy host facts
  ansible.builtin.import_playbook: freeipa-identity-fixture-reset.yml

- name: Establish canonical identity verification fixtures
  ansible.builtin.import_playbook: freeipa-identity-canonical-fixtures.yml

- name: Isolate the nested fixture from canonical host facts
  ansible.builtin.import_playbook: freeipa-identity-fixture-reset.yml

- name: Establish nested identity verification fixtures
  ansible.builtin.import_playbook: ../../apply/freeipa-identity-apply.yml
  vars:
    target_group: "{{ fixtures_target_group | default('freeipa-server') }}"
    freeipa_roster_file: "{{ playbook_dir }}/../test/fixtures/freeipa-ssh-retirement-v2.roster.yaml"

- name: Isolate the lifecycle roster from verification fixture host facts
  ansible.builtin.import_playbook: freeipa-identity-fixture-reset.yml

- name: Apply the synthetic SSH retirement lifecycle roster
  ansible.builtin.import_playbook: ../../apply/freeipa-identity-apply.yml
  vars:
    target_group: "{{ fixtures_target_group | default('freeipa-server') }}"
    freeipa_roster_file: "{{ issue226_roster_file }}"
