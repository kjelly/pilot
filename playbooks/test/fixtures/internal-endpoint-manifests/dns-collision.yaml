# named "reserved" at apps.pilot.internal. (spec.md §11.3).
schema_version: 1
endpoints:
  - fqdn: reserved.apps.pilot.internal
    state: present
    dns:
      zone: apps.pilot.internal.
    route:
      mode: direct
      target:
        address: 10.0.0.1
    tls:
      mode: disabled
