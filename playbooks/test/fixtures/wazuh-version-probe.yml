---
# Development/native tool probe on a disposable manager. This does not upgrade
# containers. The optional canary adds one synthetic, nonce-bearing alert.
- name: Probe Wazuh release policy on a disposable central stack
  hosts: "{{ target_group | default('wazuh-manager') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Install the candidate coordinator for native probes
      ansible.builtin.copy:
        src: ../../apply/files/wazuh-transaction.py
        dest: /usr/local/sbin/pilot-wazuh-transaction
        owner: root
        group: root
        mode: "0700"

    - name: Probe committed native versions and optional analysis-to-indexer canary
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/local/sbin/pilot-wazuh-transaction', 'central-verify']
             + (['--canary'] if (wazuh_probe_canary | default(false) | bool) else []) }}
      register: wazuh_probe_result
      changed_when: false

    - name: Show the sanitized native probe result
      ansible.builtin.debug:
        var: wazuh_probe_result.stdout

    - name: Probe the exact candidate verification-row command
      ansible.builtin.command:
        argv: [sh, -c, "/usr/local/sbin/pilot-wazuh-transaction central-verify >/dev/null && echo 0 || echo 1"]
      register: wazuh_probe_row
      changed_when: false

    - name: Require the native verification-row expected value
      ansible.builtin.assert:
        that:
          - wazuh_probe_row.stdout == '0'
