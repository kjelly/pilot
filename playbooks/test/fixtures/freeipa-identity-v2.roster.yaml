---
# Schema-v2-only fixture for freeipa-identity-apply.yml: nested hostgroup
# membership (roster-schema-v2 migration spec §8) and netgroups (§6/§24/§25)
# exercising every membership.* type plus one level of netgroup nesting.
# The admin secret is supplied separately (for example -e @~/.vault/main.yaml).
#
# Deliberately independent of freeipa-identity-canonical.roster.yaml (which
# stays schema_version: 1 as the migration-fixture baseline) rather than a
# v2 conversion of it, so the two fixtures can be applied/cleaned up without
# any shared-object interference.
schema_version: 2

freeipa:
  admin:
    principal: admin
    password: "{{ ipa_admin_password }}"

users:
  - name: fixture-v2-user-a
    state: present
    ssh_keys: {authoritative: true, values: []}

groups:
  - name: team-fixture-v2
    state: present
    category: team
    description: Schema v2 fixture team
    membership:
      authoritative: true
      users: [fixture-v2-user-a]
      groups: []

hosts:
  - name: fixture-v2-host-a.ipa.pilot.internal
    state: present
    ip_address: 192.168.122.60
    description: Schema v2 fixture host

hostgroups:
  - name: hostgroup-fixture-v2-child
    state: present
    description: Schema v2 fixture child hostgroup
    membership:
      authoritative: true
      hosts: [fixture-v2-host-a.ipa.pilot.internal]
      hostgroups: []

  # membership.hostgroups (nested) is what this fixture exists to prove:
  # freeipa-identity-apply.yml did not reconcile this field at all before
  # the roster-schema-v2 migration spec's §8 work.
  - name: hostgroup-fixture-v2-parent
    state: present
    description: Schema v2 fixture parent hostgroup (nests the child)
    membership:
      authoritative: true
      hosts: []
      hostgroups: [hostgroup-fixture-v2-child]

netgroups:
  - name: ng-fixture-v2-nested
    state: present
    description: Schema v2 fixture nested netgroup
    membership:
      authoritative: true
      users: []
      groups: []
      hosts: []
      hostgroups: []
      netgroups: []

  # Exercises all five membership.* types in one netgroup, including one
  # level of nesting via ng-fixture-v2-nested.
  - name: ng-fixture-v2-clients
    state: present
    description: Schema v2 fixture netgroup (every membership type)
    membership:
      authoritative: true
      users: [fixture-v2-user-a]
      groups: [team-fixture-v2]
      hosts: [fixture-v2-host-a.ipa.pilot.internal]
      hostgroups: [hostgroup-fixture-v2-parent]
      netgroups: [ng-fixture-v2-nested]
